name: test
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      # no --net or --deploy: CI should not fail because YouTube had a bad minute
      - run: ./test --browser
