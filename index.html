/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}], "img": "media/cards/ea6b6b94b97f.webp", "cred": "Ezrdr · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Arithmometre_%28cropped%29.jpg"}, {"t": "Papier-Mâché Anatomical Models", "d": "1820", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/papier-mache-anatomical-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Fourier's *Théorie analytique de la chaleur", "b": "*: every signal is a sum of pure sine waves — the theorem that finally answers Mersenne's harmonic puzzle and later becomes, via the FFT, MP3s, Auto-Tune, and speech recognition (Thread T; Thread M).", "d": "1822", "img": "media/cards/de2212a70a34.webp", "cred": "Julien-Léopold Boilly · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Fourier2_-_restoration1.jpg"}, {"t": "Charles Babbage: Difference Engine", "b": "automatic polynomial table calculation, motivated by errors in human-computed tables.", "d": "1822", "in": [{"to": "era-5/16", "t": "Scheutz difference engine"}, {"to": "era-6/11", "t": "Torres Quevedo"}, {"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}, {"to": "thread-L/18", "t": "Too old for computing class"}, {"to": "about/1", "t": "The machine itself"}], "img": "media/museum/56d39aa81f5f.webp", "cred": "Difference Engine No. 2, to Babbage's 1847 design"}, {"t": "Solresol", "b": "Sudre's constructed language built entirely from the seven solfège notes — speakable, singable, playable on a violin, or whistled across a valley (Thread T; Thread M).", "d": "1827", "in": [{"to": "thread-T/16", "t": "Musical and constructed tongues"}], "img": "media/cards/8d1605c55877.webp", "cred": "Immanuel Giel · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASol-resol.png"}, {"t": "The tally sticks burn Parliament", "b": "centuries of split-tally records — matching halves as unforgeable medieval receipts — are carelessly incinerated, and the overloaded furnaces burn down the Houses of Parliament. Legacy-data destruction, spectacularly literal.", "d": "1834", "img": "media/cards/0e77b416606b.webp", "cred": "museado · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Burning%20of%20the%20Houses%20of%20Parliament%20ca.%201834.jpg"}, {"t": "The electric telegraph (Cooke & Wheatstone; Morse)", "b": "messages become electric pulses; Morse code is a variable-length compression code — common letters short, rare letters long — a century before information theory named the idea.", "d": "1837–44", "in": [{"to": "thread-M/6", "t": "The Victorian Internet (Standage's framing)"}], "img": "media/cards/0ccb645dd183.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AElectric%20Telegraph%20Company%20Telegraph%20street%201859.jpg"}, {"t": "Théodore Olivier's String Models", "d": "1839", "b": "Between 1839 and 1853 the French mathematician Théodore Olivier created string models to teach and demonstrate descriptive geometry, some of which could be manipulated. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/theodore-oliviers-string-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Alexander Bain patents the fax", "b": "images by wire decades *before* the telephone; Caselli's pantelegraph carries commercial fax traffic in 1860s France.", "d": "1843", "img": "media/cards/f196edc405f9.webp", "cred": "European Patent Office · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ABain%20improved%20facsimile%201850.png"}, {"t": "Babbage: Analytical Engine", "b": "mill (CPU), store (memory), punched-card input, conditional branching — the general-purpose computer, designed a century early, never built.", "d": "1837", "img": "media/museum/546216ffa33d.webp", "cred": "Analytical Engine trial model"}, {"t": "Ada Lovelace's Notes", "b": "first published algorithm intended for a machine (Bernoulli numbers); her insight that such a machine could manipulate *symbols*, not just numbers — even compose music.", "d": "1843", "in": [{"to": "era-10/54", "t": "The Letters of Ada Lovelace: The Poetry of Mathematics"}, {"to": "era-10/55", "t": "The Letters of Ada Lovelace: Thinking Machines"}], "img": "media/cards/74b539d24adf.webp", "cred": "William Henry Mote · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAda%20Lovelace%201838.jpg"}, {"t": "George Boole", "b": "logic reduced to algebra of 0 and 1 — the mathematics that circuits would later speak.", "d": "1847/1854", "img": "media/cards/3d374dbf5562.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGeorge%20Boole%20color.jpg"}, {"t": "Merryweather's Leech Barometer", "d": "1850", "b": "In 1850, British doctor and inventor George Merryweather built a barometer that uses live medicinal leeches to predict storms: The twelve leeches are kept in small bottles inside the device; when they become agitated by an approaching storm they attempt to cli… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/merryweathers-leech-barometer/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Scheutz difference engine", "b": "Georg Scheutz, a Stockholm printer, read a magazine description of <a class=\"xl\" href=\"#era-5/6\">Babbage<\/a>'s engine and built one with his son Edvard — smaller, cheaper, and finished. It calculated tables and set them in type itself, removing the typesetter, who was the likeliest source of error. Two were sold. Babbage, to his credit, helped them.", "d": "1853", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}], "img": "media/museum/8087c0efd41b.webp", "cred": "Scheutz difference engine, 1859"}, {"t": "De Chancourtois' Telluric Screw", "d": "1862", "b": "The French geologist Alexandre-Émile Béguyer de Chancourtois was the first scientist to see the periodicity of elements when they were arranged in order of their atomic weights. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/telluric-screw-of-de-chancourtois/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Hofmann's Croquet Ball Models", "d": "1865", "b": "August Wilhelm Hofmann was the first to introduce physical representations of molecules into lectures during his Friday Evening Discourses presentation \"On the Combining Power of Atoms\" at London's Royal Institution of Great Britain in . <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/hofmanns-croquet-ball-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Kundt's Tube", "d": "1866", "b": "Kundt's tube is an apparatus invented in 1866 by German physicist August Kundt for measuring the speed of sound. It mostly consists of a transparent tube of adjustable length with powder in it. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/kundts-tube/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Dewar's Brass Strip Models", "d": "1866", "b": "Mechanical arrangement adapted to illustrate structure in the non-saturated hydrocarbons by the chemist James Dewar. The model is made of bars, clamped together so as to allow free motion. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/dewars-brass-strip-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Thermodynamic Surfaces", "d": "1871", "b": "A physical visualization by Scottish physicist James Maxwell (left), constructed over the course of about seven months, from November 1874 to July 1875, based on the descriptions of thermodynamics surfaces described in two 1873 papers by American engineer Will… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/thermodynamic-surfaces/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Office machine boom", "b": "Odhner wheel, comptometer, cash register — arithmetic becomes clerical infrastructure.", "d": "1873–1887", "img": "media/museum/4458a499fd25.webp", "cred": "Calculating machine, about 1885"}, {"t": "The transatlantic cable", "b": "continents wired together; Kelvin's mirror galvanometer — sensitive enough to read a whisper of current after 3,000 km — makes it work, and per-word pricing spawns commercial codebooks: compression driven by economics.", "d": "1858/1866", "img": "media/cards/d34ae46b660b.webp", "cred": "Ogden Daily Standard | 1917-06-16 | Page 23 · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ATransatlantic%20telegraph%20cable%20flag.png"}, {"t": "Baudot's 5-bit code", "b": "fixed-length binary character encoding for multiplexed telegraphy — direct ancestor of teleprinters, telex, and ASCII (\"baud\" preserves his name).", "d": "1870", "in": [{"to": "thread-M/10", "t": "The paper-tape lineage"}], "img": "media/cards/61e4c3c02675.webp", "cred": "Jean Maurice Emile Baudot · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ABaudot%20Code%20-%20from%201888%20patent.png"}, {"t": "Helmholtz's *On the Sensations of Tone", "b": "*: hearing itself dissected with tuned resonators — physiological acoustics founded (Thread T).", "d": "1863", "in": [{"to": "thread-T/24", "t": "The hearing sciences"}], "img": "media/cards/f49378e28fdf.webp", "cred": "Poul la Cour &amp; Jacob Appel · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHelmholtz%20resonator%202.jpg"}, {"t": "Sound becomes data", "b": "Scott de Martinville's phonautograph *records* sound it cannot play back; Edison's phonograph plays it — audio as stored signal (Thread M; Thread T).", "d": "1857/1877"}, {"t": "Robert Henry Thurston’s Glyptic Models", "d": "1875", "b": "Robert Henry Thurston was an American engineer and inventor who created solid models of 3D surfaces for engineering purposes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/robert-henry-thurstons-glyptic-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Van't Hoff's Molecular Paper Models", "d": "1875", "b": "Van’t Hoff disseminated his stereochemical ideas to leading chemists of the day by sending them 3-D paper models of tetrahedral molecules, like these now housed in the Leiden Museum. There might be some difficulty in following my reasoning. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/vant-hoffs-molecular-paper-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Telephone and automatic exchange", "b": "Bell's telephone; then Strowger — an undertaker convinced the operator was diverting his business calls — invents dial switching: machine routing begins replacing human routing.", "d": "1876/1891", "img": "media/cards/a367123d2cc3.webp", "cred": "Cephas · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ANorthern%20Electric%20N415H%2002.jpg"}, {"t": "The photophone (Bell & Tainter)", "b": "voice carried 213 meters between Washington rooftops on a modulated beam of sunlight — no wires at all. Bell called it his greatest invention, greater than the telephone; the world had no use for it until fiber optics and free-space laser links vindicated the idea a century later (Thread M3).", "d": "1880", "img": "media/cards/254e9e032a77.webp", "cred": "Alexander Graham BELL, Ph.D., · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APhotophone.jpg"}, {"t": "Switchboard operators", "b": "overwhelmingly women, hand-routing the world's calls — the communication twin of the human computers (Thread B).", "d": "1878–1950s", "in": [{"to": "thread-M/11", "t": "The telephone era"}], "img": "media/cards/66ccd465221f.webp", "cred": "Seattle Municipal Archives from Seattle, WA · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File:Telephone_operators%2C_1952.jpg"}, {"t": "Gauss finds Ceres", "b": "least squares recovers a lost dwarf planet from 41 days of observations — the mathematics of taming measurement error, computed by hand (Thread P).", "d": "1801"}, {"t": "The Luddites", "b": "skilled weavers smash stocking frames — not hatred of technology but a labor revolt against immiseration; the corrective card for history's most misused insult (Thread Q).", "d": "1811–16", "img": "media/cards/fa596285b110.webp", "cred": "Unknown. 195 years since publication, copyright extinguished · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ALuddite.jpg"}, {"t": "Neptune discovered \"with the point of his pen\"", "b": "Le Verrier computes an unseen planet's position from Uranus' wobbles; astronomers find it within one degree — hand computation's greatest triumph.", "d": "1846", "img": "media/cards/068c183fe28a.webp", "cred": "Carl Daniel Freydanck · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Sternwarte_Berlin_Schinkel.jpg"}, {"t": "Nightingale's rose diagrams", "b": "statistical graphics as political weapon — army sanitation reformed by chart (Thread P).", "d": "1858", "in": [{"to": "thread-P/3", "t": "The picture-makers"}], "img": "media/cards/8c56727ae9a2.webp", "cred": "Henry Hering (1814-1893) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Florence_Nightingale_%28H_Hering_NPG_x82368%29.jpg"}, {"t": "Jevons' \"logic piano\"", "b": "a machine that performs Boolean inference — mechanical logic, halfway between Boole and <a class=\"xl\" href=\"#era-6/46\">Shannon<\/a>.", "d": "1869", "out": [{"to": "era-6/46", "t": "Claude Shannon's master's thesis"}], "img": "media/cards/0bec208a9572.webp", "cred": "Eric and Mary Ellen · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AWilliam%20Stanley%20Jevons%20Logic%20Piano%20keys.jpg"}, {"t": "Galton and Pearson", "b": "correlation and regression, the modern statistical toolkit — created in deep entanglement with eugenics: a card teaching that computation is not morally neutral (Thread P).", "d": "1880s–1901", "in": [{"to": "thread-P/4", "t": "The uncomfortable card"}], "img": "media/cards/6092d0eddc0a.webp", "cred": "Eveleen Myers (née Tennant) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASir%20Francis%20Galton%2C%201890s.jpg"}, {"t": "Winogradsky Columns", "d": "1880", "b": "The Winogradsky column, invented by Sergei Winogradsky, consists in a transparent cylinder for analyzing microbial life by observing how the metabolism of micro-organisms evolve over time in stratified layers. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/winogradsky-column/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Klein's Mathematical Plaster Models", "d": "1880", "b": "In the 19th century, mathematicians became interested in the question how mathematical functions look like. Felix Klein, a German mathematician, had several of such physical models in his lab in Göttingen, and popularized them in America when he brought a boat… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/plaster-models-of-mathematical-functions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Ammassalik Wooden Maps", "d": "1885", "b": "These three-dimensional maps were carved by inuits from the Ammassalik Fjord in Greenland, and used as eyes-free guides for sailing. The left one shows coastline, the right one shows a sequence of offshore islands. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ammassalik-wooden-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Marey's Movement Sculptures", "d": "1887", "b": "Bronze sculpture showing the phases of the flight of birds, created by French scientist Étienne-Jules Marey in 1887 based on photographs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mareys-movement-sculptures/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Gaudí's Hanging Chain Models", "d": "1889", "b": "Spanish Catalan architect Antoni Gaudí disliked drawings and prefered to explore some of his designs — such as the unfinished Church of Colònia Güell and the Sagrada Família — using scale models made of chains or weighted strings. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/gaudis-hanging-chain-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Herman Hollerith", "b": "punched-card tabulators process the US Census in record time; his company later merges into **IBM**.", "d": "1890", "in": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}], "img": "media/cards/881abeb91eca.webp", "cred": "Charles Milton Bell · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHollerith.jpg"}, {"t": "Polynesian Genealogical Instrument", "d": "1890", "b": "This artefact from the Marquesas Islands (French Polynesia) served as a memory aid for reciting genealogies during ceremonies. Each thread, made of woven coconut fiber, is a genealogical line and each knot is a generation. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/polynesian-genealogical-instrument/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Genaille–Lucas rulers", "b": "<a class=\"xl\" href=\"#era-4/10\">Napier's bones<\/a> perfected — multiplication by pure sight-reading, no carrying; a reminder that \"calculating aids\" kept evolving right up to the electronic age.", "d": "1891", "out": [{"to": "era-4/10", "t": "Napier's bones"}], "in": [{"to": "thread-H/23", "t": "Specialized aids to the very end"}], "img": "media/cards/75914c00c4a4.webp", "cred": "Worrydream · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGenaille-Lucas%20rulers%20example%202.png"}, {"t": "The Committee of Ten (US)", "b": "secondary mathematics standardized into arithmetic → algebra → geometry → trigonometry — the course sequence most students still walk today, frozen before the airplane flew (see Thread L).", "d": "1893", "in": [{"to": "thread-L/8", "t": "The freeze"}]}, {"t": "Stanhope's logical demonstrator", "b": "Charles Stanhope built machines that tested whether a statement was logically valid — mechanised deduction, half a century before Boole wrote the algebra down.", "d": "c. 1805", "img": "media/museum/469f2aff995c.webp", "cred": "Stanhope's logical demonstrator, about 1805"}, {"t": "Qi Mei-lu's celestial globe", "b": "made in Wuyuan and long misattributed to the Jesuit Ferdinand Verbiest; a rotating star catalogue, data stored on a sphere.", "d": "1828", "img": "media/museum/f6e7d853715f.webp", "cred": "Celestial globe, made 1828 in Wuyuan"}, {"t": "Galton Board", "d": "1893", "b": "The galton board (named after and invented by Sir Francis Galton) is a physical device consisting of a vertical board with rows of interleaved pegs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/galton-board/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "James Ive's Mechanical Teaching Map", "d": "1896", "b": "The boundaries of the United States transformed during the 19th century, often through violent means. Mapmaker James Ives created this mechanical map to help people, especially students, visualize these changes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/james-ives-mechanical-teaching-map/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Stop Motion Animation", "d": "1897", "b": "Stop motion animation is the frame-by-frame capture of (generally) inanimate objects which are manipulated by increments in order to produce the illusion of motion. It was first used in movies to produce magical effects. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/stop-motion-animation/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "in": [{"to": "era-8/105", "t": "Stop Motion Animation of Physical 3D Map"}, {"to": "era-9/278", "t": "Micro Live: Episode 1"}, {"to": "era-9/328", "t": "Micro File: Images"}]}, {"t": "Crookes' Vis Generatrix", "d": "1898", "b": "Model of Crookes’ \"Vis Generatrix\" made in 1898, built by his assistant, Gardiner. From: Proc. R. Soc. Lond. 63, 408. The vertical scale represents the atomic weight of the elements from H = 1 to Ur = 239. Missing elements are represented with a white circle. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/crookes-vis-generatrix-periodic-table/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Tallies Used as Social Displays on Pacific Islands", "d": "1898", "b": "In the 19th century, the Torres Strait Islanders did not have a numeral system and used sticks to keep counts. Sticks were tied to a string, forming a bundle (called kupe) that could be rolled and unrolled when needed. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/tallies-used-as-social-displays-on-pacific-islands/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}]}, {"id": "era-6", "kind": "era", "title": "Era 6: Human Computers, Analog Machines & Theory", "sub": "1900 – 1940", "cards": [{"t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)", "b": "women \"computers\" classify hundreds of thousands of stars; Leavitt's computed relation lets us measure the universe.", "d": "1870s–1920s", "in": [{"to": "thread-B/0", "t": "Human Computers"}], "img": "media/cards/e8a791bd919e.webp", "cred": "Harvard University Archives · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AObservatory%20women%20computers%2C%201891.jpg"}, {"t": "Pearson and Lee's Height Correlation Chart", "d": "1900", "b": "The physical model on the left is a bivariate histogram showing the correlation between the heights of fathers (horizontal axis) and sons (\"vertical\" axis). This data was famously collected by Karl Pearson and Alice Lee between 1893 and 1898. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pearson-lee-height-correlation-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Crum Brown's Mathematical Surface", "d": "1900", "b": "Model by Alexander Crum Brown (1838-1922) of a half-twist mathematical surface, featuring a non-Euclidean so-called Klein bottle, c. 1900. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/browns-mathematical-surface/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Modern Solid Terrain Modeling", "d": "1900", "b": "The Institute of Cartography ETH Zurich published a great review of past and present techniques for doing solid terrain modeling. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-terrain-modeling-techniques/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Marconi's transatlantic wireless", "b": "the letter \"S\" crosses an ocean without wires; radio makes signals *broadcast* rather than routed.", "d": "1901", "img": "media/cards/b9e4859ab53e.webp", "cred": "Jonathan Adolf Wilhelm Zenneck · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ADrawing%20of%20Marconi%20Poldhu%20wireless%20station%201901.png"}, {"t": "Davenport's Physical Distributions", "d": "1901", "b": "In 1901, biologist Charles Davenport \"built\" physical visualizations that show the distributions of features of objects and people. These visualizations were made out of the objects and the people themselves. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/davenports-physical-distributions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Rubens Tube", "d": "1905", "b": "A Rubens tube, also known as a standing wave flame tube, or simply flame tube, is a physics apparatus for demonstrating acoustic standing waves in a tube. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/rubens-tube/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Pin Maps", "d": "1907", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pin-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Felix Klein names the \"double discontinuity\"", "b": "university mathematics and school mathematics fail to connect in either direction — the feedback loop that lets curricula lag the frontier by generations (Thread L); Klein founds the first international commission on mathematics teaching the same year.", "d": "1908"}, {"t": "Hilbert's program", "b": "23 problems, then the Entscheidungsproblem — can all mathematics be mechanically decided? \"We must know, we will know\": the dare that Gödel and <a class=\"xl\" href=\"#era-6/43\">Turing<\/a> answer.", "d": "1900/1928", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}]}, {"t": "Otlet's Mundaneum (Brussels)", "b": "12+ million index cards answering queries by mail and telegraph — a paper search engine; by 1934 Otlet sketches networked screens querying it remotely (Thread S).", "d": "1910", "img": "media/cards/0b2c2b80bf97.webp", "cred": "Zinneke · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Mundaneum_Tir%C3%A4ng_Karteikaarten.jpg"}, {"t": "Torres Quevedo", "b": "a *working* chess endgame automaton (no hidden human this time), essays anticipating floating-point arithmetic, and a remotely commanded electromechanical calculator — Spain's forgotten bridge between <a class=\"xl\" href=\"#era-5/6\">Babbage<\/a> and the electronic age.", "d": "1912–20", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}]}, {"t": "Frankfurt Streetcar Load", "d": "1913", "b": "Strips of woods glued on top of each other convey the average number of passengers carried between two stops. Each strip corresponds to 4,000 passengers. Shown at the 1913 International building trade exhibition in Leipzig. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/frankfurt-streetcar-load/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Solid 3D Curves for Engineering", "d": "1914", "b": "In his 1914 book, Brinton discusses various techniques for building solid models of three-dimensional charts and functions for the purposes of engineering, and uses the two designs above as examples. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-3d-curves-for-engineering/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Wire Models of Factory Worker Movements", "d": "1915", "b": "3D wire models of hand motion paths (or chronocyclegraphs) created by Frank Gilbreth, a pioneer in the study of motion in the workplace. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/wire-models-of-factory-worker-movements/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Yakama Time Ball", "d": "1920", "b": "Women from the Yakama Native American tribe used strings of hemp as personal diaries. Each major event in their life was represented by a knot, a bead or a shell. This mnemonic device is called an Ititamat, or counting-the-days ball, or simply time ball. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/yakama-time-ball/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Richardson's \"forecast factory\"", "b": "a fantasy of 64,000 human computers in a vast hall predicting weather in real time — the dream ENIAC fulfills in 1950.", "d": "1922", "in": [{"to": "era-7/55", "t": "ENIAC computes the first numerical weather forecasts"}], "img": "media/cards/e6e89fe4a62e.webp", "cred": "Author Jonathan Lawhead\n\nIllustrator Francois Schuiten · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AArtist%E2%80%99s%20conception%20of%20Lewis%20Richardson%E2%80%99s%20forecast%20factory.jpg"}, {"t": "R.A. Fisher", "b": "design of experiments, significance testing, modern statistics — forged at an agricultural research station and now the operating system of empirical science (Thread P).", "d": "1920s"}, {"t": "Making Coal Gas and Coke", "b": "", "kindc": "film", "status": "live", "d": "1922", "img": "media/yt/a8TB17-04aE.jpg", "dur": 515, "by": "US Auto Industry", "v": "a8TB17-04aE", "coll": ["dividing-engine-original"]}, {"t": "Electrical Transmission of Speech", "b": "", "kindc": "film", "status": "live", "d": "1925", "img": "media/yt/ygwiwXO9avE.jpg", "dur": 683, "by": "AT&T Tech Channel", "v": "ygwiwXO9avE", "coll": ["dividing-engine-original", "att-archives"]}, {"t": "Karsten's Tridimensional Chart", "d": "1926", "b": "American economist and statistician Karl G. Karsten patented a method for creating physical visualizations of temporal data by stacking two-dimensional plates, each representing a time period. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/karstens-tridimensional-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "A Desert Span, building trunk telephone lines in 1929", "b": "", "kindc": "film", "status": "live", "d": "1929", "img": "media/yt/Yi2uqD7nA74.jpg", "dur": 501, "by": "AT&T Tech Channel", "v": "Yi2uqD7nA74", "coll": ["att-archives"]}, {"t": "1930's Electronic Music - The Variophone", "b": "", "kindc": "film", "status": "live", "d": "1930", "img": "media/yt/4r4WqAf-X8Y.jpg", "dur": 330, "by": "Old Films and Stuff", "v": "4r4WqAf-X8Y", "coll": ["dividing-engine"]}, {"t": "Mechanical Principles", "b": "", "kindc": "film", "status": "live", "d": "1930", "img": "media/yt/UwCdNvisa2M.jpg", "dur": 615, "by": "Split Negative", "v": "UwCdNvisa2M", "via": "Split Negative", "coll": ["dividing-engine-original"]}, {"t": "Phone Pioneers Talk Telephone", "b": "", "kindc": "film", "status": "live", "d": "1930", "img": "media/yt/2_s6Y9i-U18.jpg", "dur": 2234, "by": "AT&T Tech Channel", "v": "2_s6Y9i-U18", "coll": ["att-archives"]}, {"t": "Spectacular New York, Lower Manhattan Waterfront in the 1930's in color!", "b": "", "kindc": "film", "status": "live", "d": "1930", "img": "media/yt/rN97y3gnl6s.jpg", "dur": 273, "by": "Rick88888888", "v": "rN97y3gnl6s", "coll": ["dividing-engine"]}, {"t": "Mathematical Functions Embodied in Ballistic Cams", "d": "1930", "b": "These cams are solid models of bivariate and univariate mathematical functions plotted in cylindric coordinates (left and middle images) and polar coordinates (right image). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mathematical-functions-embodied-in-ballistic-cams/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Gödel's incompleteness theorems", "b": "any sufficiently rich formal system contains truths it cannot prove — mechanized reason has hard limits, discovered before the machines even arrive.", "d": "1931", "img": "media/cards/17144d1e5a0c.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A1925%20kurt%20g%C3%B6del.png"}, {"t": "Tide-predicting machines (Kelvin and successors)", "b": "analog gear-and-pulley computers used into the 1960s (including for D-Day planning).", "d": "1872–20th c.", "in": [{"to": "era-7/16", "t": "D-Day's tides"}, {"to": "about/3", "t": "Have you heard of any of these?"}], "img": "media/museum/417447d4a7e5.webp", "cred": "Tide-predicting machine, 1872"}, {"t": "Naval fire-control computers (Dreyer Table, Ford Rangekeeper, the US Navy's Mark 1)", "b": "shipboard mechanical analog computers solving moving-target ballistics in real time; analog gunnery computers served at sea into the 1990s.", "d": "1912–1945", "in": [{"to": "about/3", "t": "Have you heard of any of these?"}], "img": "media/cards/e337ffef1c42.webp", "cred": "U.S. Navy, Bureau of Naval Personnel (Transfered by \n\nJostikas/Original uploaded · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3AMark%201A%20Fire%20Control%20Computer%20Controls.jpg"}, {"t": "Flying Down To Rio", "b": "", "kindc": "film", "status": "live", "d": "1932", "img": "media/yt/DKVxiqa3Xzc.jpg", "dur": 156, "by": "British Pathé", "v": "DKVxiqa3Xzc", "coll": ["dividing-engine"]}, {"t": "Flying Down To Rio - No. 2", "b": "", "kindc": "film", "status": "live", "d": "1932", "img": "media/yt/tlnOFY0xRjY.jpg", "dur": 145, "by": "British Pathé", "v": "tlnOFY0xRjY", "coll": ["dividing-engine"]}, {"t": "Switchboards, Old and New (Bonus Edition)", "b": "", "kindc": "film", "status": "live", "d": "1932", "img": "media/yt/xJ1fKFqt7qU.jpg", "dur": 800, "by": "AT&T Tech Channel", "v": "xJ1fKFqt7qU", "coll": ["att-archives"]}, {"t": "Gateway to the World", "b": "", "kindc": "film", "status": "live", "d": "1933", "img": "media/yt/USc9dxsHCnY.jpg", "dur": 642, "by": "AT&T Tech Channel", "v": "USc9dxsHCnY", "coll": ["att-archives"]}, {"t": "IBM's Cosmograph", "d": "1933", "b": "The left image above shows a physical flow chart (Sankey diagram) made of 1000 sheets of paper. It was not meant to be directly read, but to be photographed (see right image). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ibms-cosmograph/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Mining and Preparation of Anthracite Coal", "b": "", "kindc": "film", "status": "live", "d": "1934", "img": "media/screen-shot-2014-11-09-at_360-12.png", "v": "0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20", "emb": "https://archive.org/embed/0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20", "url": "https://archive.org/embed/0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20", "coll": ["dividing-engine-original"]}, {"t": "Hayward's Moon Model", "d": "1934", "b": "Illustrator and model-maker Roger Hayward (1899-1979) working on a model of the lunar surface for the Griffith Planetarium, 1934. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/haywards-moon-model/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Ford's Globe", "d": "1934", "b": "A large rotating relief globe showing Ford company's industrial sites around the word, exhibited at the Chicago World's Fair in 1934. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/fords-globe/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "3D Visualizations of Power Consumption", "d": "1935", "b": "A large 3D physical visualization made by the Detroit Edison Company showing electricity consumption for the year 1935, with a slice per day and each day split into 30 min intervals. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electricity-power-demand/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Vladimir Lukyanov's water integrator (USSR)", "b": "partial differential equations solved by water levels in interconnected glass tubes — originally for heat flow in concrete; mass-produced and used in Soviet engineering for decades (see Thread I).", "d": "1936"}, {"t": "Vannevar Bush's differential analyzer", "b": "a room of shafts, gears and spinning discs in which a mechanical integrator adds up a changing quantity continuously, the way the world does. You did not program it, you *built* it — reconfiguring the linkages to match the equation, which could take days. It computed artillery tables and power-network behaviour, and it taught a generation what it felt like to hand a problem to a machine.", "d": "1927–1931", "img": "media/cards/ab12269e6c2f.webp", "cred": "Daderot · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ADifferential%20analyzer%2C%20similar%20to%20that%20of%20Vannevar%20Bush%2C%20probably%20made%20by%20the%20Tokyo%20Imperial%20University%2C%201942%20-%20Ridai%20Museum%20of%20Modern%20Science%2C%20Tokyo%20-%20DSC07667.JPG"}, {"t": "WPA Mathematical Tables Project", "b": "hundreds of human computers employed during the Depression producing math tables.", "d": "1935–1938"}, {"t": "William & Elizebeth Friedman", "b": "the married founders of modern American cryptanalysis — Elizebeth breaks rum-runner and Nazi spy networks (credit classified for decades; the FBI took it); William's team breaks Japan's PURPLE machine (1940) without ever seeing one — reconstructing a computer from its outputs alone.", "d": "1920s–1940"}, {"t": "Alan Turing, \"On Computable Numbers\"", "b": "the universal machine; a precise definition of \"computation\" itself — and of its limits.", "d": "1936", "in": [{"to": "era-6/9", "t": "Hilbert's program"}, {"to": "era-6/44", "t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)"}, {"to": "era-7/10", "t": "Turing's Delilah"}, {"to": "era-7/60", "t": "Turing's \"Computing Machinery and Intelligence\""}, {"to": "era-7/69", "t": "Prinz and Mays' electrical logic machine"}, {"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}, {"to": "thread-I/19", "t": "Toys that are computers"}, {"to": "thread-N/9", "t": "Gödel & the halting problem"}], "img": "media/cards/9af2ee76ebb7.webp", "cred": "Unknown photographer · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAlan%20Turing%20%281912-1954%29%20in%201936%20at%20Princeton%20University.jpg"}, {"t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)", "b": "a notation in which everything is a function and computing is applying one to another — no machine, no tape, no memory, just substitution. Church used it to prove the Entscheidungsproblem unsolvable months before <a class=\"xl\" href=\"#era-6/43\">Turing<\/a> reached the same result by a completely different route. That two such different models turned out to define exactly the same class of computable things is the evidence behind the thesis that bears both names.", "d": "1936", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}], "img": "media/cards/8be9dc6cc72b.webp", "cred": "Charles Morton Strahan, author.  New England Magazine Corporation, publisher. · Public dom", "credurl": "https://commons.wikimedia.org/wiki/File%3AAlonzo%20Church%20%28University%20of%20Georgia%20President%29.jpg"}, {"t": "Spinning Levers - How A Transmission Works", "b": "", "kindc": "film", "status": "live", "d": "1936", "img": "media/yt/JOLtS4VUcvQ.jpg", "dur": 580, "by": "US Auto Industry", "v": "JOLtS4VUcvQ", "coll": ["dividing-engine"]}, {"t": "Claude Shannon's master's thesis", "b": "<a class=\"xl\" href=\"#thread-M/16\">Shannon<\/a>, then 21, noticed that the algebra Boole had invented for reasoning described exactly what a relay circuit does when it opens and closes. Design stopped being intuition and became algebra: you could now write a circuit down, simplify it like an equation, and know the simpler one behaved identically. It is routinely called the most important master's thesis ever written.", "d": "1937", "out": [{"to": "thread-M/16", "t": "Shannon (1948)"}], "in": [{"to": "era-5/36", "t": "Jevons' \"logic piano\""}, {"to": "era-7/43", "t": "Shannon's \"A Mathematical Theory of Communication\""}, {"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-M/21", "t": "Twins, not neighbors"}], "img": "media/cards/a826cc730e52.webp", "cred": "Unknown authorUnknown author · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File:C.E._Shannon._Tekniska_museet_43069_%282x3_crop%29.jpg"}, {"t": "1930s How Photographs Were Transmitted by Wire: Spot News", "b": "", "kindc": "film", "status": "live", "d": "1937", "img": "media/yt/cLUD_NGE370.jpg", "dur": 555, "by": "Charlie Dean Archives", "v": "cLUD_NGE370", "coll": ["dividing-engine"]}, {"t": "Konrad Zuse: Z1–Z3", "b": "the Z3 (1941) is the first working programmable, fully automatic digital computer (binary, electromechanical).", "d": "1938–1941", "img": "media/cards/75c8664963af.webp", "cred": "Wolfgang Hunscher, Dortmund · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKonrad%20Zuse%20%281992%29.jpg"}, {"t": "The Enigma machine", "b": "rotor encryption sold first as a commercial product, then taken up by the German military — the problem that would justify building <a class=\"xl\" href=\"#era-7/8\">Colossus<\/a>.", "d": "1934", "out": [{"to": "era-7/8", "t": "Colossus (Bletchley Park)"}], "img": "media/museum/416bb296e197.webp", "cred": "Enigma machine, 1934"}, {"t": "The Manchester differential analyser", "b": "built to solve problems from electrical power transmission onward; in the war it was turned to secret work, including calculations for the atomic bomb dropped on Hiroshima.", "d": "1935", "img": "media/museum/6cfa48d3dba6.webp", "cred": "Differential analyser, built 1935"}, {"t": "More Power to You", "b": "", "kindc": "film", "status": "live", "d": "1938", "img": "media/yt/ux-MUNkx1MU.jpg", "dur": 548, "by": "JamHandyOrganization", "v": "ux-MUNkx1MU", "via": "JamHandyOrganization", "coll": ["dividing-engine-original"]}, {"t": "Operator!", "b": "", "kindc": "film", "status": "blocked", "d": "1938", "img": "media/yt/IOEOM4S6vgA.jpg", "dur": 1164, "by": "AT&T Tech Channel", "v": "IOEOM4S6vgA", "coll": ["att-archives"]}, {"t": "Operator! (Bonus Edition)", "b": "", "kindc": "film", "status": "live", "d": "1938", "img": "media/yt/nEy7Zb1Noj8.jpg", "dur": 1317, "by": "AT&T Tech Channel", "v": "nEy7Zb1Noj8", "coll": ["att-archives"]}, {"t": "The Voder: 1939, the worlds first electronic voice synthesizer", "b": "", "kindc": "film", "status": "live", "d": "1939", "img": "media/yt/TsdOej_nC1M.jpg", "dur": 377, "by": "Brian Roemmele", "v": "TsdOej_nC1M", "coll": ["dividing-engine"]}, {"t": "Voder Speech Synthesizer", "b": "", "kindc": "film", "status": "blocked", "d": "1939", "img": "media/yt/0rAyrmm7vv0.jpg", "dur": 44, "by": "VintageCG", "v": "0rAyrmm7vv0", "coll": ["dividing-engine-original"]}, {"t": "Voder Voice Coder", "b": "", "kindc": "film", "status": "live", "d": "1939", "img": "media/yt/5hyI_dM5cGo.jpg", "dur": 380, "by": "MonoThyratron", "v": "5hyI_dM5cGo", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "Map of Great Britain's Marine Trade", "d": "1939", "b": "A physical World map made of copper and glass showing the size of Great Britain's merchant marine and the main trade routes as 9,000 miniature ship models. Exhibited at the New York World Fair in 1939. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/map-of-great-britains-marine-trade/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}]}, {"id": "era-7", "kind": "era", "title": "Era 7: The Electronic Breakthrough", "sub": "1940 – 1955", "cards": [{"t": "A Continent is Bridged", "b": "", "kindc": "film", "status": "live", "d": "1940", "img": "media/yt/OxO7-EUYpq0.jpg", "dur": 648, "by": "AT&T Tech Channel", "v": "OxO7-EUYpq0", "coll": ["att-archives"]}, {"t": "A Modern Aladdin's Lamp", "b": "", "kindc": "film", "status": "live", "d": "1940", "img": "media/yt/_-JzxX75oYc.jpg", "dur": 1292, "by": "AT&T Tech Channel", "v": "_-JzxX75oYc", "via": "AT&T Tech Channel", "coll": ["dividing-engine-original", "att-archives"]}, {"t": "Taking the X out of X-Rays", "b": "", "kindc": "film", "status": "live", "d": "1940", "img": "media/yt/tEaYmP7lMyY.jpg", "dur": 563, "by": "A/V Geeks 16mm Films", "v": "tEaYmP7lMyY", "via": "A/V Geeks 16mm Films", "coll": ["dividing-engine-original"]}, {"t": "Stedman's 3D Periodic Table", "d": "1940", "b": "Dr. Don Stedman from the National Research Council Canada designed this 3-D periodic table in the 1940s. Stedman considered many factors and characteristics of the elements as he designed his models. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/3d-periodic-table/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "It Happened in the Kitchen, Part 1 - ca. 1941", "b": "", "kindc": "film", "status": "live", "d": "1941", "img": "media/yt/ndhcaVMawrI.jpg", "dur": 990, "by": "miSci - museum of innovation and science", "v": "ndhcaVMawrI", "coll": ["dividing-engine"]}, {"t": "Rare 1941 film: Pre-Computer Calculating Accounting Machines & IBM 416 punch card tabulators WW2 405", "b": "", "kindc": "film", "status": "live", "d": "1941", "img": "media/yt/3QLvzeZpN8o.jpg", "dur": 741, "by": "Computer History Archives Project  (\"CHAP\")", "v": "3QLvzeZpN8o", "coll": ["advantage"]}, {"t": "Traffic Flow Profiles of the Interregional Highway System", "d": "1941", "b": "2D area diagrams encoding average daily traffic as height and color are set up along their respective highways on a background map of the US. Background map seems to be a cut-out wooden panel; area diagrams potentially cardboard, or also wood veneer. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/traffic-flow-profiles-of-the-interregional-highway-system/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Atanasoff–Berry Computer", "b": "John Atanasoff and Clifford Berry, at Iowa State, built a machine that was electronic, binary, and used regenerated capacitor memory — a direct ancestor of DRAM. It could only solve systems of linear equations, and it was never finished or patented. In 1973 a US court voided the ENIAC patent on the grounds that its ideas derived from this machine, which is why the word 'first' is fought over here.", "d": "1942", "img": "media/cards/db62ddeb6169.webp", "cred": "Ik T from Kanagawa, Japan · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAtanasoff-Berry%20Computer%20%E3%83%BC%20Computer%20History%20Museum%20%2830781535612%29.jpg"}, {"t": "Colossus (Bletchley Park)", "b": "first programmable electronic computer, breaking German ciphers; after the war most are dismantled and the drawings burned by order — secret for 30 years, full details classified until 2000.", "d": "1943–44", "in": [{"to": "era-6/49", "t": "The Enigma machine"}, {"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}, {"to": "thread-M/10", "t": "The paper-tape lineage"}, {"to": "thread-U/22", "t": "The Yates card"}], "img": "media/cards/0d7bcd840549.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AColossus.jpg"}, {"t": "SIGSALY", "b": "the first secure digital voice system (and first PCM transmission) — 50-ton terminals carrying Churchill–Roosevelt calls; its existence stayed secret until 1976.", "d": "1943", "img": "media/cards/fa97e0b9726c.webp", "cred": "ArnoldReinhold · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASIGSALY%20synchronizer%20at%20National%20Cryptologic%20Museum.agr.jpg"}, {"t": "Turing's Delilah", "b": "a portable encrypted-voice machine <a class=\"xl\" href=\"#era-6/43\">Turing<\/a> built in near-total secrecy; the technical report wasn't released for nearly 70 years.", "d": "1943–45", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}], "in": [{"to": "thread-J/8", "t": "SIGSALY and Delilah (Era 7)"}], "img": "media/cards/cb908874024c.webp", "cred": "Elliott &amp; Fry · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Alan_turing_header.jpg"}, {"t": "Electronics At Work", "b": "", "kindc": "film", "status": "live", "d": "1943", "img": "media/yt/4uYNe40igWM.jpg", "dur": 1275, "by": "US Auto Industry", "v": "4uYNe40igWM", "via": "US Auto Industry", "coll": ["dividing-engine-original"]}, {"t": "Electronics at Work - 1943", "b": "", "kindc": "film", "status": "live", "d": "1943", "img": "media/yt/hwutHPYGgfU.jpg", "dur": 1277, "by": "GBPPR2", "v": "hwutHPYGgfU", "coll": ["computers-101", "dividing-engine"]}, {"t": "Newfoundland Long Lines, a WWII film made by the U.S. Army and AT&T, from 1943", "b": "", "kindc": "film", "status": "blocked", "d": "1943", "img": "media/yt/zCuasSte6Nw.jpg", "dur": 1275, "by": "AT&T Tech Channel", "v": "zCuasSte6Nw", "coll": ["att-archives"]}, {"t": "Sound Recording and Reproduction (Sound on Film)", "b": "", "kindc": "film", "status": "live", "d": "1943", "img": "media/yt/h2ilHhJspi8.jpg", "dur": 639, "by": "maantube", "v": "h2ilHhJspi8", "coll": ["dividing-engine"]}, {"t": "Dymaxion Map & Folding Globe", "d": "1943", "b": "“Also know as the “Dymaxion Map,” the Fuller Projection Map is the only flat map of the entire surface of the Earth which reveals our planet as one island in one ocean, without any visually obvious distortion of the relative shapes and sizes of the land areas,… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/dymaxion-map/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "D-Day's tides", "b": "Arthur Doodson computes invasion tides on Kelvin-type <a class=\"xl\" href=\"#era-6/28\">tide-predicting machines<\/a> from anonymized harmonic constants for a location he knows only as \"Position Z\" — the computer wasn't cleared to know it was Normandy.", "d": "1944", "out": [{"to": "era-6/28", "t": "Tide-predicting machines (Kelvin and successors)"}], "img": "media/cards/1fbcdbf9688d.webp", "cred": "Chief Photographer's Mate (CPHoM) Robert F. Sargent · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Into_the_Jaws_of_Death_23-0455M_edit.jpg"}, {"t": "Harvard Mark I (Aiken/IBM)", "b": "electromechanical giant; Grace <a class=\"xl\" href=\"#era-7/68\">Hopper<\/a> programs it; the famous \"bug\" (an actual moth) comes later on Mark II.", "d": "1944", "out": [{"to": "era-7/68", "t": "Grace Hopper's A-0 compiler"}], "img": "media/cards/a3dfdd60ca22.webp", "cred": "Capvideo · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAiken-IBM%20Automatic%20Sequence%20Controlled%20Calculator.jpg"}, {"t": "Computing: IBM ASCC Harvard Mark 1 Largest electro-mechanical calculator, Admiral Grace Hopper", "b": "", "kindc": "film", "status": "live", "d": "1944", "img": "media/yt/bN7AdQmd8So.jpg", "dur": 245, "by": "Computer History Archives Project  (\"CHAP\")", "v": "bN7AdQmd8So", "coll": ["advantage"]}, {"t": "Slide Rule - Proportion, Percentage, Squares And Square Roots", "b": "", "kindc": "film", "status": "live", "d": "1944", "img": "media/yt/dT7bSn03lx0.jpg", "dur": 1217, "by": "A/V Geeks 16mm Films", "v": "dT7bSn03lx0", "coll": ["advantage"]}, {"t": "ENIAC", "b": "~5,000 additions per second — a thousand times faster than any person. Programmed by six women (Jean Bartik, Betty Holberton, et al.) whose work went unrecognized for decades.", "d": "1945", "img": "media/cards/6b326c792b4b.webp", "cred": "United States Army · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATwo%20women%20operating%20ENIAC.gif"}, {"t": "ENIAC's first real job (classified)", "b": "hydrogen-bomb feasibility calculations on a million punched cards; at Los Alamos, von Neumann and Ulam's **Monte Carlo method** is born classified, following wartime rooms of human computers and Feynman's punched-card \"assembly line.\"", "d": "1945–46", "img": "media/cards/9130d76c2c2e.webp", "cred": "The original uploader was TexasDex at English Wikipedia. · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:ENIAC_Penn1.jpg"}, {"t": "von Neumann's EDVAC report", "b": "a draft, circulated unfinished, describing a machine with one memory holding both instructions and data, and a processor fetching them one at a time. Herman Goldstine put von Neumann's name alone on the cover page, which cost Eckert and Mauchly the patent and gave the design a single author's name for eighty years. Nearly every computer you have ever used is this shape.", "d": "1945", "img": "media/cards/87085dc4e489.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AOppenheimer%20%26%20Neumann.jpg"}, {"t": "Conquest of the Night", "b": "", "kindc": "film", "status": "live", "d": "1945", "img": "media/yt/9RrG6gNq12w.jpg", "dur": 610, "by": "Armoured Archivist", "v": "9RrG6gNq12w", "coll": ["advantage"]}, {"t": "The Telephone Hour, The Making of the Classic Radio Program, from 1945", "b": "", "kindc": "film", "status": "blocked", "d": "1945", "img": "media/yt/Ddkcx2mZHBQ.jpg", "dur": 894, "by": "AT&T Tech Channel", "v": "Ddkcx2mZHBQ", "coll": ["att-archives"]}, {"t": "Electron Density Map and Molecular Model of Penicillin", "d": "1945", "b": "Electron density map and model of Penicillin created by Dorothy Crowfoot <a class=\"xl\" href=\"#era-7/34\">Hodgkin<\/a> in 1945 based on her work on X-ray crystallography. The Penicillin molecule was the first molecule whose structure was derived entirely from X-ray data. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electron-density-map-and-molecular-model-of-penicillin/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-7/34", "t": "Dorothy Hodgkin's Electron Density Contours"}]}, {"t": "Manchester Baby (1948) & EDSAC (1949)", "b": "the Baby ran the first program held in electronic memory on 21 June 1948 — seventeen instructions, searching for the highest factor of a number, taking 52 minutes. EDSAC followed in 1949 and did real work for real scientists. The point is not the speed. It is that the instructions now lived in the same memory as the data, which is what makes a computer general rather than rewired.", "d": "1946–49", "img": "media/cards/d17bb5feab72.webp", "cred": "Geni · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AManchester%20baby%20head%20on.JPG"}, {"t": "Election Microscope", "b": "", "kindc": "film", "status": "live", "d": "1946", "img": "media/yt/PAsjs0HNmwg.jpg", "dur": 59, "by": "British Pathé", "v": "PAsjs0HNmwg", "coll": ["dividing-engine"]}, {"t": "Telephone Courtesy", "b": "", "kindc": "film", "status": "live", "d": "1946", "img": "media/yt/UudfzQRN3GQ.jpg", "dur": 1468, "by": "AT&T Tech Channel", "v": "UudfzQRN3GQ", "coll": ["att-archives"]}, {"t": "Television and Telephone", "b": "", "kindc": "film", "status": "live", "d": "1946", "img": "media/yt/XWwV4Hc-Nkc.jpg", "dur": 338, "by": "AT&T Tech Channel", "v": "XWwV4Hc-Nkc", "via": "AT&T Tech Channel", "coll": ["dividing-engine-original", "att-archives"]}, {"t": "Gasoline for Everybody", "b": "", "kindc": "film", "status": "live", "d": "1947", "img": "media/yt/pdgvhs2QAig.jpg", "dur": 793, "by": "Prelinger Archives Official", "v": "pdgvhs2QAig", "via": "Prelinger Archives Official", "coll": ["dividing-engine-original"]}, {"t": "General Electric in 1947, Part 2 - 1948", "b": "", "kindc": "film", "status": "live", "d": "1947", "img": "media/yt/uTCZVmnbePs.jpg", "dur": 1430, "by": "miSci - museum of innovation and science", "v": "uTCZVmnbePs", "coll": ["dividing-engine"]}, {"t": "Mk 57 Gun Director", "b": "", "kindc": "film", "status": "live", "d": "1947", "img": "media/yt/z_HUZSk8c2c.jpg", "dur": 602, "by": "Draper", "v": "z_HUZSk8c2c", "coll": ["dividing-engine"]}, {"t": "Office Automation & Business Machines 1947 (IBM Chinese Character Typewriter, China, full video)", "b": "", "kindc": "film", "status": "live", "d": "1947", "img": "media/yt/xYhmv8fDL_Q.jpg", "dur": 1020, "by": "Computer History Archives Project  (\"CHAP\")", "v": "xYhmv8fDL_Q", "coll": ["advantage"]}, {"t": "Dorothy Hodgkin's Electron Density Contours", "d": "1947", "b": "Nobel prize winning crystallographer Dorothy Crowfoot Hodgkin created another physical visualization in the mid 1940's, showing part of the structure of penicillin. An original of this artifact is in the Oxford Museum of the History of Science. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electron-density-contours/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "in": [{"to": "era-7/25", "t": "Electron Density Map and Molecular Model of Penicillin"}]}, {"t": "1948 Movie Theater Newsreel", "b": "", "kindc": "film", "status": "blocked", "d": "1948", "img": "media/yt/EDDNBr7OCX0.jpg", "dur": 617, "by": "AT&T Tech Channel", "v": "EDDNBr7OCX0", "coll": ["att-archives"]}, {"t": "Advances in Photography", "b": "", "kindc": "film", "status": "live", "d": "1948", "img": "media/yt/m-C1q1cLu7E.jpg", "dur": 1585, "by": "PeriscopeFilm", "v": "m-C1q1cLu7E", "coll": ["dividing-engine"]}, {"t": "Bottle of Magic", "b": "", "kindc": "film", "status": "live", "d": "1948", "img": "media/yt/S6IeuC8DSvg.jpg", "dur": 807, "by": "AT&T Tech Channel", "v": "S6IeuC8DSvg", "coll": ["dividing-engine-original", "att-archives"]}, {"t": "Computer History: WORLD'S LARGEST CALCULATOR: IBM's 1948 Giant Electronic Vacuum Tube Machine: SSEC", "b": "", "kindc": "film", "status": "live", "d": "1948", "img": "media/yt/m1M3iGDboMg.jpg", "dur": 636, "by": "Computer History Archives Project  (\"CHAP\")", "v": "m1M3iGDboMg", "coll": ["advantage"]}, {"t": "Crystal Clear", "b": "", "kindc": "film", "status": "live", "d": "1948", "img": "media/yt/uve2ZJmV4dk.jpg", "dur": 581, "by": "AT&T Tech Channel", "v": "uve2ZJmV4dk", "coll": ["att-archives"]}, {"t": "UCLA's Mechanical Brain: 1948", "b": "", "kindc": "film", "status": "live", "d": "1948", "img": "media/yt/hIinz4fKGpo.jpg", "dur": 180, "by": "danieljbmitchell", "v": "hIinz4fKGpo", "coll": ["dividing-engine"]}, {"t": "The MONIAC (Bill Phillips, LSE)", "b": "the national economy simulated hydraulically — income, taxes, savings, and imports as colored water flowing through tanks and valves; about 14 were built for universities and central banks.", "d": "1949", "in": [{"to": "era-7/50", "t": "Moniac: A Hydromechanical Machine to Teach Economics"}], "img": "media/cards/0ee9ce895564.webp", "cred": "Unlisted/Unknown · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3APhillips%20and%20MONIAC%20LSE.jpg"}, {"t": "The transistor (Bardeen, Brattain, Shockley at Bell Labs)", "b": "Bardeen and Brattain's point-contact device amplified a signal on 16 December 1947; Shockley, stung at being left off it, worked out the more manufacturable junction transistor within weeks. It did what a vacuum tube did, without the heat, the fragility, the warm-up or the size. Everything downstream — the computer on your desk, in your pocket, in the satellite — is this component, repeated.", "d": "1947", "img": "media/cards/4f8cfa5e9be3.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2N1307%20transistor%20die%20with%20bond%20wires%20attached.jpg"}, {"t": "Shannon's \"A Mathematical Theory of Communication\"", "b": "information had never been a measurable thing. <a class=\"xl\" href=\"#era-6/46\">Shannon<\/a> defined it as the reduction of uncertainty, named the unit the bit, and proved you can send a message over a noisy channel with as little error as you like — up to a hard limit he could calculate. Every modem, codec, error-correcting code and compression scheme since is working inside the bounds he set.", "d": "1948", "out": [{"to": "era-6/46", "t": "Claude Shannon's master's thesis"}], "img": "media/cards/3e5bb686255a.webp", "cred": "Claude E. Shannon and Warren Weaver · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Mathematical%20Theory%20Of%20Communication%20title%20page.jpg"}, {"t": "The Curta", "b": "a pocket-sized mechanical calculator of astonishing precision, designed by Curt Herzstark while imprisoned in Buchenwald; beloved by engineers and rally drivers until the 1970s.", "d": "1948", "img": "media/cards/75225d072396.webp", "cred": "Francis Chang · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ACurta%20Calculator%20%287419454394%29.jpg"}, {"t": "Food For Thought", "b": "", "kindc": "film", "status": "live", "d": "1949", "img": "media/yt/HoyouNQ-a2g.jpg", "dur": 1449, "by": "traci0dee", "v": "HoyouNQ-a2g", "coll": ["dividing-engine"]}, {"t": "Mathematics - Meaning of Pi (Ohio State University film) by Coronet Instructional", "b": "", "kindc": "film", "status": "live", "d": "1949", "img": "media/yt/xTP2mByoDNo.jpg", "dur": 605, "by": "rdwaynes", "v": "xTP2mByoDNo", "coll": ["dividing-engine"]}, {"t": "Noughts And Crosses Machine", "b": "", "kindc": "film", "status": "live", "d": "1949", "img": "media/yt/SlNxBb_27CA.jpg", "dur": 42, "by": "British Pathé", "v": "SlNxBb_27CA", "coll": ["dividing-engine"]}, {"t": "Synthetic Fibers: Nylon and Rayon", "b": "", "kindc": "film", "status": "live", "d": "1949", "img": "media/yt/Nl4bS-59w9c.jpg", "dur": 793, "by": "A/V Geeks 16mm Films", "v": "Nl4bS-59w9c", "via": "A/V Geeks 16mm Films", "coll": ["dividing-engine-original"]}, {"t": "Mississippi River Basin Model", "d": "1949", "b": "As a response to devastating floods of the Mississippi river in the early 1900s, the US Army Corps of Engineers built a large-scale hydraulic model of the entire river system. The model, 2. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mississippi-river-basin-model/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Moniac: A Hydromechanical Machine to Teach Economics", "d": "1949", "b": "<a class=\"xl\" href=\"#era-7/41\">The MONIAC<\/a> or Phillips machine is a hydromechanical analog computer built to teach basic economical principles using colored water flowing in transparent pipes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/moniac-a-hydromechanical-machine-to-teach-economics/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-7/41", "t": "The MONIAC (Bill Phillips, LSE)"}]}, {"t": "Hamming codes", "b": "error-*correcting* codes, born of weekend frustration with crashing punched-card runs — mathematics that lets messages heal themselves; Reed–Solomon codes (1960) later shield everything from CDs to deep-space probes.", "d": "1950", "img": "media/cards/945040299d66.webp", "cred": "TranvanKhanh · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHamming%20Code%20%28Fail%29.jpg"}, {"t": "McCulloch & Pitts", "b": "neurons modeled as logic gates — the paper von Neumann cites in the EDVAC report; brains and computers become each other's mirrors.", "d": "1943", "img": "media/cards/a6d4ae3d7b45.webp", "cred": "AnonymousUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAllan%20Riverstone%20McCulloch%20portrait%20cropped.jpg"}, {"t": "Vannevar Bush's Memex (\"As We May Think\")", "b": "an imagined desk that links documents by association — the essay that inspires <a class=\"xl\" href=\"#era-8/201\">Engelbart<\/a>, Nelson, and ultimately <a class=\"xl\" href=\"#era-9/360\">HyperCard<\/a> and the Web (Thread S).", "d": "1945", "out": [{"to": "era-8/201", "t": "Engelbart's \"Mother of All Demos\""}, {"to": "era-9/360", "t": "HyperCard (Bill Atkinson, Apple)"}], "img": "media/cards/21f99dec13fd.webp", "cred": "Time Inc. · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Memex%20%283002477109%29.jpg"}, {"t": "Wiener's *Cybernetics", "b": "*: feedback and control unify machines, animals, and organizations — a surprise bestseller that makes \"thinking machines\" a public question.", "d": "1948", "img": "media/cards/6e7adfa48a31.webp", "cred": "unknown\n\nGerd Küveler (reproduction) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AWiki%20Loves%20Jules%20Verne%20Norbert%20Wiener%20Cybernetics%201948%20%28Gerd%20Kueveler%29.jpg"}, {"t": "ENIAC computes the first numerical weather forecasts", "b": "Lewis Fry <a class=\"xl\" href=\"#era-6/16\">Richardson<\/a> had worked a forecast by hand in 1922 and it took him six weeks to produce six hours of weather — wrongly. He imagined a hall of 64,000 human computers keeping pace with the sky. In 1950 a team including John von Neumann and Jule Charney ran the calculation on ENIAC in about 24 hours for a 24-hour forecast: the machine had just caught up with the weather.", "d": "1950", "out": [{"to": "era-6/16", "t": "Richardson's \"forecast factory\""}]}, {"t": "Cable to Cuba, an AT&T film about laying undersea cable in 1950", "b": "", "kindc": "film", "status": "live", "d": "1950", "img": "media/yt/495IC6YtJ3I.jpg", "dur": 632, "by": "AT&T Tech Channel", "v": "495IC6YtJ3I", "coll": ["att-archives"]}, {"t": "IBM Computer History: SAGE, World's Largest Computer (AN/FSQ-7) (cold war RADAR defense) 1950's", "b": "", "kindc": "film", "status": "live", "d": "1950", "img": "media/yt/NdMj-JV5ygQ.jpg", "dur": 979, "by": "Computer History Archives Project  (\"CHAP\")", "v": "NdMj-JV5ygQ", "coll": ["advantage"]}, {"t": "Making Electrons Count (c. 1950)", "b": "", "kindc": "film", "status": "live", "d": "1950", "img": "media/yt/KH0tcv3nEQI.jpg", "dur": 1347, "by": "From the Vault of MIT", "v": "KH0tcv3nEQI", "coll": ["advantage"]}, {"t": "LEO I", "b": "the world's first business computer — built by J. Lyons & Co., a British *teashop chain*, to schedule cakes and payroll (Thread R).", "d": "1951", "img": "media/cards/47b906aaebba.webp", "cred": "Geni · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ALEO%20III%20computer%20circuit%20board%202012.JPG"}, {"t": "Turing's \"Computing Machinery and Intelligence\"", "b": "<a class=\"xl\" href=\"#era-6/43\">Turing<\/a> opens by calling 'can machines think?' too meaningless to discuss, and replaces it with a game — if a person cannot tell which correspondent is the machine, on what grounds do you refuse it the word? Most of the paper is him answering objections one at a time, including the one nobody expected: that a machine might learn, starting as a child does.", "d": "1950", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}]}, {"t": "UNIVAC I", "b": "the first computer sold as a product rather than built as a project. In 1952 CBS put one on air to call the presidential election; with 1% of the vote counted it predicted a landslide for Eisenhower, the network decided it could not be right and refused to broadcast it, and then apologised on air when it was. The public met the computer as an oracle, and the impression stuck.", "d": "1951", "img": "media/cards/8e5f4f5110fe.webp", "cred": "Unknown authorUnknown author · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGrace%20Hopper%20and%20UNIVAC.jpg"}, {"t": "Dialing the Nation", "b": "", "kindc": "film", "status": "blocked", "d": "1951", "img": "media/yt/C7YM9Sz9wxo.jpg", "dur": 602, "by": "AT&T Tech Channel", "v": "C7YM9Sz9wxo", "coll": ["att-archives"]}, {"t": "Early Computer Magnetic Tape Units: IBM, UNIVAC, RCA, Ampex", "b": "", "kindc": "film", "status": "live", "d": "1951", "img": "media/yt/lEYyZSlQEdg.jpg", "dur": 1678, "by": "Computer History Archives Project  (\"CHAP\")", "v": "lEYyZSlQEdg", "coll": ["dividing-engine"]}, {"t": "See It Now: Jay W. Forrester and the WHIRLWIND Computer", "b": "", "kindc": "film", "status": "live", "d": "1951", "img": "media/yt/5ZQP4G3Qwb4.jpg", "dur": 355, "by": "Diego Sanhueza Martínez", "v": "5ZQP4G3Qwb4", "coll": ["dividing-engine"]}, {"t": "UNIVAC Computer", "b": "", "kindc": "film", "status": "live", "d": "1951", "img": "media/yt/KHUS8lNrjHo.jpg", "dur": 179, "by": "Maurizio Banavage", "v": "KHUS8lNrjHo", "coll": ["dividing-engine-original"]}, {"t": "Electricity Generated or Demanded", "d": "1951", "b": "A 3D chart made out of a jagged cardboard for each year representing generated electricity and demand over time. Three-dimensional chart used by Central Electricity Generating Board planners, c.1954. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electricity-generated-or-demanded/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Microtiter Plates", "d": "1951", "b": "A microtiter plate is an array of chemical test tubes called \"wells\", invented in 1951 by a Hungarian medical doctor. They are used in a variety of experimental designs, most typically biochemistry assays. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/microtiter-plates/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Grace Hopper's A-0 compiler", "b": "<a class=\"xl\" href=\"#era-8/146\">Hopper<\/a>'s insight was that the machine could do its own clerical work — take names for common operations and assemble the machine code itself. She was told repeatedly that computers could only do arithmetic, and that nobody would trust a program written by a program. Every language you have ever used is downstream of her being right.", "d": "1952", "out": [{"to": "era-8/146", "t": "Grace Hopper's Nanoseconds"}], "in": [{"to": "era-7/17", "t": "Harvard Mark I (Aiken/IBM)"}, {"to": "era-8/146", "t": "Grace Hopper's Nanoseconds"}]}, {"t": "Prinz and Mays' electrical logic machine", "b": "built by Dietrich Prinz, one of <a class=\"xl\" href=\"#era-6/43\">Turing<\/a>'s protégés, with the philosopher Wolfe Mays — an electrical device for testing logical statements, and an early attempt at building human-like qualities into a machine.", "d": "1949", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}], "img": "media/museum/e1ff06a82860.webp", "cred": "Electrical logic machine, 1949"}, {"t": "How Television Works", "b": "", "kindc": "film", "status": "live", "d": "1952", "img": "media/yt/ZCfAiCS9a4U.jpg", "dur": 743, "by": "Computer History Archives Project  (\"CHAP\")", "v": "ZCfAiCS9a4U", "coll": ["dividing-engine"]}, {"t": "IBM Card Programmed Calculator - CPC Computer History Archives; WWII, Plugboard, vacuum tubes", "b": "", "kindc": "film", "status": "live", "d": "1952", "img": "media/yt/JPDL6Zaird4.jpg", "dur": 435, "by": "Computer History Archives Project  (\"CHAP\")", "v": "JPDL6Zaird4", "coll": ["advantage"]}, {"t": "Piercing the Unknown", "b": "", "kindc": "film", "status": "live", "d": "1952", "img": "media/yt/dAnbb8ZEkBk.jpg", "dur": 1283, "by": "PeriscopeFilm", "v": "dAnbb8ZEkBk", "coll": ["advantage"]}, {"t": "Potted and Printed Circuits", "b": "", "kindc": "film", "status": "live", "d": "1952", "img": "media/yt/AzLCr2ZBIgQ.jpg", "dur": 1444, "by": "PeriscopeFilm", "v": "AzLCr2ZBIgQ", "coll": ["dividing-engine"]}, {"t": "US Navy USS Saufley DD465 1952 Living Conditions", "b": "", "kindc": "film", "status": "live", "d": "1952", "img": "media/yt/8RHcz1KS7F8.jpg", "dur": 809, "by": "braintrusts", "v": "8RHcz1KS7F8", "coll": ["dividing-engine"]}, {"t": "Computer History: 1953 UNIVAC 1103A Scientific, Remington Rand vacuum tube plugin module circuit", "b": "", "kindc": "film", "status": "live", "d": "1953", "img": "media/yt/igHHqLfR5-0.jpg", "dur": 338, "by": "Computer History Archives Project  (\"CHAP\")", "v": "igHHqLfR5-0", "coll": ["advantage"]}, {"t": inum on the March", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/KJRD2Q7i624.jpg", "dur": 1664, "by": "Charlie Dean Archives", "v": "KJRD2Q7i624", "coll": ["dividing-engine"]}, {"t": "Integrated Data Processing", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/GBc1ArTr7dY.jpg", "dur": 1997, "by": "PeriscopeFilm", "v": "GBc1ArTr7dY", "coll": ["advantage"]}, {"t": "John Von Neumann Interview", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/vLbllFHBQM4.jpg", "dur": 150, "by": "sierranevadatrail", "v": "vLbllFHBQM4", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "Office Automation Computers: Integrated Data Processing 1956 IBM Burroughs NCR ELECOM Bell Teletype", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/iu9wFTKkgS4.jpg", "dur": 1710, "by": "Computer History Archives Project  (\"CHAP\")", "v": "iu9wFTKkgS4", "coll": ["advantage"]}, {"t": "Our Mr. Sun", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/JBwZ6UT0mMI.jpg", "dur": 3416, "by": "shaggylocks", "v": "JBwZ6UT0mMI", "coll": ["dividing-engine-original"]}, {"t": "People and Places - Disneyland USA", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/Tg3lAQ9pjlw.jpg", "dur": 2513, "by": "Lukas Dziatkowski", "v": "Tg3lAQ9pjlw", "coll": ["dividing-engine"]}, {"t": "The Bell Solar Battery", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/3I1JhyOahIw.jpg", "dur": 696, "by": "AT&T Tech Channel", "v": "3I1JhyOahIw", "coll": ["att-archives"]}, {"t": "The Power to Serve, A Presentation of Burroughs Corporation", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/foSzMTMV3cE.jpg", "dur": 1605, "by": "Detroit Historical Society", "v": "foSzMTMV3cE", "coll": ["dividing-engine"]}, {"t": "Tools of Telephony", "b": "", "kindc": "film", "status": "live", "d": "1956", "img": "media/yt/LAebA_z_7rk.jpg", "dur": 1817, "by": "PeriscopeFilm", "v": "LAebA_z_7rk", "coll": ["dividing-engine"]}, {"t": "FORTRAN", "b": "John Backus's team at IBM knew the objection before they started — hand-written machine code would always be faster, so nobody serious would use a translator. They spent most of the effort on the optimiser precisely to kill that argument, and shipped something that wrote code about as good as a person's. Programming stopped being an act of transcription and became one of expression.", "d": "1957", "img": "media/cards/d604d1afa3a4.webp", "cred": "original uploader was en:User:Muhandis · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AFortran%20acs%20cover.jpeg"}, {"t": "Computer music begins", "b": "the *Illiac Suite* (Hiller & Isaacson), the first substantial computer-composed score, and Max Mathews' MUSIC I at Bell Labs, the first widely used sound-synthesis program — <a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a>'s 1650 composition box, electrified (Thread T).", "d": "1957", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}]}, {"t": "Calculus reaches high school; the New Math follows", "b": "AP Calculus debuts 268 years after Newton's *Principia*; then Sputnik panic pushes set theory into elementary classrooms via teachers who were never trained in it — the curriculum-lag engine demonstrated at national scale, and reversed within 15 years (Thread L).", "d": "1955–58"}, {"t": "Link to the North", "b": "", "kindc": "film", "status": "live", "d": "1957", "img": "media/yt/Nq93WNt9gxc.jpg", "dur": 641, "by": "AT&T Tech Channel", "v": "Nq93WNt9gxc", "coll": ["att-archives"]}, {"t": "Perceptron", "b": "", "kindc": "film", "status": "live", "d": "1957", "img": "media/yt/cNxadbrN_aI.jpg", "dur": 71, "by": "Pseudo1ntellectual", "v": "cNxadbrN_aI", "via": "Pseudo1ntellectual", "coll": ["dividing-engine-original"]}, {"t": "Rhythm of Production", "b": "", "kindc": "film", "status": "live", "d": "1957", "img": "media/screen-shot-2015-08-07-at_360-7.png", "v": "0594_Rhythm_of_Production_Automatic_Mass_Production_with_Progress_Th_11_34_56_00", "emb": "https://archive.org/embed/0594_Rhythm_of_Production_Automatic_Mass_Production_with_Progress_Th_11_34_56_00", "url": "https://archive.org/embed/0594_Rhythm_of_Production_Automatic_Mass_Production_with_Progress_Th_11_34_56_00", "coll": ["dividing-engine-original"]}, {"t": "Special Lessons the Slide Rule", "b": "", "kindc": "film", "status": "live", "d": "1957", "img": "media/yt/RA0uRxVjZL4.jpg", "dur": 1869, "by": "PeriscopeFilm", "v": "RA0uRxVjZL4", "coll": ["advantage"]}, {"t": "The Strange Case of the Cosmic Rays", "b": "", "kindc": "film", "status": "blocked", "d": "1957", "img": "media/yt/k_wt5AFjRQo.jpg", "dur": 3283, "by": "Jack Fuller", "v": "k_wt5AFjRQo", "coll": ["dividing-engine-original"]}, {"t": "The Strange Case of the Cosmic Rays, part 2", "b": "", "kindc": "film", "status": "live", "d": "1957", "img": "media/yt/l7olzpYXQmQ.jpg", "dur": 1785, "by": "PeriscopeFilm", "v": "l7olzpYXQmQ", "coll": ["dividing-engine"]}, {"t": "US Army Corps of Engineers San Francisco Bay Model", "d": "1957", "b": "A working hydrodynamic model of San Francisco Bay and the surrounding waterways, with tides. It is still open to the public as a demonstration, although it is no longer used for research. <em> <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/uscae-bay-model/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Proteine Visualizations", "d": "1957", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/proteine-visualizations/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Setun (Moscow State University)", "b": "the only production *balanced-ternary* computer — digits −1, 0, +1; about 50 built; a road not taken.", "
