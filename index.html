On the morning of 12 May the attack started.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/b45896c0ca6c.jpg", "dur": 3486, "by": "BBC", "v": "284e2724458fb8930970fcdf89c471da", "url": "https://clp.bbcrewind.co.uk/284e2724458fb8930970fcdf89c471da", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Horizon: Dawn of the Driverless Car", "b": "The car has shrunk the world, increased personal freedom and in so many ways expanded our horizons, but there is a flipside.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/557e09fbb3ad.jpg", "dur": 3539, "by": "BBC", "v": "21523bb8edc9d18d254cf596025284a3", "url": "https://clp.bbcrewind.co.uk/21523bb8edc9d18d254cf596025284a3", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Hyper Evolution: The Rise of the Robots: Episode 1", "b": "Ben is unashamedly unnerved by the tremendous rate that robots are evolving, whilst Danielle is welcoming them with open arms.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/ab40366c28af.jpg", "dur": 3526, "by": "BBC", "v": "97d8d73c1459944cad683238d676b81b", "url": "https://clp.bbcrewind.co.uk/97d8d73c1459944cad683238d676b81b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Hyper Evolution: The Rise of the Robots: Episode 2", "b": "In this episode, Danielle and Ben investigate whether robots will ever become our friends, if we should trust them with our lives, and if one day they will even become conscious.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/f5072fd1f6b3.jpg", "dur": 3527, "by": "BBC", "v": "6263b020131b0cc9166653f8d69c0fdb", "url": "https://clp.bbcrewind.co.uk/6263b020131b0cc9166653f8d69c0fdb", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Panorama: What Facebook Knows About You", "b": "Current affairs programme. Darragh MacIntyre investigates Facebook and questions whether the company's size and complexity now makes it impossible to regulate. Watch programme", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/496fbe418c9d.jpg", "dur": 1732, "by": "BBC", "v": "8bb613c381855cfdf65274a33fa17096", "url": "https://clp.bbcrewind.co.uk/8bb613c381855cfdf65274a33fa17096", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): 'Babel Fish' Language Translation", "b": "New technology that claims to be able to translate speech through an earpiece worn by the user – like the fictional Babel Fish in The Hitchhiker's Guide to the Galaxy – has been unveiled at the Mobile World Congress in Barcelona.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/2415e3d53e40.jpg", "dur": 342, "by": "BBC", "v": "edab124d35f958cca05bc2832e557869", "url": "https://clp.bbcrewind.co.uk/edab124d35f958cca05bc2832e557869", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): AI Bias Against Women", "b": "Machines programmed using photos are learning to be sexist towards women, dismissing the great promise of artificial intelligence and its ability to remove bias.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/cde6e47b9bfc.jpg", "dur": 356, "by": "BBC", "v": "2873839428b25c9b1246e4f7f2f0e114", "url": "https://clp.bbcrewind.co.uk/2873839428b25c9b1246e4f7f2f0e114", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): AI Effects: Professors Dame Wendy Hall & Noel Sharkey", "b": "The Chancellor delivers his budget on Wednesday but we've already had a few sneak previews. One of them is a £75m fund for investment in AI companies.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/e12b73469c08.jpg", "dur": 299, "by": "BBC", "v": "6b418f211e9de3ecc913360a5891bc9b", "url": "https://clp.bbcrewind.co.uk/6b418f211e9de3ecc913360a5891bc9b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Is Russia ‘Weaponising’ Information?", "b": "Russia is trying to \"weaponise\" information. That was the prime minister's warning. In a speech this week a senior adviser to the boss of Google was issuing a warning of his own. Jared Cohen declared that \"all future wars are going to begin as cyber wars\".", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/47097de1cca7.jpg", "dur": 401, "by": "BBC", "v": "67d40638abf94d2c17ed19696ab64443", "url": "https://clp.bbcrewind.co.uk/67d40638abf94d2c17ed19696ab64443", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Marcus Hutchins USA Arrest", "b": "US prosecutors say a British computer expert has admitted to creating software that harvests bank details. But Marcus Hutchins' own lawyer says he denies six charges of creating and distributing the Kronos malware.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/003eacc69652.jpg", "dur": 359, "by": "BBC", "v": "44eb3e556210634d18e8362c55af27f1", "url": "https://clp.bbcrewind.co.uk/44eb3e556210634d18e8362c55af27f1", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): MishalBot Presenter Robot", "b": "Artificial Intelligence makes most people think of two things; futuristic killer robots bent on destroying the human race or spotless factories where obsolete workers are replaced by silently gliding robots.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/885808e520c1.jpg", "dur": 133, "by": "BBC", "v": "55619fba8a3bc749162c3a190e1ee5ae", "url": "https://clp.bbcrewind.co.uk/55619fba8a3bc749162c3a190e1ee5ae", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Robots and Artificial Intelligence", "b": "Robots and artificial intelligence devices are playing an increasingly central role in society. And if you have a smartphone or Amazon Alexa, you will know that this means we increasingly have to talk to machines.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/3fdadc17c27b.jpg", "dur": 357, "by": "BBC", "v": "fdef9af5c65d6d7fce91bcca61514881", "url": "https://clp.bbcrewind.co.uk/fdef9af5c65d6d7fce91bcca61514881", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): The New National Cyber Security Centre Pt1", "b": "The Queen will today launch a new national centre to protect the UK against cyber-attacks. The centre says the UK is facing on average 60 serious attacks a month - with Russia a growing concern. BBC’s Gordon Corera reports.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/f6eeab6acacf.jpg", "dur": 838, "by": "BBC", "v": "dd7def3b89eda7ccba9aea08bd0e883e", "url": "https://clp.bbcrewind.co.uk/dd7def3b89eda7ccba9aea08bd0e883e", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): The New National Cyber Security Centre Pt2", "b": "The opening of the new National Cyber Security Centre is testament to the threat that cyber security poses to governments.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/0585e3f00f44.jpg", "dur": 391, "by": "BBC", "v": "80dcd3b0ac68717e81acb21f503a580e", "url": "https://clp.bbcrewind.co.uk/80dcd3b0ac68717e81acb21f503a580e", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Secrets of Silicon Valley: The Disruptors", "b": "Jamie Bartlett uncovers the dark reality behind Silicon Valley's glittering promise to build a better world. The tech gods believe progress is powered by technology tearing up the world as it is - a process they call disruption.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/5e75ab6777b6.jpg", "dur": 3517, "by": "BBC", "v": "0aa40908182a453af2b2a1c99cbbe3ac", "url": "https://clp.bbcrewind.co.uk/0aa40908182a453af2b2a1c99cbbe3ac", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Secrets of Silicon Valley: The Persuasion Machine", "b": "Jamie Bartlett reveals how Silicon Valley's mission to connect the world is disrupting democracy, helping plunge us into an age of political turbulence.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/d855ad35b9c6.jpg", "dur": 3549, "by": "BBC", "v": "c6d27ffedcf614232f7bb813d0c6d8b1", "url": "https://clp.bbcrewind.co.uk/c6d27ffedcf614232f7bb813d0c6d8b1", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Life Scientific: Alan Winfield on Robots", "b": "Alan Winfield is the only Professor of Robot Ethics in the world. He is a voice of reason amid the growing sense of unease at the pace of progress in the field of artificial intelligence.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/7da9a5a37295.jpg", "dur": 1654, "by": "BBC", "v": "d0f8302f4007dba0aca6c78fbcfd9ac5", "url": "https://clp.bbcrewind.co.uk/d0f8302f4007dba0aca6c78fbcfd9ac5", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Rise of the Robots: Our Relationship With These Machines", "b": "Robots are becoming present in our lives, as companions and as helpers. Some are humanoid, others are like dustbins. Adam Rutherford explores our relationship with these machines.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/47968ccf5e7c.jpg", "dur": 1672, "by": "BBC", "v": "c3d23c5a68c59e6da3b79dcd3e70ba5a", "url": "https://clp.bbcrewind.co.uk/c3d23c5a68c59e6da3b79dcd3e70ba5a", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Rise of the Robots: The Role of Robots in Societies", "b": "The idea of robots goes back to the Ancient Greeks. In myths Hephaestus, the god of fire, created robots to assist in his workshop. In the medieval period the wealthy showed off their automata.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/3ecdd88165c0.jpg", "dur": 1670, "by": "BBC", "v": "961e39f3507856498ccbe58bb4fedb37", "url": "https://clp.bbcrewind.co.uk/961e39f3507856498ccbe58bb4fedb37", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Rise of the Robots: Where Is My Mind?", "b": "Are we ready for artificial intelligences making decisions for us? From Skynet and the Terminator franchise, through Wargames and Ava in Ex Machina, artificial intelligences pervade our cinematic experiences.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/4599031b022d.jpg", "dur": 1661, "by": "BBC", "v": "f3b2798b449c0f1347ad70316241dc81", "url": "https://clp.bbcrewind.co.uk/f3b2798b449c0f1347ad70316241dc81", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Cambridge Analytica, Facebook Data + Uber Self-driving Car Tests", "b": "The UK's Information Commissioner is to apply to court for a warrant to search the offices of London-based political consulting firm, Cambridge Analytica.", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/db468ac8b744.jpg", "dur": 533, "by": "BBC", "v": "cc9275668749cababf55b98eba88640b", "url": "https://clp.bbcrewind.co.uk/cc9275668749cababf55b98eba88640b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Cryptocurrency Criminal Transactions", "b": "Police concerns about the increased use of Cryptocurrencies to hide criminal transactions Watch programme", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/0d1f163f6b5b.jpg", "dur": 364, "by": "BBC", "v": "0be6aced679f86dde3ab923f0514c23f", "url": "https://clp.bbcrewind.co.uk/0be6aced679f86dde3ab923f0514c23f", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Dr Aleksandr Kogan, Facebook, Data Harvesting & Cambridge Analytica", "b": "An academic who created an app which harvested data from 50 million users says he has been made \"a scapegoat\" for Facebook and Cambridge Analytica.", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/bd1cfefee8d9.jpg", "dur": 1084, "by": "BBC", "v": "512dedfe1c3206de7329a57aaa2324bb", "url": "https://clp.bbcrewind.co.uk/512dedfe1c3206de7329a57aaa2324bb", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The BBC Computer Literacy Project Interviews: David Kitson (Head of Transmission Group within BBC Designs Department)", "b": "David Kitson (Head of Transmission Group within BBC Designs Department) became responsible for monitoring the progress of the BBC micro computer in behalf of BBC Engineering. Watch programme", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/40acb6909157.jpg", "dur": 1180, "by": "BBC", "v": "4412a4e642f6bc04b47f09ec7953a6bf", "url": "https://clp.bbcrewind.co.uk/4412a4e642f6bc04b47f09ec7953a6bf", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The BBC Computer Literacy Project Interviews: John Radcliffe (Executive producer)", "b": "John Radcliffe (Executive producer and later Head of Open University Productions) and David Allen (project editor) In conversation in May 2018, remembering the Computer Literacy Project 40 years on. Watch programme", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/2a9418ff2f15.jpg", "dur": 3467, "by": "BBC", "v": "aef4287b5161099b147d9c4a75f9c1d3", "url": "https://clp.bbcrewind.co.uk/aef4287b5161099b147d9c4a75f9c1d3", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The BBC Computer Literacy Project Interviews: Sheila Innes, former BBC Controller Educational Broadcasting", "b": "Sheila Innes Head of Department and later Controller of Educational Broadcasting remembers origins and highlights of the project, recorded May 2018 Watch programme", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/c8ab5fbd86a9.jpg", "dur": 585, "by": "BBC", "v": "bb6b1ca945a5e42fe93b610d75bd125a", "url": "https://clp.bbcrewind.co.uk/bb6b1ca945a5e42fe93b610d75bd125a", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Life Scientific: Eben Upton on Raspberry Pi", "b": "Jim Al-Khalili discusses the scientific life with fellow scientists. Eben Upton tells Jim how Raspberry Pi, a computer that costs little more than a toasted sandwich, was created. Watch programme", "kindc": "film", "status": "offsite", "d": "2018", "img": "media/clp/affcc2070947.jpg", "dur": 1658, "by": "BBC", "v": "702bee8821b6dd946dc8d7ff59d1b21a", "url": "https://clp.bbcrewind.co.uk/702bee8821b6dd946dc8d7ff59d1b21a", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "GPT-3, then ChatGPT", "b": "large language models reach the public; training runs consume ~10²³–10²⁵ floating-point operations.", "d": "2020–2022"}, {"t": "The 1890 US Census and the history of punchcard computing [feat. Grant of 3blue1brown fame]", "b": "", "kindc": "film", "status": "live", "d": "2020", "img": "media/yt/YBnBAzrWeF0.jpg", "dur": 1247, "by": "Stand-up Maths", "v": "YBnBAzrWeF0", "coll": ["advantage"]}, {"t": "Sheridan Simon Talk 2021. William Hahn", "b": "", "kindc": "film", "status": "live", "d": "2021", "img": "media/yt/F6dqngF7S5E.jpg", "dur": 4849, "by": "Don Smith", "v": "F6dqngF7S5E", "coll": ["computers-101"]}, {"t": "Frontier supercomputer", "b": "a billion billion operations a second at Oak Ridge, drawing about 21 megawatts — roughly a small town. Every machine on this timeline until the 1940s ran on a hand, a weight or a waterwheel. The constraint has moved from what we can build to what we can cool and power, which is where the constraint sat for the watermill too.", "d": "2022", "img": "media/cards/cef89b1034a5.webp", "cred": "OLCF at ORNL · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFrontier%20Supercomputer%20%282%29.jpg"}, {"t": "Nature computes", "b": "slime mold (Physarum) re-derives the Tokyo rail network layout (2010); researchers use ripples in a literal bucket of water as a \"liquid state machine\" for speech-pattern recognition (2003) — see Thread I.", "d": "2000s–2010s", "img": "media/cards/f547998a7461.webp", "cred": "Woodman, J. M. [from old catalog] · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3AGod%20in%20nature%20and%20revelation%20%281875%29%20%2814582271380%29.jpg"}, {"t": "Google's Sycamore \"quantum supremacy\" claim", "b": "a quantum processor performs a (contrived) task believed intractable for classical machines.", "d": "2019"}, {"t": "AlphaFold 2", "b": "protein structure prediction effectively solved — computation as an instrument of scientific *discovery*, honored with a Nobel Prize in 2024.", "d": "2020"}, {"t": "Operation Rubicon revealed", "b": "Crypto AG, the trusted Swiss cipher-machine maker, had been secretly owned by the CIA and West German BND for decades — half the world bought its \"secure\" machines from its adversaries.", "d": "2020", "img": "media/cards/a25604a66c3f.webp", "cred": "Photograph by Rama, Wikimedia Commons, Cc-by-sa-2.0-fr · CC BY-SA 2.0 fr", "credurl": "https://commons.wikimedia.org/wiki/File:Hagelin_CX-52-IMG_0568-white.jpg"}, {"t": "Computer History: IBM 1919 - 1970 Computing Tabulating Recording (data processing, mainframe 360 NU)", "b": "", "kindc": "film", "status": "live", "d": "2022", "img": "media/yt/fXa4qPCeoeE.jpg", "dur": 1329, "by": "Computer History Archives Project  (\"CHAP\")", "v": "fXa4qPCeoeE", "coll": ["advantage"]}, {"t": "NIST post-quantum cryptography standards", "b": "after eight years of open competition, NIST published the first standard algorithms designed to survive a quantum computer. No such machine exists yet that can break anything — but encrypted traffic recorded today can be decrypted later, so the deadline for switching is already in the past for anything that must stay secret for a decade.", "d": "2024"}, {"t": "computing still classified", "b": "intelligence-agency supercomputers absent from public rankings; TEMPEST emission-security standards partly secret; nuclear-stockpile machines behind closed doors — the fastest computers on Earth may not be the ones we know about (see Thread J).", "d": "Today", "img": "media/cards/47b740468b0b.webp", "cred": "M. Weik · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:ENIAC-changing_a_tube_%28cropped%29.jpg"}, {"t": "Frontier AI training runs (~10²⁵–10²⁶ FLOPs)", "b": "and formal proof assistants (Lean, Coq) verifying real mathematics — machines now assist at every level from arithmetic to proof.", "d": "2020s"}, {"t": "The analog revival", "b": "in-memory, memristor, and photonic chips perform AI's matrix arithmetic with raw physics (currents, light) instead of digital logic — computing's oldest idea returning at the frontier, driven by AI's appetite for multiplication (Thread A).", "d": "2020s", "img": "media/cards/2a343586a2df.webp", "cred": "Chad · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File:1st_commercial_Moog_synthesizer_%281964%2C_commissioned_by_the_Alwin_Nikolai_Dance_Theater_of_NY%29_%40_Stearns_Collection_%28Stearns_2035%29%2C_University_of_Michigan.jpg"}]}, {"id": "thread-A", "kind": "thread", "title": "Thread A: The Speed Ladder", "sub": "the emotional core of the site", "cards": [{"t": "Overview", "b": "Approximate sustained arithmetic rates, for direct comparison cards:"}, {"t": "Human with pencil", "b": "~0.01–0.05 operations/sec (a multi-digit multiplication takes ~20–60 s)", "img": "media/cards/6d7fae31b289.webp", "cred": "Graphophile · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3APencil%20over%20the%20line.jpg"}, {"t": "Skilled abacus operator", "b": "~1 op/sec bursts", "img": "media/cards/70b274bfcf54.webp", "cred": "Pearson Scott Foresman · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Abacus_%28PSF%29.png"}, {"t": "de Prony's table project", "b": "~100 human computers for years → millions of table entries", "img": "media/cards/1e759747f684.webp", "cred": "Gaspard de Prony · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Gaspard_de_Prony.jpg"}, {"t": "Mechanical desk calculator", "b": "~0.1–0.5 ops/sec", "img": "media/cards/9b27c7a45e17.webp", "cred": "Ezrdr · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Mechanical_calculators_Keyboards.png"}, {"t": "ENIAC (1945)", "b": "~5×10³ additions/sec", "img": "media/cards/2e7957ef3de2.webp", "cred": "United States Army · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATwo%20women%20operating%20ENIAC.gif"}, {"t": "IBM System/360 (1964)", "b": "~10⁵–10⁶ ops/sec", "img": "media/cards/c9454d17bbb3.webp", "cred": "Sandstein · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIBM%20system%20360-50%20console%20-%20MfK%20Bern.jpg"}, {"t": "Cray-1 (1976)", "b": "~1.6×10⁸ FLOP/s", "img": "media/cards/f38daf38e2fb.webp", "cred": "Rama · CC BY-SA 2.0 fr", "credurl": "https://commons.wikimedia.org/wiki/File%3ACray%201%20IMG%209126.jpg"}, {"t": "Intel Pentium (1993)", "b": "~10⁸", "img": "media/cards/5f1d507c0c67.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3APentium%20III%20SL4CB.jpg"}, {"t": "Smartphone (2020s)", "b": "~10¹¹–10¹²", "img": "media/cards/ca8ffa11359c.webp", "cred": "Sage Ross · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Wikipedia_homepage_on_a_large_Android_phone%2C_2015-04-16.jpg"}, {"t": "Single modern AI GPU", "b": "~10¹⁴–10¹⁵ FLOP/s"}, {"t": "Frontier/exascale cluster", "b": ">10¹⁸ FLOP/s"}, {"t": "One frontier AI training run", "b": "~10²⁵–10²⁶ total FLOPs"}, {"t": "The punchline card", "b": "a student doing one operation per second, nonstop, would need vastly longer than the age of the universe (~4×10¹⁷ seconds) to perform the arithmetic of a single modern AI training run — yet every one of those operations is the same kind of arithmetic the student practices by hand."}]}, {"id": "thread-B", "kind": "thread", "title": "Thread B: Human Computers", "sub": "", "cards": [{"t": "Overview", "b": "Tally-keepers → scribes → table-makers → de Prony's pyramid → Harvard <a class=\"xl\" href=\"#era-6/0\">Observatory<\/a> women → WPA project → Bletchley → ENIAC programmers → NASA's hidden figures → \"computer\" stops meaning a person (~1950s).", "out": [{"to": "era-6/0", "t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)"}]}]}, {"id": "thread-C", "kind": "thread", "title": "Thread C: Ideas", "sub": "the mathematics itself", "cards": [{"t": "Overview", "b": "Positional notation → zero → algorithms (<a class=\"xl\" href=\"#era-3/4\">al-Khwarizmi<\/a>) → logarithms → binary → Boolean logic → computability (<a class=\"xl\" href=\"#era-6/43\">Turing<\/a>/Church) → information theory (<a class=\"xl\" href=\"#era-6/46\">Shannon<\/a>) → complexity theory (P vs NP, 1971 Cook) → machine proof.", "out": [{"to": "era-3/4", "t": "al-Khwarizmi (House of Wisdom, Baghdad)"}, {"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "era-6/46", "t": "Claude Shannon's master's thesis"}]}]}, {"id": "thread-D", "kind": "thread", "title": "Thread D: Machines", "sub": "", "cards": [{"t": "Overview", "b": "Tally bone → abacus → <a class=\"xl\" href=\"#era-2/24\">Antikythera<\/a> → astrolabe → Pascaline → <a class=\"xl\" href=\"#era-5/1\">Jacquard loom<\/a> → Analytical Engine → tabulators → analog computers → ENIAC → transistor → IC → microprocessor → GPU → AI accelerators.", "out": [{"to": "era-2/24", "t": "Antikythera mechanism"}, {"to": "era-5/1", "t": "Jacquard loom"}]}]}, {"id": "thread-E", "kind": "thread", "title": "Thread E: Why Learn It by Hand?", "sub": "pedagogical cards", "cards": [{"t": "Every era's mathematicians practiced the previous era's methods.", "b": "Every era's mathematicians practiced the previous era's methods."}, {"t": "Estimation and error-checking (Glenn trusting Johnson over the machine…", "b": "Estimation and error-checking (Glenn trusting Johnson over the machine).", "in": [{"to": "thread-N/10", "t": "Closing card"}]}, {"t": "Understanding what the machine does 10²⁵ times.", "b": "Understanding *what* the machine does 10²⁵ times."}, {"t": "The tradition argument", "b": "hand arithmetic connects a student to the <a class=\"xl\" href=\"#era-1/2\">Ishango bone<\/a>.", "out": [{"to": "era-1/2", "t": "Ishango bone (Congo)"}], "img": "media/cards/f386082877b8.webp", "cred": "Gill, John · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20argument%20from%20apostolic%20tradition%20Fleuron%20T014010-2.png"}, {"t": "The internalization argument", "b": "soroban masters prove that a deeply practiced tool becomes a mental faculty (see Thread H2 — anzan)."}]}, {"id": "thread-F", "kind": "thread", "title": "Thread F: What Is a Number?", "sub": "cross-cultural conceptions of number & data", "cards": [{"t": "Egypt — number as measure. Number lives in physical quantities", "b": "the cubit (length), setat (area), hekat (grain volume), deben (weight), the 365-day civil calendar (time). Unit fractions exist for fair division — how to split 7 loaves among 10 workers. Mathematics is a scribe's craft, taught by worked example, validated by *working*: \"the correct method of reckoning.\"", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Greece — number as idea. Sharp split between arithmos (a multitude…", "b": "*Greece — number as idea.* Sharp split between *arithmos* (a multitude of discrete units) and *megethos* (continuous magnitude), and between *logistikē* (mere reckoning — low prestige, left to slaves and merchants) and *arithmētikē* (theory of number — philosophy). Mathematics is validated by *proof*: it must be shown to be necessarily true.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "The twist", "b": "* Herodotus reports the Greeks learned geometry from <a class=\"xl\" href=\"#era-2/7\">Egyptian rope-stretchers<\/a>. Measurement became abstraction; the surveyor's craft became the philosopher's object.", "ch": "Featured comparison stack: Egypt vs. Greece", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}]}, {"t": "Contrast cards", "b": "* procedure vs. proof · scribe vs. philosopher · \"does it work?\" vs. \"why must it be true?\" · number embedded in things vs. number as a thing itself.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Payoff card for students", "b": "* every math student recapitulates both traditions — first you *compute* like an Egyptian scribe, then you learn to *prove* like a Greek. Both are the tradition.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Mesopotamia", "b": "* no single \"number\" at first — separate metrological systems for grain, land, silver, and time; the abstract sexagesimal system emerges from bureaucracy. Our hours, minutes, and degrees are its living fossil.", "ch": "Other conception-of-number cards", "img": "media/cards/5503bd2a63e8.webp", "cred": "SpeakingArch · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AClay%20Envelope%20%2C%20c.2034%20BCE%2C%20Umma%2C%20Mesopotamia.%20Currently%20at%20the%20RAMM%2C%20Exeter.jpg"}, {"t": "China", "b": "* number as a physical rod on a counting board — manipulable, spatial; negative numbers simply rods of another color.", "ch": "Other conception-of-number cards", "img": "media/cards/fd8fda3788d2.webp", "cred": "CEphoto, Uwe Aranas · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ABadaling%20China%20Great-Wall-of-China-01.jpg"}, {"t": "India", "b": "* numbers as Sanskrit words and verse (mathematics recited and memorized); zero and the infinite admitted as legitimate objects of calculation.", "ch": "Other conception-of-number cards", "img": "media/cards/e212305c07b9.webp", "cred": "Dennis G. Jarvis · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIndia-0037%20-%20Flickr%20-%20archer10%20%28Dennis%29.jpg"}, {"t": "Maya", "b": "* number as time — dates, calendar cycles, numbers personified as gods; base-20 with head-glyph numerals.", "ch": "Other conception-of-number cards"}, {"t": "Inca", "b": "* data without writing — knot type, knot position, cord color, and cord hierarchy as the fields of an imperial database.", "ch": "Other conception-of-number cards", "img": "media/cards/51a0457afeb4.webp", "cred": "Martin St-Amant (S23678) · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A80%20-%20Machu%20Picchu%20-%20Juin%202009%20-%20edit.2.jpg"}, {"t": "Bodies and bases", "b": "* base-5, 10, 20, 60; 27-body-part counting systems of Papua New Guinea; Yoruba base-20 with subtractive construction — the human body as the first numeral system.", "ch": "Other conception-of-number cards"}, {"t": "Data as length, weight, time, quantity", "b": "* a synthesis card — before number was abstract, every culture computed *with the world itself*: ropes, stones, beads, knots, shadows, <a class=\"xl\" href=\"#era-2/6\">water clocks<\/a>, balance scales.", "ch": "Other conception-of-number cards", "out": [{"to": "era-2/6", "t": "Water clocks (clepsydrae) (Egypt, then Babylon, Greece, China)"}]}, {"t": "I Ching (China)", "b": "64 hexagrams from binary lines — divination as combinatorics (see Era 2 and the <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> connection).", "ch": "Computing without written numbers (embodied & ritual computation)", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}], "img": "media/cards/3ddda6a3b53b.webp", "cred": "Song era print artist · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:I_Ching_Song_Dynasty_print.jpg"}, {"t": "Ifá divination (Yoruba, West Africa)", "b": "256 odu generated from 8 binary casts — exactly one byte of states, each indexing a body of recited literature; a binary addressing system in ritual form.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/9d6d19fc3275.webp", "cred": "Toluaye · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AJogo%20de%20Ikin%20Orossi.JPG"}, {"t": "Sona sand drawings (Chokwe, Angola/DR Congo)", "b": "single-line figures traced over dot grids by memorized rules — Eulerian paths and recursive algorithms executed as art.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/018bd84c953f.webp", "cred": "OmarTheKingFr · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKalunga-lusona.jpg"}, {"t": "Marshall Islands stick charts", "b": "ocean swell patterns and their interference around islands encoded in lashed sticks and shells — an analog model of wave dynamics, memorized before the voyage and left ashore.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/3c3c242528cd.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMarshall%20Islands%20stick%20chart%2C%20Rebbelib%20type.%20LOC%202010586182.jpg"}, {"t": "Polynesian wayfinding", "b": "star compass, dead reckoning, and the etak reference-island system — voyages of thousands of miles computed continuously in the navigator's head.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/25d1c4813a2f.webp", "cred": "S. Percy Smith · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APolynesian%20navigation%20device%20showing%20directions%20of%20winds%2C%20waves%20and%20islands.jpg"}, {"t": "Mancala-family games (Africa, Middle East, Asia)", "b": "seed-counting and capture strategy — arithmetic and lookahead as play.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/162a5a983b64.webp", "cred": "MozMozJ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Yao_People_Playing_%22Bawo%22.jpg"}, {"t": "Theme card", "b": "computation has always lived in ritual, art, navigation, and games — alongside and long before written mathematics.", "ch": "Computing without written numbers (embodied & ritual computation)"}]}, {"id": "thread-G", "kind": "thread", "title": "Thread G: Cryptography: computing to conceal and reveal", "sub": "", "cards": [{"t": "Overview", "b": "Caesar cipher (antiquity) → <a class=\"xl\" href=\"#era-3/6\">al-Kindi<\/a>'s frequency analysis (9th c.) → Alberti's cipher disk (1467) → Vigenère (1553) → <a class=\"xl\" href=\"#era-5/6\">Babbage<\/a> & Kasiski break it (1850s–63) → Rejewski's bomba vs. Enigma (1932) → <a class=\"xl\" href=\"#era-6/43\">Turing<\/a>/Welchman Bombe & <a class=\"xl\" href=\"#era-7/8\">Colossus<\/a> (1940s) → DES (1977) → Diffie–Hellman & RSA (1976–77) → elliptic curves → Shor's quantum threat (1994) → NIST post-quantum standards (2024). Theme: an arms race that repeatedly *forced* the invention of faster computation — including the first programmable electronic computer.", "out": [{"to": "era-3/6", "t": "al-Kindi"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "era-7/8", "t": "Colossus (Bletchley Park)"}]}]}, {"id": "thread-H", "kind": "thread", "title": "Thread H: The Art of Reckoning", "sub": "how people *actually* calculated", "cards": [{"t": "Roman numerals are a recording notation, nearly useless for arithmet…", "b": "Roman numerals are a *recording* notation, nearly useless for arithmetic — try multiplying XLVII × XXXIX on paper. Romans didn't; nobody did.", "ch": "The Roman paradox: numerals for writing, machines for computing", "img": "media/cards/f3f4737d9ca1.webp", "cred": "Alex1011 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:CuttySarkRomNum.jpg"}, {"t": "Day-to-day arithmetic ran on pebbles (calculi) on lined counting boa…", "b": "Day-to-day arithmetic ran on **pebbles (calculi) on lined counting boards** and on the **portable bronze hand abacus** — grooved slots for units through millions, plus extra slots for base-12 fractions (unciae). A merchant's pocket device, ~2,000 years before the pocket calculator.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Key card for students", "b": "the numeral was the *output format*; the board was the *processor*. Notation ≠ computation.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Linguistic-fossils card", "b": "*calculus/calculate* (pebble), *exchequer* (the checkered counting cloth of the English treasury), the shop *counter* (the counting table), *bank* (the money-changer's bench where the board sat).", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Counting boards with cast counters (jetons) remained standard across E…", "b": "Counting boards with cast counters (jetons) remained standard across Europe into the 1600s–1700s. Samuel Pepys — Cambridge graduate, senior naval administrator — hired a tutor at age 29 (1662) to learn the multiplication table. Written arithmetic was a *specialist skill* long after board-reckoning was universal.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "The suanpan (China, 2+5 beads) and soroban (Japan, 1+4 beads)…", "b": "The **suanpan** (China, 2+5 beads) and **soroban** (Japan, 1+4 beads) are not museum pieces — millions of children in Japan, China, Taiwan, Korea, India, and Southeast Asia train on them today in schools and after-school academies, with **kyū/dan ranking exams** graded like martial arts.", "ch": "The living abacus: East Asian abacus education today", "img": "media/cards/f84c90a8b15f.webp", "cred": "N509FZ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AROC-era%20abacus%20at%20China%20National%20Museum%20of%20Women%20and%20Children%20%2820210909140914%29.jpg"}, {"t": "The schoty, Russia's abacus, was still clicking on shop counters i…", "b": "The **schoty**, Russia's abacus, was still clicking on shop counters into the 1990s. Western Europe abandoned the counting board; most of the world never stopped.", "ch": "The living abacus: East Asian abacus education today", "img": "media/cards/f6846fa9a6a4.webp", "cred": "Syced · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAbacus%20actually%20in%20use%20at%20kimono%20shop%20in%20Otaru.jpg"}, {"t": "Anzan (暗算) — the internalized machine", "b": "advanced students stop needing the physical soroban. They visualize it and move imaginary beads — you can watch champions' fingers flicking over an empty desk. The machine has been *installed in the mind*.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Flash anzan", "b": "multi-digit numbers flashed on screen faster than they can be read aloud; top competitors correctly sum 15 three-digit numbers shown in under two seconds. National soroban championships and the Mental Calculation World Cup keep the tradition elite and alive.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Research on expert abacus users suggests they shift arithmetic from ve…", "b": "Research on expert abacus users suggests they shift arithmetic from verbal processing toward **visuospatial imagery** — they compute with a mental picture rather than with inner speech.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "The payoff card (core to the site's thesis):", "b": "the tool does not replace the skill — practiced deeply enough, the tool *becomes* the skill. A student who masters a calculating machine ends up carrying it in their head. This is the strongest answer to \"why practice by hand when machines exist?\"", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Finger reckoning (dactylonomy)", "b": "Bede's system to 9,999; Mediterranean and Middle Eastern market-traders' finger systems; complement-based finger multiplication for the 6–10 times tables — arithmetic carried on the body.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/11389e04dd59.webp", "cred": "Wound theology · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFinger%20reckoning%20cropped%20from%20Wellcome%20Library%20MS.509.jpg"}, {"t": "Doubling and halving", "b": "Egyptian multiplication by repeated doubling, and its folk survival, \"Russian peasant multiplication\" — secretly *binary multiplication*, the method inside every CPU today. (Superb card: the pharaoh's scribe and the microchip run the same algorithm.)", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Table lookup as a way of life", "b": "<a class=\"xl\" href=\"#era-2/4\">Babylonian<\/a> multiplication and reciprocal tablets; Ptolemy's chords; medieval computus tables for Easter; Toledan and Alfonsine astronomical tables. For most of history, \"computing\" largely meant *looking up* someone else's frozen labor.", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "era-2/4", "t": "Babylonian mathematical tablets"}]}, {"t": "Quarter-square multiplication", "b": "ab = [(a+b)² − (a−b)²]/4 — multiply using only a table of squares plus addition and subtraction; used from Babylon to 19th-century table books.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Lattice (gelosia) multiplication", "b": "the grid method from Indian/Islamic mathematics, standard in the abbaco schools — and now back in modern elementary classrooms.", "ch": "Before Napier: the toolkit of tricks", "in": [{"to": "era-3/14", "t": "Italian abbaco schools (scuole d'abbaco)"}], "img": "media/cards/ee57a6a04236.webp", "cred": "Brigban · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ALattice%20multiplication%20step%203.jpg"}, {"t": "Casting out nines", "b": "the universal error-check of hand arithmetic, transmitted through <a class=\"xl\" href=\"#era-3/4\">al-Khwarizmi<\/a>'s tradition — checksum logic centuries before checksums.", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "era-3/4", "t": "al-Khwarizmi (House of Wisdom, Baghdad)"}]}, {"t": "Prosthaphaeresis", "b": "trigonometric identities as a multiplication machine (see Era 4) — proof that the *hunger* for fast multiplication predates the means.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/74a56a50fa54.webp", "cred": "Dominic3203 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AProof%20for%20Sum-to-Product%20Identities.jpg"}, {"t": "Logarithm tables (Briggs onward)", "b": "the single most important calculating aid of the scientific era; engineers, navigators, gunners, and schoolchildren computed with them into the 1970s.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/9d3139a3bdc0.webp", "cred": "Matthias Bernegger · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Bernegger_Manuale_136.jpg"}, {"t": "The slide rule", "b": "logarithms made physical — analog multiplication at a glance; \"slipstick\" culture, belt holsters, carried aboard Apollo as backup.", "ch": "After Napier: three centuries of augmented hand-calculation", "in": [{"to": "era-4/15", "t": "Gunter's scale"}], "img": "media/cards/27397d846189.webp", "cred": "Jacek Halicki · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2023%20Suwak%20logarytmiczny%20%281%29.jpg"}, {"t": "Ready reckoners", "b": "cheap printed books of precomputed prices, interest, wages, and conversions — the shopkeeper's lookup table from the 1600s well into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation", "in": [{"to": "thread-R/2", "t": "The infrastructure of trust"}], "img": "media/cards/6c9e4c0f2865.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Ready-Reckoner.jpg"}, {"t": "Nomograms (d'Ocagne, 1880s)", "b": "computation as *drawing* — lay a straightedge across printed scales and read off the answer; used for artillery, engineering, and medicine (some clinical nomograms survive today).", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Planimeters and integraphs", "b": "trace a curve's outline with a stylus, read its area off a dial — mechanical integration.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/c5bd012902a7.webp", "cred": "«Военная энциклопедия И. Д. Сытина». Том 2 (Санкт-Петербург; 1911). · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A%D0%98%D0%BB%D0%BB%D1%8E%D1%81%D1%82%D1%80%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BA%20%D1%81%D1%82%D0%B0%D1%82%D1%8C%D0%B5%20%C2%AB%D0%90%D0%BC%D1%81%D0%BB%D0%B5%D1%80%D0%B0%20%D0%BF%D0%BB%D0%B0%D0%BD%D0%B8%D0%BC%D0%B5%D1%82%D1%80%C2%BB.%20%D0%92%D0%BE%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BD%D1%86%D0%B8%D0%BA%D0%BB%D0%BE%D0%BF%D0%B5%D0%B4%D0%B8%D1%8F%20%D0%A1%D1%8B%D1%82%D0%B8%D0%BD%D0%B0%20%28%D0%A1%D0%B0%D0%BD%D0%BA%D1%82-%D0%9F%D0%B5%D1%82%D0%B5%D1%80%D0%B1%D1%83%D1%80%D0%B3%2C%201911-1915%29.jpg"}, {"t": "Specialized aids to the very end", "b": "<a class=\"xl\" href=\"#era-5/45\">Genaille–Lucas rulers<\/a> (1891) and dozens of similar devices sold to clerks and accountants into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation", "out": [{"to": "era-5/45", "t": "Genaille–Lucas rulers"}]}, {"t": "Professional lightning calculators", "b": "Zerah Colburn (factoring large numbers mentally as a child, 1810s), George Parker Bidder (from stage calculator to great railway engineer), Alexander Aitken (perhaps the best-documented calculating mind), Shakuntala Devi (multiplied two 13-digit numbers in 28 seconds, 1980).", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "The Trachtenberg system", "b": "high-speed arithmetic rules developed by Jakow Trachtenberg *entirely in his head while imprisoned in Nazi camps* — calculation as survival of the mind.", "ch": "Lightning minds: mental calculators and speed systems", "img": "media/cards/60e1d56abd89.webp", "cred": "Holretz · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2FingerMethod-third%20digit.png"}, {"t": "\"Vedic mathematics\" (Bharati Krishna Tirtha, pub. 1965)", "b": "sutra-based speed techniques (\"all from 9 and the last from 10,\" \"vertically and crosswise\"); a modern system rather than an ancient Vedic one, but pedagogically potent and hugely popular in India.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Everyday mental tricks", "b": "as mini-cards: complements (\"make ten\"), left-to-right addition, ×5 via ×10÷2, ×25 via ×100÷4, squaring numbers ending in 5, and 47×99 = 4,700 − 47.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Closing card", "b": "when calculation was economically vital, societies invested enormously in *human* computational skill — tables, tools, tricks, and training. Today that need is met by machines running 10¹⁸ operations per second — but the trained mind remains the only place where *understanding* happens.", "ch": "Lightning minds: mental calculators and speed systems"}]}, {"id": "thread-I", "kind": "thread", "title": "Thread I: Computing with the World: water, analog & unconventional machines", "sub": "", "cards": [{"t": "Clepsydrae", "b": "from Egyptian outflow bowls to Ctesibius' feedback-regulated clocks (the first known feedback control) to elaborate Chinese and Islamic water-clock towers (Su Song 1088, <a class=\"xl\" href=\"#era-3/8\">al-Jazari<\/a> 1206) — time itself was water-computed for three millennia.", "ch": "Water computing", "out": [{"to": "era-3/8", "t": "al-Jazari"}]}, {"t": "Lukyanov's water integrator (1936)", "b": "PDEs as plumbing — water levels are the variables, tube resistances the coefficients; adjust the valves, read the solution. Mass-produced in the USSR, used for dams, mines, and rocketry into the 1980s.", "ch": "Water computing"}, {"t": "The MONIAC (1949)", "b": "Keynesian macroeconomics in transparent tanks — raise taxes and literally watch consumption drain. Fourteen built; one still runs demonstrations in New Zealand's central bank museum.", "ch": "Water computing", "img": "media/cards/262f49792327.webp", "cred": "Unlisted/Unknown · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3APhillips%20and%20MONIAC%20LSE.jpg"}, {"t": "Fluidics (1960s)", "b": "logic gates made of nothing but jets and channels — no electronics, immune to radiation and EMP; used in aircraft, industrial control, even missile systems; reborn today as **microfluidic logic** in lab-on-a-chip devices.", "ch": "Water computing", "img": "media/cards/a62b64119e3a.webp", "cred": "Herbert.Oertel / www.prof-oertel.de · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFluidic%20Oscillator.png"}, {"t": "The liquid brain (2003)", "b": "researchers used ripples on the surface of a bucket of water as the reservoir in a \"liquid state machine,\" successfully distinguishing spoken words — a literal bucket of water performing pattern recognition.", "ch": "Water computing", "img": "media/cards/32916a4ed568.webp", "cred": "Laboratoires Servier · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ANervous%20system%20-%20Cerebrospinal%20fluid%20--%20Smart-Servier.png"}, {"t": "Theme card", "b": "water was humanity's first continuous quantity. Time, then economies, then differential equations were all made to *flow*.", "ch": "Water computing"}, {"t": "The integrator lineage", "b": "James Thomson's ball-and-disk integrator → his brother Lord Kelvin's tide predictor and harmonic analyzer → Bush's differential analyzer (Era 6) — continuous mathematics done by wheels.", "ch": "Mechanical & electrical analog computing"}, {"t": "Fire control", "b": "Dreyer Tables and Rangekeepers through the Mark 1 — shipboard analog computers tracking moving targets from moving platforms in real time, decades before digital could; still aboard recommissioned battleships in the 1990s.", "ch": "Mechanical & electrical analog computing", "img": "media/cards/23531fc8847a.webp", "cred": "U.S. Navy, Bureau of Naval Personnel (Transfered by \n\nJostikas/Original uploaded · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3AMark%201A%20Fire%20Control%20Computer%20Controls.jpg"}, {"t": "Field analogies", "b": "electrolytic tanks and conductive paper \"compute\" electric and aerodynamic fields; stretched rubber sheets solve potential problems — let the physics find the answer.", "ch": "Mechanical & electrical analog computing"}, {"t": "Network analyzers", "b": "scale-model power grids used to compute the behavior of real power grids into the 1960s.", "ch": "Mechanical & electrical analog computing"}, {"t": "The op-amp era", "b": "room-sized patch-panel analog computers simulate aircraft, rockets, and reactors; the very name \"operational amplifier\" means *an amplifier that performs mathematical operations*.", "ch": "Mechanical & electrical analog computing"}, {"t": "Theme card", "b": "for continuous problems — tides, trajectories, flight — analog machines were *faster than digital for decades*. Digital won on precision and programmability, not on any monopoly over mathematics.", "ch": "Mechanical & electrical analog computing"}, {"t": "Graphical statics (1860s)", "b": "bridges and roofs designed by drawing force polygons — Eiffel-era engineering computed with straightedge and pencil.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Nomography proper (d'Ocagne, 1884)", "b": "alignment charts where laying a straightedge across three scales *is* the calculation; grounded in projective geometry and determinants.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "War by straightedge", "b": "WWI and WWII artillery fired on nomogram-computed solutions; engineering handbooks carried alignment charts for everything from pipe flow to beam loads.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Still alive in medicine", "b": "clinical nomograms (cardiac risk, drug dosing, oncology prognosis) remain in use — a 19th-century computing technology at the bedside.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Pedagogy card", "b": "students can *build* a working nomogram for the ideal gas law or Ohm's law with paper and ruler — constructing a computer that has no moving parts at all.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Soap films", "b": "dip a wire frame, and the film instantly settles into a minimal surface — near-instant \"solutions\" to problems (Plateau, Steiner trees) that strain digital computers.", "ch": "Nature computes: unconventional and physical computation", "img": "media/cards/4b6b251b44ed.webp", "cred": "Nikk · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASoap%20film.jpg"}, {"t": "Kitchen analog", "b": "spaghetti sort (cut rods to length, tap the bundle — the tallest is found in one step); string boards that find shortest paths by pulling taut.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Toys that are computers", "b": "dominoes as logic gates; marble machines (Digi-Comp II, today's <a class=\"xl\" href=\"#era-6/43\">Turing<\/a> Tumble); the Tinkertoy computer (Hillis & Silverman, MIT) that plays perfect tic-tac-toe.", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}], "img": "media/cards/3fb40ac2d7b5.webp", "cred": "Christian Ursilva from København, Danmark · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Lego_by_Christian_Ursilva_%282025%29.jpg"}, {"t": "The billiard-ball computer (Fredkin & Toffoli, 1982)", "b": "a thought experiment showing computation from nothing but elastic collisions — foundational to reversible and quantum computing.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Wet computers", "b": "<a class=\"xl\" href=\"#era-9/524\">Adleman<\/a>'s DNA computation (1994); molecular logic gates; slime mold (*Physarum*) solving mazes (2000) and re-deriving the Tokyo rail network (2010).", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-9/524", "t": "Leonard Adleman's DNA computer"}]}, {"t": "Cellular automata", "b": "Conway's Game of Life (1970) — trivial rules yielding universal computation; Wolfram's systematic exploration.", "ch": "Nature computes: unconventional and physical computation", "img": "media/cards/8ae8d595c5a4.webp", "cred": "Lucas Vieira · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Gospers_glider_gun.gif"}, {"t": "Reservoir computing", "b": "any sufficiently rich dynamical system — water, lasers, mechanical springs — can serve as a machine-learning substrate.", "ch": "Nature computes: unconventional and physical computation", "img": "media/cards/f86bdba3413a.webp", "cred": "D Cat laz · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ACalcul%20par%20reservoir.png"}, {"t": "The analog AI revival (2020s)", "b": "memristor crossbars multiply matrices via Ohm's and Kirchhoff's laws; photonic chips do it with interference of light — physics-as-processor returning precisely because AI's arithmetic appetite (Thread A) has outgrown comfortable digital scaling.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Closing card", "b": "digital was a choice, not a destiny. Anything with reliable physics can compute. Electronics won on precision, programmability, and perfect copying — but the world itself has been doing mathematics all along, and students should know the machine in their pocket is one answer among many.", "ch": "Nature computes: unconventional and physical computation"}]}, {"id": "thread-J", "kind": "thread", "title": "Thread J: The Secret History: computation classified", "sub": "", "cards": [{"t": "Ancient roots", "b": "Herodotus' tattooed scalp and wax-tablet warnings (Era 2); Aeneas Tacticus' catalogue of hidden-message tricks.", "ch": "Steganography: hiding the message itself"}, {"t": "Invisible inks from antiquity through both World Wars; the Cardan gril…", "b": "Invisible inks from antiquity through both World Wars; the Cardan grille (1550) — a mask that turns an innocent letter into a cipher; null ciphers where only every nth word counts.", "ch": "Steganography: hiding the message itself"}, {"t": "Microdots (WWII)", "b": "whole pages photographed down to the size of a period — J. Edgar Hoover called them \"the enemy's masterpiece of espionage.\"", "ch": "Steganography: hiding the message itself", "img": "media/cards/504302fe9200.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:German_microdots_World_War_II_Mexico_Spain.jpg"}, {"t": "Printer tracking dots", "b": "the machine identification code secretly stamped by color laser printers, publicly decoded in 2005 — a hidden message in *your* documents.", "ch": "Steganography: hiding the message itself", "img": "media/cards/6a37f1c66aaf.webp", "cred": "Anton · CC BY-SA 2.5", "credurl": "https://commons.wikimedia.org/wiki/File%3APrintermarkrp.jpg"}, {"t": "Digital steganography and watermarking today — including proposals to…", "b": "Digital steganography and watermarking today — including proposals to statistically watermark AI-generated text: steganography contemplated at the scale of trillions of words.", "ch": "Steganography: hiding the message itself", "img": "media/cards/1dbddad506d1.webp", "cred": "Trithemius, Johannes. Steganographia. Frankfurt: Johannes Saurius?, 1606. Digiti · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3ATrithemius-Johannes-Steganographia-Johannes-Saurius%2C-1608.-Digitized-photographic-reproduction-provided-by-the-Herzog-August-Bibliothek.jpg"}, {"t": "Card theme", "b": "cryptography scrambles a message; steganography denies it exists. Both are computation bent toward concealment.", "ch": "Steganography: hiding the message itself"}, {"t": "Colossus erased", "b": "ten machines; most dismantled and the drawings burned by order after the war; engineer Tommy Flowers, forbidden to speak, watches ENIAC take the crown of \"first\" — full details classified until 2000. Textbooks taught a wrong history for half a century.", "ch": "The machines themselves were secret", "img": "media/cards/a87bc2faf398.webp", "cred": "Willem Janszoon Blaeu · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ANova%20totius%20terrarum%20orbis%20geographica%20ac%20hydrographica%20tabula%20RMG%20F0410.tiff"}, {"t": "The Bombes", "b": "British and US Navy models (600 WAVES ran NCR-built Bombes in Dayton, all sworn to secrecy) destroyed or hidden postwar; Poland's founding contribution — Rejewski's bomba — nearly erased from the record.", "ch": "The machines themselves were secret", "img": "media/cards/339ad0aa6413.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Wartime_picture_of_a_Bletchley_Park_Bombe.jpg"}, {"t": "SIGSALY and Delilah (Era 7)", "b": "secure digital voice — the birth of digital audio — locked away for decades; <a class=\"xl\" href=\"#era-7/10\">Turing's Delilah<\/a> report unreleased for ~70 years.", "ch": "The machines themselves were secret", "out": [{"to": "era-7/10", "t": "Turing's Delilah"}], "img": "media/cards/a8037b98ad0b.webp", "cred": "U.S. Army Signal Corps · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASIGSALY%20receiver%20terminal.jpg"}, {"t": "The OCR connection", "b": "the first commercial optical character reader, GISMO (1951), was built by David Shepard — a cryptanalyst at the NSA's predecessor agency, teaching machines to *read* text after days spent teaching them to *break* it. Machine reading and machine codebreaking grew from the same soil, and Turing-era pattern-recognition and statistical methods fed both.", "ch": "The machines themselves were secret"}, {"t": "D-Day by tide machine", "b": "Doodson computes Normandy's tides for a site he knows only as \"Position Z\" — computation on a need-to-know basis (Era 7).", "ch": "The machines themselves were secret", "img": "media/cards/a47d592102dc.webp", "cred": "William M. Connolley · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:DSCN1739-thomson-tide-machine.jpg"}, {"t": "Bombsight oaths", "b": "Norden bombardiers swore to defend the device's secrecy with their lives; naval fire-control mechanisms were crown jewels of state.", "ch": "The machines themselves were secret", "in": [{"to": "about/3", "t": "Have you heard of any of these?"}], "img": "media/cards/b9d0cf8eedd2.webp", "cred": "Allan J. Cronin · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Norden.JPG"}, {"t": "Nuclear computing", "b": "ENIAC's first job, MANIAC, the Monte Carlo method — all born classified; Los Alamos ran on rooms of human computers before the machines arrived.", "ch": "The machines themselves were secret"}, {"t": "Venona", "b": "US decryption of Soviet cables, worked from 1943, kept secret until **1995** — a fifty-year computation in a vault.", "ch": "The machines themselves were secret"}, {"t": "GCHQ's stolen thunder", "b": "<a class=\"xl\" href=\"#era-8/159\">public-key cryptography invented in secret<\/a>, 1970–74; unrevealed until 1997 — the inventors watched the world celebrate others for their own discovery, and said nothing.", "ch": "The machines themselves were secret", "out": [{"to": "era-8/159", "t": "Public-key cryptography invented in secret"}]}, {"t": "NSA and the industry", "b": "Harvest (1962), influence on IBM's Stretch, decades as supercomputing's quietest best customer; the DES S-box mystery — IBM had independently discovered *differential cryptanalysis* in 1974 and, at NSA's request, kept the attack secret for ~20 years while the public suspected a backdoor (the secret changes had actually *strengthened* the cipher).", "ch": "The machines themselves were secret", "img": "media/cards/7b308543779b.webp", "cred": "National Security Agency · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ANational%20Security%20Agency%20headquarters%2C%20Fort%20Meade%2C%20Maryland.jpg"}, {"t": "Operation Rubicon (revealed 2020)", "b": "the CIA and BND secretly *owned* Crypto AG, selling compromised cipher machines to 100+ governments for decades — the supply chain itself as the wiretap.", "ch": "The machines themselves were secret", "img": "media/cards/e510164dda9b.webp", "cred": "Photograph by Rama, Wikimedia Commons, Cc-by-sa-2.0-fr · CC BY-SA 2.0 fr", "credurl": "https://commons.wikimedia.org/wiki/File:Hagelin_CX-52-IMG_0568-white.jpg"}, {"t": "Still secret now", "b": "classified supercomputers absent from the TOP500 list; TEMPEST emission-security standards; cryptanalytic capabilities we can only infer. An honest card can say: *parts of this timeline are still blank, and some blanks are deliberate.*", "ch": "The machines themselves were secret"}, {"t": "Oath-bound silence", "b": "Bletchley's ~10,000 workers, including married couples who didn't tell each other until the 1970s; ENIAC's programmers and the Navy's WAVES uncredited for decades.", "ch": "The human cost — and the rewritten record"}, {"t": "Alan Turing", "b": "defined computation, helped win the war — his heroism itself classified — prosecuted in 1952, dead in 1954; public apology 2009, royal pardon 2013. Secrecy meant his country punished him without knowing whom it was punishing.", "ch": "The human cost — and the rewritten record", "in": [{"to": "era-9/401", "t": "Micro Live: Episode 20"}, {"to": "era-10/70", "t": "Radio 4: Today (Item): Turing and Music"}], "img": "media/cards/22da2382e343.webp", "cred": "Elliott &amp; Fry · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Alan_turing_header.jpg"}, {"t": "Historiography card for students", "b": "because the fastest machines were secret, the *public* history of computing was wrong for 30–50 years — and is still being declassified. Primary sources keep surfacing. This history is a computation that hasn't halted.", "ch": "The human cost — and the rewritten record"}]}, {"id": "thread-K", "kind": "thread", "title": "Thread K: Ethnomathematics: the mathematics of the world's peoples", "sub": "", "cards": [{"t": "Ubiratan D'Ambrosio", "b": "names the discipline (1984): the mathematics of identifiable cultural groups — not only \"civilizations\" but carpenters, tailors, weavers, navigators, street vendors. Everyone's math counts.", "ch": "The field itself"}, {"t": "Founders' shelf", "b": "Zaslavsky's *Africa Counts* (1973); Marcia & Robert Ascher decoding quipu mathematics; Paulus Gerdes on sona and weaving geometry; Ron Eglash's *African Fractals* (1999).", "ch": "The field itself"}, {"t": "Alan Bishop's six universal activities", "b": "— counting, locating, measuring, designing, playing, explaining: every documented culture does all six. A perfect organizing card.", "ch": "The field itself", "in": [{"to": "era-9/509", "t": "Durrell Bishop's Marble Answering Machine"}]}, {"t": "Fractal architecture (Eglash)", "b": "recursive, self-similar village layouts (Ba-ila), <a class=\"xl\" href=\"#thread-K/6\">Ethiopian<\/a> processional crosses, Mokoulek — scaling geometry as design tradition.", "ch": "Africa", "out": [{"to": "thread-K/6", "t": "Ethiopian peasant multiplication"}]}, {"t": "The binary lineage", "b": "Ifá's 256 odu → medieval Islamic and European geomancy's 16 binary figures → (Eglash's argued thread) influences reaching <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> — binary divination millennia before binary machines.", "ch": "Africa", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Borana calendar (Kenya/Ethiopia)", "b": "a working lunar-stellar calendar computed by specialists without writing.", "ch": "Africa"}, {"t": "Ethiopian peasant multiplication", "b": "doubling-and-halving — binary arithmetic as folk method (cross-ref H3).", "ch": "Africa", "in": [{"to": "thread-K/3", "t": "Fractal architecture (Eglash)"}]}, {"t": "Kente, Ndebele, and mud-cloth symmetry systems; Gerdes on the theo…", "b": "Kente, Ndebele, and mud-cloth **symmetry systems**; Gerdes on the theorems hidden inside basket-weaving; Yoruba base-20 subtractive numerals (45 said as \"five from ten from three twenties\").", "ch": "Africa"}, {"t": "Kinship algebra", "b": "Warlpiri \"skin name\" marriage systems form genuine finite groups (the Aschers' analysis: a dihedral group of order 8) — abstract algebra lived as social structure.", "ch": "Oceania & Australia"}, {"t": "Songlines", "b": "routes across a continent stored and retrieved as song — geography as computed, memorized sequence.", "ch": "Oceania & Australia"}, {"t": "Māori kōwhaiwhai rafter patterns and tukutuku lattice panels", "b": "systematic symmetry classes; Pacific navigation and PNG body-counting (cross-ref Thread F).", "ch": "Oceania & Australia"}, {"t": "Aztec Codex Vergara surveying (Era 4)", "b": "field areas via indigenous algorithms and fractional units — colonial-era math running parallel to Europe's.", "ch": "The Americas", "img": "media/cards/1a4537a24c02.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:CodexMendoza01.jpg"}, {"t": "Maya time-mathematics, quipu & yupana (cross-refs); Navajo weaving s…", "b": "Maya time-mathematics, quipu & yupana (cross-refs); **Navajo weaving symmetry** and sandpainting geometry; **wampum** belts as treaty records — data woven in shell.", "ch": "The Americas"}, {"t": "Kaktovik numerals (1994)", "b": "schoolchildren inventing a numeral system that reaches Unicode — ethnomathematics happening *now* (Era 9).", "ch": "The Americas"}, {"t": "Kolam / rangoli (Tamil Nadu and beyond)", "b": "dot-grid, single-line threshold drawings executed from memory each dawn — formally studied by computer scientists as picture languages and array grammars; algorithms performed as devotion, mostly by women.", "ch": "Asia", "img": "media/cards/c977b1f034ec.webp", "cred": "SreeramKalyan · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AA%20Beautiful%20Rangoli.jpg"}, {"t": "Sangaku & wasan (Era 4)", "b": "geometry as temple offering; Seki's determinants.", "ch": "Asia", "img": "media/cards/dbaee3ab038f.webp", "cred": "Momotarou2012 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASangaku%20of%20Konnoh%20Hachimangu%201850.jpg"}, {"t": "Girih tiles (Era 3)", "b": "; **Balinese pawukon calendar**: ten concurrent week-lengths running simultaneously — daily life scheduled by least-common-multiple.", "ch": "Asia", "img": "media/cards/fad7cf71d509.webp", "cred": "Vathlu · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGirih%20tiles.jpg"}, {"t": "Yan tan tethera", "b": "Brythonic base-20 sheep-scoring chants surviving among shepherds into the 20th century — a numeral system preserved as work-song.", "ch": "European folk mathematics"}, {"t": "Split tally sticks", "b": "as unforgeable contracts (and the 1834 Parliament fire, Era 5); **knitting and lace patterns as executable code** — knitters \"read\" compact instruction languages; wartime knitting was even used to smuggle coded messages (cross-ref Thread J).", "ch": "European folk mathematics", "img": "media/cards/ead07aab9695.webp", "cred": "Winchester City Council Museums · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File:Medieval_tally_sticks.jpg"}, {"t": "Change ringing (Era 4)", "b": "permutation theory in the belfry; quilt-block geometry and its symmetry groups.", "ch": "European folk mathematics", "in": [{"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}], "img": "media/cards/fbb5a7cb6450.webp", "cred": "Qazwsx777 · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ARinging%20Church%20Bells%20at%20Edinburgh%20Cathedral.jpg"}, {"t": "Talking drums (West/Central Africa)", "b": "two-tone transmission of full phrases using tonal-language redundancy — long-distance messaging whose information-theoretic cleverness stunned later engineers.", "ch": "Sound & rhythm as computation", "in": [{"to": "thread-M/0", "t": "Sound over distance"}, {"to": "thread-T/20", "t": "Cross-links"}]}, {"t": "Indian tala", "b": "cycles and konnakol spoken rhythm: recursive subdivision performed at speed.", "ch": "Sound & rhythm as computation"}, {"t": "Euclidean rhythms (Toussaint, 2004)", "b": "a huge share of world rhythm patterns are generated by Euclid's GCD algorithm — a 2,300-year-old algorithm, dancing.", "ch": "Sound & rhythm as computation"}, {"t": "Nunes, Carraher & Schliemann, Brazil (1985–93)", "b": "child street vendors ~98% accurate on transaction arithmetic — and ~37% on the *same problems* posed as school-style written exercises.", "ch": "Street mathematics (the pedagogy bombshell)"}, {"t": "Card thesis", "b": "mathematics lives in context and purpose; schooling that strips both can strip the competence too. Bridges directly into Thread L.", "ch": "Street mathematics (the pedagogy bombshell)", "img": "media/cards/b62b6f024899.webp", "cred": "P1898 · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAteneo%20Law%20School%20Rizal%20Library%20Rockwell%20Library%20Card%20catalogs.jpg"}, {"t": "Closing card", "b": "\"ethnomathematics\" is not math for *other* people. Our own school mathematics — the 1893 sequence, the standard algorithms — is also somebody's cultural tradition (see Thread L). All mathematics is somebody's ethnomathematics.", "ch": "Street mathematics (the pedagogy bombshell)"}]}, {"id": "thread-L", "kind": "thread", "title": "Thread L: How We Came to Teach Math This Way", "sub": "the lag, and the orphaned history", "cards": [{"t": "The edubba (c. 2000 BCE)", "b": "clay-tablet homework, table-copying, teacher's model on one side and student's shaky copy on the other — the problem set is as old as writing.", "ch": "The 4,000-year classroom", "img": "media/cards/2dc6af32c973.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAssyrian%20scribes.jpg"}, {"t": "Scribal schools (Egypt, Babylon)", "b": "worked examples, rote-plus-variation — recognizably modern pedagogy.", "ch": "The 4,000-year classroom", "img": "media/cards/8eb354756f35.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAssyrian%20scribes.jpg"}, {"t": "Greece", "b": "the **quadrivium** (arithmetic, geometry, music, astronomy); Plato's \"let no one ignorant of geometry enter\"; **Euclid as the textbook for ~2,200 years** — no book but scripture has taught longer.", "ch": "The 4,000-year classroom"}, {"t": "Medieval universities", "b": "computus and *oral* disputation — for most of history, math was examined by talking, not writing.", "ch": "The 4,000-year classroom"}, {"t": "The two-track split", "b": "university mathematics for the learned; **abbaco schools** (Era 3) for merchants' children — a practical/academic divide that still structures curricula.", "ch": "The 4,000-year classroom"}, {"t": "Vernacular revolution", "b": "<a class=\"xl\" href=\"#era-4/3\">Adam Ries<\/a> (1522), Robert <a class=\"xl\" href=\"#era-4/5\">Recorde<\/a> (1557) — cheap printed textbooks in living languages; mass numeracy becomes possible.", "ch": "The 4,000-year classroom", "out": [{"to": "era-4/3", "t": "Adam Ries"}, {"to": "era-4/5", "t": "Robert Recorde invents \"=\""}]}, {"t": "The exam is invented", "b": "the Cambridge Tripos (18th–19th c.) creates the written, timed, ranked mathematics examination — and instantly, the coaching industry, cramming, and teach-to-the-test. Modern assessment is a ~250-year-old technology with known side effects.", "ch": "The 4,000-year classroom"}, {"t": "The Prussian machine (1810s–40s)", "b": "age grades, state curriculum, normal schools; <a class=\"xl\" href=\"#era-5/0\">the blackboard<\/a> (c. 1801). The delivery system we still use predates the telegraph.", "ch": "The 4,000-year classroom", "out": [{"to": "era-5/0", "t": "The blackboard"}]}, {"t": "The freeze", "b": "<a class=\"xl\" href=\"#era-5/46\">the Committee of Ten<\/a> (1893) fixes arithmetic → algebra → geometry → trig; with calculus added (1955), that is *still* the standard walk — designed for 1890s college prep, not for a world that runs on statistics, linear algebra, and algorithms.", "ch": "The 4,000-year classroom", "out": [{"to": "era-5/46", "t": "The Committee of Ten (US)"}]}, {"t": "Klein's Meran reforms (1905) push functions and calculus into European…", "b": "Klein's Meran reforms (1905) push functions and calculus into European schools; the US largely declines.", "ch": "The reform pendulum"}, {"t": "New Math (1957–58, post-Sputnik)", "b": "set theory handed to teachers who had never studied it — the definitive national-scale demonstration of the training gap; collapsed by the early 1970s (*Why Johnny Can't Add*, 1973; Tom Lehrer's satire in between).", "ch": "The reform pendulum", "img": "media/cards/d243e3b97292.webp", "cred": "Jengod · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASpines%20of%20New%20Math%20paperbacks%20from%201960s.jpg"}, {"t": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standard…", "b": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standards (1989) → **Math Wars** (1990s) → high-stakes testing (2001) → **Common Core** (2010), where parents' inability to help with homework put the generational gap on every kitchen table → computer-based-math movement (2010s).", "ch": "The reform pendulum"}, {"t": "Pattern card", "b": "the pendulum swings roughly every 15–20 years — about one teacher-generation. That is not a coincidence; it's the lag mechanism oscillating.", "ch": "The reform pendulum"}, {"t": "The arithmetic of the gap", "b": "a teacher certified in year X teaches until ~X+35. Their methods were largely absorbed not in training but as a *student* around X−15 — Lortie's \"apprenticeship of observation\" (1975): ~13,000 hours of watching teachers before training even begins. Their textbooks were written by authors trained around X−40. So classroom content routinely trails the frontier by 50–100 years — *before* compounding.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Compounding card", "b": "each generation can only pass on what it received plus the little it retrained on; whatever a generation misses, the next generation cannot inherit. Gaps don't just persist — they *accumulate*, era over era, like the curriculum's own dark matter.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Klein's double discontinuity (1908)", "b": "future teachers experience university math as irrelevant to school math, then return to classrooms and teach school math untouched by university math — the loop that locks the lag in place.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Case files", "b": "Calculus (1687) → standard high-school course in 1955: **~270 years**. <a class=\"xl\" href=\"#thread-P/5\">Statistics<\/a> (Fisher, 1920s) → still marginal in K-12 a century on. Computer science (1936–1950s) → still not universal after ~80 years. Linear algebra — the actual arithmetic of AI (Thread A) — effectively absent from school. Log tables were still being taught *after* the HP-35 made them obsolete.", "ch": "The lag engine (core thesis card-set)", "out": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}]}, {"t": "Curriculum as geology", "b": "every stratum was deposited by a dead era's needs — navigation left trigonometry, commerce left arithmetic drill, the Cold War left New Math's residue, the testing era left procedure-first habits. Little is ever removed. The sediment *is* the syllabus. Students deserve to be told which layer they're standing on.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Too old for computing class", "b": "a programming course can't spare a week for <a class=\"xl\" href=\"#era-5/6\">Babbage<\/a>, never mind Sumer; \"history of computing\" is one slide on day one.", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}]}, {"t": "Too new for history class", "b": "school history runs out of steam around 1945–1990; the eighty most computationally transformative years in the human story belong to *no* course, no teacher, no exam.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "So the lineage is kept by museums, retro-computing hobbyists, and docu…", "b": "So the lineage is kept by museums, retro-computing hobbyists, and documentaries — while students carry 10¹²-FLOP/s devices with zero formal knowledge of where they came from.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Mathematics' own history is orphaned the same way", "b": "a student can finish calculus without hearing a single date, and even the names are wrong (\"Gaussian\" elimination appears in the *Nine <a class=\"xl\" href=\"#era-2/21\">Chapters<\/a>*, ~2,000 years before Gauss).", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "era-2/21", "t": "Nine Chapters on the Mathematical Art (China)"}]}, {"t": "Mission card", "b": "this site lives deliberately in that gap — the history too old for CS and too new for History — built for the students who need it most: the ones practicing, by hand, the very operations machines now perform 10¹⁸ times per second.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Overview", "b": "**L5. <a class=\"xl\" href=\"#thread-T/20\">Cross-links<\/a>**: Thread E (why learn it by hand) · H2 (anzan — training that demonstrably works) · K8 (street math — context carries competence) · Thread A (what the curriculum hasn't caught up to) · Thread J (why even the recent history went untaught: much of it was classified).", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "thread-T/20", "t": "Cross-links"}]}]}, {"id": "thread-M", "kind": "thread", "title": "Thread M: The Signal: a history of communication technology", "sub": "", "cards": [{"t": "Sound over distance", "b": "<a class=\"xl\" href=\"#thread-K/20\">talking drums<\/a> (Thread K7), signal horns, church bells, and **whistled languages** — Silbo Gomero in the Canary Islands compresses Spanish into whistles that carry across whole valleys, still taught in schools there today.", "ch": "Signals before electricity", "out": [{"to": "thread-K/20", "t": "Talking drums (West/Central Africa)"}]}, {"t": "Light and smoke", "b": "beacon chains from Aeschylus' Troy relay to the Great Wall's smoke towers to England's Armada beacons (1588) — one bit (\"they're coming\"), delivered at the speed of sight.", "ch": "Signals before electricity"}, {"t": "Relay infrastructure", "b": "Persia's Royal Road couriers (Herodotus' \"neither snow nor rain…\" describes them), Rome's cursus publicus, and the Inca **chasqui** runners — who carried *quipus*: a data network transporting data structures (Thread F).", "ch": "Signals before electricity"}, {"t": "Carrier pigeons", "b": "from ancient Egypt to Reuters' founding pigeon fleet (1850) to WWII medal-winning birds — packets with wings.", "ch": "Signals before electricity", "img": "media/cards/f185832f31e8.webp", "cred": "Pearson Scott Foresman · Public domai
