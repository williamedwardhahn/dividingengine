ea. Sharp split between arithmos (a multitude…"}], "in": [{"to": "thread-H/3", "t": "Linguistic-fossils card"}]}, {"t": "Steganography enters history", "b": "Herodotus records messages tattooed on a slave's shaved scalp and hidden under the wax of writing tablets (Demaratus warning <a class=\"xl\" href=\"#thread-F/1\"><a class=\"xl\" href=\"#thread-L/2\">Greece<\/a><\/a> of Xerxes' invasion) — concealing the *existence* of a message, the twin art to cryptography (see Thread J).", "d": "c. 480 BCE", "out": [{"to": "thread-L/2", "t": "Greece"}, {"to": "thread-F/1", "t": "Greece — number as idea. Sharp split between arithmos (a multitude…"}], "in": [{"to": "era-10/0", "t": "Printer tracking dots decoded"}, {"to": "thread-J/4", "t": "Digital steganography and watermarking today — including proposals to…"}, {"to": "thread-J/5", "t": "Card theme"}], "img": "media/cards/a030b43cfac7.webp", "cred": "Anton · CC BY-SA 2.5", "credurl": "https://commons.wikimedia.org/wiki/File:Printermarkrp.jpg"}, {"t": "The beacon relay", "b": "Aeschylus' *Agamemnon* describes news of Troy's fall leaping mountain to mountain by fire in one night; Persia's Royal Road couriers and Rome's cursus publicus build the relay-post alternative — the dream of instant long-distance signaling is <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> (see Thread M).", "d": "458 BCE", "out": [{"to": "thread-J/0", "t": "Ancient roots"}]}, {"t": "The incommensurability crisis", "b": "the diagonal of a square has no whole-number ratio to its side (√2 is irrational); Greek thought splits *arithmos* (discrete number) from *megethos* (continuous magnitude).", "d": "c. 450–400 BCE"}, {"t": "Eudoxus' theory of proportion", "b": "rigorous treatment of irrational magnitudes — the ancestor of the real numbers, completed by Dedekind 2,200 years later.", "d": "c. 370 BCE"}, {"t": "Salamis Tablet", "b": "oldest surviving counting board (Greek).", "d": "c. 300 BCE", "in": [{"to": "era-3/16", "t": "Ficino translates the Corpus Hermeticum"}, {"to": "era-4/29", "t": "Newton the alchemist"}, {"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}], "img": "media/cards/1ec910de9723.webp", "cred": "Wilhelm Kubitschek: „XII. Die Salaminische Rechentafel“ in: Numismatische Zeitsc · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3ASalaminische%20Tafel%20Salamis%20Tablet%20nach%20Wilhelm%20Kubitschek%20Numismatische%20Zeitschrift%20Bd%2031%20Wien%201899%20p.%20394%20ff.jpg"}, {"t": "Euclid's Elements", "b": "axiomatic method; Euclid's algorithm for GCD — an algorithm still taught and still running in computers today.", "d": "c. 300 BCE", "in": [{"to": "era-4/39", "t": "George Adams' Solid Geometry Models"}, {"to": "era-5/17", "t": "De Chancourtois' Telluric Screw"}, {"to": "era-5/50", "t": "Crookes' Vis Generatrix"}, {"to": "era-7/2", "t": "Stedman's 3D Periodic Table"}, {"to": "thread-K/22", "t": "Euclidean rhythms (Toussaint, 2004)"}], "img": "media/cards/841344ede903.webp", "cred": "Charles Thomas-Stanford · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATitle%20page%20of%20Sir%20Henry%20Billingsley%27s%20first%20English%20version%20of%20Euclid%27s%20Elements%2C%201570%20%28560x900%29.jpg"}, {"t": "The Library of Alexandria", "b": "humanity's first attempt at total information storage and retrieval; Callimachus' *<a class=\"xl\" href=\"#thread-S/0\">Pinakes<\/a>* catalog is the ancestor of every index, card catalog, database, and search <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">engine<\/a><\/a> (Thread S).", "d": "c. 295 BCE", "out": [{"to": "thread-S/0", "t": "Alexandria's Pinakes (Era 2)"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}], "in": [{"to": "era-2/6", "t": "Water clocks (clepsydrae) (Egypt, then Babylon, Greece, China)"}, {"to": "thread-M/20", "t": "Convergence"}, {"to": "thread-U/2", "t": "John Dee (Era 4)"}], "img": "media/cards/27f124362a39.webp", "cred": "O. Von Corven · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAncientlibraryalex.jpg"}, {"t": "Chinese counting rods and the suanpan (abacus)", "b": "fast positional arithmetic; <a class=\"xl\" href=\"#thread-A/2\">skilled<\/a> operators rival early electronic calculators.", "d": "c. 200 BCE onward", "out": [{"to": "thread-A/2", "t": "Skilled abacus operator"}], "in": [{"to": "era-2/26", "t": "Chinese Seismoscope"}, {"to": "era-9/243", "t": "World's Largest Solid Terrain Model"}, {"to": "thread-I/0", "t": "Clepsydrae"}, {"to": "thread-U/10", "t": "1701–03"}], "img": "media/cards/34da48bf13df.webp", "cred": "Gary Todd from Xinzheng, China · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AWestern%20Han%20Lead%20Counting%20Rods%20%289831915095%29.jpg"}, {"t": "Nine Chapters on the Mathematical Art (China)", "b": "algorithm-first mathematics — systems of linear equations solved by rod manipulation (essentially Gaussian elimination), negative numbers as red/black rods.", "d": "c. 200 BCE – 200 CE", "in": [{"to": "thread-L/21", "t": "Mathematics' own history is orphaned the same way"}], "img": "media/cards/8d634ad48765.webp", "cred": "User:Jean-Luc W utilisateur travaillant sur le compte Jean-Luc W · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ALes%20Neuf%20Chapitres%20sur%20l%27art%20math%C3%A9matique.jpg"}, {"t": "Greek Orrery", "d": "c. 150 BCE", "b": "An orrery is a mechanical model of the solar system. The left image shows the <a class=\"xl\" href=\"#era-2/24\">Antikythera<\/a>, the oldest known orrery. The middle image shows a <a class=\"xl\" href=\"#era-9/122\">virtual<\/a> reconstruction. The right image shows a contemporary orrery. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/antikythera-mechanism/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-2/24", "t": "Antikythera mechanism"}, {"to": "era-9/122", "t": "Using the Physical to Explain the Virtual"}]}, {"t": "Maya Long Count", "b": "<a class=\"xl\" href=\"#era-2/3\">earliest<\/a> dated zero in the Americas; base-20 numeration serving that civilization's central quantity — *time*.", "d": "c. 36 BCE", "out": [{"to": "era-2/3", "t": "Earliest abacus/counting boards (Sumer)"}], "img": "media/cards/fdac88aaf9fb.webp", "cred": "Maudslay · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:East_side_of_stela_C%2C_Quirigua.PNG"}, {"t": "Antikythera mechanism", "b": "geared analog computer predicting eclipses and planetary positions; ~30 bronze gears.", "d": "c. 150–100 BCE", "in": [{"to": "era-2/22", "t": "Greek Orrery"}, {"to": "thread-D/0", "t": "Machines"}], "img": "media/cards/98498e130632.webp", "cred": "No machine-readable author provided. Marsyas assumed (based on copyright claims) · CC BY 2", "credurl": "https://commons.wikimedia.org/wiki/File%3ANAMA%20Machine%20d%27Anticyth%C3%A8re%201.jpg"}, {"t": "Hero of Alexandria", "b": "programmable automata (pegged drums = stored program in embryo).", "d": "c. 60 CE", "in": [{"to": "era-2/6", "t": "Water clocks (clepsydrae) (Egypt, then Babylon, Greece, China)"}], "img": "media/cards/a7fb52f54aa1.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Heron_Alexandrie.jpg"}, {"t": "Chinese Seismoscope", "d": "132", "b": "A seismoscope is a qualitative indicator of seismic activity -- as opposed to seismographs which show quantitative data, typically through line graphs. The oldest known seismoscope is <a class=\"xl\" href=\"#era-2/20\">Chinese<\/a> and dates backs from 132. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/houfeng-didong-yi-zhang-hengs-seismoscope/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-2/20", "t": "Chinese counting rods and the suanpan (abacus)"}], "in": [{"to": "era-9/243", "t": "World's Largest Solid Terrain Model"}, {"to": "thread-I/0", "t": "Clepsydrae"}, {"to": "thread-U/10", "t": "1701–03"}]}, {"t": "Ptolemy's Almagest", "b": "massive trigonometric (chord) tables — centuries of \"compute\" frozen into a book.", "d": "c. 150 CE", "in": [{"to": "thread-H/13", "t": "Table lookup as a way of life"}], "img": "media/cards/f56dddadda53.webp", "cred": "Claudius Ptolemy · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APtolemy-2.jpg"}, {"t": "Roman hand abacus", "b": "pocket calculator of the <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> world.", "out": [{"to": "thread-J/0", "t": "Ancient roots"}], "img": "media/cards/25460da7269b.webp", "cred": "Photographer: Mike Cowlishaw (aus der englischen Wikipedia) · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:RomanAbacusRecon.jpg"}]}, {"id": "era-3", "kind": "era", "title": "Era 3: Zero, Algorithms & Medieval Machines", "sub": "500 – 1500", "cards": [{"t": "Boethius' *De institutione musica", "b": "*: music sorted into *mundana* (the spheres), *humana* (body and soul), and *instrumentalis* (what we hear); his textbook fixes music inside the quadrivium beside arithmetic, geometry, and astronomy — for a thousand years, music class *was* math class (Thread T).", "d": "c. 520", "in": [{"to": "thread-T/1", "t": "Musica universalis"}], "img": "media/cards/8f385f41228b.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Boethius.jpeg"}, {"t": "Brahmagupta (India)", "b": "rules for zero and negative numbers; zero as a number, not just a placeholder.", "d": "c. 628", "img": "media/cards/81eefbbfd776.webp", "cred": "Pṛthūdhaka and Brahmagaputa · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AP%E1%B9%9Bth%C5%ABdhaka%E2%80%99s%2010th%20century%20commentary%20on%20Brahmagupta%E2%80%99s%20Br%C4%81hmasphu%E1%B9%ADasiddh%C4%81nta.jpg"}, {"t": "Bede's finger reckoning", "b": "*De computo vel loquela digitorum* — a standardized system for counting to 9,999 on two hands; monks compute the date of Easter (*computus* — the <a class=\"xl\" href=\"#era-3/17\"><a class=\"xl\" href=\"#thread-L/3\">medieval<\/a><\/a> word family that gives us \"computer\").", "d": "725", "out": [{"to": "era-3/17", "t": "Medieval counting houses & jetons"}, {"to": "thread-L/3", "t": "Medieval universities"}]}, {"t": "The dust board (takht)", "b": "Islamic arithmeticians compute Hindu numerals on erasable sand <a class=\"xl\" href=\"#era-9/246\"><a class=\"xl\" href=\"#era-9/247\">boards<\/a><\/a> — algorithms designed around *erasing as you go*, later adapted to pen and paper.", "d": "9th–12th c.", "out": [{"to": "era-9/246", "t": "Kanban Boards"}, {"to": "era-9/247", "t": "Graph Boards"}]}, {"t": "al-Khwarizmi (House of Wisdom, Baghdad)", "b": "*Al-jabr* (→ \"algebra\") and his text on Hindu numerals (→ \"algorithm\" from his Latinized name). Computation as rule-following procedure.", "d": "c. 820", "in": [{"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-H/16", "t": "Casting out nines"}], "img": "media/cards/14b6e68eb604.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A1983%20CPA%205426%20%281%29.png"}, {"t": "Banu Musa brothers", "b": "*Book of Ingenious Devices*, programmable machines and automata.", "d": "9th c.", "img": "media/cards/bebc206c94b7.webp", "cred": "Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ABanu%20musa%20mechanical.jpg"}, {"t": "al-Kindi", "b": "*On Deciphering Cryptographic Messages* — frequency analysis; <a class=\"xl\" href=\"#thread-P/5\">statistics<\/a> as a computational weapon (see Cryptography thread).", "d": "9th c.", "out": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}], "in": [{"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}], "img": "media/cards/1f984f6afcea.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAl-Kind%C4%AB%2C%20Sayr%20mulhimah%20min%20al-Sharq%20wa-al-Gharb.png"}, {"t": "Pop-Up and Movable Books", "d": "1200", "b": "While gatefold mechanisms were already used in the 1100s, one of the first movable paper mechanisms was a volvelle created by Benedictine Monk Matthew Paris to calculate the dates of Christian holidays in his book Chronica Majorca (1236-1253, see left image ab… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pop-up-and-movable-books/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "al-Jazari", "b": "elaborate programmable automata, including a programmable drum machine (camshaft \"programming\").", "d": "1206", "in": [{"to": "thread-I/0", "t": "Clepsydrae"}], "img": "media/cards/e0f437a69fb5.webp", "cred": "Al-Jazari · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAl-jazari%20elephant%20clock.png"}, {"t": "Girih tiles (Islamic world)", "b": "five decorated tiles generating intricate quasi-periodic ornament — patterns on the Darb-i Imam shrine anticipate Penrose tilings by five centuries (recognized only in 2007).", "d": "c. 1200s–1400s", "img": "media/cards/074056f902c9.webp", "cred": "Vathlu · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGirih%20tiles.jpg"}, {"t": "The mechanical clock & verge escapement (Europe)", "b": "gear trains that ration time into equal ticks — Europe's apprenticeship in precision gearing, without which no calculating machines; \"clockwork\" becomes the reigning metaphor for the universe itself.", "d": "c. 1280s–1300s", "img": "media/cards/e409c5cda47a.webp", "cred": "Christoph Braun · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3APendulum%20clock%20by%20Jacob%20Kock%2C%20antique%20furniture%20photography%2C%20IMG%200931%20edit.jpg"}, {"t": "Abraham Abulafia's letter permutations", "b": "ecstatic Kabbalah as combinatorial practice — Hebrew letters permuted in disciplined sequences as meditative technology, with gematria assigning numbers to words; devotion as symbol-manipulation, right beside <a class=\"xl\" href=\"#era-3/12\">Llull's<\/a> wheels (Thread U).", "d": "c. 1280s", "out": [{"to": "era-3/12", "t": "Ramon Llull's Ars Magna (Majorca)"}], "in": [{"to": "thread-U/11", "t": "The Kabbalist cousin"}], "img": "media/cards/f55074d22d2e.webp", "cred": "Unknown artist; the author of the book is Abulafia. · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Abraham_abulafia.jpg"}, {"t": "Ramon Llull's Ars Magna (Majorca)", "b": "rotating paper wheels that combine concepts mechanically to generate arguments — the audacious claim that *reasoning itself* can be mechanized. Leibniz's own dissertation builds on Llull's combinatorics; he is the godfather of symbolic AI, seven centuries early.", "d": "1305", "in": [{"to": "era-3/11", "t": "Abraham Abulafia's letter permutations"}, {"to": "era-4/21", "t": "Kircher's engines of everything"}, {"to": "thread-U/11", "t": "The Kabbalist cousin"}, {"to": "thread-U/14", "t": "The knowledge engines"}], "img": "media/cards/77991108be44.webp", "cred": "Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ARamon%20Llull%20-%20Ars%20Magna%20Fig%201.png"}, {"t": "Fibonacci's Liber Abaci", "b": "Hindu-Arabic numerals enter <a class=\"xl\" href=\"#thread-L/9\">European<\/a> commerce; algorists vs. abacists — a centuries-long fight over *how* to compute.", "d": "1202", "out": [{"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}], "img": "media/cards/b0b1888c1331.webp", "cred": "Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ALiber%20abbaci%20magliab%20f124r.jpg"}, {"t": "Italian abbaco schools (scuole d'abbaco)", "b": "merchant children (including Leonardo da Vinci and Machiavelli) trained in commercial arithmetic, <a class=\"xl\" href=\"#thread-H/15\">lattice multiplication<\/a>, and the Rule of Three — Europe's first mass mathematics education, driven by trade.", "d": "13th–16th c.", "out": [{"to": "thread-H/15", "t": "Lattice (gelosia) multiplication"}]}, {"t": "Gutenberg's printing press", "b": "mass replication of identical text and *identical numbers* — printed tables, textbooks, and almanacs make shared computation possible at scale; the first mass data-copying technology (Thread M).", "d": "c. 1450", "img": "media/cards/a1318e15165d.webp", "cred": "dronepicr · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AForme%20for%20the%20Gutenberg%27s%20printing%20press%20in%20the%20Gutenberg%20Museum%2C%20Mainz%2C%20Germany%20%2848988296286%29.jpg"}, {"t": "Ficino translates the Corpus Hermeticum", "b": "Cosimo de' Medici orders Plato set aside so Hermes Trismegistus can be translated *first* — the <a class=\"xl\" href=\"#thread-U/1\">Renaissance<\/a> reboots with the <a class=\"xl\" href=\"#thread-U/0\"><a class=\"xl\" href=\"#thread-U/4\">Emerald<\/a><\/a> <a class=\"xl\" href=\"#era-2/17\">Tablet<\/a>'s \"as above, so below\" at the front of the queue (Thread U).", "d": "1463", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "thread-U/0", "t": "The Emerald Tablet and the Corpus Hermeticum"}, {"to": "thread-U/1", "t": "The Renaissance magi"}, {"to": "era-2/17", "t": "Salamis Tablet"}], "in": [{"to": "thread-U/0", "t": "The Emerald Tablet and the Corpus Hermeticum"}], "img": "media/cards/eee5a81eedce.webp", "cred": "Jean-Louis Durant (1654-1718) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:HermesTrismegistusCaucHighRes.jpg"}, {"t": "Medieval counting houses & jetons", "b": "the \"exchequer\" is literally a checkered counting board — government by calculation.", "in": [{"to": "era-3/2", "t": "Bede's finger reckoning"}, {"to": "era-5/8", "t": "The tally sticks burn Parliament"}, {"to": "thread-H/13", "t": "Table lookup as a way of life"}, {"to": "thread-K/4", "t": "The binary lineage"}], "img": "media/cards/e7ddc0d9fd1b.webp", "cred": "Cocharelli · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Avarice1.png"}, {"t": "Inca quipu & yupana", "b": "knotted-cord decimal data storage administering an empire without writing, paired with the yupana grid counting board — database and calculator, together.", "d": "c. 1400s", "img": "media/cards/f897f666f59e.webp", "cred": "Claus Ableiter nur hochgeladen aus enWiki · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AInca%20Quipu.jpg"}, {"t": "Astrolabes & equatoria", "b": "analog computers for astronomy carried in the hand.", "img": "media/cards/a968dd56fe8b.webp", "cred": "Jacopo Koushan (User:Jacopo188)\nPhotograph by Masoud Safarniya (User:M.safarniya · CC BY-S", "credurl": "https://commons.wikimedia.org/wiki/File%3AIranian%20Astrolabe%2014.jpg"}, {"t": "Guido of Arezzo", "b": "the <a class=\"xl\" href=\"#thread-T/16\">musical<\/a> staff — pitch plotted against time, arguably the first graph, six centuries before Descartes' coordinates; solmization (do–re–mi) and the Guidonian hand turn a monk's palm into memory hardware (Thread T).", "d": "c. 1025", "out": [{"to": "thread-T/16", "t": "Musical and constructed tongues"}], "img": "media/cards/d6001d5e02f0.webp", "cred": "The original uploader was Robbot at Dutch Wikipedia. · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGuido%20van%20Arezzo.jpg"}, {"t": "Su Song's astronomical clock tower (China)", "b": "a 12-meter water-driven celestial computer — escapement, rotating armillary sphere, and time-announcing manikins.", "d": "1088", "img": "media/cards/a2fbdc44501b.webp", "cred": "Su Song · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AClock%20Tower%20from%20Su%20Song%27s%20Book%20desmear.JPG"}, {"t": "Zij tables (Islamic world)", "b": "vast computed astronomical handbooks; al-Kashi (Samarkand, 1424) calculates π to 16 decimal places and perfects decimal fractions — a precision record standing nearly two centuries.", "d": "8th–15th c.", "img": "media/cards/c1a0d9f36432.webp", "cred": "BnF (Bibliotheque nationale de France) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:SanjufiniZij1.jpg"}, {"t": "The Kerala school (Madhava of Sangamagrama, India)", "b": "infinite series for π, sine, and cosine — power-series results two centuries before <a class=\"xl\" href=\"#era-4/29\"><a class=\"xl\" href=\"#thread-U/4\">Newton<\/a><\/a> and Leibniz.", "d": "c. 1400", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "era-4/29", "t": "Newton the alchemist"}]}]}, {"id": "era-4", "kind": "era", "title": "Era 4: The Calculating Revolution", "sub": "1500 – 1800", "cards": [{"t": "Luca Pacioli codifies double-entry bookkeeping", "b": "debits must equal credits — a built-in checksum for commerce, and the information system that will finance everything else on this timeline (Thread R).", "d": "1494"}, {"t": "Flow Visualization", "d": "1500", "b": "Although today computer graphics is often used for doing flow <a class=\"xl\" href=\"#era-9/183\">visualization<\/a>, a range of physical methods exist that can visualize flows in-place. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/flow-visualization/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/183", "t": "Münster Congestion Visualization"}], "in": [{"to": "era-5/21", "t": "Thermodynamic Surfaces"}, {"to": "era-6/36", "t": "3D Visualizations of Power Consumption"}, {"to": "era-7/24", "t": "Dorothy Hodgkin's Electron Density Contours"}, {"to": "era-9/122", "t": "Using the Physical to Explain the Virtual"}]}, {"t": "Plans-Reliefs", "d": "1500", "b": "The first <a class=\"xl\" href=\"#era-6/3\"><a class=\"xl\" href=\"#era-9/243\">terrain<\/a><\/a>/city models date back from the 16th century and were created for military purposes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/plan-reliefs/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/3", "t": "Modern Solid Terrain Modeling"}, {"to": "era-9/243", "t": "World's Largest Solid Terrain Model"}]}, {"t": "Adam Ries", "b": "German *Rechenmeister* whose <a class=\"xl\" href=\"#thread-L/5\">vernacular<\/a> arithmetic textbooks teach a nation to calculate — \"nach Adam Riese\" (\"per Adam Ries\") still means \"correctly computed\" in German today.", "d": "1522", "out": [{"to": "thread-L/5", "t": "Vernacular revolution"}], "in": [{"to": "thread-L/5", "t": "Vernacular revolution"}], "img": "media/cards/1331ddc5afdf.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ARies.PNG"}, {"t": "Codex Vergara (Aztec/Nahua)", "b": "surveyors' records of chinampa field areas using indigenous fractional units (arrows, hearts, hands) — sophisticated land-area computation running in parallel with, and <a class=\"xl\" href=\"#thread-J/1\">invisible<\/a> to, <a class=\"xl\" href=\"#thread-L/9\">European<\/a> mathematics.", "d": "c. 1540s", "out": [{"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}, {"to": "thread-J/1", "t": "Invisible inks from antiquity through both World Wars; the Cardan gril…"}], "img": "media/cards/e4549e88c031.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:CodexMendoza01.jpg"}, {"t": "Robert Recorde invents \"=\"", "b": "<a class=\"xl\" href=\"#thread-U/4\">English<\/a> math textbooks written as teacher–student dialogues; the equals sign born of a teacher's impatience with writing \"is equal to\" over and over.", "d": "1557", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}], "in": [{"to": "era-4/32", "t": "Modern notation is invented"}, {"to": "era-5/27", "t": "Robert Henry Thurston’s Glyptic Models"}, {"to": "thread-K/1", "t": "Founders' shelf"}, {"to": "thread-L/5", "t": "Vernacular revolution"}], "img": "media/cards/6f5d5561a3df.webp", "cred": "Richard Hagen from Brisbane, Australia · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ARobert%20Recorde%20%28306312390%29.jpg"}, {"t": "John Dee", "b": "the *Monas Hieroglyphica* compresses the cosmos into a <a class=\"xl\" href=\"#thread-A/10\">single<\/a> occult glyph; six years later his Mathematical Preface to the first <a class=\"xl\" href=\"#thread-U/4\">English<\/a> Euclid preaches mathematics' power to navigators, artisans, and <a class=\"xl\" href=\"#era-8/16\">engineers<\/a> — the magus as math evangelist, one mind holding both worlds (Thread U).", "d": "1564/1570", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}, {"to": "thread-A/10", "t": "Single modern AI GPU"}], "img": "media/cards/d1e8fe7d60b7.webp", "cred": "Thomas Pennant · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ADr%20John%20Dee%2002355.jpg"}, {"t": "Prosthaphaeresis", "b": "astronomers (Wittich, Clavius; used in Tycho Brahe's <a class=\"xl\" href=\"#era-6/0\">observatory<\/a>) convert multiplication into addition via trigonometric identities — the trick logarithms would soon make obsolete.", "d": "1580s", "out": [{"to": "era-6/0", "t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)"}], "img": "media/cards/097703a27395.webp", "cred": "Dominic3203 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AProof%20for%20Sum-to-Product%20Identities.jpg"}, {"t": "John Napier: logarithms", "b": "multiplication converted into addition — arguably the greatest \"computational speedup\" before electronics. Napier spent twenty years computing the tables by hand at Merchiston Castle, hunting a way to spare astronomers the grinding multiplications their work <a class=\"xl\" href=\"#era-7/48\">demanded<\/a>. <a class=\"xl\" href=\"#thread-P/1\">Laplace<\/a> later said the invention \"doubles the life of the astronomer\"; it is the rare case where a piece of mathematics is best described in hours saved.", "d": "1614", "out": [{"to": "era-7/48", "t": "Electricity Generated or Demanded"}, {"to": "thread-P/1", "t": "Bayes and Laplace"}], "in": [{"to": "era-4/9", "t": "Casaubon dates the Hermetica"}, {"to": "era-4/15", "t": "Gunter's scale"}, {"to": "era-4/17", "t": "Wilhelm Schickard's \"calculating clock\""}, {"to": "era-5/45", "t": "Genaille–Lucas rulers"}, {"to": "thread-U/3", "t": "the turn"}], "img": "media/cards/43c06b90b15e.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AJohn%20Napier%20of%20Merchiston%2C%201616.jpg"}, {"t": "Casaubon dates the Hermetica", "b": "philology proves the \"primordially <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a>\" Hermetic texts are late-antique — Hermes' stock falls in the very year <a class=\"xl\" href=\"#era-4/10\"><a class=\"xl\" href=\"#era-4/8\">Napier<\/a>'s<\/a> logarithms appear; one revolution demotes magic while another accelerates mathematics (Thread U).", "d": "1614", "out": [{"to": "era-4/8", "t": "John Napier: logarithms"}, {"to": "thread-J/0", "t": "Ancient roots"}, {"to": "era-4/10", "t": "Napier's bones"}], "in": [{"to": "thread-U/3", "t": "the turn"}], "img": "media/cards/8799f96fa823.webp", "cred": "Jean-Louis Durant (1654-1718) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:HermesTrismegistusCaucHighRes.jpg"}, {"t": "Napier's bones", "b": "multiplication rods for laypeople, published in *Rabdologiae* in the year he died. Each rod carries one column of the times table; lay the right rods side by side and a multi-digit multiplication becomes reading off partial products and adding along the diagonals. Sold in cased sets of ivory — hence \"bones\" — they put multiplication within reach of shopkeepers and surveyors who had never been taught it. The tables did the remembering.", "d": "1617", "in": [{"to": "era-4/9", "t": "Casaubon dates the Hermetica"}, {"to": "era-4/15", "t": "Gunter's scale"}, {"to": "era-4/17", "t": "Wilhelm Schickard's \"calculating clock\""}, {"to": "era-5/45", "t": "Genaille–Lucas rulers"}], "img": "media/cards/e08cd2783bb1.webp", "cred": "Kim Traynor · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Napier%27s_Bones.JPG"}, {"t": "Henry Briggs: base-10 logarithm tables", "b": "computed by hand to 14 decimal places; log tables become the working <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">engine<\/a><\/a> of science and engineering for the next 350 years — schoolchildren still carried them in the 1970s.", "d": "1617–1624", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}], "img": "media/cards/fb2ab593354e.webp", "cred": "Henry Briggs by John Faber Jr, after Isaac Seeman mezzotint, 1738 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Henry-Briggs.jpg"}, {"t": "Japanese soroban", "b": "refined 1/4-bead <a class=\"xl\" href=\"#era-4/26\">abacus<\/a>; in a famous 1946 Tokyo contest a soroban operator beat a US Army electric calculator in four of five rounds.", "d": "c. 1600s", "out": [{"to": "era-4/26", "t": "Wearable Abacus from the Qing Dynasty"}], "in": [{"to": "era-4/30", "t": "Seki Takakazu and wasan (Japan)"}], "img": "media/cards/71f85a54d7c6.webp", "cred": "Dr. Bernd Gross · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASoroban-Japan.jpg"}, {"t": "Galileo's geometric and military compass (the sector)", "b": "a hinged brass calculating <a class=\"xl\" href=\"#era-5/44\">instrument<\/a> for gunners and surveyors; <a class=\"xl\" href=\"#era-4/22\">Galileo<\/a> manufactured and sold them with lessons — a scientist funding <a class=\"xl\" href=\"#thread-H/9\"><a class=\"xl\" href=\"#thread-U/18\">research<\/a><\/a> by selling calculators.", "d": "1597", "out": [{"to": "era-5/44", "t": "Polynesian Genealogical Instrument"}, {"to": "thread-H/9", "t": "Research on expert abacus users suggests they shift arithmetic from ve…"}, {"to": "thread-U/18", "t": "Research programs harden into science"}, {"to": "era-4/22", "t": "Galileo Thermometer"}], "img": "media/cards/1b27ea6d2d27.webp", "cred": "Sage Ross · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGalileo%27s%20geometrical%20and%20military%20compass%20in%20Putnam%20Gallery%2C%202009-11-24.jpg"}, {"t": "Kepler's *Harmonices Mundi", "b": "*: hunting the chords of the planets, he finds the third law of planetary <a class=\"xl\" href=\"#era-5/49\"><a class=\"xl\" href=\"#era-8/74\">motion<\/a><\/a> — music-of-the-spheres mysticism delivering hard celestial mechanics (Thread T).", "d": "1619", "out": [{"to": "era-5/49", "t": "Stop Motion Animation"}, {"to": "era-8/74", "t": "Stop Motion Animation of Physical 3D Map"}], "in": [{"to": "thread-T/2", "t": "Kepler's wager (1619)"}], "img": "media/cards/047bd688c5d7.webp", "cred": "Johannes Kepler (1619) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AKepler%27s%20tetrahedron%20in%20cube.png"}, {"t": "Gunter's scale", "b": "logarithms engraved on wood, worked with dividers — the missing link between <a class=\"xl\" href=\"#era-4/10\"><a class=\"xl\" href=\"#era-4/8\">Napier<\/a>'s<\/a> tables and <a class=\"xl\" href=\"#thread-H/19\">the slide rule<\/a>. Edmund Gunter cut the logarithmic scale into a two-foot boxwood rule, so that stepping off two lengths with a pair of dividers added the logarithms and so multiplied the numbers. The \"Gunter\" stayed in ships' navigation chests for two hundred years. Computation had become a physical distance you could measure.", "d": "1620", "out": [{"to": "thread-H/19", "t": "The slide rule"}, {"to": "era-4/8", "t": "John Napier: logarithms"}, {"to": "era-4/10", "t": "Napier's bones"}], "in": [{"to": "era-4/16", "t": "William Oughtred: slide rule"}]}, {"t": "William Oughtred: slide rule", "b": "the engineer's computer for the next 350 years. Oughtred's step was to set two of <a class=\"xl\" href=\"#era-4/15\">Gunter's<\/a> scales sliding against one another, which retired the dividers: the lengths now added themselves. He quarrelled bitterly with his student Richard Delamain over who thought of it first, and published little, being a clergyman who taught mathematics for nothing. Buzz Aldrin carried a slide rule to the Moon — the same idea, still working, three and a half centuries on.", "d": "c. 1622", "out": [{"to": "era-4/15", "t": "Gunter's scale"}], "in": [{"to": "era-6/40", "t": "William & Elizebeth Friedman"}], "img": "media/cards/9df071d61fdc.webp", "cred": "Wenceslaus Hollar · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AWenceslas%20Hollar%20-%20William%20Oughtred.jpg"}, {"t": "Wilhelm Schickard's \"calculating clock\"", "b": "the first known mechanical calculator — six-digit addition with automatic carry, and a set of <a class=\"xl\" href=\"#era-4/10\"><a class=\"xl\" href=\"#era-4/8\">Napier<\/a>'s<\/a> rods mounted on cylinders for multiplication. Schickard described it in letters to Kepler, who was to use it for the *Rudolphine Tables*. The machine burned before delivery; Schickard died of plague in 1635; the letters lay unread until 1957. For three hundred years the credit went to <a class=\"xl\" href=\"#era-4/19\"><a class=\"xl\" href=\"#era-4/33\">Pascal<\/a><\/a>, and the first calculating machine was a thing nobody knew had been built.", "d": "1623", "out": [{"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "era-4/8", "t": "John Napier: logarithms"}, {"to": "era-4/33", "t": "Pascal & Fermat's correspondence"}, {"to": "era-4/10", "t": "Napier's bones"}], "in": [{"to": "era-5/18", "t": "Hofmann's Croquet Ball Models"}], "img": "media/cards/effc2181494d.webp", "cred": "Conrad Melperger · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:C_Melperger_-_Wilhelm_Schickard_1632.jpg"}, {"t": "Mersenne's *Harmonie universelle", "b": "*: pitch measured as countable vibrations per second (by watching the slow swings of very long strings, then scaling up by law); <a class=\"xl\" href=\"#thread-T/5\">the string laws<\/a> — frequency ∝ (1/L)·√(T/μ) — from varying one parameter at a time; equal temperament's ¹²√2 ≈ 1.05946 computed and printed as fret lengths; and all 720 permutations of a six-note hexachord tabulated, with 22! melodies declared inexhaustible. Acoustics founded, Western music retuned, and combinatorics applied to art — in one 1,500-page book (Thread T).", "d": "1636", "out": [{"to": "thread-T/5", "t": "The string laws"}], "in": [{"to": "era-4/27", "t": "Sauveur names \"acoustics\""}, {"to": "era-5/5", "t": "Fourier's *Théorie analytique de la chaleur"}, {"to": "era-9/220", "t": "GIMPS"}, {"to": "thread-T/9", "t": "Computing equal temperament"}, {"to": "thread-T/11", "t": "The human internet hub"}], "img": "media/cards/95c6c305778a.webp", "cred": "Marin Mersenne, publié à Paris en 1636 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMarin%20Mersenne%20-%20Harmonie%20universelle%201636%20%28page%20de%20titre%29.png"}, {"t": "Blaise Pascal: the Pascaline", "b": "mechanical addition and subtraction with carry, built at nineteen for his father, a tax official in Rouen drowning in the re-assessment of Normandy. The carry was the hard part: <a class=\"xl\" href=\"#era-4/33\">Pascal<\/a>'s *sautoir* let a falling weight tip the next wheel over, so a nine could roll to zero and pass the debt along a whole row. He had perhaps fifty made and sold almost none — the machine cost more than the clerk it replaced. The mechanism is right; the market is two centuries early.", "d": "1642", "out": [{"to": "era-4/33", "t": "Pascal & Fermat's correspondence"}], "in": [{"to": "era-4/17", "t": "Wilhelm Schickard's \"calculating clock\""}, {"to": "thread-D/0", "t": "Machines"}, {"to": "thread-P/0", "t": "Born at the gambling table and the plague ledger"}, {"to": "thread-T/11", "t": "The human internet hub"}], "img": "media/cards/a074149ad824.webp", "cred": "Gérard Edelinck · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFR-631136102%20GRA%206025%20Portrait%20de%20Blaise%20Pascal%20par%20Edelinck%20%28cropped%29.jpg"}, {"t": "Kircher's *Musurgia universalis* and arca musarithmica", "b": "birdsong transcribed into <a class=\"xl\" href=\"#thread-T/16\">musical<\/a> <a class=\"xl\" href=\"#thread-T/21\">notation<\/a>, and a box that composes music by combinatorial lookup — an <a class=\"xl\" href=\"#thread-T/22\">algorithmic<\/a> composition machine (Thread T).", "d": "1650", "out": [{"to": "thread-T/21", "t": "Notation is a program"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}, {"to": "thread-T/16", "t": "Musical and constructed tongues"}], "in": [{"to": "era-8/10", "t": "Computer music begins"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}], "img": "media/cards/e17676703831.webp", "cred": "Athanasius Kircher · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Musurgia_universalis_-_title_page_%2822831149%29.jpg"}, {"t": "Kircher's engines of everything", "b": "the magic lantern popularized (projected images — ancestor of every screen), museum statues that speak through hidden voice tubes, a universal cipher-language with a translation box (*Polygraphia nova*, 1663), <a class=\"xl\" href=\"#era-3/12\">Llull's<\/a> combinatorics rebuilt as a general logic of discovery (*Ars Magna Sciendi*, 1669), and a worldwide Jesuit network mailing him magnetic and tide observations — a one-man platform era, three centuries early (Thread U).", "d": "1641–1669", "out": [{"to": "era-3/12", "t": "Ramon Llull's Ars Magna (Majorca)"}], "in": [{"to": "era-8/10", "t": "Computer music begins"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}]}, {"t": "Galileo Thermometer", "d": "1660", "b": "A Galileo <a class=\"xl\" href=\"#era-4/36\">thermometer<\/a> consists of a set of floaters immersed in a clear liquid (typically ethanol) inside a sealed glass tube. Today a floater is typically a glass sphere containing a colored liquid and to which is attached a metallic temperature tag. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/galileo-thermometer/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-4/36", "t": "Mercury Thermometer"}], "in": [{"to": "era-4/13", "t": "Galileo's geometric and military compass (the sector)"}, {"to": "era-4/36", "t": "Mercury Thermometer"}, {"to": "thread-T/11", "t": "The human internet hub"}, {"to": "thread-U/20", "t": "Secrecy's training ground"}]}, {"t": "Gottfried Leibniz: stepped reckoner", "b": "all four operations; Leibniz also formalizes **binary arithmetic (1703)** and dreams of mechanized reasoning (\"Calculemus!\").", "d": "1673", "img": "media/cards/8ef57364aacc.webp", "cred": "Christoph Bernhard Francke · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AChristoph%20Bernhard%20Francke%20-%20Bildnis%20des%20Philosophen%20Leibniz%20%28ca.%201695%29.jpg"}, {"t": "Change ringing formalized (Fabian Stedman, England)", "b": "bell-ringers systematically enumerate permutations — working group theory in <a class=\"xl\" href=\"#era-6/42\">church<\/a> towers, 150 years before mathematicians name it.", "d": "1668–77", "out": [{"to": "era-6/42", "t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)"}], "in": [{"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}]}, {"t": "Wilkins's *Real Character", "b": "*: a constructed philosophical language classifying every concept — the Babel-reversing <a class=\"xl\" href=\"#era-6/39\">project<\/a> that Leibniz would turn computational (Thread T).", "d": "1668", "out": [{"to": "era-6/39", "t": "WPA Mathematical Tables Project"}], "in": [{"to": "era-5/24", "t": "Baudot's 5-bit code"}, {"to": "thread-J/9", "t": "The OCR connection"}, {"to": "thread-T/14", "t": "The 17th-century projects"}], "img": "media/cards/5116bfd10290.webp", "cred": "An Essay Towards a Real Character, and a Philosophical Language · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Wilkins_An_Essay_towards_a_real.jpg"}, {"t": "Wearable Abacus from the Qing Dynasty", "d": "1700", "b": "A functioning abacus ring from the Qing Dynasty (1644-1912), exhibited at the Cheng Dawei Abacus Museum in Huangshan City, China. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/wearable-abacus-from-the-qing-dynasty/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "in": [{"to": "era-4/12", "t": "Japanese soroban"}, {"to": "thread-D/0", "t": "Machines"}, {"to": "thread-H/1", "t": "Day-to-day arithmetic ran on pebbles (calculi) on lined counting boa…"}, {"to": "thread-H/6", "t": "The schoty, Russia's abacus, was still clicking on shop counters i…"}, {"to": "thread-H/9", "t": "Research on expert abacus users suggests they shift arithmetic from ve…"}]}, {"t": "Sauveur names \"acoustics\"", "b": "harmonics identified, named, and measured — <a class=\"xl\" href=\"#era-4/18\"><a class=\"xl\" href=\"#thread-T/23\">Mersenne's<\/a><\/a> puzzle of one string sounding many pitches at once begins to yield (Thread T).", "d": "1701", "out": [{"to": "thread-T/23", "t": "Fourier closes Mersenne's case (1822)"}, {"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}], "in": [{"to": "thread-T/7", "t": "The harmonic-series puzzle"}, {"to": "thread-T/24", "t": "The hearing sciences"}]}, {"t": "Leibniz, Bouvet, and the binary God", "b": "Jesuit missionary Joachim Bouvet mails Leibniz the I Ching's hexagram circle; Leibniz reads the 64 figures as his own binary arithmetic and publishes the connection — for him binary was theology, 1 as God and 0 as nothing, creation *ex nihilo* inside every number; he even designed a commemorative medallion of it (Era 2; Thread U).", "d": "1701–03", "in": [{"to": "thread-U/10", "t": "1701–03"}], "img": "media/cards/e0f803c1172b.webp", "cred": "Christoph Bernhard Francke · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_%28ca._1695%29.jpg"}, {"t": "Newton the alchemist", "b": "translator of the <a class=\"xl\" href=\"#thread-U/0\">Emerald<\/a> <a class=\"xl\" href=\"#era-2/17\">Tablet<\/a> into <a class=\"xl\" href=\"#thread-U/4\">English<\/a>, author of roughly a million manuscript words on alchemy (more than on physics), and computer of biblical chronologies — including a calculation that the apocalypse comes \"not before 2060.\" When <a class=\"xl\" href=\"#thread-U/5\">Keynes<\/a> bought the long-hidden papers at auction in 1936, he concluded Newton was \"not the first of the age of reason\" but \"the last of the magicians\" (Thread U).", "d": "c. 1680s–1727", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "thread-U/5", "t": "The Keynes verdict (1936)"}, {"to": "thread-U/0", "t": "The Emerald Tablet and the Corpus Hermeticum"}, {"to": "era-2/17", "t": "Salamis Tablet"}], "in": [{"to": "era-3/23", "t": "The Kerala school (Madhava of Sangamagrama, India)"}, {"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "thread-U/5", "t": "The Keynes verdict (1936)"}, {"to": "thread-U/7", "t": "Computing doomsday"}, {"to": "thread-U/8", "t": "Still being decrypted"}], "img": "media/cards/87c9b1ef134b.webp", "cred": "by Thomas Lewis Atkinson, published by Henry Graves &amp; Co, and published by W · CC BY-S", "credurl": "https://commons.wikimedia.org/wiki/File%3AImaginary-portrait-of-Sir-Isaac-Newton-as-a-child.jpg"}, {"t": "Seki Takakazu and wasan (Japan)", "b": "determinants before Leibniz publishes them, Bernoulli numbers before Bernoulli — an independent <a class=\"xl\" href=\"#era-4/12\">Japanese<\/a> mathematical tradition whose devotees hang **<a class=\"xl\" href=\"#thread-K/15\">sangaku<\/a>**, carved geometry problems, as offerings in shrines and temples.", "d": "1683", "out": [{"to": "thread-K/15", "t": "Sangaku & wasan (Era 4)"}, {"to": "era-4/12", "t": "Japanese soroban"}], "img": "media/cards/acc5f0ba8ea7.webp", "cred": "Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASeki%20Kowa.jpg"}, {"t": "The Gregorian calendar reform", "b": "Clavius' commission computes away accumulated drift — Thursday, October 4 is followed by Friday, October 15. Arithmetic edits reality's date.", "d": "1582", "img": "media/cards/b1628d08aed9.webp", "cred": "Karl Nimtsch · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AEwiger%20Kalender%20gregorianisch.png"}, {"t": "Modern notation is invented", "b": "Viète's letters for unknowns, then Descartes' x, y, z and exponents; +, −, ×, and <a class=\"xl\" href=\"#era-4/5\">Recorde<\/a>'s = spread in the same era — algebraic symbolism as a compact machine language for *human* computation.", "d": "1591–1637", "out": [{"to": "era-4/5", "t": "Robert Recorde invents \"=\""}]}, {"t": "Pascal & Fermat's correspondence", "b": "a gambler's dispute births probability theory — chance becomes calculable (Thread P).", "d": "1654", "in": [{"to": "era-4/17", "t": "Wilhelm Schickard's \"calculating clock\""}, {"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "thread-P/0", "t": "Born at the gambling table and the plague ledger"}, {"to": "thread-T/11", "t": "The human internet hub"}], "img": "media/cards/9c8a4e781df1.webp", "cred": "Radlrb · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ABinary%20Pascal%27s%20Triangle.png"}, {"t": "Graunt's Bills of Mortality and Halley's life table", "b": "death counted, tabulated, and priced into annuities — <a class=\"xl\" href=\"#thread-P/5\">statistics<\/a> and the actuarial profession begin (Thread P).", "d": "1662/1693", "out": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}], "in": [{"to": "era-4/35", "t": "Halley's comet"}], "img": "media/cards/e1178674a8c8.webp", "cred": "Fondazione Mansutt · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGraunt%20-%20Natural%20and%20political%20observations%2C%201676%20-%20204.tif"}, {"t": "Halley's comet", "b": "predicted by computation to return; it does, on schedule, sixteen years after <a class=\"xl\" href=\"#era-4/34\">Halley's<\/a> death — hand calculation forecasting the heavens (Thread P).", "d": "1705/1758", "out": [{"to": "era-4/34", "t": "Graunt's Bills of Mortality and Halley's life table"}], "img": "media/cards/bc75e47c0f71.webp", "cred": "Myrabella · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ABayeux%20Tapestry%2032-33%20comet%20Halley%20Harold.jpg"}, {"t": "Mercury Thermometer", "d": "1714", "b": "The mercury <a class=\"xl\" href=\"#era-4/22\">thermometer<\/a> was invented by Dutch physicist Daniel Gabriel Fahrenheit in 1714. It consists of a narrow glass tube with a bulb at the bottom, containing mercury. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mercury-thermometer/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-4/22", "t": "Galileo Thermometer"}], "in": [{"to": "era-4/22", "t": "Galileo Thermometer"}, {"to": "thread-O/1", "t": "Bits as echoes"}]}, {"t": "Vaucanson's automata", "b": "the flute player and the \"digesting duck\" make mechanical life a public sensation; his automated loom work leads directly to <a class=\"xl\" href=\"#era-5/1\">Jacquard<\/a>.", "d": "1739", "out": [{"to": "era-5/1", "t": "Jacquard loom"}], "img": "media/cards/0e00e2fb4cf1.webp", "cred": "Jacques de Vaucanson · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AVaucanson%20Automata.jpg"}, {"t": "Physical Splines", "d": "1750", "b": "You may not realize that splines were once physical things. In an era prior to CAD and large-format printing, when draftsmen needed to lay out full-sized <a class=\"xl\" href=\"#era-6/14\">curves<\/a>—for boatbuilding, airplane manufacturing and the like—this is how they did it. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/physical-splines/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/14", "t": "Solid 3D Curves for Engineering"}]}, {"t": "George Adams' Solid Geometry Models", "d": "1750", "b": "During the 18th century, <a class=\"xl\" href=\"#era-5/44\">instrument<\/a> maker <a class=\"xl\" href=\"#era-5/14\">George<\/a> Adams built and sold solid 3D geometric models as educational complements to the 2D images found in <a class=\"xl\" href=\"#era-2/18\">Euclid's Elements<\/a> of Geometry. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/george-adams-geometric-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/44", "t": "Polynesian Genealogical Instrument"}, {"to": "era-2/18", "t": "Euclid's Elements"}, {"to": "era-5/14", "t": "George Boole"}], "in": [{"to": "era-5/15", "t": "Merryweather's Leech Barometer"}, {"to": "thread-H/24", "t": "Professional lightning calculators"}]}, {"t": "Barbeu-Dubourg's Machine Chronologique", "d": "1753", "b": "Before Joseph Priestley published his famous timelines, Frenchman <a class=\"xl\" href=\"#era-8/106\">Jacques<\/a> Barbeu-Dubourg built a 16-meter long timeline showing 140 years of world history, which can be mechanically scrolled and folded for transport. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/barbeu-dubourgs-machine-chronologique/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-8/106", "t": "Jacques Bertin's Reorderable Matrices"}]}, {"t": "Bayes' theorem (published posthumously)", "b": "belief updated by arithmetic — the mathematics now beating inside spam filters and AI. <a class=\"xl\" href=\"#era-5/3\">Thomas<\/a> Bayes, a Presbyterian minister, left the essay unpublished among his papers; his friend Richard Price found it, saw what it was, and read it to the Royal Society two years after Bayes' death. It answers the inverse question — not *given this coin, what will it do*, but *given what it did, what kind of coin is it* — which is the question every learning machine is asking (Thread P).", "d": "1763", "out": [{"to": "era-5/3", "t": "Thomas de Colmar's Arithmometer"}]}, {"t": "The Mechanical Turk", "b": "Kempelen's chess \"automaton\" conceals a human player and fools Europe for 84 years — the permanent lesson that claimed machine <a class=\"xl\" href=\"#era-7/43\">intelligence<\/a> may hide human labor (Thread Q; Amazon later names its crowdwork platform after it).", "d": "1770", "out": [{"to": "era-7/43", "t": "Turing's \"Computing Machinery and Intelligence\""}], "img": "media/cards/82962ce672e0.webp", "cred": "Joseph Racknitz · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Racknitz_-_The_Turk_3.jpg"}, {"t": "William Playfair invents the line and bar chart (pie chart 1801)", "b": "data becomes picture. A Scottish engineer who had worked in Boulton & Watt's shop, Playfair put England's imports and exports on a time axis in his *Commercial and Political Atlas* and invented, in the same book, most of the vocabulary still in use. He was a bankrupt, a pamphleteer and by some accounts a blackmailer, and he had to argue at length that a picture of numbers was not a trick. Every chart since is a footnote to him (Thread P).", "d": "1786", "in": [{"to": "era-6/40", "t": "William & Elizebeth Friedman"}, {"to": "thread-P/3", "t": "The picture-makers"}], "img": "media/cards/83f1b98d1eb8.webp", "cred": "Playfair, William, 1759-1823 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATableau%20des%20d%C3%A9penses%20des%20Troupes%20d%27Angleterre%20depuis%201720%2C%20jusqu%27en%201786.%20W.%20Playfair%20inv.%20%28IA%20dr%20tableau-des-dpenses-des-troupes-dangleterre-depuis-1720-jusquen-1786-w-14319060%29.jpg"}, {"t": "Chladni Plates", "d": "1787", "b": "In 1787, German physicist and musician Ernst Chladni published a technique to visualize the modes of vibration of a rigid <a class=\"xl\" href=\"#era-6/2\">surface<\/a>. Chladni's technique [...] consisted of drawing a bow over a piece of metal whose surface was lightly covered with sand. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/chladni-plates/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/2", "t": "Crum Brown's Mathematical Surface"}], "in": [{"to": "era-6/21", "t": "Karsten's Tridimensional Chart"}]}, {"t": "The metric system (and the failed decimal clock)", "b": "revolutionary France rationalizes measurement; decimal time dies within two years — Sumer's base-60 hours outlast the guillotine (Thread F callback).", "d": "1790s", "img": "media/cards/f1b5864a599b.webp", "cred": "Published by Funk &amp; Wagnalls, New York · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMetric%20System%20Illustrated%20and%20Explained%201929.png"}, {"t": "Human computing as a profession", "b": "observatories and navies employ rooms of <a class=\"xl\" href=\"#era-9/53\">people<\/a> grinding out tables. Maskelyne's *Nautical Almanac* (1767) was worked out by computers scattered across England — a Yorkshire schoolmaster, a Cornish clergyman's widow — each paid by the lunar distance, each result computed twice by two people who did not know each other and reconciled by a third called the comparer. Redundancy as error-correction, a century before the phrase existed. The job title is \"computer\" and it belongs to a person.", "d": "1700s", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}], "img": "media/cards/07243d51a39a.webp", "cred": "NACA (NASA) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Human_computers_-_Dryden.jpg"}, {"t": "de Prony's logarithm project (France)", "b": "tables produced by a *pyramid of human computers* using division of labor — an assembly line for arithmetic, explicitly inspired by Adam Smith. A \"computer\" is a job title, not a machine.", "d": "1790s", "in": [{"to": "thread-B/0", "t": "Human Computers"}, {"to": "thread-Q/2", "t": "The computing proletariat"}], "img": "media/cards/4a811fce0b6d.webp", "cred": "Matthias Bernegger · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Bernegger_Manuale_136.jpg"}, {"t": "The Chappe optical telegraph (France)", "b": "semaphore towers relay coded messages Paris–Lille in minutes, growing into a ~5,000 km state network with protocols, acknowledgments, error control, and encrypted payloads its own operators couldn't read; in 1834 the Blanc brothers bribe operators to smuggle bond-market signals through it — history's first network hack (Thread M).", "d": "1794", "in": [{"to": "thread-M/23", "t": "The latency ladder (companion to Thread A's speed ladder)"}], "img": "media/cards/a5a01b91d64c.webp", "cred": "Lokilech at German Wikipedia · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:OptischerTelegraf.jpg"}]}, {"id": "era-5", "kind": "era", "title": "Era 5: The Industrialization of Calculation", "sub": "1800 – 1900", "cards": [{"t": "The blackboard", "b": "enters classrooms (popularized at West Point): the dominant educational <a class=\"xl\" href=\"#era-8/122\"><a class=\"xl\" href=\"#era-9/245\">display<\/a><\/a> technology for the next two centuries.", "d": "c. 1801", "out": [{"to": "era-9/245", "t": "A Shape Display Appears in a Movie"}, {"to": "era-8/122", "t": "Physical Display to Study Perception"}], "in": [{"to": "thread-L/7", "t": "The Prussian machine (1810s–40s)"}], "img": "media/cards/27196c98fdf1.webp", "cred": "Winslow Homer · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AWinslow%20Homer%20-%20Blackboard%20%281877%29.jpg"}, {"t": "Jacquard loom", "b": "punched cards control <a class=\"xl\" href=\"#era-9/195\">weaving<\/a> — programs stored on cards, data controlling machines.", "d": "1804", "out": [{"to": "era-9/195", "t": "Slumber: Brainwave Weaving"}], "in": [{"to": "era-4/37", "t": "Vaucanson's automata"}, {"to": "era-8/76", "t": "The Apollo Guidance Computer"}, {"to": "thread-D/0", "t": "Machines"}, {"to": "thread-O/3", "t": "Core rope & Apollo"}, {"to": "thread-T/21", "t": "Notation is a program"}], "img": "media/cards/1f5718cc1fe3.webp", "cred": "Michel Marie Carquillat (tisseur) d'après Claude Bonnefond · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:A_la_m%C3%A9moire_de_J.M._Jacquard.jpg"}, {"t": "The Prussian school model", "b": "age-graded classrooms, state curricula, and \"normal schools\" that turn teacher training into an institution — the template exported worldwide, and the <a class=\"xl\" href=\"#era-7/43\">machinery<\/a> through which <a class=\"xl\" href=\"#thread-L/17\">curriculum<\/a> lag propagates (see Thread L).", "d": "1810s–40s", "out": [{"to": "thread-L/17", "t": "Curriculum as geology"}, {"to": "era-7/43", "t": "Turing's \"Computing Machinery and Intelligence\""}], "img": "media/cards/732db47f074b.webp", "cred": "Albert Bettannier · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Geography%20Lesson%20or%20%22The%20Black%20Spot%22.jpg"}, {"t": "Thomas de Colmar's Arithmometer", "b": "first commercially successful calculator; offices begin to mechanize.", "d": "1820–1851", "in": [{"to": "era-4/41", "t": "Bayes' theorem (published posthumously)"}, {"to": "thread-N/3", "t": "Pentium FDIV (1994)"}], "img": "media/cards/ea6b6b94b97f.webp", "cred": "Ezrdr · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Arithmometre_%28cropped%29.jpg"}, {"t": "Papier-Mâché Anatomical Models", "d": "1820", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/papier-mache-anatomical-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Fourier's *Théorie analytique de la chaleur", "b": "*: every signal is a sum of pure sine waves — the <a class=\"xl\" href=\"#era-8/155\">theorem<\/a> that finally answers <a class=\"xl\" href=\"#era-4/18\"><a class=\"xl\" href=\"#thread-T/23\">Mersenne's<\/a><\/a> harmonic puzzle and later becomes, via the FFT, MP3s, Auto-Tune, and speech recognition (Thread T; Thread M).", "d": "1822", "out": [{"to": "thread-T/23", "t": "Fourier closes Mersenne's case (1822)"}, {"to": "era-8/155", "t": "Appel & Haken prove the Four Color Theorem by computer"}, {"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}], "img": "media/cards/de2212a70a34.webp", "cred": "Julien-Léopold Boilly · Public domain", "credurl": "https://commons.wikimedia.or an class=\"src\">&mdash; <a href=\"https://dataphys.org/list/thermodynamic-surfaces/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/183", "t": "Münster Congestion Visualization"}, {"to": "era-4/1", "t": "Flow Visualization"}], "in": [{"to": "era-5/27", "t": "Robert Henry Thurston’s Glyptic Models"}]}, {"t": "Office machine boom", "b": "Odhner wheel, comptometer, cash register — arithmetic becomes clerical infrastructure.", "d": "1873–1887", "in": [{"to": "era-10/0", "t": "Printer tracking dots decoded"}, {"to": "thread-R/4", "t": "The retail stack"}]}, {"t": "The transatlantic cable", "b": "continents wired together; Kelvin's mirror galvanometer — sensitive enough to read a whisper of current after 3,000 km — makes it work, and per-word pricing spawns commercial codebooks: compression driven by <a class=\"xl\" href=\"#era-7/36\">economics<\/a>.", "d": "1858/1866", "out": [{"to": "era-7/36", "t": "Moniac: A Hydromechanical Machine to Teach Economics"}], "img": "media/cards/d34ae46b660b.webp", "cred": "Ogden Daily Standard | 1917-06-16 | Page 23 · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ATransatlantic%20telegraph%20cable%20flag.png"}, {"t": "Baudot's 5-bit code", "b": "fixed-length binary <a class=\"xl\" href=\"#era-4/25\">character<\/a> encoding for multiplexed telegraphy — direct ancestor of teleprinters, telex, and ASCII (\"baud\" preserves his name).", "d": "1870", "out": [{"to": "era-4/25", "t": "Wilkins's *Real Character"}], "in": [{"to": "thread-M/10", "t": "The paper-tape lineage"}, {"to": "thread-M/21", "t": "Twins, not neighbors"}], "img": "media/cards/61e4c3c02675.webp", "cred": "Jean Maurice Emile Baudot · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ABaudot%20Code%20-%20from%201888%20patent.png"}, {"t": "Helmholtz's *On the Sensations of Tone", "b": "*: hearing itself dissected with tuned resonators — physiological acoustics founded (Thread T).", "d": "1863", "img": "media/cards/f49378e28fdf.webp", "cred": "Poul la Cour &amp; Jacob Appel · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHelmholtz%20resonator%202.jpg"}, {"t": "Sound becomes data", "b": "Scott de Martinville's phonautograph *records* sound it cannot play back; Edison's phonograph plays it — audio as stored signal (Thread M; Thread T).", "d": "1857/1877"}, {"t": "Robert Henry Thurston’s Glyptic Models", "d": "1875", "b": "<a class=\"xl\" href=\"#era-4/5\">Robert<\/a> Henry Thurston was an American engineer and inventor who created solid models of 3D <a class=\"xl\" href=\"#era-5/21\">surfaces<\/a> for engineering purposes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/robert-henry-thurstons-glyptic-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/21", "t": "Thermodynamic Surfaces"}, {"to": "era-4/5", "t": "Robert Recorde invents \"=\""}], "in": [{"to": "thread-K/1", "t": "Founders' shelf"}, {"to": "thread-L/5", "t": "Vernacular revolution"}]}, {"t": "Van't Hoff's Molecular Paper Models", "d": "1875", "b": "Van’t Hoff disseminated his stereochemical ideas to leading chemists of the day by sending them 3-D paper models of tetrahedral molecules, like these now housed in the Leiden Museum. There might be some difficulty in following my reasoning. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/vant-hoffs-molecular-paper-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "in": [{"to": "era-8/123", "t": "Byron's Bender"}, {"to": "thread-I/21", "t": "Wet computers"}]}, {"t": "Telephone and automatic exchange", "b": "Bell's telephone; then Strowger — an undertaker convinced the operator was diverting his business calls — invents d
