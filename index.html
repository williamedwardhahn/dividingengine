utation is not morally neutral (Thread P).", "d": "1880s–1901", "img": "media/cards/6092d0eddc0a.webp", "cred": "Eveleen Myers (née Tennant) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASir%20Francis%20Galton%2C%201890s.jpg"}, {"t": "Winogradsky Columns", "d": "1880", "b": "The Winogradsky column, invented by Sergei Winogradsky, consists in a transparent cylinder for analyzing microbial life by observing how the metabolism of micro-organisms evolve over time in stratified layers. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/winogradsky-column/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Klein's Mathematical Plaster Models", "d": "1880", "b": "In the 19th century, mathematicians became interested in the question how mathematical functions look like. Felix Klein, a German mathematician, had several of such physical models in his lab in Göttingen, and popularized them in America when he brought a boat… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/plaster-models-of-mathematical-functions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Ammassalik Wooden Maps", "d": "1885", "b": "These three-dimensional maps were carved by inuits from the Ammassalik Fjord in Greenland, and used as eyes-free guides for sailing. The left one shows coastline, the right one shows a sequence of offshore islands. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ammassalik-wooden-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Marey's Movement Sculptures", "d": "1887", "b": "Bronze sculpture showing the phases of the flight of birds, created by French scientist Étienne-Jules Marey in 1887 based on photographs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mareys-movement-sculptures/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Gaudí's Hanging Chain Models", "d": "1889", "b": "Spanish Catalan architect Antoni Gaudí disliked drawings and prefered to explore some of his designs — such as the unfinished Church of Colònia Güell and the Sagrada Família — using scale models made of chains or weighted strings. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/gaudis-hanging-chain-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Herman Hollerith", "b": "punched-card tabulators process the US Census in record time; his company later merges into **IBM**.", "d": "1890", "img": "media/cards/881abeb91eca.webp", "cred": "Charles Milton Bell · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHollerith.jpg"}, {"t": "Polynesian Genealogical Instrument", "d": "1890", "b": "This artefact from the Marquesas Islands (French Polynesia) served as a memory aid for reciting genealogies during ceremonies. Each thread, made of woven coconut fiber, is a genealogical line and each knot is a generation. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/polynesian-genealogical-instrument/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Genaille–Lucas rulers", "b": "Napier's bones perfected — multiplication by pure sight-reading, no carrying; a reminder that \"calculating aids\" kept evolving right up to the electronic age.", "d": "1891", "img": "media/cards/75914c00c4a4.webp", "cred": "Worrydream · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGenaille-Lucas%20rulers%20example%202.png"}, {"t": "The Committee of Ten (US)", "b": "secondary mathematics standardized into arithmetic → algebra → geometry → trigonometry — the course sequence most students still walk today, frozen before the airplane flew (see Thread L).", "d": "1893"}, {"t": "Galton Board", "d": "1893", "b": "The galton board (named after and invented by Sir Francis Galton) is a physical device consisting of a vertical board with rows of interleaved pegs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/galton-board/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "James Ive's Mechanical Teaching Map", "d": "1896", "b": "The boundaries of the United States transformed during the 19th century, often through violent means. Mapmaker James Ives created this mechanical map to help people, especially students, visualize these changes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/james-ives-mechanical-teaching-map/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Stop Motion Animation", "d": "1897", "b": "Stop motion animation is the frame-by-frame capture of (generally) inanimate objects which are manipulated by increments in order to produce the illusion of motion. It was first used in movies to produce magical effects. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/stop-motion-animation/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Crookes' Vis Generatrix", "d": "1898", "b": "Model of Crookes’ \"Vis Generatrix\" made in 1898, built by his assistant, Gardiner. From: Proc. R. Soc. Lond. 63, 408. The vertical scale represents the atomic weight of the elements from H = 1 to Ur = 239. Missing elements are represented with a white circle. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/crookes-vis-generatrix-periodic-table/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Tallies Used as Social Displays on Pacific Islands", "d": "1898", "b": "In the 19th century, the Torres Strait Islanders did not have a numeral system and used sticks to keep counts. Sticks were tied to a string, forming a bundle (called kupe) that could be rolled and unrolled when needed. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/tallies-used-as-social-displays-on-pacific-islands/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}]}, {"id": "era-6", "kind": "era", "title": "Era 6: Human Computers, Analog Machines & Theory", "sub": "1900 – 1940", "cards": [{"t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)", "b": "women \"computers\" classify hundreds of thousands of stars; Leavitt's computed relation lets us measure the universe.", "d": "1870s–1920s", "img": "media/cards/e8a791bd919e.webp", "cred": "Harvard University Archives · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AObservatory%20women%20computers%2C%201891.jpg"}, {"t": "Pearson and Lee's Height Correlation Chart", "d": "1900", "b": "The physical model on the left is a bivariate histogram showing the correlation between the heights of fathers (horizontal axis) and sons (\"vertical\" axis). This data was famously collected by Karl Pearson and Alice Lee between 1893 and 1898. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pearson-lee-height-correlation-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Crum Brown's Mathematical Surface", "d": "1900", "b": "Model by Alexander Crum Brown (1838-1922) of a half-twist mathematical surface, featuring a non-Euclidean so-called Klein bottle, c. 1900. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/browns-mathematical-surface/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Modern Solid Terrain Modeling", "d": "1900", "b": "The Institute of Cartography ETH Zurich published a great review of past and present techniques for doing solid terrain modeling. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-terrain-modeling-techniques/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Marconi's transatlantic wireless", "b": "the letter \"S\" crosses an ocean without wires; radio makes signals *broadcast* rather than routed.", "d": "1901", "img": "media/cards/b9e4859ab53e.webp", "cred": "Jonathan Adolf Wilhelm Zenneck · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ADrawing%20of%20Marconi%20Poldhu%20wireless%20station%201901.png"}, {"t": "Davenport's Physical Distributions", "d": "1901", "b": "In 1901, biologist Charles Davenport \"built\" physical visualizations that show the distributions of features of objects and people. These visualizations were made out of the objects and the people themselves. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/davenports-physical-distributions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Rubens Tube", "d": "1905", "b": "A Rubens tube, also known as a standing wave flame tube, or simply flame tube, is a physics apparatus for demonstrating acoustic standing waves in a tube. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/rubens-tube/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Pin Maps", "d": "1907", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pin-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Felix Klein names the \"double discontinuity\"", "b": "university mathematics and school mathematics fail to connect in either direction — the feedback loop that lets curricula lag the frontier by generations (Thread L); Klein founds the first international commission on mathematics teaching the same year.", "d": "1908"}, {"t": "Hilbert's program", "b": "23 problems, then the Entscheidungsproblem — can all mathematics be mechanically decided? \"We must know, we will know\": the dare that Gödel and Turing answer.", "d": "1900/1928"}, {"t": "Otlet's Mundaneum (Brussels)", "b": "12+ million index cards answering queries by mail and telegraph — a paper search engine; by 1934 Otlet sketches networked screens querying it remotely (Thread S).", "d": "1910", "img": "media/cards/0b2c2b80bf97.webp", "cred": "Zinneke · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Mundaneum_Tir%C3%A4ng_Karteikaarten.jpg"}, {"t": "A Trip Through New York City in 1911", "b": "", "kindc": "film", "slug": "4k-60-fps-a-trip-through-new-york-city-in-1911", "status": "live", "d": "1911", "img": "media/yt/hZ1OgQL9_Cw.jpg", "dur": 515, "by": "Denis Shiryaev", "v": "hZ1OgQL9_Cw", "emb": "https://www.youtube-nocookie.com/embed/hZ1OgQL9_Cw?rel=0", "url": "https://www.youtube.com/watch?v=hZ1OgQL9_Cw"}, {"t": "Torres Quevedo", "b": "a *working* chess endgame automaton (no hidden human this time), essays anticipating floating-point arithmetic, and a remotely commanded electromechanical calculator — Spain's forgotten bridge between Babbage and the electronic age.", "d": "1912–20"}, {"t": "Frankfurt Streetcar Load", "d": "1913", "b": "Strips of woods glued on top of each other convey the average number of passengers carried between two stops. Each strip corresponds to 4,000 passengers. Shown at the 1913 International building trade exhibition in Leipzig. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/frankfurt-streetcar-load/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Solid 3D Curves for Engineering", "d": "1914", "b": "In his 1914 book, Brinton discusses various techniques for building solid models of three-dimensional charts and functions for the purposes of engineering, and uses the two designs above as examples. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-3d-curves-for-engineering/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Wire Models of Factory Worker Movements", "d": "1915", "b": "3D wire models of hand motion paths (or chronocyclegraphs) created by Frank Gilbreth, a pioneer in the study of motion in the workplace. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/wire-models-of-factory-worker-movements/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Yakama Time Ball", "d": "1920", "b": "Women from the Yakama Native American tribe used strings of hemp as personal diaries. Each major event in their life was represented by a knot, a bead or a shell. This mnemonic device is called an Ititamat, or counting-the-days ball, or simply time ball. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/yakama-time-ball/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Richardson's \"forecast factory\"", "b": "a fantasy of 64,000 human computers in a vast hall predicting weather in real time — the dream ENIAC fulfills in 1950.", "d": "1922", "img": "media/cards/e6e89fe4a62e.webp", "cred": "Author Jonathan Lawhead\n\nIllustrator Francois Schuiten · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AArtist%E2%80%99s%20conception%20of%20Lewis%20Richardson%E2%80%99s%20forecast%20factory.jpg"}, {"t": "R.A. Fisher", "b": "design of experiments, significance testing, modern statistics — forged at an agricultural research station and now the operating system of empirical science (Thread P).", "d": "1920s"}, {"t": "Making Coal Gas and Coke", "b": "", "kindc": "film", "slug": "making-coal-gas-and-coke", "status": "live", "d": "1922", "img": "media/yt/a8TB17-04aE.jpg", "dur": 515, "by": "US Auto Industry", "v": "a8TB17-04aE", "emb": "https://www.youtube-nocookie.com/embed/a8TB17-04aE?rel=0", "url": "https://www.youtube.com/watch?v=a8TB17-04aE"}, {"t": "Electrical Transmission of Speech", "b": "", "kindc": "film", "slug": "electrical-transmission-of", "status": "live", "d": "1925", "img": "media/yt/ygwiwXO9avE.jpg", "dur": 683, "by": "AT&T Tech Channel", "v": "ygwiwXO9avE", "emb": "https://www.youtube-nocookie.com/embed/ygwiwXO9avE?rel=0", "url": "https://www.youtube.com/watch?v=ygwiwXO9avE"}, {"t": "Karsten's Tridimensional Chart", "d": "1926", "b": "American economist and statistician Karl G. Karsten patented a method for creating physical visualizations of temporal data by stacking two-dimensional plates, each representing a time period. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/karstens-tridimensional-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "1930's Electronic Music - The Variophone", "b": "", "kindc": "film", "slug": "1930s-electronic-music-the-variophone", "status": "live", "d": "1930", "img": "media/yt/4r4WqAf-X8Y.jpg", "dur": 330, "by": "Old Films and Stuff", "v": "4r4WqAf-X8Y", "emb": "https://www.youtube-nocookie.com/embed/4r4WqAf-X8Y?rel=0", "url": "https://www.youtube.com/watch?v=4r4WqAf-X8Y"}, {"t": "Mechanical Principles", "b": "", "kindc": "film", "slug": "mechanical-principles-1930", "status": "live", "d": "1930", "img": "media/yt/UwCdNvisa2M.jpg", "dur": 615, "by": "Split Negative", "v": "UwCdNvisa2M", "emb": "https://www.youtube-nocookie.com/embed/UwCdNvisa2M?rel=0", "url": "https://www.youtube.com/watch?v=UwCdNvisa2M", "via": "Split Negative"}, {"t": "Spectacular New York, Lower Manhattan Waterfront in the 1930's in color!", "b": "", "kindc": "film", "slug": "spectacular-new-york-lower-manhattan-waterfront", "status": "live", "d": "1930", "img": "media/yt/rN97y3gnl6s.jpg", "dur": 273, "by": "Rick88888888", "v": "rN97y3gnl6s", "emb": "https://www.youtube-nocookie.com/embed/rN97y3gnl6s?rel=0", "url": "https://www.youtube.com/watch?v=rN97y3gnl6s"}, {"t": "Mathematical Functions Embodied in Ballistic Cams", "d": "1930", "b": "These cams are solid models of bivariate and univariate mathematical functions plotted in cylindric coordinates (left and middle images) and polar coordinates (right image). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mathematical-functions-embodied-in-ballistic-cams/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Gödel's incompleteness theorems", "b": "any sufficiently rich formal system contains truths it cannot prove — mechanized reason has hard limits, discovered before the machines even arrive.", "d": "1931", "img": "media/cards/17144d1e5a0c.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A1925%20kurt%20g%C3%B6del.png"}, {"t": "Tide-predicting machines (Kelvin and successors)", "b": "analog gear-and-pulley computers used into the 1960s (including for D-Day planning).", "d": "1872–20th c.", "img": "media/cards/c7b576b4d69c.webp", "cred": "Steven Fine · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ATide%20Predicting%20Machine%20No.%202.jpg"}, {"t": "Naval fire-control computers (Dreyer Table, Ford Rangekeeper, the US Navy's Mark 1)", "b": "shipboard mechanical analog computers solving moving-target ballistics in real time; analog gunnery computers served at sea into the 1990s.", "d": "1912–1945", "img": "media/cards/e337ffef1c42.webp", "cred": "U.S. Navy, Bureau of Naval Personnel (Transfered by \n\nJostikas/Original uploaded · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3AMark%201A%20Fire%20Control%20Computer%20Controls.jpg"}, {"t": "Flying Down To Rio", "b": "", "kindc": "film", "slug": "flying-down-to-rio", "status": "live", "d": "1932", "img": "media/yt/DKVxiqa3Xzc.jpg", "dur": 156, "by": "British Pathé", "v": "DKVxiqa3Xzc", "emb": "https://www.youtube-nocookie.com/embed/DKVxiqa3Xzc?rel=0", "url": "https://www.youtube.com/watch?v=DKVxiqa3Xzc"}, {"t": "Flying Down To Rio - No. 2", "b": "", "kindc": "film", "slug": "flying-down-to-rio-no-2", "status": "live", "d": "1932", "img": "media/yt/tlnOFY0xRjY.jpg", "dur": 145, "by": "British Pathé", "v": "tlnOFY0xRjY", "emb": "https://www.youtube-nocookie.com/embed/tlnOFY0xRjY?rel=0", "url": "https://www.youtube.com/watch?v=tlnOFY0xRjY"}, {"t": "Lake Placid Olympics", "b": "", "kindc": "film", "slug": "lake-placid-1932-olympics", "status": "dead", "d": "1932", "img": "media/screen-shot-2014-11-09-at_360-41.png", "v": "wgPfp1FovSc", "emb": "https://www.youtube-nocookie.com/embed/wgPfp1FovSc?rel=0", "url": "https://www.youtube.com/watch?v=wgPfp1FovSc", "why": "Private video"}, {"t": "IBM's Cosmograph", "d": "1933", "b": "The left image above shows a physical flow chart (Sankey diagram) made of 1000 sheets of paper. It was not meant to be directly read, but to be photographed (see right image). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ibms-cosmograph/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Mining and Preparation of Anthracite Coal", "b": "", "kindc": "film", "slug": "mining-and-preparation-of-2", "status": "live", "d": "1934", "img": "media/screen-shot-2014-11-09-at_360-12.png", "v": "0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20", "emb": "https://archive.org/embed/0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20", "url": "https://archive.org/embed/0915_Mining_and_Preparation_of_Anthracite_Coal_00_29_35_20"}, {"t": "Hayward's Moon Model", "d": "1934", "b": "Illustrator and model-maker Roger Hayward (1899-1979) working on a model of the lunar surface for the Griffith Planetarium, 1934. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/haywards-moon-model/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Ford's Globe", "d": "1934", "b": "A large rotating relief globe showing Ford company's industrial sites around the word, exhibited at the Chicago World's Fair in 1934. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/fords-globe/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "3D Visualizations of Power Consumption", "d": "1935", "b": "A large 3D physical visualization made by the Detroit Edison Company showing electricity consumption for the year 1935, with a slice per day and each day split into 30 min intervals. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electricity-power-demand/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Vladimir Lukyanov's water integrator (USSR)", "b": "partial differential equations solved by water levels in interconnected glass tubes — originally for heat flow in concrete; mass-produced and used in Soviet engineering for decades (see Thread I).", "d": "1936"}, {"t": "Vannevar Bush's differential analyzer", "b": "room-sized analog computer solving differential equations.", "d": "1927–1931", "img": "media/cards/ab12269e6c2f.webp", "cred": "Daderot · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ADifferential%20analyzer%2C%20similar%20to%20that%20of%20Vannevar%20Bush%2C%20probably%20made%20by%20the%20Tokyo%20Imperial%20University%2C%201942%20-%20Ridai%20Museum%20of%20Modern%20Science%2C%20Tokyo%20-%20DSC07667.JPG"}, {"t": "WPA Mathematical Tables Project", "b": "hundreds of human computers employed during the Depression producing math tables.", "d": "1935–1938"}, {"t": "William & Elizebeth Friedman", "b": "the married founders of modern American cryptanalysis — Elizebeth breaks rum-runner and Nazi spy networks (credit classified for decades; the FBI took it); William's team breaks Japan's PURPLE machine (1940) without ever seeing one — reconstructing a computer from its outputs alone.", "d": "1920s–1940"}, {"t": "Alan Turing, \"On Computable Numbers\"", "b": "the universal machine; a precise definition of \"computation\" itself — and of its limits.", "d": "1936", "img": "media/cards/9af2ee76ebb7.webp", "cred": "Unknown photographer · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAlan%20Turing%20%281912-1954%29%20in%201936%20at%20Princeton%20University.jpg"}, {"t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)", "b": ".", "d": "1936", "img": "media/cards/8be9dc6cc72b.webp", "cred": "Charles Morton Strahan, author.  New England Magazine Corporation, publisher. · Public dom", "credurl": "https://commons.wikimedia.org/wiki/File%3AAlonzo%20Church%20%28University%20of%20Georgia%20President%29.jpg"}, {"t": "Spinning Levers - How A Transmission Works", "b": "", "kindc": "film", "slug": "spinning-levers-how-a-transmission-works", "status": "live", "d": "1936", "img": "media/yt/JOLtS4VUcvQ.jpg", "dur": 580, "by": "US Auto Industry", "v": "JOLtS4VUcvQ", "emb": "https://www.youtube-nocookie.com/embed/JOLtS4VUcvQ?rel=0", "url": "https://www.youtube.com/watch?v=JOLtS4VUcvQ"}, {"t": "Claude Shannon's master's thesis", "b": "Boolean algebra = switching circuits. Logic becomes hardware.", "d": "1937", "img": "media/cards/a826cc730e52.webp", "cred": "Unknown authorUnknown author · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File:C.E._Shannon._Tekniska_museet_43069_%282x3_crop%29.jpg"}, {"t": "1930s How Photographs Were Transmitted by Wire: Spot News - CharlieDeanArchives", "b": "", "kindc": "film", "slug": "1930s-how-photographs-were-transmitted-by-wire-s", "status": "live", "d": "1937", "img": "media/yt/cLUD_NGE370.jpg", "dur": 555, "by": "Charlie Dean Archives", "v": "cLUD_NGE370", "emb": "https://www.youtube-nocookie.com/embed/cLUD_NGE370?rel=0", "url": "https://www.youtube.com/watch?v=cLUD_NGE370"}, {"t": "Konrad Zuse: Z1–Z3", "b": "the Z3 (1941) is the first working programmable, fully automatic digital computer (binary, electromechanical).", "d": "1938–1941", "img": "media/cards/75c8664963af.webp", "cred": "Wolfgang Hunscher, Dortmund · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKonrad%20Zuse%20%281992%29.jpg"}, {"t": "More Power to You", "b": "", "kindc": "film", "slug": "more-power-to-you-1930s", "status": "live", "d": "1938", "img": "media/yt/ux-MUNkx1MU.jpg", "dur": 548, "by": "JamHandyOrganization", "v": "ux-MUNkx1MU", "emb": "https://www.youtube-nocookie.com/embed/ux-MUNkx1MU?rel=0", "url": "https://www.youtube.com/watch?v=ux-MUNkx1MU", "via": "JamHandyOrganization"}, {"t": "The Voder: 1939, the worlds first electronic voice synthesizer", "b": "", "kindc": "film", "slug": "the-voder-1939-the-worlds-first-electronic-voice", "status": "live", "d": "1939", "img": "media/yt/TsdOej_nC1M.jpg", "dur": 377, "by": "Brian Roemmele", "v": "TsdOej_nC1M", mb": "https://www.youtube-nocookie.com/embed/tEaYmP7lMyY?rel=0", "url": "https://www.youtube.com/watch?v=tEaYmP7lMyY", "via": "A/V Geeks 16mm Films"}, {"t": "Stedman's 3D Periodic Table", "d": "1940", "b": "Dr. Don Stedman from the National Research Council Canada designed this 3-D periodic table in the 1940s. Stedman considered many factors and characteristics of the elements as he designed his models. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/3d-periodic-table/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "It Happened in the Kitchen, Part 1 - ca. 1941", "b": "", "kindc": "film", "slug": "it-happened-in-the-kitchen-part-1-ca-1941", "status": "live", "d": "1941", "img": "media/yt/ndhcaVMawrI.jpg", "dur": 990, "by": "miSci - museum of innovation and science", "v": "ndhcaVMawrI", "emb": "https://www.youtube-nocookie.com/embed/ndhcaVMawrI?rel=0", "url": "https://www.youtube.com/watch?v=ndhcaVMawrI"}, {"t": "Traffic Flow Profiles of the Interregional Highway System", "d": "1941", "b": "2D area diagrams encoding average daily traffic as height and color are set up along their respective highways on a background map of the US. Background map seems to be a cut-out wooden panel; area diagrams potentially cardboard, or also wood veneer. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/traffic-flow-profiles-of-the-interregional-highway-system/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Atanasoff–Berry Computer", "b": "first electronic digital calculating device (not programmable).", "d": "1942", "img": "media/cards/db62ddeb6169.webp", "cred": "Ik T from Kanagawa, Japan · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAtanasoff-Berry%20Computer%20%E3%83%BC%20Computer%20History%20Museum%20%2830781535612%29.jpg"}, {"t": "Colossus (Bletchley Park)", "b": "first programmable electronic computer, breaking German ciphers; after the war most are dismantled and the drawings burned by order — secret for 30 years, full details classified until 2000.", "d": "1943–44", "img": "media/cards/0d7bcd840549.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AColossus.jpg"}, {"t": "SIGSALY", "b": "the first secure digital voice system (and first PCM transmission) — 50-ton terminals carrying Churchill–Roosevelt calls; its existence stayed secret until 1976.", "d": "1943", "img": "media/cards/fa97e0b9726c.webp", "cred": "ArnoldReinhold · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASIGSALY%20synchronizer%20at%20National%20Cryptologic%20Museum.agr.jpg"}, {"t": "Turing's Delilah", "b": "a portable encrypted-voice machine Turing built in near-total secrecy; the technical report wasn't released for nearly 70 years.", "d": "1943–45", "img": "media/cards/cb908874024c.webp", "cred": "Elliott &amp; Fry · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Alan_turing_header.jpg"}, {"t": "Electronics At Work", "b": "", "kindc": "film", "slug": "electronics-at-work-1943", "status": "live", "d": "1943", "img": "media/yt/4uYNe40igWM.jpg", "dur": 1275, "by": "US Auto Industry", "v": "4uYNe40igWM", "emb": "https://www.youtube-nocookie.com/embed/4uYNe40igWM?rel=0", "url": "https://www.youtube.com/watch?v=4uYNe40igWM", "via": "US Auto Industry"}, {"t": "Electronics at Work - 1943", "b": "", "kindc": "film", "slug": "electronics-at-work-1943-2", "status": "live", "d": "1943", "img": "media/yt/hwutHPYGgfU.jpg", "dur": 1277, "by": "GBPPR2", "v": "hwutHPYGgfU", "emb": "https://www.youtube-nocookie.com/embed/hwutHPYGgfU?rel=0", "url": "https://www.youtube.com/watch?v=hwutHPYGgfU"}, {"t": "Sound Recording and Reproduction (Sound on Film)", "b": "", "kindc": "film", "slug": "sound-recording-and-reproduction-sound-on-film", "status": "live", "d": "1943", "img": "media/yt/h2ilHhJspi8.jpg", "dur": 639, "by": "maantube", "v": "h2ilHhJspi8", "emb": "https://www.youtube-nocookie.com/embed/h2ilHhJspi8?rel=0", "url": "https://www.youtube.com/watch?v=h2ilHhJspi8"}, {"t": "Dymaxion Map & Folding Globe", "d": "1943", "b": "“Also know as the “Dymaxion Map,” the Fuller Projection Map is the only flat map of the entire surface of the Earth which reveals our planet as one island in one ocean, without any visually obvious distortion of the relative shapes and sizes of the land areas,… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/dymaxion-map/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "D-Day's tides", "b": "Arthur Doodson computes invasion tides on Kelvin-type tide-predicting machines from anonymized harmonic constants for a location he knows only as \"Position Z\" — the computer wasn't cleared to know it was Normandy.", "d": "1944", "img": "media/cards/1fbcdbf9688d.webp", "cred": "Chief Photographer's Mate (CPHoM) Robert F. Sargent · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Into_the_Jaws_of_Death_23-0455M_edit.jpg"}, {"t": "Harvard Mark I (Aiken/IBM)", "b": "electromechanical giant; Grace Hopper programs it; the famous \"bug\" (an actual moth) comes later on Mark II.", "d": "1944", "img": "media/cards/a3dfdd60ca22.webp", "cred": "Capvideo · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAiken-IBM%20Automatic%20Sequence%20Controlled%20Calculator.jpg"}, {"t": "ENIAC", "b": "~5,000 additions per second — a thousand times faster than any person. Programmed by six women (Jean Bartik, Betty Holberton, et al.) whose work went unrecognized for decades.", "d": "1945", "img": "media/cards/6b326c792b4b.webp", "cred": "United States Army · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATwo%20women%20operating%20ENIAC.gif"}, {"t": "ENIAC's first real job (classified)", "b": "hydrogen-bomb feasibility calculations on a million punched cards; at Los Alamos, von Neumann and Ulam's **Monte Carlo method** is born classified, following wartime rooms of human computers and Feynman's punched-card \"assembly line.\"", "d": "1945–46", "img": "media/cards/9130d76c2c2e.webp", "cred": "The original uploader was TexasDex at English Wikipedia. · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:ENIAC_Penn1.jpg"}, {"t": "von Neumann's EDVAC report", "b": "the stored-program architecture nearly every computer still uses.", "d": "1945", "img": "media/cards/87085dc4e489.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AOppenheimer%20%26%20Neumann.jpg"}, {"t": "Electron Density Map and Molecular Model of Penicillin", "d": "1945", "b": "Electron density map and model of Penicillin created by Dorothy Crowfoot Hodgkin in 1945 based on her work on X-ray crystallography. The Penicillin molecule was the first molecule whose structure was derived entirely from X-ray data. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electron-density-map-and-molecular-model-of-penicillin/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Manchester Baby (1948) & EDSAC (1949)", "b": "first stored-program computers actually running.", "d": "1946–49", "img": "media/cards/d17bb5feab72.webp", "cred": "Geni · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AManchester%20baby%20head%20on.JPG"}, {"t": "Election Microscope", "b": "", "kindc": "film", "slug": "election-microscope", "status": "live", "d": "1946", "img": "media/yt/PAsjs0HNmwg.jpg", "dur": 59, "by": "British Pathé", "v": "PAsjs0HNmwg", "emb": "https://www.youtube-nocookie.com/embed/PAsjs0HNmwg?rel=0", "url": "https://www.youtube.com/watch?v=PAsjs0HNmwg"}, {"t": "Television and Telephone", "b": "", "kindc": "film", "slug": "television-and-telephone", "status": "live", "d": "1946", "img": "media/yt/XWwV4Hc-Nkc.jpg", "dur": 338, "by": "AT&T Tech Channel", "v": "XWwV4Hc-Nkc", "emb": "https://www.youtube-nocookie.com/embed/XWwV4Hc-Nkc?rel=0", "url": "https://www.youtube.com/watch?v=XWwV4Hc-Nkc", "via": "AT&T Tech Channel"}, {"t": "Gasoline for Everybody", "b": "", "kindc": "film", "slug": "gasoline-for-everybody-1947", "status": "live", "d": "1947", "img": "media/yt/pdgvhs2QAig.jpg", "dur": 793, "by": "Prelinger Archives Official", "v": "pdgvhs2QAig", "emb": "https://www.youtube-nocookie.com/embed/pdgvhs2QAig?rel=0", "url": "https://www.youtube.com/watch?v=pdgvhs2QAig", "via": "Prelinger Archives Official"}, {"t": "General Electric in 1947, Part 2 - 1948", "b": "", "kindc": "film", "slug": "general-electric-in-1947-part-2-1948", "status": "live", "d": "1947", "img": "media/yt/uTCZVmnbePs.jpg", "dur": 1430, "by": "miSci - museum of innovation and science", "v": "uTCZVmnbePs", "emb": "https://www.youtube-nocookie.com/embed/uTCZVmnbePs?rel=0", "url": "https://www.youtube.com/watch?v=uTCZVmnbePs"}, {"t": "Dorothy Hodgkin's Electron Density Contours", "d": "1947", "b": "Nobel prize winning crystallographer Dorothy Crowfoot Hodgkin created another physical visualization in the mid 1940's, showing part of the structure of penicillin. An original of this artifact is in the Oxford Museum of the History of Science. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/electron-density-contours/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Advances in Photography \" Cameras Lenses High Speed Motion Pictures 1948 Film XD35402z", "b": "", "kindc": "film", "slug": "advances-in-photography-cameras-lenses-high-spee", "status": "live", "d": "1948", "img": "media/yt/m-C1q1cLu7E.jpg", "dur": 1585, "by": "PeriscopeFilm", "v": "m-C1q1cLu7E", "emb": "https://www.youtube-nocookie.com/embed/m-C1q1cLu7E?rel=0", "url": "https://www.youtube.com/watch?v=m-C1q1cLu7E"}, {"t": "Bottle of Magic", "b": "", "kindc": "film", "slug": "bottle-of-magic", "status": "live", "d": "1948", "img": "media/yt/S6IeuC8DSvg.jpg", "dur": 807, "by": "AT&T Tech Channel", "v": "S6IeuC8DSvg", "emb": "https://www.youtube-nocookie.com/embed/S6IeuC8DSvg?rel=0", "url": "https://www.youtube.com/watch?v=S6IeuC8DSvg"}, {"t": "UCLA's Mechanical Brain: 1948", "b": "", "kindc": "film", "slug": "uclas-mechanical-brain-1948", "status": "live", "d": "1948", "img": "media/yt/hIinz4fKGpo.jpg", "dur": 180, "by": "danieljbmitchell", "v": "hIinz4fKGpo", "emb": "https://www.youtube-nocookie.com/embed/hIinz4fKGpo?rel=0", "url": "https://www.youtube.com/watch?v=hIinz4fKGpo"}, {"t": "The MONIAC (Bill Phillips, LSE)", "b": "the national economy simulated hydraulically — income, taxes, savings, and imports as colored water flowing through tanks and valves; about 14 were built for universities and central banks.", "d": "1949", "img": "media/cards/0ee9ce895564.webp", "cred": "Unlisted/Unknown · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3APhillips%20and%20MONIAC%20LSE.jpg"}, {"t": "The transistor (Bardeen, Brattain, Shockley at Bell Labs)", "b": ".", "d": "1947", "img": "media/cards/4f8cfa5e9be3.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2N1307%20transistor%20die%20with%20bond%20wires%20attached.jpg"}, {"t": "Shannon's \"A Mathematical Theory of Communication\"", "b": "the bit; information becomes a quantity.", "d": "1948", "img": "media/cards/3e5bb686255a.webp", "cred": "Claude E. Shannon and Warren Weaver · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Mathematical%20Theory%20Of%20Communication%20title%20page.jpg"}, {"t": "The Curta", "b": "a pocket-sized mechanical calculator of astonishing precision, designed by Curt Herzstar al principles using colored water flowing in transparent pipes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/moniac-a-hydromechanical-machine-to-teach-economics/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Hamming codes", "b": "error-*correcting* codes, born of weekend frustration with crashing punched-card runs — mathematics that lets messages heal themselves; Reed–Solomon codes (1960) later shield everything from CDs to deep-space probes.", "d": "1950", "img": "media/cards/945040299d66.webp", "cred": "TranvanKhanh · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHamming%20Code%20%28Fail%29.jpg"}, {"t": "McCulloch & Pitts", "b": "neurons modeled as logic gates — the paper von Neumann cites in the EDVAC report; brains and computers become each other's mirrors.", "d": "1943", "img": "media/cards/a6d4ae3d7b45.webp", "cred": "AnonymousUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAllan%20Riverstone%20McCulloch%20portrait%20cropped.jpg"}, {"t": "Vannevar Bush's Memex (\"As We May Think\")", "b": "an imagined desk that links documents by association — the essay that inspires Engelbart, Nelson, and ultimately HyperCard and the Web (Thread S).", "d": "1945", "img": "media/cards/21f99dec13fd.webp", "cred": "Time Inc. · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Memex%20%283002477109%29.jpg"}, {"t": "Wiener's *Cybernetics", "b": "*: feedback and control unify machines, animals, and organizations — a surprise bestseller that makes \"thinking machines\" a public question.", "d": "1948", "img": "media/cards/6e7adfa48a31.webp", "cred": "unknown\n\nGerd Küveler (reproduction) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AWiki%20Loves%20Jules%20Verne%20Norbert%20Wiener%20Cybernetics%201948%20%28Gerd%20Kueveler%29.jpg"}, {"t": "ENIAC comp xt desk had been doing — and the history of computing has to be rewritten.", "d": "1974", "img": "media/cards/5fbeb918bc48.webp", "cred": "Elgaard · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:EnigmaMachine_Warzawa.jpg"}, {"t": "Integrated circuit (Kilby, Noyce)", "b": ".", "d": "1958–59", "img": "media/cards/6f28d4694ea2.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A07R01.jpg"}, {"t": "The golden age of electronic analog computers", "b": "patch-panel machines built from op-amps (\"operational\" = performing mathematical operations) solve differential equations for aerospace and industry — often faster than early digital machines; fluidic logic (gates made of nothing but jets and channels) computes with air and water, no electronics at all; hybrid analog–digital installations linger into the 1980s.", "d": "1950s–60s"}, {"t": "NASA's human computers (Katherine Johnson, Dorothy Vaughan, Mary Jackson)", "b": "trajectories computed by hand; John Glenn asks Johnson to *check the electronic computer's numbers by hand* before flying — the handoff moment between human and machine computation.", "d": "1950s–60s", "img": "media/cards/3c470d4f4157.webp", "cred": "NACA (NASA) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Human_computers_-_Dryden.jpg"}, {"t": "IBM System/360", "b": "the mainframe standard; BASIC brings programming to students.", "d": "1964", "img": "media/cards/d00d08b2b3e0.webp", "cred": "Sandstein · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIBM%20system%20360-50%20console%20-%20MfK%20Bern.jpg"}, {"t": "Moore's Law", "b": "stated: transistor counts double roughly every two years.", "d": "1965", "img": "media/cards/567a26ea2f6b.webp", "cred": "Max Roser, Hannah Ritchie · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AMoore%27s%20Law%20Transistor%20Count%201970-2020.png"}, {"t": "Engelbart's \"Mother of All Demos\"", "b": "mouse, windows, hypertext, video calls — in one demo.", "d": "1968", "img": "media/cards/b4d5ea26b254.webp", "cred": "SRI International · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:SRI_Douglas_Engelbart_1968.jpg"}, {"t": "Computer algebra begins (Macsyma)", "b": "machines now do *symbolic* mathematics — algebra and calculus, not just arithmetic.", "d": "1968–71"}, {"t": "ARPANET", "b": "computers begin talking to each other — built on packet switching (Baran, Davies): messages chopped into independently routed fragments; email (1971) becomes the surprise killer app; TCP/IP (designed 1974, adopted 1983) becomes the internet's common tongue.", "d": "1969", "img": "media/cards/f7062bed0237.webp", "cred": "Semaforo GMS · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AArpanet%20in%20the%201970s.png"}, {"t": "Intel 4004", "b": "the microprocessor — a computer on a chip.", "d": "1971", "img": "media/cards/a0f9ccb9205c.webp", "cred": "Stelo.xyz, Pttn, or Thomas Nguyen · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Intel_C4004.jpg"}, {"t": "HP-35 pocket scientific calculator", "b": "the slide rule dies within a decade. C and Unix are born the same era.", "d": "1972", "img": "media/cards/3f7e86f30320.webp", "cred": "Seth Morabito · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AHP%2035%20Calculator.jpg"}, {"t": "Faces and Body Parts - First talking polygonal human", "b": "", "kindc": "film", "slug": "faces-and-body-parts-first-talking-polygonal-hum", "status": "live", "d": "1974", "img": "media/yt/_kElpJjW8Yk.jpg", "dur": 221, "by": "Ultimate History of CGI", "v": "_kElpJjW8Yk", "emb": "https://www.youtube-nocookie.com/embed/_kElpJjW8Yk?rel=0", "url": "https://www.youtube.com/watch?v=_kElpJjW8Yk"}, {"t": "Jacque Fresco - Introduction to Sociocyberneering - Larry King", "b": "", "kindc": "film", "slug": "jacque-fresco-introduction-to-sociocyberneering", "status": "live", "d": "1974", "img" ry side arguing, mostly without the history, about a 4,000-year-old question (Thread L).", "d": "1989–2000s"}, {"t": "World Wide Web", "b": "goes public (Berners-Lee, 1989 proposal).", "d": "1991"}, {"t": "The Crypto Wars", "b": "strong encryption legally classed as a *munition*; PGP's Phil Zimmermann under criminal investigation for \"exporting\" code; RSA printed on T-shirts as civil disobedience; the Clipper chip's key-escrow scheme defeated — mathematics itself contested as a weapon.", "d": "1990s"}, {"t": "Shor's algorithm", "b": "a quantum computer could factor huge numbers efficiently — threatening RSA and igniting the race to build one.", "d": "1994"}, {"t": "Leonard Adleman's DNA computer", "b": "a seven-city Hamiltonian-path problem solved by molecules in a test tube — biochemistry as processor.", "d": "1994"}, {"t": "Are YOU Ready for the INTERNET? | Tomorrow's World | Retro Tech", "b": "", "kindc": "film", "slug": "are-you-ready-for-the-internet-tomorrows-world-r", "status": "live", "d": "1994", "img": "media/yt/XpZ5STahhPE.jpg", "dur": 308, "by": "BBC Archive", "v": "XpZ5STahhPE", "emb": "https://www.youtube-nocookie.com/embed/XpZ5STahhPE?rel=0", "url": "https://www.youtube.com/watch?v=XpZ5STahhPE"}, {"t": "Danny Hillis: Back to the future (of 1994)", "b": "", "kindc": "film", "slug": "danny-hillis-back-to-the-future-of-1994", "status": "live", "d": "1994", "img": "media/yt/gdg4mU-wuhI.jpg", "dur": 1150, "by": "TED", "v": "gdg4mU-wuhI", "emb": "https://www.youtube-nocookie.com/embed/gdg4mU-wuhI?rel=0", "url": "https://www.youtube.com/watch?v=gdg4mU-wuhI"}, {"t": "Fermat's Last Theorem - LMS 1994", "b": "", "kindc": "film", "slug": "fermats-last-theorem-lms-1994", "status": "live", "d": "1994", "img": "media/yt/N1Zn4ZqoIeE.jpg", "dur": 1573, "by": "Imperial College London", "v": "N1Zn4ZqoIeE", "emb": "https://www.youtube-nocookie.com/embed/N1Zn4ZqoIeE?rel=0", "url": "https://www.youtube.com/watch?v=N1Zn4ZqoIeE"}, {"t": "The Complete Animator - With Fred >List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "GIMPS", "b": "the Great Internet Mersenne Prime Search — volunteers' idle PCs hunt primes of the form 2^p−1, and nearly every record prime since is one; SETI@home (1999) takes distributed volunteer computing mainstream. The friar of *Harmonie universelle* is still on computation's leaderboard (Thread T).", "d": "1996"}, {"t": "Bill Gates", "b": "", "kindc": "film", "slug": "1996-bill-gates", "status": "live", "d": "1996", "img": "media/yt/M1EsIusQJQM.jpg", "dur": 3308, "by": "zarjesve", "v": "M1EsIusQJQM", "emb": "https://www.youtube-nocookie.com/embed/M1EsIusQJQM?rel=0", "url": "https://www.youtube.com/watch?v=M1EsIusQJQM"}, {"t": "Computer Pioneers", "b": "", "kindc": "film", "slug": "1996-computer-pioneers", "status": "live", "d": "1996", "img": "media/yt/qundvme1Tik.jpg", "dur": 3206, "by": "Computer History Museum", "v": "qundvme1Tik", "emb": "https://www.youtube-nocookie.com/embed/qundvme1Tik?rel=0", "url": "https://www.youtube.com/watch?v=qundvme1Tik"}, {"t": "Silicon Vision Misha Mahowald", "b": "", "kindc": "film", "slug": "1996-silicon-vision-misha", "status": "live", "d": "1996", "img": "media/screen-shot-2015-11-15-at_med.png", "v": "x28ktma", "emb": "https://www.dailymotion.com/embed/video/x28ktma", "url": "https://www.dailymotion.com/embed/video/x28ktma"}, {"t": "Tomorrow's World 1996 - 30-line TV restored from 1927-28 and 1933", "b": "", "kindc": "film", "slug": "tomorrows-world-1996-30-line-tv-restored-from-19", "status": "live", "d": "1996", "img": "media/yt/Rg6Qtdz6cwQ.jpg", "dur": 386, "by": "TVDawn", "v": "Rg6Qtdz6cwQ", "emb": "https://www.youtube-nocookie.com/embed/Rg6Qtdz6cwQ?rel=0", "url": "https://www.youtube.com/watch?v=Rg6Qtdz6cwQ"}, {"t": "Triumph of the Nerds", "b": "", "kindc": "film", "slug": "1996-triumph-of-the-nerds", "status": "live", "d": "1996", "img": "media/yt/rr9lmaEfhY4.jpg", "dur": 9122, "by": "EggHead", "v": "rr9 a (大島芳樹)", "v": "0Rin0fCE9nM", "emb": "https://www.youtube-nocookie.com/embed/0Rin0fCE9nM?rel=0", "url": "https://www.youtube.com/watch?v=0Rin0fCE9nM"}, {"t": "WDR Computernacht - Teil 1 - Das Elektronengehirn und seine Entwicklung", "b": "", "kindc": "film", "slug": "wdr-computernacht-teil-1-das-elektronengehirn-un", "status": "blocked", "img": "media/yt/l1WVuDZYd1c.jpg", "dur": 2381, "by": "Bratislav Metulskie ॐ", "v": "l1WVuDZYd1c", "emb": "https://www.youtube-nocookie.com/embed/l1WVuDZYd1c?rel=0", "url": "https://www.youtube.com/watch?v=l1WVuDZYd1c"}, {"t": "What is the Torpedo Data Computer?", "b": "", "kindc": "film", "slug": "what-is-the-torpedo-data-computer", "status": "live", "img": "media/yt/qJqSH8gf5Ig.jpg", "dur": 230, "by": "Independence Seaport Museum", "v": "qJqSH8gf5Ig", "emb": "https://www.youtube-nocookie.com/embed/qJqSH8gf5Ig?rel=0", "url": "https://www.youtube.com/watch?v=qJqSH8gf5Ig"}, {"t": "When Computers Were Human", "b": "", "kindc": "film", "slug": "when-computers-were-human", "status": "live", "img": "media/yt/YwqltwvPnkw.jpg", "dur": 4532, "by": "Computer History Museum", "v": "YwqltwvPnkw", "emb": "https://www.youtube-nocookie.com/embed/YwqltwvPnkw?rel=0", "url": "https://www.youtube.com/watch?v=YwqltwvPnkw"}, {"t": "Where DO screws come from?", "b": "", "kindc": "film", "slug": "where-do-screws-come-from", "status": "live", "img": "media/yt/yzMU8rH4PN8.jpg", "dur": 1112, "by": "Machine Thinking", "v": "yzMU8rH4PN8", "emb": "https://www.youtube-nocookie.com/embed/yzMU8rH4PN8?rel=0", "url": "https://www.youtube.com/watch?v=yzMU8rH4PN8"}, {"t": "Who invented the computer? - Babbage's Contribution", "b": "", "kindc": "film", "slug": "who-invented-the-computer-babbages-contribution", "status": "live", "img": "media/yt/woPbln-VmiM.jpg", "dur": 214, "by": "Raj Reddy", "v": "woPbln-VmiM", "emb": "https://www.youtube-nocookie.com/embed/woPbln-VmiM?rel=0", "url": "https://www.youtube.com/watch?v=woPbln-VmiM"}, {"t": "Why the Soviet Computer Failed", "b": "", "kindc": "film", "slug": "why-the-soviet-computer-failed", "status": "live", "img": "media/yt/dnHdqPBrtH8.jpg", "dur": 1137, "by": "Asianometry", "v": "dnHdqPBrtH8", "emb": "https://www.youtube-nocookie.com/embed/dnHdqPBrtH8?rel=0", "url": "https://www.youtube.com/watch?v=dnHdqPBrtH8"}, {"t": "Yesterday's Computer of Tomorrow: The Xerox Alto │Smalltalk-76 Demo", "b": "", "kindc": "film", "slug": "yesterdays-computer-of-tomorrow-the-xerox-alto-s", "status": "live", "img": "media/yt/NqKyHEJe9_w.jpg", "dur": 1008, "by": "Computer History Museum", "v": "NqKyHEJe9_w", "emb": "https://www.youtube-nocookie.com/embed/NqKyHEJe9_w?rel=0", "url": "https://www.youtube.com/watch?v=NqKyHEJe9_w"}, {"t": "Your World, Your Newton - '90s Apple Promo Video", "b": "", "kindc": "film", "slug": "your-world-your-newton-90s-apple-promo-video", "status": "live", "img": "media/yt/SQqQwauidKw.jpg", "dur": 817, "by": "Blake Patterson", "v": "SQqQwauidKw", "emb": "https://www.youtube-nocookie.com/embed/SQqQwauidKw?rel=0", "url": "https://www.youtube.com/watch?v=SQqQwauidKw"}, {"t": "東京理科大 微分解析機", "b": "", "kindc": "film", "slug": "film", "status": "live", "img": "media/yt/L84rSHTd3OY.jpg", "dur": 165, "by": "Kazumichi Moriyama", "v": "L84rSHTd3OY", "emb": "https://www.youtube-nocookie.com/embed/L84rSHTd3OY?rel=0", "url": "https://www.youtube.com/watch?v=L84rSHTd3OY"}]}, {"id": "thread-A", "kind": "thread", "title": "Thread A: The Speed Ladder", "sub": "the emotional core of the site", "cards": [{"t": "Overview", "b": "Approximate sustained arithmetic rates, for direct comparison cards:"}, {"t": "Human with pencil", "b": "~0.01–0.05 operations/sec (a multi-digit multiplication takes ~20–60 s)", "img": "media/cards/6d7fae31b289.webp", "cred": "Graphophile · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3APencil%20over%20the%20line.jpg"}, {"t": "Skilled abacus operator", "b": "~1 op/sec bursts", "img": "media/cards/70b274bfcf54.webp", "cred": "Pearson Scott Foresman · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Abacus_%28PSF%29.png"}, {"t": "de Prony's table project", "b": "~100 human computers for years → millions of table entries", "img": "media/cards/1e759747f684.webp", "cred": "Gaspard de Prony · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Gaspard_de_Prony.jpg"}, {"t": "Mechanical desk calculator", "b": "~0.1–0.5 ops/sec", "img": "media/cards/9b27c7a45e17.webp", "cred": "Ezrdr · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Mechanical_calculators_Keyboards.png"}, {"t": "ENIAC (1945)", "b": "~5×10³ additions/sec", "img": "media/cards/2e7957ef3de2.webp", "cred": "United States Army · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ATwo%20women%20operating%20ENIAC.gif"}, {"t": "IBM System/360 (1964)", "b": "~10⁵–10⁶ ops/sec", "img": "media/cards/c9454d17bbb3.webp", "cred": "Sandstein · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIBM%20system%20360-50%20console%20-%20MfK%20Bern.jpg"}, {"t": "Cray-1 (1976)", "b": "~1.6×10⁸ FLOP/s", "img": "media/cards/f38daf38e2fb.webp", "cred": "Rama · CC BY-SA 2.0 fr", "credurl": "https://commons.wikimedia.org/wiki/File%3ACray%201%20IMG%209126.jpg"}, {"t": "Intel Pentium (1993)", "b": "~10⁸", "img": "media/cards/5f1d507c0c67.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3APentium%20III%20SL4CB.jpg"}, {"t": "Smartphone (2020s)", "b": "~10¹¹–10¹²", "img": "media/cards/ca8ffa11359c.webp", "cred": "Sage Ross · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Wikipedia_homepage_on_a_large_Android_phone%2C_2015-04-16.jpg"}, {"t": "Single modern AI GPU", "b": "~10¹⁴–10¹⁵ FLOP/s"}, {"t": "Frontier/exascale cluster", "b": ">10¹⁸ FLOP/s"}, {"t": "One frontier AI training run", "b": "~10²⁵–10²⁶ total FLOPs"}, {"t": "The punchline card", "b": "a student doing one operation per second, nonstop, would need vastly longer than the age of the universe (~4×10¹⁷ seconds) to perform the arithmetic of a single modern AI training run — yet every one of those operations is the same kind of arithmetic the student practices by hand."}]}, {"id": "thread-B", "kind": "thread", "title": "Thread B: Human Computers", "sub": "", "cards": [{"t": "Overview", "b": "Tally-keepers → scribes → table-makers → de Prony's pyramid → Harvard Observatory women → WPA project → Bletchley → ENIAC programmers → NASA's hidden figures → \"computer\" stops meaning a person (~1950s)."}]}, {"id": "thread-C", "kind": "thread", "title": "Thread C: Ideas", "sub": "the mathematics itself", "cards": [{"t": "Overview", "b": "Positional notation → zero → algorithms (al-Khwarizmi) → logarithms → binary → Boolean logic → computability (Turing/Church) → information theory (Shannon) → complexity theory (P vs NP, 1971 Cook) → machine proof."}]}, {"id": "thread-D", "kind": "thread", "title": "Thread D: Machines", "sub": "", "cards": [{"t": "Overview", "b": "Tally bone → abacus → Antikythera → astrolabe → Pascaline → Jacquard loom → Analytical Engine → tabulators → analog computers → ENIAC → transistor → IC → microprocessor → GPU → AI accelerators."}]}, {"id": "thread-E", "kind": "thread", "title": "Thread E: Why Learn It by Hand?", "sub": "pedagogical cards", "cards": [{"t": "Every era's mathematicians practiced the previous era's methods.", "b": "Every era's mathematicians practiced the previous era's methods."}, {"t": "Estimation and error-checking (Glenn trusting Johnson over the machine…", "b": "Estimation and error-checking (Glenn trusting Johnson over the machine)."}, {"t": "Understanding what the machine does 10²⁵ times.", "b": "Understanding *what* the machine does 10²⁵ times."}, {"t": "The tradition argument", "b": "hand arithmetic connects a student to the Ishango bone.", "img": "media/cards/f386082877b8.webp", "cred": "Gill, John · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20argument%20from%20apostolic%20tradition%20Fleuron%20T014010-2.png"}, {"t": "The internalization argument", "b": "soroban masters prove that a deeply practiced tool becomes a mental faculty (see Thread H2 — anzan)."}]}, {"id": "thread-F", "kind": "thread", "title": "Thread F: What Is a Number?", "sub": "cross-cultural conceptions of number & data", "cards": [{"t": "Egypt — number as measure. Number lives in physical quantities", "b": "the cubit (length), setat (area), hekat (grain volume), deben (weight), the 365-day civil calendar (time). Unit fractions exist for fair division — how to split 7 loaves among 10 workers. Mathematics is a scribe's craft, taught by worked example, validated by *working*: \"the correct method of reckoning.\"", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Greece — number as idea. Sharp split between arithmos (a multitude…", "b": "*Greece — number as idea.* Sharp split between *arithmos* (a multitude of discrete units) and *megethos* (continuous magnitude), and between *logistikē* (mere reckoning — low prestige, left to slaves and merchants) and *arithmētikē* (theory of number — philosophy). Mathematics is validated by *proof*: it must be shown to be necessarily true.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "The twist", "b": "* Herodotus reports the Greeks learned geometry from Egyptian rope-stretchers. Measurement became abstraction; the surveyor's craft became the philosopher's object.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Contrast cards", "b": "* procedure vs. proof · scribe vs. philosopher · \"does it work?\" vs. \"why must it be true?\" · number embedded in things vs. number as a thing itself.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Payoff card for students", "b": "* every math student recapitulates both traditions — first you *compute* like an Egyptian scribe, then you learn to *prove* like a Greek. Both are the tradition.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Mesopotamia", "b": "* no single \"number\" at first — separate metrological systems for grain, land, silver, and time; the abstract sexagesimal system emerges from bureaucracy. Our hours, minutes, and degrees are its living fossil.", "ch": "Other conception-of-number cards", "img": "media/cards/5503bd2a63e8.webp", "cred": "SpeakingArch · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AClay%20Envelope%20%2C%20c.2034%20BCE%2C%20Umma%2C%20Mesopotamia.%20Currently%20at%20the%20RAMM%2C%20Exeter.jpg"}, {"t": "China", "b": "* number as a physical rod on a counting board — manipulable, spatial; negative numbers simply rods of another color.", "ch": "Other conception-of-number cards", "img": "media/cards/fd8fda3788d2.webp", "cred": "CEphoto, Uwe Aranas · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ABadaling%20China%20Great-Wall-of-China-01.jpg"}, {"t": "India", "b": "* numbers as Sanskrit words and verse (mathematics recited and memorized); zero and the infinite admitted as legitimate objects of calculation.", "ch": "Other conception-of-number cards", "img": "media/cards/e212305c07b9.webp", "cred": "Dennis G. Jarvis · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIndia-0037%20-%20Flickr%20-%20archer10%20%28Dennis%29.jpg"}, {"t": "Maya", "b": "* number as time — dates, calendar cycles, numbers personified as gods; base-20 with head-glyph numerals.", "ch": "Other conception-of-number cards"}, {"t": "Inca", "b": "* data without writing — knot type, knot position, cord color, and cord hierarchy as the fields of an imperial database.", "ch": "Other conception-of-number cards", "img": "media/cards/51a0457afeb4.webp", "cred": "Martin St-Amant (S23678) · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A80%20-%20Machu%20Picchu%20-%20Juin%202009%20-%20edit.2.jpg"}, {"t": "Bodies and bases", "b": "* base-5, 10, 20, 60; 27-body-part counting systems of Papua New Guinea; Yoruba base-20 with subtractive construction — the human body as the first numeral system.", "ch": "Other conception-of-number cards"}, {"t": "Data as length, weight, time, quantity", "b": "* a synthesis card — before number was abstract, every culture computed *with the world itself*: ropes, stones, beads, knots, shadows, water clocks, balance scales.", "ch": "Other conception-of-number cards"}, {"t": "I Ching (China)", "b": "64 hexagrams from binary lines — divination as combinatorics (see Era 2 and the Leibniz connection).", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/3ddda6a3b53b.webp", "cred": "Song era print artist · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:I_Ching_Song_Dynasty_print.jpg"}, {"t": "Ifá divination (Yoruba, West Africa)", "b": "256 odu generated from 8 binary casts — exactly one byte of states, each indexing a body of recited literature; a binary addressing system in ritual form.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/9d6d19fc3275.webp", "cred": "Toluaye · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AJogo%20de%20Ikin%20Orossi.JPG"}, {"t": "Sona sand drawings (Chokwe, Angola/DR Congo)", "b": "single-line figures traced over dot grids by memorized rules — Eulerian paths and recursive algorithms executed as art.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/018bd84c953f.webp", "cred": "OmarTheKingFr · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKalunga-lusona.jpg"}, {"t": "Marshall Islands stick charts", "b": "ocean swell patterns and their interference around islands encoded in lashed sticks and shells — an analog model of wave dynamics, memorized before the voyage and left ashore.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/3c3c242528cd.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMarshall%20Islands%20stick%20chart%2C%20Rebbelib%20type.%20LOC%202010586182.jpg"}, {"t": "Polynesian wayfinding", "b": "star compass, dead reckoning, and the etak reference-island system — voyages of thousands of miles computed continuously in the navigator's head.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/25d1c4813a2f.webp", "cred": "S. Percy Smith · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APolynesian%20navigation%20device%20showing%20directions%20of%20winds%2C%20waves%20and%20islands.jpg"}, {"t": "Mancala-family games (Africa, Middle East, Asia)", "b": "seed-counting and capture strategy — arithmetic and lookahead as play.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/162a5a983b64.webp", "cred": "MozMozJ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Yao_People_Playing_%22Bawo%22.jpg"}, {"t": "Theme card", "b": "computation has always lived in ritual, art, navigation, and games — alongside and long before written mathematics.", "ch": "Computing without written numbers (embodied & ritual computation)"}]}, {"id": "thread-G", "kind": "thread", "title": "Thread G: Cryptography: computing to conceal and reveal", "sub": "", "cards": [{"t": "Overview", "b": "Caesar cipher (antiquity) → al-Kindi's frequency analysis (9th c.) → Alberti's cipher disk (1467) → Vigenère (1553) → Babbage & Kasiski break it (1850s–63) → Rejewski's bomba vs. Enigma (1932) → Turing/Welchman Bombe & Colossus (1940s) → DES (1977) → Diffie–Hellman & RSA (1976–77) → elliptic curves → Shor's quantum threat (1994) → NIST post-quantum standards (2024). Theme: an arms race that repeatedly *forced* the invention of faster computation — including the first programmable electronic computer."}]}, {"id": "thread-H", "kind": "thread", "title": "Thread H: The Art of Reckoning", "sub": "how people *actually* calculated", "cards": [{"t": "Roman numerals are a recording notation, nearly useless for arithmet…", "b": "Roman numerals are a *recording* notation, nearly useless for arithmetic — try multiplying XLVII × XXXIX on paper. Romans didn't; nobody did.", "ch": "The Roman paradox: numerals for writing, machines for computing", "img": "media/cards/f3f4737d9ca1.webp", "cred": "Alex1011 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:CuttySarkRomNum.jpg"}, {"t": "Day-to-day arithmetic ran on pebbles (calculi) on lined counting boa…", "b": "Day-to-day arithmetic ran on **pebbles (calculi) on lined counting boards** and on the **portable bronze hand abacus** — grooved slots for units through millions, plus extra slots for base-12 fractions (unciae). A merchant's pocket device, ~2,000 years before the pocket calculator.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Key card for students", "b": "the numeral was the *output format*; the board was the *processor*. Notation ≠ computation.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Linguistic-fossils card", "b": "*calculus/calculate* (pebble), *exchequer* (the checkered counting cloth of the English treasury), the shop *counter* (the counting table), *bank* (the money-changer's bench where the board sat).", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Counting boards with cast counters (jetons) remained standard across E…", "b": "Counting boards with cast counters (jetons) remained standard across Europe into the 1600s–1700s. Samuel Pepys — Cambridge graduate, senior naval administrator — hired a tutor at age 29 (1662) to learn the multiplication table. Written arithmetic was a *specialist skill* long after board-reckoning was universal.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "The suanpan (China, 2+5 beads) and soroban (Japan, 1+4 beads)…", "b": "The **suanpan** (China, 2+5 beads) and **soroban** (Japan, 1+4 beads) are not museum pieces — millions of children in Japan, China, Taiwan, Korea, India, and Southeast Asia train on them today in schools and after-school academies, with **kyū/dan ranking exams** graded like martial arts.", "ch": "The living abacus: East Asian abacus education today", "img": "media/cards/f84c90a8b15f.webp", "cred": "N509FZ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AROC-era%20abacus%20at%20China%20National%20Museum%20of%20Women%20and%20Children%20%2820210909140914%29.jpg"}, {"t": "The schoty, Russia's abacus, was still clicking on shop counters i…", "b": "The **schoty**, Russia's abacus, was still clicking on shop counters into the 1990s. Western Europe abandoned the counting board; most of the world never stopped.", "ch": "The living abacus: East Asian abacus education today", "img": "media/cards/f6846fa9a6a4.webp", "cred": "Syced · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAbacus%20actually%20in%20use%20at%20kimono%20shop%20in%20Otaru.jpg"}, {"t": "Anzan (暗算) — the internalized machine", "b": "advanced students stop needing the physical soroban. They visualize it and move imaginary beads — you can watch champions' fingers flicking over an empty desk. The machine has been *installed in the mind*.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Flash anzan", "b": "multi-digit numbers flashed on screen faster than they can be read aloud; top competitors correctly sum 15 three-digit numbers shown in under two seconds. National soroban championships and the Mental Calculation World Cup keep the tradition elite and alive.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Research on expert abacus users suggests they shift arithmetic from ve…", "b": "Research on expert abacus users suggests they shift arithmetic from verbal processing toward **visuospatial imagery** — they compute with a mental picture rather than with inner speech.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "The payoff card (core to the site's thesis):", "b": "the tool does not replace the skill — practiced deeply enough, the tool *becomes* the skill. A student who masters a calculating machine ends up carrying it in their head. This is the strongest answer to \"why practice by hand when machines exist?\"", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Finger reckoning (dactylonomy)", "b": "Bede's system to 9,999; Mediterranean and Middle Eastern market-traders' finger systems; complement-based finger multiplication for the 6–10 times tables — arithmetic carried on the body.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/11389e04dd59.webp", "cred": "Wound theology · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFinger%20reckoning%20cropped%20from%20Wellcome%20Library%20MS.509.jpg"}, {"t": "Doubling and halving", "b": "Egyptian multiplication by repeated doubling, and its folk survival, \"Russian peasant multiplication\" — secretly *binary multiplication*, the method inside every CPU today. (Superb card: the pharaoh's scribe and the microchip run the same algorithm.)", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Table lookup as a way of life", "b": "Babylonian multiplication and reciprocal tablets; Ptolemy's chords; medieval computus tables for Easter; Toledan and Alfonsine astronomical tables. For most of history, \"computing\" largely meant *looking up* someone else's frozen labor.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Quarter-square multiplication", "b": "ab = [(a+b)² − (a−b)²]/4 — multiply using only a table of squares plus addition and subtraction; used from Babylon to 19th-century table books.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Lattice (gelosia) multiplication", "b": "the grid method from Indian/Islamic mathematics, standard in the abbaco schools — and now back in modern elementary classrooms.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/ee57a6a04236.webp", "cred": "Brigban · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ALattice%20multiplication%20step%203.jpg"}, {"t": "Casting out nines", "b": "the universal error-check of hand arithmetic, transmitted through al-Khwarizmi's tradition — checksum logic centuries before checksums.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Prosthaphaeresis", "b": "trigonometric identities as a multiplication machine (see Era 4) — proof that the *hunger* for fast multiplication predates the means.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/74a56a50fa54.webp", "cred": "Dominic3203 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AProof%20for%20Sum-to-Product%20Identities.jpg"}, {"t": "Logarithm tables (Briggs onward)", "b": "the single most important calculating aid of the scientific era; engineers, navigators, gunners, and schoolchildren computed with them into the 1970s.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/9d3139a3bdc0.webp", "cred": "Matthias Bernegger · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Bernegger_Manuale_136.jpg"}, {"t": "The slide rule", "b": "logarithms made physical — analog multiplication at a glance; \"slipstick\" culture, belt holsters, carried aboard Apollo as backup.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/27397d846189.webp", "cred": "Jacek Halicki · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2023%20Suwak%20logarytmiczny%20%281%29.jpg"}, {"t": "Ready reckoners", "b": "cheap printed books of precomputed prices, interest, wages, and conversions — the shopkeeper's lookup table from the 1600s well into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/6c9e4c0f2865.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Ready-Reckoner.jpg"}, {"t": "Nomograms (d'Ocagne, 1880s)", "b": "computation as *drawing* — lay a straightedge across printed scales and read off the answer; used for artillery, engineering, and medicine (some clinical nomograms survive today).", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Planimeters and integraphs", "b": "trace a curve's outline with a stylus, read its area off a dial — mechanical integration.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/c5bd012902a7.webp", "cred": "«Военная энциклопедия И. Д. Сытина». Том 2 (Санкт-Петербург; 1911). · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A%D0%98%D0%BB%D0%BB%D1%8E%D1%81%D1%82%D1%80%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BA%20%D1%81%D1%82%D0%B0%D1%82%D1%8C%D0%B5%20%C2%AB%D0%90%D0%BC%D1%81%D0%BB%D0%B5%D1%80%D0%B0%20%D0%BF%D0%BB%D0%B0%D0%BD%D0%B8%D0%BC%D0%B5%D1%82%D1%80%C2%BB.%20%D0%92%D0%BE%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BD%D1%86%D0%B8%D0%BA%D0%BB%D0%BE%D0%BF%D0%B5%D0%B4%D0%B8%D1%8F%20%D0%A1%D1%8B%D1%82%D0%B8%D0%BD%D0%B0%20%28%D0%A1%D0%B0%D0%BD%D0%BA%D1%82-%D0%9F%D0%B5%D1%82%D0%B5%D1%80%D0%B1%D1%83%D1%80%D0%B3%2C%201911-1915%29.jpg"}, {"t": "Specialized aids to the very end", "b": "Genaille–Lucas rulers (1891) and dozens of similar devices sold to clerks and accountants into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Professional lightning calculators", "b": "Zerah Colburn (factoring large numbers mentally as a child, 1810s), George Parker Bidder (from stage calculator to great railway engineer), Alexander Aitken (perhaps the best-documented calculating mind), Shakuntala Devi (multiplied two 13-digit numbers in 28 seconds, 1980).", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "The Trachtenberg system", "b": "high-speed arithmetic rules developed by Jakow Trachtenberg *entirely in his head while imprisoned in Nazi camps* — calculation as survival of the mind.", "ch": "Lightning minds: mental calculators and speed systems", "img": "media/cards/60e1d56abd89.webp", "cred": "Holretz · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2FingerMethod-third%20digit.png"}, {"t": "\"Vedic mathematics\" (Bharati Krishna Tirtha, pub. 1965)", "b": "sutra-based speed techniques (\"all from 9 and the last from 10,\" \"vertically and crosswise\"); a modern system rather than an ancient Vedic one, but pedagogically potent and hugely popular in India.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Everyday mental tricks", "b": "as mini-cards: complements (\"make ten\"), left-to-right addition, ×5 via ×10÷2, ×25 via ×100÷4, squaring numbers ending in 5, and 47×99 = 4,700 − 47.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Closing card", "b": "when calculation was economically vital, societies invested enormously in *human* computational skill — tables, tools, tricks, and training. Today that need is met by machines running 10¹⁸ operations per second — but the trained mind remains the only place where *understanding* happens.", "ch": "Lightning minds: mental calculators and speed systems"}]}, {"id": "thread-I", "kind": "thread", "title": "Thread I: Computing with the World: water, analog & unconventional machines", "sub": "", "cards": [{"t": "Clepsydrae", "b": "from Egyptian outflow bowls to Ctesibius' feedback-regulated clocks (the first known feedback control) to elaborate Chinese and Islamic water-clock towers (Su Song 1088, al-Jazari 1206) — time itself was water-computed for three millennia.", "ch": "Water computing"}, {"t": "Lukyanov's water integrator (1936)", "b": "PDEs as plumbing — water levels are the variables, tube resistances the coefficients; adjust the valves, read the solution. Mass-produced in the USSR, used for dams, mines, and rocketry into the 1980s.", "ch": "Water computing"}, {"t": "The MONIAC (1949)", "b": "Keynesian macroeconomics in transparent tanks — raise taxes and literally watch consumption drain. Fourteen built; one still runs demonstrations in New Zealand's central bank museum.", "ch": "Water computing", "img": "media/cards/262f49792327.webp", "cred": "Unlisted/Unknown · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3APhillips%20and%20MONIAC%20LSE.jpg"}, {"t": "Fluidics (1960s)", "b": "logic gates made of nothing but jets and channels — no electronics, immune to radiation and EMP; used in aircraft, industrial control, even missile systems; reborn today as **microfluidic logic** in lab-on-a-chip devices.", "ch": "Water computing", "img": "media/cards/a62b64119e3a.webp", "cred": "Herbert.Oertel / www.prof-oertel.de · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFluidic%20Oscillator.png"}, {"t": "The liquid brain (2003)", "b": "researchers used ripples on the surface of a bucket of water as the reservoir in a \"liquid state machine,\" successfully distinguishing spoken words — a literal bucket of water performing pattern recognition.", "ch": "Water computing", "img": "media/cards/32916a4ed568.webp", "cred": "Laboratoires Servier · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ANervous%20system%20-%20Cerebrospinal%20fluid%20--%20Smart-Servier.png"}, {"t": "Theme card", "b": "water was humanity's first continuous quantity. Time, then economies, then differential equations were all made to *flow*.", "ch": "Water computing"}, {"t": "The integrator lineage", "b": "James Thomson's ball-and-disk integrator → his brother Lord Kelvin's tide predictor and harmonic analyzer → Bush's differential analyzer (Era 6) — continuous mathematics done by wheels.", "ch": "Mechanical & electrical analog computing"}, {"t": "Fire control", "b": "Dreyer Tables and Rangekeepers through the Mark 1 — shipboard analog computers tracking moving targets from moving platforms in real time, decades before digital could; still aboard recommissioned battleships in the 1990s.", "ch": "Mechanical & electrical analog computing", "img": "media/cards/23531fc8847a.webp", "cred": "U.S. Navy, Bureau of Naval Personnel (Transfered by \n\nJostikas/Original uploaded · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3AMark%201A%20Fire%20Control%20Computer%20Controls.jpg"}, {"t": "Field analogies", "b": "electrolytic tanks and conductive paper \"compute\" electric and aerodynamic fields; stretched rubber sheets solve potential problems — let the physics find the answer.", "ch": "Mechanical & electrical analog computing"}, {"t": "Network analyzers", "b": "scale-model power grids used to compute the behavior of real power grids into the 1960s.", "ch": "Mechanical & electrical analog computing"}, {"t": "The op-amp era", "b": "room-sized patch-panel analog computers simulate aircraft, rockets, and reactors; the very name \"operational amplifier\" means *an amplifier that performs mathematical operations*.", "ch": "Mechanical & electrical analog computing"}, {"t": "Theme card", "b": "for continuous problems — tides, trajectories, flight — analog machines were *faster than digital for decades*. Digital won on precision and programmability, not on any monopoly over mathematics.", "ch": "Mechanical & electrical analog computing"}, {"t": "Graphical statics (1860s)", "b": "bridges and roofs designed by drawing force polygons — Eiffel-era engineering computed with straightedge and pencil.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Nomography proper (d'Ocagne, 1884)", "b": "alignment charts where laying a straightedge across three scales *is* the calculation; grounded in projective geometry and determinants.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "War by straightedge", "b": "WWI and WWII artillery fired on nomogram-computed solution
