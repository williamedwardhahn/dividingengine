is", "b": "mathematics lives in context and purpose; schooling that strips both can strip the competence too. Bridges directly into Thread L.", "ch": "Street mathematics (the pedagogy bombshell)"}, {"t": "Closing card", "b": "\"<a class=\"xl\" href=\"#era-9/177\">ethnomathematics<\/a>\" is not math for *other* <a class=\"xl\" href=\"#era-9/53\">people<\/a>. Our own school mathematics — the 1893 sequence, the standard algorithms — is also somebody's cultural tradition (see Thread L). All mathematics is somebody's ethnomathematics.", "ch": "Street mathematics (the pedagogy bombshell)", "out": [{"to": "era-9/177", "t": "Ethnomathematics becomes a field"}, {"to": "era-9/53", "t": "People on a Giant World Map"}]}]}, {"id": "thread-L", "kind": "thread", "title": "Thread L: How We Came to Teach Math This Way", "sub": "the lag, and the orphaned history", "cards": [{"t": "The edubba (c. 2000 BCE)", "b": "clay-tablet homework, table-copying, teacher's model on one side and student's shaky copy on the other — the problem set is as old as writing.", "ch": "The 4,000-year classroom"}, {"t": "Scribal schools (Egypt, Babylon)", "b": "worked examples, rote-plus-variation — recognizably modern <a class=\"xl\" href=\"#thread-I/16\"><a class=\"xl\" href=\"#thread-M/24\">pedagogy<\/a><\/a>.", "ch": "The 4,000-year classroom", "out": [{"to": "thread-M/24", "t": "Pedagogy card"}, {"to": "thread-I/16", "t": "Pedagogy card"}]}, {"t": "Greece", "b": "the **quadrivium** (arithmetic, geometry, music, astronomy); Plato's \"let no one ignorant of geometry enter\"; **Euclid as the textbook for ~2,200 years** — no book but scripture has taught longer.", "ch": "The 4,000-year classroom", "in": [{"to": "era-2/12", "t": "Pebble Voting"}, {"to": "era-2/13", "t": "Steganography enters history"}, {"to": "thread-F/1", "t": "Greece — number as idea. Sharp split between arithmos (a multitude…"}]}, {"t": "Medieval universities", "b": "computus and *oral* disputation — for most of history, math was examined by <a class=\"xl\" href=\"#thread-K/20\">talking<\/a>, not writing.", "ch": "The 4,000-year classroom", "out": [{"to": "thread-K/20", "t": "Talking drums (West/Central Africa)"}], "in": [{"to": "era-3/2", "t": "Bede's finger reckoning"}, {"to": "era-5/8", "t": "The tally sticks burn Parliament"}, {"to": "thread-H/13", "t": "Table lookup as a way of life"}, {"to": "thread-K/4", "t": "The binary lineage"}]}, {"t": "The two-track split", "b": "university mathematics for the learned; **abbaco schools** (Era 3) for merchants' children — a practical/academic divide that still structures curricula.", "ch": "The 4,000-year classroom"}, {"t": "Vernacular revolution", "b": "<a class=\"xl\" href=\"#era-4/3\">Adam Ries<\/a> (1522), <a class=\"xl\" href=\"#era-5/27\">Robert<\/a> <a class=\"xl\" href=\"#era-4/5\">Recorde<\/a> (1557) — cheap printed textbooks in living languages; mass numeracy becomes possible.", "ch": "The 4,000-year classroom", "out": [{"to": "era-5/27", "t": "Robert Henry Thurston’s Glyptic Models"}, {"to": "era-4/3", "t": "Adam Ries"}, {"to": "era-4/5", "t": "Robert Recorde invents \"=\""}], "in": [{"to": "era-4/3", "t": "Adam Ries"}]}, {"t": "The exam is invented", "b": "the Cambridge Tripos (18th–19th c.) creates the written, timed, ranked mathematics examination — and instantly, the coaching industry, cramming, and teach-to-the-test. Modern assessment is a ~250-year-old technology with known side effects.", "ch": "The 4,000-year classroom"}, {"t": "The Prussian machine (1810s–40s)", "b": "age grades, state <a class=\"xl\" href=\"#thread-L/17\">curriculum<\/a>, normal schools; <a class=\"xl\" href=\"#era-5/0\">the blackboard<\/a> (c. 1801). The delivery system we still use predates the telegraph.", "ch": "The 4,000-year classroom", "out": [{"to": "thread-L/17", "t": "Curriculum as geology"}, {"to": "era-5/0", "t": "The blackboard"}]}, {"t": "The freeze", "b": "<a class=\"xl\" href=\"#era-5/46\">the Committee of Ten<\/a> (1893) fixes arithmetic → algebra → geometry → trig; with <a class=\"xl\" href=\"#era-8/11\">calculus<\/a> added (1955), that is *still* the standard walk — designed for 1890s college prep, not for a world that runs on <a class=\"xl\" href=\"#thread-P/5\">statistics<\/a>, linear algebra, and algorithms.", "ch": "The 4,000-year classroom", "out": [{"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "era-5/46", "t": "The Committee of Ten (US)"}, {"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}]}, {"t": "Klein's Meran reforms (1905) push functions and calculus into European…", "b": "<a class=\"xl\" href=\"#era-5/39\"><a class=\"xl\" href=\"#thread-L/15\">Klein's<\/a><\/a> Meran reforms (1905) push <a class=\"xl\" href=\"#era-6/25\">functions<\/a> and <a class=\"xl\" href=\"#era-8/11\">calculus<\/a> into European schools; the US largely declines.", "ch": "The reform pendulum", "out": [{"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "era-5/39", "t": "Klein's Mathematical Plaster Models"}, {"to": "era-6/25", "t": "Mathematical Functions Embodied in Ballistic Cams"}, {"to": "thread-L/15", "t": "Klein's double discontinuity (1908)"}], "in": [{"to": "era-3/13", "t": "Fibonacci's Liber Abaci"}, {"to": "era-4/4", "t": "Codex Vergara (Aztec/Nahua)"}, {"to": "thread-K/4", "t": "The binary lineage"}, {"to": "thread-U/10", "t": "1701–03"}]}, {"t": "New Math (1957–58, post-Sputnik)", "b": "set theory handed to teachers who had never studied it — the definitive national-scale demonstration of the training gap; collapsed by the early 1970s (*Why Johnny Can't Add*, 1973; Tom Lehrer's satire in between).", "ch": "The reform pendulum"}, {"t": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standard…", "b": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standards (1989) → **Math Wars** (1990s) → high-stakes testing (2001) → **<a class=\"xl\" href=\"#era-10/8\">Common<\/a> Core** (2010), where parents' inability to help with homework put the generational gap on every <a class=\"xl\" href=\"#thread-I/18\">kitchen<\/a> table → computer-based-math <a class=\"xl\" href=\"#era-5/41\">movement<\/a> (2010s).", "ch": "The reform pendulum", "out": [{"to": "era-10/8", "t": "Common Core & the CS-for-all push"}, {"to": "era-5/41", "t": "Marey's Movement Sculptures"}, {"to": "thread-I/18", "t": "Kitchen analog"}]}, {"t": "Pattern card", "b": "the pendulum swings roughly every 15–20 years — about one teacher-generation. That is not a coincidence; it's the lag mechanism oscillating.", "ch": "The reform pendulum", "in": [{"to": "era-9/138", "t": "Expert systems and the AI winters"}, {"to": "thread-I/4", "t": "The liquid brain (2003)"}]}, {"t": "The arithmetic of the gap", "b": "a teacher certified in year X teaches until ~X+35. Their methods were largely absorbed not in training but as a *student* around X−15 — Lortie's \"apprenticeship of observation\" (1975): ~13,000 hours of watching teachers before training even begins. Their textbooks were written by authors trained around X−40. So classroom content routinely trails the <a class=\"xl\" href=\"#era-10/16\"><a class=\"xl\" href=\"#era-10/23\"><a class=\"xl\" href=\"#thread-A/11\">frontier<\/a><\/a><\/a> by 50–100 years — *before* <a class=\"xl\" href=\"#thread-L/14\">compounding<\/a>.", "ch": "The lag engine (core thesis card-set)", "out": [{"to": "era-10/16", "t": "Frontier supercomputer"}, {"to": "thread-A/11", "t": "Frontier/exascale cluster"}, {"to": "thread-L/14", "t": "Compounding card"}, {"to": "era-10/23", "t": "Frontier AI training runs (~10²⁵–10²⁶ FLOPs)"}]}, {"t": "Compounding card", "b": "each generation can only pass on what it received plus the little it retrained on; whatever a generation misses, the next generation cannot inherit. Gaps don't just persist — they *accumulate*, era over era, like the <a class=\"xl\" href=\"#thread-L/17\">curriculum<\/a>'s own dark matter.", "ch": "The lag engine (core thesis card-set)", "out": [{"to": "thread-L/17", "t": "Curriculum as geology"}], "in": [{"to": "thread-L/13", "t": "The arithmetic of the gap"}, {"to": "thread-U/3", "t": "the turn"}]}, {"t": "Klein's double discontinuity (1908)", "b": "future teachers experience university math as irrelevant to school math, then return to classrooms and teach school math untouched by university math — the loop that locks the lag in place.", "ch": "The lag engine (core thesis card-set)", "in": [{"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}]}, {"t": "Case files", "b": "<a class=\"xl\" href=\"#era-8/11\">Calculus<\/a> (1687) → standard high-school course in 1955: **~270 years**. <a class=\"xl\" href=\"#thread-P/5\">Statistics<\/a> (<a class=\"xl\" href=\"#era-6/18\">Fisher<\/a>, 1920s) → still marginal in K-12 a century on. Computer science (1936–1950s) → still not universal after ~80 years. Linear algebra — the actual arithmetic of AI (Thread A) — effectively absent from school. Log tables were still being taught *after* the HP-35 made them obsolete.", "ch": "The lag engine (core thesis card-set)", "out": [{"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "era-6/18", "t": "R.A. Fisher"}, {"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}]}, {"t": "Curriculum as geology", "b": "every stratum was deposited by a dead era's needs — navigation left trigonometry, commerce left arithmetic drill, the Cold War left New Math's residue, the testing era left procedure-first habits. Little is ever removed. The sediment *is* the syllabus. Students deserve to be told which layer they're standing on.", "ch": "The lag engine (core thesis card-set)", "in": [{"to": "era-5/2", "t": "The Prussian school model"}, {"to": "era-10/8", "t": "Common Core & the CS-for-all push"}, {"to": "thread-L/7", "t": "The Prussian machine (1810s–40s)"}, {"to": "thread-L/14", "t": "Compounding card"}, {"to": "thread-L/23", "t": "How We Came to Teach Math This Way"}]}, {"t": "Too old for computing class", "b": "a programming course can't spare a week for <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">Babbage<\/a><\/a>, never mind Sumer; \"history of computing\" is one slide on day one.", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}]}, {"t": "Too new for history class", "b": "school history runs out of steam around 1945–1990; the eighty most computationally transformative years in the human story belong to *no* course, no teacher, no exam.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "So the lineage is kept by museums, retro-computing hobbyists, and docu…", "b": "So the lineage is kept by museums, retro-computing hobbyists, and documentaries — while students carry 10¹²-FLOP/s devices with zero formal knowledge of where they came from.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Mathematics' own history is orphaned the same way", "b": "a student can finish <a class=\"xl\" href=\"#era-8/11\">calculus<\/a> without hearing a <a class=\"xl\" href=\"#thread-A/10\">single<\/a> date, and even the names are wrong (\"Gaussian\" elimination <a class=\"xl\" href=\"#era-9/245\">appears<\/a> in the *Nine <a class=\"xl\" href=\"#era-2/21\">Chapters<\/a>*, ~2,000 years before Gauss).", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "era-9/245", "t": "A Shape Display Appears in a Movie"}, {"to": "era-2/21", "t": "Nine Chapters on the Mathematical Art (China)"}, {"to": "thread-A/10", "t": "Single modern AI GPU"}]}, {"t": "Mission card", "b": "this site lives deliberately in that gap — the history too old for CS and too new for History — built for the students who need it most: the ones practicing, by hand, the very operations machines now perform 10¹⁸ times per second.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Overview", "b": "**L5. <a class=\"xl\" href=\"#thread-T/20\">Cross-links<\/a>**: Thread E (why learn it by hand) · H2 (anzan — training that demonstrably works) · K8 (street math — context carries competence) · Thread A (what the <a class=\"xl\" href=\"#thread-L/17\">curriculum<\/a> hasn't caught up to) · Thread J (why even the recent history went untaught: much of it was classified).", "ch": "The orphaned history (the site's reason to exist)", "out": [{"to": "thread-L/17", "t": "Curriculum as geology"}, {"to": "thread-T/20", "t": "Cross-links"}]}]}, {"id": "thread-M", "kind": "thread", "title": "Thread M: The Signal: a history of communication technology", "sub": "", "cards": [{"t": "Sound over distance", "b": "<a class=\"xl\" href=\"#thread-K/20\">talking drums<\/a> (Thread K7), signal horns, <a class=\"xl\" href=\"#era-6/42\">church<\/a> bells, and **whistled languages** — Silbo Gomero in the Canary <a class=\"xl\" href=\"#era-5/51\"><a class=\"xl\" href=\"#thread-F/15\">Islands<\/a><\/a> compresses Spanish into whistles that carry across whole valleys, still taught in schools there today.", "ch": "Signals before electricity", "out": [{"to": "thread-F/15", "t": "Marshall Islands stick charts"}, {"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}, {"to": "era-6/42", "t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)"}, {"to": "thread-K/20", "t": "Talking drums (West/Central Africa)"}]}, {"t": "Light and smoke", "b": "beacon chains from Aeschylus' Troy relay to the Great Wall's smoke towers to England's Armada beacons (1588) — one bit (\"they're coming\"), delivered at the speed of sight.", "ch": "Signals before electricity"}, {"t": "Relay infrastructure", "b": "Persia's Royal Road couriers (Herodotus' \"neither snow nor rain…\" describes them), Rome's cursus publicus, and the Inca **chasqui** runners — who carried *<a class=\"xl\" href=\"#era-2/1\">quipus<\/a>*: a data network transporting data structures (Thread F).", "ch": "Signals before electricity", "out": [{"to": "era-2/1", "t": "Quipus"}]}, {"t": "Carrier pigeons", "b": "from <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> Egypt to Reuters' founding pigeon fleet (1850) to WWII medal-winning birds — packets with wings.", "ch": "Signals before electricity", "out": [{"to": "thread-J/0", "t": "Ancient roots"}]}, {"t": "The Chappe optical telegraph (1794, Era 4)", "b": "a mechanical national network complete with protocols, acknowledgments, flow control, encryption, and — by 1834 — its first hacker exploit. \"The mechanical <a class=\"xl\" href=\"#thread-M/6\">internet<\/a>,\" half a century before Morse.", "ch": "Signals before electricity", "out": [{"to": "thread-M/6", "t": "The Victorian Internet (Standage's framing)"}], "in": [{"to": "thread-M/23", "t": "The latency ladder (companion to Thread A's speed ladder)"}]}, {"t": "Heliographs and flag semaphore", "b": "mirror-flash telegraphy served armies into the 20th century; naval flag codes ran fleets.", "ch": "Signals before electricity"}, {"t": "The Victorian Internet (Standage's framing)", "b": "<a class=\"xl\" href=\"#era-5/9\">the electric telegraph<\/a> brings news tickers, wire fraud, long-distance romances, and even weddings conducted by telegraph — every <a class=\"xl\" href=\"#era-5/51\">social<\/a> phenomenon of the internet, rehearsed in the 1800s.", "ch": "The wire", "out": [{"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}, {"to": "era-5/9", "t": "The electric telegraph (Cooke & Wheatstone; Morse)"}], "in": [{"to": "era-8/149", "t": "ARPANET"}, {"to": "era-9/220", "t": "GIMPS"}, {"to": "thread-M/4", "t": "The Chappe optical telegraph (1794, Era 4)"}, {"to": "thread-S/3", "t": "Otlet's Mundaneum (1910)"}]}, {"t": "Codes as economics", "b": "per-word cable pricing spawns commercial codebooks compressing whole sentences into <a class=\"xl\" href=\"#thread-A/10\">single<\/a> words — compression, invented by accountants.", "ch": "The wire", "out": [{"to": "thread-A/10", "t": "Single modern AI GPU"}]}, {"t": "Cable mathematics", "b": "the 1858 transatlantic cable dies of over-voltage ignorance; Kelvin's analysis and mirror galvanometer save 1866 — signal theory learned the hard way, by ocean.", "ch": "The wire"}, {"t": "Pneumatic tube networks", "b": "under Paris, London, Berlin, New York: physical <a class=\"xl\" href=\"#thread-M/18\">packet<\/a> delivery, some running into the 1980s.", "ch": "The wire", "out": [{"to": "thread-M/18", "t": "Packet switching → ARPANET → TCP/IP → the Web (Eras 8–9)"}]}, {"t": "The paper-tape lineage", "b": "<a class=\"xl\" href=\"#era-5/24\">Baudot's 5-bit code<\/a> → teleprinters → telex — and punched tape becomes early computer I/O; <a class=\"xl\" href=\"#era-7/6\"><a class=\"xl\" href=\"#thread-J/6\">Colossus<\/a><\/a> read enciphered teleprinter tape at 5,000 characters/second (Threads G, J). <a class=\"xl\" href=\"#era-7/30\">Communication<\/a> gear and computers share one bloodstream.", "ch": "The wire", "out": [{"to": "era-7/30", "t": "Shannon's \"A Mathematical Theory of Communication\""}, {"to": "era-5/24", "t": "Baudot's 5-bit code"}, {"to": "thread-J/6", "t": "Colossus erased"}, {"to": "era-7/6", "t": "Colossus (Bletchley Park)"}]}, {"t": "The telephone era", "b": "Bell (1876), exchanges, Strowger's dial (1891), and generations of <a class=\"xl\" href=\"#era-5/31\">switchboard operators<\/a> — human <a class=\"xl\" href=\"#thread-M/18\">packet<\/a> routers (Thread B) — automated away exactly as the human computers would be.", "ch": "The wire", "out": [{"to": "era-5/31", "t": "Switchboard operators"}, {"to": "thread-M/18", "t": "Packet switching → ARPANET → TCP/IP → the Web (Eras 8–9)"}]}, {"t": "Fax before phones", "b": "Bain (1843) and Caselli's pantelegraph in commercial service by 1865 — image transmission is older than voice transmission.", "ch": "The wire"}, {"t": "The photophone (Bell, 1880)", "b": "voice carried on a sunbeam — Bell called it his greatest invention; it waited a century for fiber optics to vindicate it.", "ch": "Through the air"}, {"t": "Radio", "b": "Hertz's laboratory waves → <a class=\"xl\" href=\"#era-6/4\">Marconi's<\/a> transatlantic \"S\" (1901) → broadcasting (KDKA, 1920) → radar in WWII, which poured money into the electronics and mathematics that built the computer industry.", "ch": "Through the air", "out": [{"to": "era-6/4", "t": "Marconi's transatlantic wireless"}]}, {"t": "Satellites", "b": "Sputnik's beep (1957) → Telstar's live TV (1962) → GPS: atomic-clock time signals turned into position by relativistic computation — Einstein running silently in every phone.", "ch": "Through the air"}, {"t": "Shannon (1948)", "b": "one theory for every channel — drum, wire, light, radio — with the *bit* as universal currency. <a class=\"xl\" href=\"#era-7/30\">Communication<\/a> and computation formally become a <a class=\"xl\" href=\"#thread-A/10\">single<\/a> subject.", "ch": "The digital merger", "out": [{"to": "era-7/30", "t": "Shannon's \"A Mathematical Theory of Communication\""}, {"to": "thread-A/10", "t": "Single modern AI GPU"}], "in": [{"to": "era-5/36", "t": "Jevons' \"logic piano\""}, {"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-M/21", "t": "Twins, not neighbors"}]}, {"t": "Error correction", "b": "<a class=\"xl\" href=\"#era-7/37\">Hamming<\/a> (1950), Reed–Solomon (1960), and their descendants in every phone and <a class=\"xl\" href=\"#era-8/53\">spacecraft<\/a> — arithmetic that heals damaged messages mid-flight.", "ch": "The digital merger", "out": [{"to": "era-7/37", "t": "Hamming codes"}, {"to": "era-8/53", "t": "Voskhod Spacecraft 'Globus' IMP navigation instrument"}]}, {"t": "Packet switching → ARPANET → TCP/IP → the Web (Eras 8–9)", "b": "the network becomes a computer; the computer becomes a network.", "ch": "The digital merger", "in": [{"to": "era-8/149", "t": "ARPANET"}, {"to": "thread-M/9", "t": "Pneumatic tube networks"}, {"to": "thread-M/11", "t": "The telephone era"}]}, {"t": "Fiber", "b": "Kao's 1966 insight that glass could carry light for kilometers; TAT-8 (1988) crosses the Atlantic; today undersea fiber carries ~99% of intercontinental data along routes eerily echoing the 1866 cable map.", "ch": "The digital merger"}, {"t": "Convergence", "b": "the <a class=\"xl\" href=\"#thread-A/9\">smartphone<\/a> is telegraph + <a class=\"xl\" href=\"#era-5/29\">telephone<\/a> + radio + television + camera + <a class=\"xl\" href=\"#era-2/19\">library<\/a> + computer — every channel in this thread, fused into a slab.", "ch": "The digital merger", "out": [{"to": "thread-A/9", "t": "Smartphone (2020s)"}, {"to": "era-5/29", "t": "Telephone and automatic exchange"}, {"to": "era-2/19", "t": "The Library of Alexandria"}]}, {"t": "Twins, not neighbors", "b": "<a class=\"xl\" href=\"#era-7/30\">communication<\/a> and computation are both transformations of encoded symbols. Every era's signaling system needed codes, and every code invited computation — Morse's compression, cable codebooks, <a class=\"xl\" href=\"#era-5/24\">Baudot's<\/a> binary, <a class=\"xl\" href=\"#era-6/44\"><a class=\"xl\" href=\"#thread-M/16\">Shannon<\/a>'s<\/a> unification.", "ch": "Theme cards", "out": [{"to": "era-7/30", "t": "Shannon's \"A Mathematical Theory of Communication\""}, {"to": "thread-M/16", "t": "Shannon (1948)"}, {"to": "era-5/24", "t": "Baudot's 5-bit code"}, {"to": "era-6/44", "t": "Claude Shannon's master's thesis"}]}, {"t": "Numbers travel first", "b": "each new fastest channel carried prices, odds, tides, and war before it carried anything else.", "ch": "Theme cards"}, {"t": "The latency ladder (companion to Thread A's speed ladder)", "b": "courier (days) → beacon (minutes, one bit) → <a class=\"xl\" href=\"#era-4/48\"><a class=\"xl\" href=\"#thread-M/4\">Chappe<\/a><\/a> (minutes, low bandwidth) → telegraph (seconds) → light in fiber (milliseconds) — and today the speed of light itself is the wall: high-frequency traders build microwave towers because fiber's path is microseconds too *curved*. Latency, not arithmetic, is now often the scarce resource.", "ch": "Theme cards", "out": [{"to": "era-4/48", "t": "The Chappe optical telegraph (France)"}, {"to": "thread-M/4", "t": "The Chappe optical telegraph (1794, Era 4)"}]}, {"t": "Pedagogy card", "b": "a student who understands Morse's short-E and long-Q already understands the core idea of data compression — 19th-century hand-skills as a royal road into information theory.", "ch": "Theme cards", "in": [{"to": "thread-L/1", "t": "Scribal schools (Egypt, Babylon)"}]}]}, {"id": "thread-N", "kind": "thread", "title": "Thread N: When Computation Fails", "sub": "", "cards": [{"t": "The opening card is Babbage's motive", "b": "he built engines *because human tables were full of errors* — this whole subject begins with failure.", "in": [{"to": "era-5/16", "t": "Scheutz difference engine"}]}, {"t": "Therac-25 (1985–87)", "b": "race conditions in a radiation-therapy machine kill patients — software safety engineering is born of tragedy.", "in": [{"to": "era-9/234", "t": "The famous failures"}]}, {"t": "Patriot missile (1991)", "b": "0.1 seconds has no exact binary representation; 100 hours of clock drift = a 687-meter miss and 28 dead soldiers. Floating point as life and death (see IEEE 754, Era 9).", "in": [{"to": "era-9/234", "t": "The famous failures"}]}, {"t": "Pentium FDIV (1994)", "b": "a few missing lookup-table entries; discovered by a mathematician (<a class=\"xl\" href=\"#era-5/3\">Thomas<\/a> Nicely) cross-checking prime computations — caught because a human was *verifying by independent calculation*. A $475M recall.", "out": [{"to": "era-5/3", "t": "Thomas de Colmar's Arithmometer"}], "in": [{"to": "era-9/234", "t": "The famous failures"}]}, {"t": "Ariane 5 (1996)", "b": "a 64-bit float jammed into a 16-bit integer; reused code from a slower rocket; $370M of fireworks in 37 seconds.", "in": [{"to": "era-9/234", "t": "The famous failures"}]}, {"t": "Mars Climate Orbiter (1999)", "b": "one team used pound-seconds, the other newton-seconds — Thread F's \"number as quantity\" lesson, fatal at Mars. Units are not decoration.", "in": [{"to": "era-9/234", "t": "The famous failures"}]}, {"t": "Y2K (2000)", "b": "two-digit years meet the millennium; a massive global remediation *works*, so smoothly that <a class=\"xl\" href=\"#era-9/53\">people<\/a> now call it a hoax — the \"successful prevention looks like overreaction\" card.", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}]}, {"t": "Reinhart–Rogoff (2013)", "b": "an Excel range error (plus contestable choices) in a paper that had steered global austerity policy — found by a graduate student who *redid the arithmetic*. The site's best modern argument for checking by hand."}, {"t": "Lorenz (1963)", "b": "chaos discovered through rounding — some systems have mathematical forecast horizons no supercomputer can push past."}, {"t": "Gödel & the halting problem", "b": "some questions no computer can ever decide — failure elevated to <a class=\"xl\" href=\"#era-8/155\">theorem<\/a>.", "out": [{"to": "era-8/155", "t": "Appel & Haken prove the Four Color Theorem by computer"}]}, {"t": "Closing card", "b": "machines compute wrong at exactly the same speed they compute right. <a class=\"xl\" href=\"#thread-E/1\">Estimation<\/a>, unit sense, and sanity checks — the skills of hand arithmetic — are the human firmware that catches the machine (Glenn trusted Johnson, not the computer; Nicely caught Intel).", "out": [{"to": "thread-E/1", "t": "Estimation and error-checking (Glenn trusting Johnson over the machine…"}]}]}, {"id": "thread-O", "kind": "thread", "title": "Thread O: Memory: How Machines Remember", "sub": "", "cards": [{"t": "Before machines", "b": "clay tablets, quipu knots, tally sticks, books, card catalogs — every era's storage (cross-refs Eras 1–3, Thread S)."}, {"t": "Bits as echoes", "b": "<a class=\"xl\" href=\"#era-4/36\">mercury<\/a> delay lines store numbers as circulating sound pulses (EDSAC); Williams tubes store them as glowing spots on a CRT — memory you could *hear* and *see*.", "out": [{"to": "era-4/36", "t": "Mercury Thermometer"}]}, {"t": "Core memory (1950s–70s)", "b": "thousands of ferrite rings, each threaded by hand — for two decades, nearly every bit on Earth passed through the fingers of women doing precision textile work."}, {"t": "Core rope & Apollo", "b": "program memory physically *woven* — wire through a core = 1, around it = 0; NASA <a class=\"xl\" href=\"#era-8/16\">engineers<\/a> called it \"LOL memory\" (little old ladies). Software you could hold, made by weavers (Threads B, Q; <a class=\"xl\" href=\"#era-5/1\">Jacquard<\/a>'s descendants).", "out": [{"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}, {"to": "era-5/1", "t": "Jacquard loom"}], "in": [{"to": "thread-H/19", "t": "The slide rule"}]}, {"t": "The magnetic era", "b": "drum → tape → RAMAC's 5 MB ton (1956) → floppy (1971) → the hard-drive <a class=\"xl\" href=\"#era-7/18\"><a class=\"xl\" href=\"#era-7/24\">density<\/a><\/a> explosion.", "out": [{"to": "era-7/24", "t": "Dorothy Hodgkin's Electron Density Contours"}, {"to": "era-7/18", "t": "Electron Density Map and Molecular Model of Penicillin"}]}, {"t": "Optical & solid state", "b": "CD (1982, with Reed–Solomon armor — Thread M), flash memory (Masuoka, 1987), SSDs; experimental DNA storage — data written back into molecules, where Era 1's tokens began.", "in": [{"to": "thread-J/9", "t": "The OCR connection"}]}, {"t": "The price-of-a-bit ladder (companion to Thread A)", "b": "from dollars per bit to trillions of bits per dollar — memory's own vertiginous curve, worth its own comparison card."}, {"t": "Theme card", "b": "storage has always been <a class=\"xl\" href=\"#era-6/25\">embodied<\/a> labor — scribes, knotters, weavers, threaders — until suddenly it wasn't; remembering *how* memory was made keeps the abstraction <a class=\"xl\" href=\"#thread-Q/4\">honest<\/a>.", "out": [{"to": "thread-Q/4", "t": "Honest closing card"}, {"to": "era-6/25", "t": "Mathematical Functions Embodied in Ballistic Cams"}]}]}, {"id": "thread-P", "kind": "thread", "title": "Thread P: The Data Thread: Probability, Statistics & Seeing Numbers", "sub": "", "cards": [{"t": "Born at the gambling table and the plague ledger", "b": "<a class=\"xl\" href=\"#era-4/19\"><a class=\"xl\" href=\"#era-4/33\">Pascal<\/a><\/a>–Fermat (1654) make chance calculable; Graunt (1662) reads London's death rolls as *data*; Halley (1693) prices annuities — the state and commerce learn to compute risk.", "out": [{"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "era-4/33", "t": "Pascal & Fermat's correspondence"}]}, {"t": "Bayes and Laplace", "b": "inverse probability — updating belief by arithmetic; Laplace computes planetary masses with it, and modern AI is soaked in it.", "in": [{"to": "era-4/8", "t": "John Napier: logarithms"}]}, {"t": "Gauss", "b": "least squares and the normal curve — error itself becomes lawful (Ceres, Era 5)."}, {"t": "The picture-makers", "b": "<a class=\"xl\" href=\"#era-4/43\">Playfair<\/a> invents the chart (1786); Nightingale weaponizes it (1858); Minard's Napoleon-in-Russia map — often called the finest graphic ever drawn; Tukey's exploratory data analysis; today's dashboards.", "out": [{"to": "era-4/43", "t": "William Playfair invents the line and bar chart (pie chart 1801)"}]}, {"t": "The uncomfortable card", "b": "<a class=\"xl\" href=\"#era-5/37\"><a class=\"xl\" href=\"#era-5/47\">Galton<\/a> and Pearson<\/a> built <a class=\"xl\" href=\"#era-6/1\">correlation<\/a> and regression in the service of eugenics; <a class=\"xl\" href=\"#era-6/18\">Fisher<\/a> too was entangled. Methods outlive motives — users must supply the ethics. Taught honestly, this is one of the site's most important cards.", "out": [{"to": "era-6/1", "t": "Pearson and Lee's Height Correlation Chart"}, {"to": "era-5/47", "t": "Galton Board"}, {"to": "era-6/18", "t": "R.A. Fisher"}, {"to": "era-5/37", "t": "Galton and Pearson"}]}, {"t": "\"Statistics\" contains \"state\"", "b": "censuses from Babylon to <a class=\"xl\" href=\"#era-5/43\">Hollerith<\/a> (1890) to modern \"big data\" — the same problem at 10¹⁵ scale.", "out": [{"to": "era-5/43", "t": "Herman Hollerith"}], "in": [{"to": "era-3/6", "t": "al-Kindi"}, {"to": "era-4/34", "t": "Graunt's Bills of Mortality and Halley's life table"}, {"to": "era-6/18", "t": "R.A. Fisher"}, {"to": "thread-L/8", "t": "The freeze"}, {"to": "thread-L/16", "t": "Case files"}, {"to": "thread-P/6", "t": "Closing card"}]}, {"t": "Closing card", "b": "<a class=\"xl\" href=\"#thread-P/5\">statistics<\/a> is the mathematics most adults actually need, and Thread L explains why school still teaches so little of it.", "out": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}]}]}, {"id": "thread-Q", "kind": "thread", "title": "Thread Q: Labor & Automation: Who Does the Work?", "sub": "", "cards": [{"t": "The Turk, twice", "b": "Kempelen's 1770 hoax hid a human inside the machine; Amazon's Mechanical Turk (2005) and today's global data-labeling workforce hide thousands of humans inside \"AI.\" Same card, 250 years apart — always ask who's inside the box."}, {"t": "The Luddites, corrected (1811)", "b": "machine-breaking as collective bargaining by other means, not technophobia — the most slandered workers in industrial history."}, {"t": "The computing proletariat", "b": "de <a class=\"xl\" href=\"#era-4/47\"><a class=\"xl\" href=\"#thread-A/3\">Prony's<\/a><\/a> pyramid → table factories → typing pools → comptometer rooms → \"computer\" quietly ceasing to be a job title (1950s–60s) → <a class=\"xl\" href=\"#era-5/31\">switchboard<\/a> automation (Strowger to direct dial) → phototypesetting ending hot-metal careers → the ATM paradox (teller employment *rose* for decades as cheap branches multiplied — automation reshapes rather than simply deletes).", "out": [{"to": "era-4/47", "t": "de Prony's logarithm project (France)"}, {"to": "era-5/31", "t": "Switchboard operators"}, {"to": "thread-A/3", "t": "de Prony's table project"}]}, {"t": "The contests as ritual", "b": "John Henry vs. the steam drill; the 1946 soroban vs. electric calculator match; <a class=\"xl\" href=\"#era-9/227\">Kasparov<\/a> (1997); Lee Sedol (2016) — cultures stage man-vs-machine duels at every threshold, and the site's students are living through the next one.", "out": [{"to": "era-9/227", "t": "Deep Blue defeats Kasparov"}]}, {"t": "Honest closing card", "b": "automation transitions are real, painful, uneven — and navigable. Every generation on this timeline adapted; <a class=\"xl\" href=\"#thread-E/2\">understanding<\/a> the machine, rather than merely operating or fearing it, has always been the strongest position. That is what this site is for.", "out": [{"to": "thread-E/2", "t": "Understanding what the machine does 10²⁵ times."}], "in": [{"to": "thread-J/17", "t": "Still secret now"}, {"to": "thread-O/7", "t": "Theme card"}]}]}, {"id": "thread-R", "kind": "thread", "title": "Thread R: Commerce as Computation", "sub": "", "cards": [{"t": "Writing was invented by accountants", "b": "<a class=\"xl\" href=\"#era-1/4\">Mesopotamian<\/a> tokens → clay envelopes → cuneiform (Era 1) — literacy itself is a spinoff of inventory.", "out": [{"to": "era-1/4", "t": "Mesopotamian clay tokens"}]}, {"t": "Pacioli's mirror (1494)", "b": "double-entry bookkeeping — debits equal credits, a checksum you can run by candlelight; Goethe called it one of the finest inventions of the human mind."}, {"t": "The infrastructure of trust", "b": "bills of exchange, interest tables, <a class=\"xl\" href=\"#thread-H/20\">ready reckoners<\/a> (Thread H4), actuarial tables (Thread P), the Medici network moving value as *messages* (Thread M).", "out": [{"to": "thread-H/20", "t": "Ready reckoners"}]}, {"t": "Speed is money", "b": "Reuters' pigeons, the Blanc brothers' telegraph hack (1834), the ticker tape (1867), and today's microwave HFT links (Thread M5) — finance has always bought the fastest channel first."}, {"t": "The retail stack", "b": "cash registers → the barcode's first beep (1974, a pack of Wrigley's gum) → credit-card networks authorizing billions of transactions → the ATM (1967) → <a class=\"xl\" href=\"#era-9/19\">VisiCalc<\/a> putting a ledger in every <a class=\"xl\" href=\"#era-5/22\">office<\/a> (Era 9).", "out": [{"to": "era-5/22", "t": "Office machine boom"}, {"to": "era-9/19", "t": "VisiCalc"}]}, {"t": "The tally stick reborn", "b": "blockchain (2008) — distributed, unforgeable, split-record ledgers; Era 5's burned sticks would recognize the idea instantly."}, {"t": "Theme card", "b": "from clay tokens to high-frequency trading, commerce has been computation's most reliable paymaster — most machines on this timeline were bought to count money."}]}, {"id": "thread-S", "kind": "thread", "title": "Thread S: The Card and the Link: From Library to HyperCard", "sub": "", "cards": [{"t": "Alexandria's Pinakes (Era 2)", "b": "the catalog is older than almost everything it catalogs.", "in": [{"to": "era-2/19", "t": "The Library of Alexandria"}]}, {"t": "Monks as search engines", "b": "concordances and indexes compiled by hand — years of labor to let a reader \"query\" scripture; the florilegium as a curated feed."}, {"t": "Cards take over", "b": "Gesner's paper slips (1540s); revolutionary France catalogs seized libraries on the backs of playing cards (1790s); the card catalog and Dewey standardize retrieval."}, {"t": "Otlet's Mundaneum (1910)", "b": "12 million cards, a query-by-mail service, and a 1934 vision of screens networked to a universal repository — a paper <a class=\"xl\" href=\"#thread-M/6\">internet<\/a>, dreamed in Brussels.", "out": [{"to": "thread-M/6", "t": "The Victorian Internet (Standage's framing)"}]}, {"t": "The lineage of the dream", "b": "Bush's Memex (1945) → Licklider's \"Man-Computer Symbiosis\" (1960) → <a class=\"xl\" href=\"#era-8/147\">Engelbart's<\/a> Demo (1968) → Nelson's hypertext and Xanadu (1965) → PLATO's community (1960s–70s) → Kay's <a class=\"xl\" href=\"#era-9/0\">Dynabook<\/a> → PARC's Alto → <a class=\"xl\" href=\"#era-9/141\">Macintosh<\/a> (1984).", "out": [{"to": "era-8/147", "t": "Engelbart's \"Mother of All Demos\""}, {"to": "era-9/0", "t": "Dynabook and Xerox PARC's Alto"}, {"to": "era-9/141", "t": "Macintosh"}]}, {"t": "HyperCard (1987)", "b": "Atkinson's \"software erector set\" — teachers, artists, and kids building linked-card stacks without \"programming\"; *Myst* was built in it; Ward Cunningham designed the first wiki as \"<a class=\"xl\" href=\"#era-9/137\">HyperCard<\/a> for the web\"; countless classrooms made their first software in it.", "out": [{"to": "era-9/137", "t": "HyperCard (Bill Atkinson, Apple)"}], "in": [{"to": "era-7/39", "t": "Vannevar Bush's Memex (\"As We May Think\")"}, {"to": "era-9/141", "t": "Macintosh"}]}, {"t": "The Web (1991)", "b": "hypertext's global victory — and a card on what was lost (two-way links, Xanadu's transclusion and micropayment dreams)."}, {"t": "Mission card", "b": "this site is deliberately built as a HyperCard-style stack. Its *form* is an artifact from its own timeline — students navigate the history of computation using a beloved piece of it."}]}, {"id": "thread-T", "kind": "thread", "title": "Thread T: The Harmony Thread: music, myth & the mathematical universe", "sub": "", "cards": [{"t": "The monochord (Era 2)", "b": "Pythagorean legend — hammers in a smithy, then a <a class=\"xl\" href=\"#thread-A/10\">single<\/a> string divided — reveals that <a class=\"xl\" href=\"#thread-T/8\">consonance<\/a> lives in small whole-number ratios; the first physical law expressed numerically, and the founding *proof* that <a class=\"xl\" href=\"#era-10/17\">nature<\/a> obeys mathematics.", "ch": "The music of the spheres", "out": [{"to": "thread-A/10", "t": "Single modern AI GPU"}, {"to": "era-10/17", "t": "Nature computes"}, {"to": "thread-T/8", "t": "Consonance as coincidence"}], "in": [{"to": "thread-T/3", "t": "The metaphor that never died"}]}, {"t": "Musica universalis", "b": "Plato's *Timaeus* tunes the world-soul; Cicero's *Dream of Scipio* lets Scipio *hear* the planets; <a class=\"xl\" href=\"#era-3/0\">Boethius<\/a> (Era 3) transmits the doctrine and plants music in the **quadrivium** — for a millennium, the educated studied music as a branch of mathematics, between arithmetic and astronomy.", "ch": "The music of the spheres", "out": [{"to": "era-3/0", "t": "Boethius' *De institutione musica"}]}, {"t": "Kepler's wager (1619)", "b": "if the heavens are harmonic, their chords can be computed — and inside *<a class=\"xl\" href=\"#era-4/14\">Harmonices<\/a> Mundi*, amid planetary scales and angelic choirs, sits the third law of planetary <a class=\"xl\" href=\"#era-5/49\"><a class=\"xl\" href=\"#era-8/74\">motion<\/a><\/a>. Mysticism, methodically pursued, delivered mechanics.", "ch": "The music of the spheres", "out": [{"to": "era-5/49", "t": "Stop Motion Animation"}, {"to": "era-4/14", "t": "Kepler's *Harmonices Mundi"}, {"to": "era-8/74", "t": "Stop Motion Animation of Physical 3D Map"}]}, {"t": "The metaphor that never died", "b": "modern physics still speaks of vibrating strings, resonant modes, and harmonics — from spectroscopy to quantum mechanics, <a class=\"xl\" href=\"#era-2/11\"><a class=\"xl\" href=\"#thread-T/0\">the monochord<\/a><\/a>'s vocabulary runs straight through science.", "ch": "The music of the spheres", "out": [{"to": "thread-T/0", "t": "The monochord (Era 2)"}, {"to": "era-2/11", "t": "The monochord"}]}, {"t": "*Harmonie universelle* (1636)", "b": "~1,500 pages measuring everything <a class=\"xl\" href=\"#thread-T/16\">musical<\/a> — construction, dimensions, stringing, and technique for lutes, viols, violins, keyboards, winds, drums, and bells, so precisely recorded that modern luthiers still reconstruct 17th-century instruments from it.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "thread-T/16", "t": "Musical and constructed tongues"}], "in": [{"to": "era-9/220", "t": "GIMPS"}]}, {"t": "The string laws", "b": "vary one thing at a time — length, tension (weights hung from strings), thickness, material (gut, brass, even gold wire) — yielding frequency ∝ (1/L)·√(T/μ). The conceptual leap: pitch is a *rate of vibration*, a countable physical event, not an abstract proportion.", "ch": "Mersenne: the friar who counted sound", "in": [{"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}]}, {"t": "Counting sound itself", "b": "strings and ropes long enough that their swings can be counted by eye against a pulse — then the laws scale those slow counts up to hundreds of vibrations per second, assigning real numbers to <a class=\"xl\" href=\"#thread-T/16\">musical<\/a> notes for the first time. This is why he's called the father of acoustics.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "thread-T/16", "t": "Musical and constructed tongues"}]}, {"t": "The harmonic-series puzzle", "b": "one plucked string faintly sounds its octave, twelfth, and double octave *simultaneously* — how can one body vibrate at several rates at once? Mersenne posed the question over and over in letters; the answer (superposition of modes) took <a class=\"xl\" href=\"#era-4/27\">Sauveur<\/a>, Daniel Bernoulli, and finally <a class=\"xl\" href=\"#thread-T/23\">Fourier<\/a>. A friar's puzzlement drove a century of mathematics.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "thread-T/23", "t": "Fourier closes Mersenne's case (1822)"}, {"to": "era-4/27", "t": "Sauveur names \"acoustics\""}]}, {"t": "Consonance as coincidence", "b": "intervals sound sweet when their vibrations line up often — the octave every 2nd cycle, the fifth every 6th; dissonances rarely align. Not the modern account, but it moved consonance from number mysticism into physics, with intervals ranked on principle.", "ch": "Mersenne: the friar who counted sound", "in": [{"to": "thread-T/0", "t": "The monochord (Era 2)"}]}, {"t": "Computing equal temperament", "b": "the octave split into 12 identical semitones of ratio ¹²√2 ≈ 1.05946 — computed via mean proportionals (logarithms were brand new) and printed as string lengths for fretting. Fretted lutes practically forced equal temperament; <a class=\"xl\" href=\"#era-4/18\"><a class=\"xl\" href=\"#thread-T/23\">Mersenne's<\/a><\/a> arithmetic helped legitimize the tuning that now underlies nearly all Western music.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "thread-T/23", "t": "Fourier closes Mersenne's case (1822)"}, {"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}]}, {"t": "The combinatorics of song", "b": "factorials tabulated up to 64!; all **720 permutations of a six-note hexachord printed in full** across several pages; 22! melodies — sextillions — declared beyond all the world's singers. One of the first applications of combinatorics to an art, feeding straight into Leibniz's combinatorial dreams (see Llull, Era 3).", "ch": "Mersenne: the friar who counted sound"}, {"t": "The human internet hub", "b": "<a class=\"xl\" href=\"#era-4/18\"><a class=\"xl\" href=\"#thread-T/23\">Mersenne's<\/a><\/a> correspondence web — Descartes (whose first work, the *Compendium musicae*, was written for this circle), <a class=\"xl\" href=\"#era-4/22\">Galileo<\/a>, Fermat, <a class=\"xl\" href=\"#era-4/19\"><a class=\"xl\" href=\"#era-4/33\">Pascal<\/a><\/a>, Doni, experimenters across Europe testing echoes, resonance, sound underwater. Before journals existed, *he* was the network — and music was his test case proving <a class=\"xl\" href=\"#era-10/17\">nature<\/a> obeys mathematical law.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "era-4/33", "t": "Pascal & Fermat's correspondence"}, {"to": "era-4/22", "t": "Galileo Thermometer"}, {"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "thread-T/23", "t": "Fourier closes Mersenne's case (1822)"}, {"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}, {"to": "era-10/17", "t": "Nature computes"}]}, {"t": "Still in the machine", "b": "Mersenne primes (2^p−1) drive GIMPS, the distributed search that finds nearly every record prime (Era 9), and the *Mersenne Twister* generates the random numbers inside countless simulations. Four centuries on, the friar's name is compiled into running code.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The Tower of Babel", "b": "the myth of one lost universal tongue — and the centuries-long scholarly quest to recover or rebuild the \"Adamic language\" in which words perfectly matched things.", "ch": "Babel and the perfect language"}, {"t": "The 17th-century projects", "b": "Dalgarno's and <a class=\"xl\" href=\"#era-4/25\">Wilkins's<\/a> constructed philosophical languages (1668) classify all of reality into a symbol system — Borges made Wilkins famous again; Leibniz turns the quest computational: a *characteristica universalis* plus a *<a class=\"xl\" href=\"#era-8/11\">calculus<\/a> ratiocinator*, so that disputes end with \"let us calculate\" (Thread C; Llull, Era 3).", "ch": "Babel and the perfect language", "out": [{"to": "era-4/25", "t": "Wilkins's *Real Character"}, {"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}]}, {"t": "Babel answered sideways", "b": "the perfect language never arrived for humans — it arrived for machines. Boole's algebra, Frege's <a class=\"xl\" href=\"#thread-T/21\">notation<\/a>, and finally programming languages and protocols: humanity's actual universal tongues turned out to be code and TCP/IP (Thread M).", "ch": "Babel and the perfect language", "out": [{"to": "thread-T/21", "t": "Notation is a program"}]}, {"t": "Musical and constructed tongues", "b": "<a class=\"xl\" href=\"#era-5/7\">Solresol<\/a> (1827) — words made of do-re-mi, equally speakable, singable, playable, or whistled; Esperanto; Interlingua feeding the first machine-translation dreams (Era 8).", "ch": "Babel and the perfect language", "out": [{"to": "era-5/7", "t": "Solresol"}], "in": [{"to": "era-2/11", "t": "The monochord"}, {"to": "era-3/20", "t": "Guido of Arezzo"}, {"to": "era-4/20", "t": "Kircher's *Musurgia universalis* and arca musarithmica"}, {"to": "era-9/140", "t": "MIDI"}, {"to": "thread-T/4", "t": "*Harmonie universelle* (1636)"}, {"to": "thread-T/6", "t": "Counting sound itself"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}]}, {"t": "The mythic tongue", "b": "the secret speech of birds granted to Solomon and Siegfried, the alchemists' \"green language,\" Attar's *Conference of the Birds* (1177) — a spiritual quest structured like an algorithm, thirty birds seeking the one.", "ch": "The language of the birds"}, {"t": "From myth to data", "b": "<a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> transcribes birdsong into staff <a class=\"xl\" href=\"#thread-T/21\">notation<\/a> (1650) — animal sound becomes recordable information; his arca musarithmica composes by combinatorial lookup.", "ch": "The language of the birds", "out": [{"to": "thread-T/21", "t": "Notation is a program"}, {"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}]}, {"t": "The modern research program", "b": "bioacoustics and machine learning now parse whale codas, birdsong syntax, and bee dances — today's AI projects to decode animal <a class=\"xl\" href=\"#era-7/30\">communication<\/a> are the language of the birds pursued with GPUs.", "ch": "The language of the birds", "out": [{"to": "era-7/30", "t": "Shannon's \"A Mathematical Theory of Communication\""}]}, {"t": "Cross-links", "b": "whistled human languages (Thread M) and <a class=\"xl\" href=\"#thread-K/20\">talking drums<\/a> (Thread K) — <a class=\"xl\" href=\"#era-9/53\">people<\/a> already speak in pitch.", "ch": "The language of the birds", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}, {"to": "thread-K/20", "t": "Talking drums (West/Central Africa)"}], "in": [{"to": "thread-L/23", "t": "How We Came to Teach Math This Way"}]}, {"t": "Notation is a program", "b": "Guido's staff (Era 3) plots pitch against time — arguably the first graph — and a score is a set of instructions executed by performers; the player-piano roll is literally a punched program, <a class=\"xl\" href=\"#era-5/1\">Jacquard<\/a>'s first cousin; MIDI (1983) turns performance into a live data stream.", "ch": "Music as computation", "out": [{"to": "era-5/1", "t": "Jacquard loom"}], "in": [{"to": "era-4/20", "t": "Kircher's *Musurgia universalis* and arca musarithmica"}, {"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-H/0", "t": "Roman numerals are a recording notation, nearly useless for arithmet…"}, {"to": "thread-H/2", "t": "Key card for students"}, {"to": "thread-T/15", "t": "Babel answered sideways"}, {"to": "thread-T/18", "t": "From myth to data"}]}, {"t": "Algorithmic composition, four centuries deep", "b": "<a class=\"xl\" href=\"#era-4/20\"><a class=\"xl\" href=\"#era-4/21\"><a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a>'s<\/a><\/a> box (1650) → 18th-century <a class=\"xl\" href=\"#thread-T/16\">musical<\/a> dice games → <a class=\"xl\" href=\"#thread-K/19\"><a class=\"xl\" href=\"#era-4/24\">change<\/a> ringing<\/a>'s permutation \"programs\" (Era 4) → the *Illiac Suite* and MUSIC I (1957) → today's generative AI music.", "ch": "Music as computation", "out": [{"to": "era-4/20", "t": "Kircher's *Musurgia universalis* and arca musarithmica"}, {"to": "thread-K/19", "t": "Change ringing (Era 4)"}, {"to": "era-4/24", "t": "Change ringing formalized (Fabian Stedman, England)"}, {"to": "thread-T/16", "t": "Musical and constructed tongues"}, {"to": "era-4/21", "t": "Kircher's engines of everything"}, {"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}], "in": [{"to": "era-2/5", "t": "Rhind Mathematical Papyrus (Egypt)"}, {"to": "era-4/20", "t": "Kircher's *Musurgia universalis* and arca musarithmica"}]}, {"t": "Fourier closes Mersenne's case (1822)", "b": "every sound is a sum of sines; with the FFT (Era 8) this becomes the arithmetic inside MP3s, Auto-Tune, speech recognition, and every phone call — your earbuds run 19th-century heat theory <a class=\"xl\" href=\"#era-9/189\">answering<\/a> a 17th-century friar's question.", "ch": "Music as computation", "out": [{"to": "era-9/189", "t": "Durrell Bishop's Marble Answering Machine"}], "in": [{"to": "era-4/27", "t": "Sauveur names \"acoustics\""}, {"to": "era-5/5", "t": "Fourier's *Théorie analytique de la chaleur"}, {"to": "thread-T/7", "t": "The harmonic-series puzzle"}, {"to": "thread-T/9", "t": "Computing equal temperament"}, {"to": "thread-T/11", "t": "The human internet hub"}]}, {"t": "The hearing sciences", "b": "<a class=\"xl\" href=\"#era-4/27\">Sauveur<\/a> names acoustics (1701); Helmholtz dissects hearing with resonators (1863) — the ear itself revealed as a frequency analyzer.", "ch": "Music as computation", "out": [{"to": "era-4/27", "t": "Sauveur names \"acoustics\""}]}, {"t": "Theme card", "b": "music was the laboratory where the West first learned that number governs <a class=\"xl\" href=\"#era-10/17\">nature<\/a> — the quadrivium's bridge from arithmetic to physics. Every audio app is downstream of a monochord, and a student practicing scales is running the oldest experiment in mathematical physics.", "ch": "Music as computation", "out": [{"to": "era-10/17", "t": "Nature computes"}]}]}, {"id": "thread-U", "kind": "thread", "title": "Thread U: The Hermetic Thread: esotericism and the making of science", "sub": "", "cards": [{"t": "The Emerald Tablet and the Corpus Hermeticum", "b": "\"as above, so below\" — texts attributed to Hermes Trismegistus and believed older than Moses; in 1463 Cosimo de' Medici orders <a class=\"xl\" href=\"#era-3/16\">Ficino<\/a> to set Plato aside and translate Hermes *first*. The <a class=\"xl\" href=\"#thread-U/1\">Renaissance<\/a> reboots with magic at the front of the queue.", "ch": "The current", "out": [{"to": "era-3/16", "t": "Ficino translates the Corpus Hermeticum"}, {"to": "thread-U/1", "t": "The Renaissance magi"}], "in": [{"to": "era-3/16", "t": "Ficino translates the Corpus Hermeticum"}, {"to": "era-4/29", "t": "Newton the alchemist"}, {"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}]}, {"t": "The Renaissance magi", "b": "Pico della Mirandola weds Kabbalah to philosophy; Agrippa's *De occulta philosophia* treats number as power; Giulio Camillo builds a walk-in Memory Theatre of all knowledge and Giordano Bruno turns memory palaces into combinatorial art — information architecture in occult dress (Thread S).", "ch": "The current", "in": [{"to": "era-3/16", "t": "Ficino translates the Corpus Hermeticum"}, {"to": "thread-U/0", "t": "The Emerald Tablet and the Corpus Hermeticum"}]}, {"t": "John Dee (Era 4)", "b": "the *Monas Hieroglyphica*'s cosmic glyph and the Mathematical Preface that sold Euclid to England's navigators and artisans; the imperial adviser with the realm's greatest <a class=\"xl\" href=\"#era-2/19\">library<\/a> also transcribed \"angelic\" language by scrying. One mind, both worlds, no contradiction felt.", "ch": "The current", "out": [{"to": "era-2/19", "t": "The Library of Alexandria"}]}, {"t": "the turn", "b": "Casaubon's philology dates the <a class=\"xl\" href=\"#era-4/9\">Hermetica<\/a> to late antiquity, the same year <a class=\"xl\" href=\"#era-4/8\">Napier<\/a> publishes logarithms — the prestige of <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> magic starts falling just as computational power starts <a class=\"xl\" href=\"#thread-L/14\">compounding<\/a>.", "d": "1614", "ch": "The current", "out": [{"to": "era-4/8", "t": "John Napier: logarithms"}, {"to": "era-4 a distance — was attacked by mechanist critics (Leibniz among them) as an \"occult quality.\" A mind at home with hidden forces could accept the equation his rationalist rivals gagged on. The mysticism may have *enabled* the physics.", "ch": "Newton, the last of the magicians", "out": [{"to": "thread-J/1", "t": "Invisible inks from antiquity through both World Wars; the Cardan gril…"}]}, {"t": "Computing doomsday", "b": "<a class=\"xl\" href=\"#era-4/29\"><a class=\"xl\" href=\"#thread-U/4\">Newton<\/a><\/a> applied his calculating powers to biblical chronology, concluding in one manuscript that the apocalypse would come \"not before 2060\" — the supreme calculator, running eschatology as arithmetic.", "ch": "Newton, the last of the magicians", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "era-4/29", "t": "Newton the alchemist"}]}, {"t": "Still being decrypted", "b": "the Chymistry of Isaac <a class=\"xl\" href=\"#era-4/29\"><a class=\"xl\" href=\"#thread-U/4\">Newton<\/a><\/a> <a class=\"xl\" href=\"#era-6/39\">project<\/a> is digitizing the alchemical papers now — an archive suppressed for centuries not by classification (Thread J) but by embarrassment.", "ch": "Newton, the last of the magicians", "out": [{"to": "era-6/39", "t": "WPA Mathematical Tables Project"}, {"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "era-4/29", "t": "Newton the alchemist"}]}, {"t": "For Leibniz, binary was theology", "b": "1 as God, 0 as nothing — creation *ex nihilo* re-enacted inside every number. He designed a medallion celebrating it: *omnibus ex nihilo ducendis sufficit unum* — \"to derive everything from nothing, one suffices.\"", "ch": "Leibniz, the binary God, and the I Ching"}, {"t": "1701–03", "b": "missionary Joachim <a class=\"xl\" href=\"#era-4/28\">Bouvet<\/a> mails him Shao Yong's circular hexagram <a class=\"xl\" href=\"#era-8/125\">diagram<\/a>; Leibniz recognizes the 64 figures as his binary numbers and publishes the connection in his memoir on binary arithmetic — <a class=\"xl\" href=\"#era-2/20\"><a class=\"xl\" href=\"#era-2/26\">Chinese<\/a><\/a> divination and <a class=\"xl\" href=\"#thread-L/9\">European<\/a> theology meeting inside the number system that would run every computer on Earth (Era 2).", "ch": "Leibniz, the binary God, and the I Ching", "out": [{"to": "era-2/20", "t": "Chinese counting rods and the suanpan (abacus)"}, {"to": "era-8/125", "t": "3D Sankey Diagram"}, {"to": "era-2/26", "t": "Chinese Seismoscope"}, {"to": "era-4/28", "t": "Leibniz, Bouvet, and the binary God"}, {"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}], "in": [{"to": "era-2/8", "t": "I Ching hexagrams (China)"}]}, {"t": "The Kabbalist cousin", "b": "<a class=\"xl\" href=\"#era-3/11\">Abulafia's<\/a> letter permutations and gematria (Era 3) belong to the same current as <a class=\"xl\" href=\"#era-3/12\">Llull's<\/a> wheels — sacred combinatorics that Leibniz inherited for his *ars combinatoria* and universal characteristic (Thread T).", "ch": "Leibniz, the binary God, and the I Ching", "out": [{"to": "era-3/11", "t": "Abraham Abulafia's letter permutations"}, {"to": "era-3/12", "t": "Ramon Llull's Ars Magna (Majorca)"}], "in": [{"to": "thread-U/18", "t": "Research programs harden into science"}]}, {"t": "Athanasius Kircher, S.J. (1602–1680)", "b": ", Collegio Romano: some forty books claiming nearly every subject, a famous museum, and a continental reputation as \"master of a hundred arts.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "in": [{"to": "era-8/10", "t": "Computer music begins"}, {"to": "thread-T/18", "t": "From myth to data"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}, {"to": "thread-U/15", "t": "The data network"}, {"to": "thread-U/17", "t": "The rival hub"}]}, {"t": "The media inventor", "b": "*Ars Magna Lucis et Umbrae* (1646) popularizes the magic lantern — projected images, the ancestor of cinema and every screen (Thread M); his museum featured statues speaking through hidden voice tubes and a piped \"Delphic oracle\" — immersive audio, 1670s; plus the arca musarithmica composition box (Thread T) and the notorious cat piano he described (mercifully, likely never built).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The knowledge engines", "b": "*Ars Magna Sciendi* (1669) rebuilds <a class=\"xl\" href=\"#era-3/12\">Llull's<\/a> combinatorics as a general logic of discovery; *Polygraphia nova* (1663) offers a universal writing-and-cipher scheme with a translation box — Babel-reversal as hardware (Thread T; Thread G).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "era-3/12", "t": "Ramon Llull's Ars Magna (Majorca)"}]}, {"t": "The data network", "b": "from *Magnes* (1641) on, <a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> compiled magnetic declination, tide, and astronomical reports mailed in by Jesuit missionaries worldwide — a standing, global, crowdsourced observation network centuries before \"citizen science.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}]}, {"t": "The lucky wrongness", "b": "his hieroglyph \"translations\" were mystical fantasy — but his claim that Coptic descends from <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> <a class=\"xl\" href=\"#era-2/7\">Egyptian<\/a> was *right* and underpinned Champollion's real decipherment; his microscope study of plague victims' blood (*Scrutinium Pestis*, 1658) reported \"little worms\" — pointing toward germ theory for partly wrong reasons; he had himself lowered toward Vesuvius' glowing crater for *Mundus Subterraneus* (1665) — wrong about the subterranean fire-channels, right that you should go look.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}, {"to": "thread-J/0", "t": "Ancient roots"}]}, {"t": "The rival hub", "b": "like Mersenne (Thread T), <a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> anchored a continental correspondence web; the young Leibniz wrote to him in admiration. Patron saint of interdisciplinarity — and a standing lesson that spectacular error, honestly pursued and publicly shared, can still drag knowledge forward.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}]}, {"t": "Research programs harden into science", "b": "harmony-hunting → celestial mechanics (Kepler, Thread T); alchemy → chemistry (Boyle worked the same furnaces); perfect-language dreams → symbolic logic and code (Thread T); memory arts → information architecture (Thread S); <a class=\"xl\" href=\"#thread-U/11\">Kabbalist<\/a> and Llullian combinatorics → Leibniz → Boole → circuits.", "ch": "Why this belongs on a computation timeline", "out": [{"to": "thread-U/11", "t": "The Kabbalist cousin"}], "in": [{"to": "era-4/13", "t": "Galileo's geometric and military compass (the sector)"}, {"to": "era-6/18", "t": "R.A. Fisher"}, {"to": "era-7/2", "t": "Stedman's 3D Periodic Table"}, {"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}, {"to": "thread-H/9", "t": "Research on expert abacus users suggests they shift arithmetic from ve…"}]}, {"t": "Astrology fed astronomy", "b": "Kepler cast horoscopes to pay for planet-hunting — \"astrology, the foolish daughter, feeds her wise <a class=\"xl\" href=\"#era-8/147\">mother<\/a> astronomy.\"", "ch": "Why this belongs on a computation timeline", "out": [{"to": "era-8/147", "t": "Engelbart's \"Mother of All Demos\""}]}, {"t": "Secrecy's training ground", "b": "alchemical ciphers, coded recipes, and priority-guarding anagrams (<a class=\"xl\" href=\"#era-4/22\">Galileo<\/a> announced discoveries to Kepler as scrambled letters) rehearsed the habits that became scientific priority claims and cryptographic practice (Thread J).", "ch": "Why this belongs on a computation timeline", "out": [{"to": "era-4/22", "t": "Galileo Thermometer"}]}, {"t": "The honest-history card", "b": "none of this endorses magic. It corrects the textbook myth of pure rationalists. The <a class=\"xl\" href=\"#thread-K/1\">founders<\/a> were whole <a class=\"xl\" href=\"#era-9/53\">people<\/a> chasing hidden order everywhere — and some of those hunts found mathematics. Motivation and method can be separated only in hindsight; today's \"of course\" was once somebody's heresy.", "ch": "Why this belongs on a computation timeline", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}, {"to": "thread-K/1", "t": "Founders' shelf"}]}, {"t": "The Yates card", "b": "20th-century scholarship (Frances Yates and successors) recovered this suppressed lineage. Like <a class=\"xl\" href=\"#era-7/6\"><a class=\"xl\" href=\"#thread-J/6\">Colossus<\/a><\/a> (Thread J), part of science's own history was long left out of the story — this time from embarrassment rather than classification. History is a computation that hasn't halted (Thread L).", "ch": "Why this belongs on a computation timeline", "out": [{"to": "thread-J/6", "t": "Colossus erased"}, {"to": "era-7/6", "t": "Colossus (Bletchley Park)"}]}]}, {"id": "contents", "kind": "apparatus", "title": "Contents", "sub": "the whole archive, in order", "cards": [{"t": "Contents", "b": "", "special": "contents"}]}, {"id": "index", "kind": "apparatus", "title": "Index", "sub": "every name, alphabetically", "cards": [{"t": "Index", "b": "", "special": "index"}]}, {"id": "glossary", "kind": "apparatus", "title": "Glossary", "sub": "terms, as the cards define them", "cards": [{"t": "Glossary", "b": "", "special": "glossary"}]}]};

function shortName(st){

}
function cardYear(cd){
  const d = cd && cd.d; if(!d) return null;
  const bce = /BCE|BC\b/i.test(d);
  const mm = String(d).replace(/,/g,"").match(/(-?\d{1,6})/);

  const v = parseInt(mm[1],10);
  return bce ? -v : v;
}
function linkTerms(cd){
  const t=(cd.t||"").trim();
  if(!t || STOP_TITLE.has(t.toLowerCase())) return [];
  let base = t.replace(/\s*\([^)]*\)/g," ").replace(/\s+[-\u2013\u2014]\s+.*$/,"").trim()
              .replace(/^[\s.,:;'"]+|[\s.,:;'"]+$/g,"");
  const out=new Set();
  if(base.length>=9 && base.split(/\s+/).length>=2 && !COMMON.has(base.toLowerCase())) out.add(base);
  const names = base.match(/\b[A-Z][a-z\u00c0-\u024f]{4,}(?:['\u2019][a-z]+)?\b/g)||[];
  names.forEach(w=>{ if(!COMMON.has(w.toLowerCase())) out.add(w); });
  if(base.split(/\s+/).length===1 && base.length>=7 && !COMMON.has(base.toLowerCase())) out.add(base);
  return [...out].filter(x=>x.length>=6);
}

function humanTime(sec){

  if(sec<3600) return Math.round(sec/60)+" min";
  if(sec<86400) return Math.round(sec/3600)+" h";

}
function nearestTo(pct){
  const W = T.undated ? 88 : 100;
  let best=null, bd=1e9;
  for(const p of T.pts){
    if(!visible(p)) continue;
    const d = Math.abs(xOf(p.y)*W/100 - pct);
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}
function initScale(){
  drawScale();
  const el = $("#scaleinner");
  el.addEventListener("mousemove", e=>{
    const r=el.getBoundingClientRect(), pct=(e.clientX-r.left)/r.width*100;
    const p=nearestTo(pct); const tip=$("#stip");
    if(!p){ tip.hidden=true; return; }
    tip.hidden=false;
    tip.textContent = (p.y<0? Math.abs(p.y)+" BCE" : p.y)+"  "+p.t;
    tip.style.left = Math.max(6, Math.min(94, pct))+"%";
  });
  el.addEventListener("mouseleave", ()=>{ $("#stip").hidden=true; });
  el.addEventListener("click", e=>{
    const r=el.getBoundingClientRect(), pct=(e.clientX-r.left)/r.width*100;
    const p=nearestTo(pct); if(p) location.hash = p.to;
  });
  $("#undband").addEventListener("click", e=>{
    e.stopPropagation();                 // sits inside the scale; do not travel twice
    location.hash = "undated/0";
  });
  $("#gear").addEventListener("click", ()=>{
    gear = gear==="deep" ? "century" : "deep";
    $("#gear").textContent = gear==="deep" ? "deep time" : "the filmed century";
    drawScale();
  });
}

function render(push=true){
  const st = STACKS[cur.s], cd = st.cards[cur.c];
  const want = `#${st.id}/${cur.c}`;
  if(push){ if(location.hash !== want) location.hash = want; }
  else if(location.hash !== want) history.replaceState(null,"",want);
  $("#stacklbl").textContent = st.title + (st.sub? " \u2014 "+st.sub : "");
  let h = `<div class="fade">`;
  h += `<div class="eyebrow"><span>${st.kind==="era"?"Timeline":"Stack"}</span>` +
       (cd.ch? `<span class="ch">${esc(cd.ch)}</span>`:"") + `</div>`;
  if(cd.d) h += `<span class="date">${esc(cd.d)}</span><br>`;
  h += `<h1 class="cardtitle">${md(esc(cd.t))}</h1>`;
  if(cd.special==="ladder") h += renderLadder();
  else if(cd.special==="contents") h += renderContents();
  else if(cd.special==="index"){ h += renderIndex(); setTimeout(wireIndex,0); }
  else if(cd.special==="glossary"){ h += renderGlossary(); setTimeout(wireGlossary,0); }
  else if(cd.special==="map") h += renderMap();
  else if(cd.kindc==="film") h += renderFilm(cd);
  else {
    if(cd.img) h += `<figure class="cardpic"><img src="${esc(cd.img)}" alt="" loading="lazy">` +
      (cd.cred? `<figcaption>${cd.credurl?`<a href="${esc(cd.credurl)}" target="_blank" rel="noopener">${esc(cd.cred)}</a>`:esc(cd.cred)}</figcaption>`:"") +
      `</figure>`;
    h += `<div class="body">${linkify(md(cd.b.includes("<")? cd.b : esc(cd.b)))}</div>`;
  }
  h += renderLinks(cd);
  h += `</div>`;
  $("#content").innerHTML = h;
  if(cd.special==="ladder"){ computeLadder(); $("#secs").addEventListener("input",computeLadder); }
  $("#progfill").style.width = ((cur.c+1)/st.cards.length*100)+"%";
  placeMark();
  $("#prevb").disabled = (cur.s===0 && cur.c===0);
  const lastStack = cur.s===STACKS.length-1, lastCard = cur.c===st.cards.length-1;
  $("#nextb").disabled = lastStack && lastCard;
  $("#nextstackb").style.display = lastStack? "none":"";
  $("#counter").textContent = `Card ${cur.c+1} of ${st.cards.length}`;
  window.scrollTo({top:0});
}
function go(s,c,push=true){ sheetOff(); cur={s:Math.max(0,Math.min(s,STACKS.length-1)),c:0};
  cur.c = Math.max(0,Math.min(c,STACKS[cur.s].cards.length-1)); render(push); }
function step(dir){
  let {s,c}=cur; c+=dir;
  if(c<0){ if(s>0){s--; c=STACKS[s].cards.length-1;} else c=0; }
  else if(c>=STACKS[s].cards.length){ if(s<STACKS.length-1){s++;c=0;} else c=STACKS[s].cards.length-1; }
  go(s,c);
}
function showSheet(){ sheetOn(); }
function fromHash(){
  const m = location.hash.replace(/^#/,"").split("/");
  if(m[0]==="films"){ sheetOn(false); return true; }
  if(byId[m[0]]!==undefined){ go(byId[m[0]], +(m[1]||0), false); return true; }
  return false;
}

function buildGo(){
  const g=$("#golist");
  let h = `<a href="#home/0">Home</a><div class="sep"></div><div class="grp">REFERENCE</div>`;
  ["contents","index","glossary"].forEach(id=>{
    if(byId[id]!==undefined) h += `<a href="#${id}/0">${esc(STACKS[byId[id]].title)}</a>`;
  });
  h += `<div class="sep"></div><div class="grp">TIMELINE</div>`;
  for(const s of STACKS) if(s.kind==="era") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  h += `<div class="sep"></div><div class="grp">THREADS</div>`;
  for(const s of STACKS) if(s.kind==="thread") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  g.innerHTML=h;
}
function wander(){
  const pool=[]; STACKS.forEach((s,i)=>s.cards.forEach((_,j)=>{ if(!(i===cur.s&&j===cur.c)) pool.push([i,j]); }));
  const [s,c]=pool[Math.floor(Math.random()*pool.length)]; go(s,c);
}
function doFind(q){
  q=q.trim().toLowerCase(); if(!q) return;
  const found={id:"found",kind:"thread",title:`Found: \u201c${q}\u201d`,sub:"",cards:[]};
  STACKS.forEach(s=>{ if(s.id==="found") return;
    s.cards.forEach((cd,j)=>{
      if((cd.t+" "+(cd.d||"")+" "+cd.b).toLowerCase().includes(q))
        found.cards.push({...cd, ch:s.title});
    });});
  if(!found.cards.length){ found.cards.push({t:"Nothing found", b:`No card mentions \u201c${esc(q)}\u201d. Try a shorter word \u2014 or add the card yourself (see Home).`}); }
  const i = byId["found"];
  if(i!==undefined) STACKS[i]=found; else { byId["found"]=STACKS.length; STACKS.push(found); }
  go(byId["found"],0);
}

document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="home") go(0,0);
  if(act==="sheet"){ e.preventDefault(); sheetOn(); }
  if(act==="wander") wander();
  if(act==="back") history.back();
  if(act==="find"){ $("#finddlg").showModal(); $("#findq").select(); }
  const menu=$("#gomenu"); if(menu.open && !e.target.closest("#gomenu")) menu.open=false;
  if(e.target.closest("#golist a")) menu.open=false;
});
$("#prevb").onclick=()=>step(-1);
$("#nextb").onclick=()=>step(1);
$("#nextstackb").onclick=()=>go(cur.s+1,0);
$("#findgo").onclick=()=>{ $("#finddlg").close(); doFind($("#findq").value); };
$("#findcancel").onclick=()=>$("#finddlg").close();
$("#findq").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#finddlg").close(); doFind($("#findq").value);} });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||$("#finddlg").open) return;
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
  if(e.key.toLowerCase()==="h") go(0,0);
  if(e.key.toLowerCase()==="w") wander();
  if(e.key.toLowerCase()==="f"){ e.preventDefault(); $("#finddlg").showModal(); $("#findq").select(); }
});
let tx=null;
document.addEventListener("touchstart",e=>{ tx=e.changedTouches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>60 && !$("#finddlg").open) step(dx<0?1:-1);
},{passive:true});
window.addEventListener("hashchange",()=>{ if(!fromHash()) sheetOn(false); });

buildGo();
initScale();
initSheet();
if(!fromHash()) sheetOn(false);   // no hash -> land on the films, as it was
</script>
</body>
</html>
