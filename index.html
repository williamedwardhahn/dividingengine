ical Teaching Map"}], "in": [{"to": "era-5/47", "t": "Galton Board"}, {"to": "era-6/1", "t": "Pearson and Lee's Height Correlation Chart"}, {"to": "thread-P/4", "t": "The uncomfortable card"}], "img": "media/cards/6092d0eddc0a.webp", "cred": "Eveleen Myers (née Tennant) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASir%20Francis%20Galton%2C%201890s.jpg"}, {"t": "Winogradsky Columns", "d": "1880", "b": "The Winogradsky column, invented by Sergei Winogradsky, consists in a transparent cylinder for analyzing microbial life by observing how the metabolism of micro-organisms evolve over time in stratified layers. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/winogradsky-column/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Klein's Mathematical Plaster Models", "d": "1880", "b": "In the 19th century, mathematicians became interested in the question how mathematical <a class=\"xl\" href=\"#era-6/25\">functions<\/a> look like. Felix Klein, a German mathematician, had several of such physical models in his lab in Göttingen, and popularized them in <a class=\"xl\" href=\"#era-9/157\">America<\/a> when he brought a boat… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/plaster-models-of-mathematical-functions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/157", "t": "All the Submarines of the United States of America"}, {"to": "era-6/25", "t": "Mathematical Functions Embodied in Ballistic Cams"}], "in": [{"to": "era-9/242", "t": "Jonathan Chertok's Mathematical Plaster Models"}, {"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}]}, {"t": "Ammassalik Wooden Maps", "d": "1885", "b": "These three-dimensional maps were carved by inuits from the Ammassalik Fjord in Greenland, and used as eyes-free guides for sailing. The left one shows coastline, the right one shows a sequence of offshore <a class=\"xl\" href=\"#era-5/51\"><a class=\"xl\" href=\"#thread-F/15\">islands<\/a><\/a>. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ammassalik-wooden-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "thread-F/15", "t": "Marshall Islands stick charts"}, {"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}], "in": [{"to": "era-7/4", "t": "Traffic Flow Profiles of the Interregional Highway System"}, {"to": "era-8/105", "t": "Charles Csuri's Numeric Milling Sculpture"}]}, {"t": "Marey's Movement Sculptures", "d": "1887", "b": "Bronze <a class=\"xl\" href=\"#era-8/105\">sculpture<\/a> showing the phases of the <a class=\"xl\" href=\"#era-8/62\">flight<\/a> of birds, created by French scientist Étienne-Jules Marey in 1887 based on photographs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mareys-movement-sculptures/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-8/62", "t": "Lunar Models for Preparing Moon Flight"}, {"to": "era-8/105", "t": "Charles Csuri's Numeric Milling Sculpture"}], "in": [{"to": "era-1/1", "t": "The Very First Sculptures"}, {"to": "era-8/44", "t": "3D Spectrogram"}, {"to": "era-8/105", "t": "Charles Csuri's Numeric Milling Sculpture"}, {"to": "era-8/123", "t": "Byron's Bender"}, {"to": "era-9/219", "t": "Loren Madsen's Early Data Sculptures"}, {"to": "thread-L/11", "t": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standard…"}]}, {"t": "Gaudí's Hanging Chain Models", "d": "1889", "b": "Spanish Catalan architect Antoni Gaudí disliked drawings and prefered to explore some of his designs — such as the unfinished <a class=\"xl\" href=\"#era-6/42\">Church<\/a> of Colònia Güell and the Sagrada Família — using scale models made of chains or weighted strings. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/gaudis-hanging-chain-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/42", "t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)"}]}, {"t": "Herman Hollerith", "b": "punched-card tabulators process the US Census in record time; his company later merges into **IBM**.", "d": "1890", "in": [{"to": "thread-P/5", "t": "\"Statistics\" contains \"state\""}], "img": "media/cards/881abeb91eca.webp", "cred": "Charles Milton Bell · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AHollerith.jpg"}, {"t": "Polynesian Genealogical Instrument", "d": "1890", "b": "This artefact from the Marquesas <a class=\"xl\" href=\"#era-5/51\"><a class=\"xl\" href=\"#thread-F/15\">Islands<\/a><\/a> (French Polynesia) served as a memory aid for reciting genealogies during ceremonies. Each thread, made of woven coconut fiber, is a genealogical line and each knot is a generation. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/polynesian-genealogical-instrument/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "thread-F/15", "t": "Marshall Islands stick charts"}, {"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}], "in": [{"to": "era-4/13", "t": "Galileo's geometric and military compass (the sector)"}, {"to": "era-4/39", "t": "George Adams' Solid Geometry Models"}, {"to": "era-10/19", "t": "AlphaFold 2"}]}, {"t": "Genaille–Lucas rulers", "b": "<a class=\"xl\" href=\"#era-4/10\"><a class=\"xl\" href=\"#era-4/8\">Napier<\/a>'s bones<\/a> perfected — multiplication by pure sight-reading, no carrying; a reminder that \"calculating aids\" kept evolving right up to the electronic age.", "d": "1891", "out": [{"to": "era-4/8", "t": "John Napier: logarithms"}, {"to": "era-4/10", "t": "Napier's bones"}], "in": [{"to": "thread-H/23", "t": "Specialized aids to the very end"}], "img": "media/cards/75914c00c4a4.webp", "cred": "Worrydream · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AGenaille-Lucas%20rulers%20example%202.png"}, {"t": "The Committee of Ten (US)", "b": "secondary mathematics standardized into arithmetic → algebra → geometry → trigonometry — the course sequence most students still walk today, frozen before the airplane flew (see Thread L).", "d": "1893", "in": [{"to": "thread-L/8", "t": "The freeze"}]}, {"t": "Galton Board", "d": "1893", "b": "The <a class=\"xl\" href=\"#era-5/37\">galton<\/a> board (named after and invented by Sir Francis Galton) is a physical device consisting of a vertical board with rows of interleaved pegs. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/galton-board/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/37", "t": "Galton and Pearson"}], "in": [{"to": "thread-P/4", "t": "The uncomfortable card"}]}, {"t": "James Ive's Mechanical Teaching Map", "d": "1896", "b": "The boundaries of the United <a class=\"xl\" href=\"#era-9/157\">States<\/a> transformed during the 19th century, often through violent means. Mapmaker James Ives created this mechanical map to help <a class=\"xl\" href=\"#era-9/53\">people<\/a>, especially students, visualize these changes. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/james-ives-mechanical-teaching-map/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}, {"to": "era-9/157", "t": "All the Submarines of the United States of America"}], "in": [{"to": "era-5/37", "t": "Galton and Pearson"}, {"to": "era-6/8", "t": "Felix Klein names the \"double discontinuity\""}, {"to": "era-10/8", "t": "Common Core & the CS-for-all push"}, {"to": "thread-J/9", "t": "The OCR connection"}]}, {"t": "Stop Motion Animation", "d": "1897", "b": "Stop motion <a class=\"xl\" href=\"#era-8/74\">animation<\/a> is the frame-by-frame capture of (generally) inanimate objects which are manipulated by increments in order to produce the illusion of motion. It was first used in movies to produce magical effects. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/stop-motion-animation/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-8/74", "t": "Stop Motion Animation of Physical 3D Map"}], "in": [{"to": "era-4/14", "t": "Kepler's *Harmonices Mundi"}, {"to": "era-5/20", "t": "Dewar's Brass Strip Models"}, {"to": "era-6/15", "t": "Wire Models of Factory Worker Movements"}, {"to": "era-8/74", "t": "Stop Motion Animation of Physical 3D Map"}, {"to": "thread-T/2", "t": "Kepler's wager (1619)"}]}, {"t": "Crookes' Vis Generatrix", "d": "1898", "b": "Model of Crookes’ \"Vis Generatrix\" made in 1898, built by his assistant, Gardiner. From: Proc. R. Soc. Lond. 63, 408. The vertical scale represents the atomic weight of the <a class=\"xl\" href=\"#era-2/18\">elements<\/a> from H = 1 to Ur = 239. Missing elements are represented with a white circle. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/crookes-vis-generatrix-periodic-table/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-2/18", "t": "Euclid's Elements"}]}, {"t": "Tallies Used as Social Displays on Pacific Islands", "d": "1898", "b": "In the 19th century, the <a class=\"xl\" href=\"#era-6/12\">Torres<\/a> Strait Islanders did not have a numeral system and used sticks to keep counts. Sticks were tied to a string, forming a bundle (called kupe) that could be rolled and unrolled when needed. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/tallies-used-as-social-displays-on-pacific-islands/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/12", "t": "Torres Quevedo"}], "in": [{"to": "era-5/40", "t": "Ammassalik Wooden Maps"}, {"to": "era-5/44", "t": "Polynesian Genealogical Instrument"}, {"to": "thread-F/15", "t": "Marshall Islands stick charts"}, {"to": "thread-K/8", "t": "Kinship algebra"}, {"to": "thread-K/10", "t": "Māori kōwhaiwhai rafter patterns and tukutuku lattice panels"}, {"to": "thread-M/0", "t": "Sound over distance"}, {"to": "thread-M/6", "t": "The Victorian Internet (Standage's framing)"}]}]}, {"id": "era-6", "kind": "era", "title": "Era 6: Human Computers, Analog Machines & Theory", "sub": "1900 – 1940", "cards": [{"t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)", "b": "women \"computers\" classify hundreds of thousands of stars; Leavitt's computed relation lets us measure the universe.", "d": "1870s–1920s", "in": [{"to": "era-4/7", "t": "Prosthaphaeresis"}, {"to": "thread-B/0", "t": "Human Computers"}], "img": "media/cards/e8a791bd919e.webp", "cred": "Harvard University Archives · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AObservatory%20women%20computers%2C%201891.jpg"}, {"t": "Pearson and Lee's Height Correlation Chart", "d": "1900", "b": "The physical model on the left is a bivariate histogram showing the correlation between the heights of fathers (horizontal axis) and sons (\"vertical\" axis). This data was famously collected by Karl <a class=\"xl\" href=\"#era-5/37\">Pearson<\/a> and Alice Lee between 1893 and 1898. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pearson-lee-height-correlation-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/37", "t": "Galton and Pearson"}], "in": [{"to": "era-5/37", "t": "Galton and Pearson"}, {"to": "era-7/4", "t": "Traffic Flow Profiles of the Interregional Highway System"}, {"to": "thread-P/4", "t": "The uncomfortable card"}]}, {"t": "Crum Brown's Mathematical Surface", "d": "1900", "b": "Model by <a class=\"xl\" href=\"#era-5/11\">Alexander<\/a> Crum Brown (1838-1922) of a half-twist mathematical surface, featuring a non-Euclidean so-called Klein bottle, c. 1900. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/browns-mathematical-surface/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/11", "t": "Alexander Bain patents the fax"}], "in": [{"to": "era-4/44", "t": "Chladni Plates"}, {"to": "era-6/34", "t": "Hayward's Moon Model"}, {"to": "era-7/12", "t": "Dymaxion Map & Folding Globe"}, {"to": "era-8/105", "t": "Charles Csuri's Numeric Milling Sculpture"}, {"to": "thread-I/4", "t": "The liquid brain (2003)"}, {"to": "thread-I/17", "t": "Soap films"}]}, {"t": "Modern Solid Terrain Modeling", "d": "1900", "b": "The Institute of Cartography ETH Zurich published a great review of past and present techniques for doing solid <a class=\"xl\" href=\"#era-9/243\">terrain<\/a> modeling. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-terrain-modeling-techniques/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/243", "t": "World's Largest Solid Terrain Model"}], "in": [{"to": "era-4/2", "t": "Plans-Reliefs"}, {"to": "era-9/33", "t": "Great Polish Map of Scotland"}, {"to": "era-9/243", "t": "World's Largest Solid Terrain Model"}]}, {"t": "Marconi's transatlantic wireless", "b": "the letter \"S\" crosses an ocean without wires; radio makes signals *broadcast* rather than routed.", "d": "1901", "in": [{"to": "thread-M/14", "t": "Radio"}], "img": "media/cards/b9e4859ab53e.webp", "cred": "Jonathan Adolf Wilhelm Zenneck · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ADrawing%20of%20Marconi%20Poldhu%20wireless%20station%201901.png"}, {"t": "Davenport's Physical Distributions", "d": "1901", "b": "In 1901, biologist <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-8/105\">Charles<\/a><\/a> Davenport \"built\" physical visualizations that show the distributions of features of objects and <a class=\"xl\" href=\"#era-9/53\">people<\/a>. These visualizations were made out of the objects and the people themselves. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/davenports-physical-distributions/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-9/53", "t": "People on a Giant World Map"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-8/105", "t": "Charles Csuri's Numeric Milling Sculpture"}]}, {"t": "Rubens Tube", "d": "1905", "b": "A Rubens tube, also known as a standing wave flame tube, or simply flame tube, is a physics apparatus for demonstrating acoustic standing waves in a tube. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/rubens-tube/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Pin Maps", "d": "1907", "b": " <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/pin-maps/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Felix Klein names the \"double discontinuity\"", "b": "university mathematics and school mathematics fail to connect in either direction — the feedback loop that lets curricula lag the <a class=\"xl\" href=\"#era-10/16\"><a class=\"xl\" href=\"#era-10/23\"><a class=\"xl\" href=\"#thread-A/11\">frontier<\/a><\/a><\/a> by generations (Thread L); Klein founds the first international commission on mathematics <a class=\"xl\" href=\"#era-5/48\">teaching<\/a> the same year.", "d": "1908", "out": [{"to": "thread-A/11", "t": "Frontier/exascale cluster"}, {"to": "era-10/23", "t": "Frontier AI training runs (~10²⁵–10²⁶ FLOPs)"}, {"to": "era-10/16", "t": "Frontier supercomputer"}, {"to": "era-5/48", "t": "James Ive's Mechanical Teaching Map"}]}, {"t": "Hilbert's program", "b": "23 problems, then the Entscheidungsproblem — can all mathematics be mechanically decided? \"We must know, we will know\": the dare that Gödel and <a class=\"xl\" href=\"#era-6/41\"><a class=\"xl\" href=\"#thread-J/19\">Turing<\/a><\/a> answer.", "d": "1900/1928", "out": [{"to": "era-6/41", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "thread-J/19", "t": "Alan Turing"}]}, {"t": "Otlet's Mundaneum (Brussels)", "b": "12+ million index cards <a class=\"xl\" href=\"#era-9/189\">answering<\/a> queries by mail and telegraph — a paper search <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">engine<\/a><\/a>; by 1934 Otlet sketches networked screens querying it remotely (Thread S).", "d": "1910", "out": [{"to": "era-9/189", "t": "Durrell Bishop's Marble Answering Machine"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}], "img": "media/cards/0b2c2b80bf97.webp", "cred": "Zinneke · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Mundaneum_Tir%C3%A4ng_Karteikaarten.jpg"}, {"t": "A Trip Through New York City in 1911", "b": "", "kindc": "film", "slug": "4k-60-fps-a-trip-through-new-york-city-in-1911", "status": "live", "d": "1911", "img": "media/yt/hZ1OgQL9_Cw.jpg", "dur": 515, "by": "Denis Shiryaev", "v": "hZ1OgQL9_Cw", "emb": "https://www.youtube-nocookie.com/embed/hZ1OgQL9_Cw?rel=0", "url": "https://www.youtube.com/watch?v=hZ1OgQL9_Cw"}, {"t": "Torres Quevedo", "b": "a *working* chess endgame automaton (no hidden human this time), essays anticipating floating-point arithmetic, and a remotely commanded electromechanical calculator — Spain's forgotten bridge between <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">Babbage<\/a><\/a> and the electronic age.", "d": "1912–20", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}], "in": [{"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}]}, {"t": "Frankfurt Streetcar Load", "d": "1913", "b": "Strips of woods glued on top of each other convey the average number of passengers carried between two stops. Each strip corresponds to 4,000 passengers. Shown at the 1913 International building trade exhibition in Leipzig. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/frankfurt-streetcar-load/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Solid 3D Curves for Engineering", "d": "1914", "b": "In his 1914 book, Brinton discusses various techniques for building solid models of three-dimensional charts and <a class=\"xl\" href=\"#era-6/25\">functions<\/a> for the purposes of engineering, and uses the two designs above as examples. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/solid-3d-curves-for-engineering/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-6/25", "t": "Mathematical Functions Embodied in Ballistic Cams"}], "in": [{"to": "era-4/38", "t": "Physical Splines"}, {"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}]}, {"t": "Wire Models of Factory Worker Movements", "d": "1915", "b": "3D wire models of hand <a class=\"xl\" href=\"#era-5/49\"><a class=\"xl\" href=\"#era-8/74\">motion<\/a><\/a> paths (or chronocyclegraphs) created by Frank Gilbreth, a pioneer in the study of motion in the workplace. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/wire-models-of-factory-worker-movements/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "era-5/49", "t": "Stop Motion Animation"}, {"to": "era-8/74", "t": "Stop Motion Animation of Physical 3D Map"}], "in": [{"to": "era-8/76", "t": "The Apollo Guidance Computer"}]}, {"t": "Yakama Time Ball", "d": "1920", "b": "Women from the Yakama Native American tribe used strings of hemp as personal diaries. Each major event in their life was represented by a knot, a bead or a shell. This mnemonic device is called an Ititamat, or counting-the-days ball, or simply time ball. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/yakama-time-ball/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Richardson's \"forecast factory\"", "b": "a fantasy of 64,000 human computers in a vast hall predicting weather in real time — the dream ENIAC fulfills in 1950.", "d": "1922", "in": [{"to": "era-7/41", "t": "ENIAC computes the first numerical weather forecasts"}], "img": "media/cards/e6e89fe4a62e.webp", "cred": "Author Jonathan Lawhead\n\nIllustrator Francois Schuiten · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AArtist%E2%80%99s%20conception%20of%20Lewis%20Richardson%E2%80%99s%20forecast%20factory.jpg"}, {"t": "R.A. Fisher", "b": "design of experiments, significance testing, modern <a class=\"xl\" href= out": [{"to": "era-6/0", "t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)"}, {"to": "era-6/39", "t": "WPA Mathematical Tables Project"}, {"to": "thread-A/3", "t": "de Prony's table project"}, {"to": "era-4/47", "t": "de Prony's logarithm project (France)"}, {"to": "era-7/14", "t": "Harvard Mark I (Aiken/IBM)"}]}]}, {"id": "thread-C", "kind": "thread", "title": "Thread C: Ideas", "sub": "the mathematics itself", "cards": [{"t": "Overview", "b": "Positional <a class=\"xl\" href=\"#thread-T/21\">notation<\/a> → zero → algorithms (<a class=\"xl\" href=\"#era-3/4\">al-Khwarizmi<\/a>) → logarithms → binary → Boolean logic → computability (<a class=\"xl\" href=\"#era-6/41\"><a class=\"xl\" href=\"#thread-J/19\">Turing<\/a><\/a>/<a class=\"xl\" href=\"#era-6/42\">Church<\/a>) → information theory (<a class=\"xl\" href=\"#thread-M/16\">Shannon<\/a>) → complexity theory (P vs NP, 1971 Cook) → machine proof.", "out": [{"to": "era-6/41", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "thread-T/21", "t": "Notation is a program"}, {"to": "era-3/4", "t": "al-Khwarizmi (House of Wisdom, Baghdad)"}, {"to": "thread-M/16", "t": "Shannon (1948)"}, {"to": "era-6/42", "t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)"}, {"to": "thread-J/19", "t": "Alan Turing"}]}]}, {"id": "thread-D", "kind": "thread", "title": "Thread D: Machines", "sub": "", "cards": [{"t": "Overview", "b": "Tally bone → <a class=\"xl\" href=\"#era-4/26\">abacus<\/a> → <a class=\"xl\" href=\"#era-2/24\">Antikythera<\/a> → astrolabe → <a class=\"xl\" href=\"#era-4/19\">Pascaline<\/a> → <a class=\"xl\" href=\"#era-5/1\">Jacquard loom<\/a> → <a class=\"xl\" href=\"#era-5/12\">Analytical<\/a> <a class=\"xl\" href=\"#era-5/6\">Engine<\/a> → tabulators → analog computers → ENIAC → transistor → IC → microprocessor → GPU → AI accelerators.", "out": [{"to": "era-5/1", "t": "Jacquard loom"}, {"to": "era-4/26", "t": "Wearable Abacus from the Qing Dynasty"}, {"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-2/24", "t": "Antikythera mechanism"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}]}]}, {"id": "thread-E", "kind": "thread", "title": "Thread E: Why Learn It by Hand?", "sub": "pedagogical cards", "cards": [{"t": "Every era's mathematicians practiced the previous era's methods.", "b": "Every era's mathematicians practiced the previous era's methods."}, {"t": "Estimation and error-checking (Glenn trusting Johnson over the machine…", "b": "Estimation and error-checking (Glenn trusting Johnson over the machine).", "in": [{"to": "era-8/144", "t": "NASA's human computers (Katherine Johnson, Dorothy Vaughan, Mary Jackson)"}, {"to": "thread-N/10", "t": "Closing card"}]}, {"t": "Understanding what the machine does 10²⁵ times.", "b": "Understanding *what* the machine does 10²⁵ times.", "in": [{"to": "era-9/197", "t": "NCTM standards and the \"Math Wars\""}, {"to": "thread-H/28", "t": "Closing card"}, {"to": "thread-Q/4", "t": "Honest closing card"}]}, {"t": "The tradition argument", "b": "hand arithmetic connects a student to the <a class=\"xl\" href=\"#era-1/2\">Ishango bone<\/a>.", "out": [{"to": "era-1/2", "t": "Ishango bone (Congo)"}], "img": "media/cards/f386082877b8.webp", "cred": "Gill, John · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20argument%20from%20apostolic%20tradition%20Fleuron%20T014010-2.png"}, {"t": "The internalization argument", "b": "soroban masters prove that a deeply practiced tool becomes a mental faculty (see Thread H2 — anzan)."}]}, {"id": "thread-F", "kind": "thread", "title": "Thread F: What Is a Number?", "sub": "cross-cultural conceptions of number & data", "cards": [{"t": "Egypt — number as measure. Number lives in physical quantities", "b": "the cubit (length), setat (area), hekat (grain volume), deben (weight), the 365-day civil calendar (time). Unit fractions exist for fair division — how to split 7 loaves among 10 workers. Mathematics is a scribe's craft, taught by worked example, validated by *working*: \"the correct method of reckoning.\"", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Greece — number as idea. Sharp split between arithmos (a multitude…", "b": "*<a class=\"xl\" href=\"#thread-L/2\">Greece<\/a> — number as idea.* Sharp split between *arithmos* (a multitude of discrete units) and *megethos* (continuous magnitude), and between *logistikē* (mere reckoning — low prestige, left to slaves and merchants) and *arithmētikē* (theory of number — philosophy). Mathematics is validated by *proof*: it must be shown to be necessarily true.", "ch": "Featured comparison stack: Egypt vs. Greece", "out": [{"to": "thread-L/2", "t": "Greece"}], "in": [{"to": "era-2/12", "t": "Pebble Voting"}, {"to": "era-2/13", "t": "Steganography enters history"}]}, {"t": "The twist", "b": "* Herodotus reports the Greeks learned geometry from <a class=\"xl\" href=\"#era-2/7\">Egyptian rope-stretchers<\/a>. Measurement became abstraction; the surveyor's craft became the philosopher's object.", "ch": "Featured comparison stack: Egypt vs. Greece", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}]}, {"t": "Contrast cards", "b": "* procedure vs. proof · scribe vs. philosopher · \"does it work?\" vs. \"why must it be true?\" · number embedded in things vs. number as a thing itself.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Payoff card for students", "b": "* every math student recapitulates both traditions — first you *compute* like an <a class=\"xl\" href=\"#era-2/7\">Egyptian<\/a> scribe, then you learn to *prove* like a Greek. Both are the tradition.", "ch": "Featured comparison stack: Egypt vs. Greece", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}]}, {"t": "Mesopotamia", "b": "* no <a class=\"xl\" href=\"#thread-A/10\">single<\/a> \"number\" at first — separate metrological systems for grain, land, silver, and time; the abstract sexagesimal system emerges from bureaucracy. Our hours, minutes, and degrees are its living fossil.", "ch": "Other conception-of-number cards", "out": [{"to": "thread-A/10", "t": "Single modern AI GPU"}], "img": "media/cards/5503bd2a63e8.webp", "cred": "SpeakingArch · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AClay%20Envelope%20%2C%20c.2034%20BCE%2C%20Umma%2C%20Mesopotamia.%20Currently%20at%20the%20RAMM%2C%20Exeter.jpg"}, {"t": "China", "b": "* number as a physical rod on a counting board — manipulable, spatial; negative numbers simply rods of another color.", "ch": "Other conception-of-number cards", "img": "media/cards/fd8fda3788d2.webp", "cred": "CEphoto, Uwe Aranas · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ABadaling%20China%20Great-Wall-of-China-01.jpg"}, {"t": "India", "b": "* numbers as Sanskrit words and verse (mathematics recited and memorized); zero and the infinite admitted as legitimate objects of calculation.", "ch": "Other conception-of-number cards", "img": "media/cards/e212305c07b9.webp", "cred": "Dennis G. Jarvis · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIndia-0037%20-%20Flickr%20-%20archer10%20%28Dennis%29.jpg"}, {"t": "Maya", "b": "* number as time — dates, calendar cycles, numbers personified as gods; base-20 with head-glyph numerals.", "ch": "Other conception-of-number cards"}, {"t": "Inca", "b": "* data without writing — knot type, knot position, cord color, and cord hierarchy as the fields of an imperial database.", "ch": "Other conception-of-number cards", "img": "media/cards/51a0457afeb4.webp", "cred": "Martin St-Amant (S23678) · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A80%20-%20Machu%20Picchu%20-%20Juin%202009%20-%20edit.2.jpg"}, {"t": "Bodies and bases", "b": "* base-5, 10, 20, 60; 27-body-part counting systems of Papua New Guinea; Yoruba base-20 with subtractive construction — the human body as the first numeral system.", "ch": "Other conception-of-number cards", "in": [{"to": "era-9/32", "t": "Planetenweg Uetliberg: The Solar System as a Hiking Path"}]}, {"t": "Data as length, weight, time, quantity", "b": "* a synthesis card — before number was abstract, every culture computed *with the world itself*: ropes, stones, beads, knots, shadows, <a class=\"xl\" href=\"#era-2/6\">water clocks<\/a>, balance scales.", "ch": "Other conception-of-number cards", "out": [{"to": "era-2/6", "t": "Water clocks (clepsydrae) (Egypt, then Babylon, Greece, China)"}]}, {"t": "I Ching (China)", "b": "64 hexagrams from binary lines — divination as combinatorics (see Era 2 and the Leibniz connection).", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/3ddda6a3b53b.webp", "cred": "Song era print artist · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:I_Ching_Song_Dynasty_print.jpg"}, {"t": "Ifá divination (Yoruba, West Africa)", "b": "256 odu <a class=\"xl\" href=\"#era-7/48\">generated<\/a> from 8 binary casts — exactly one byte of <a class=\"xl\" href=\"#era-9/157\">states<\/a>, each indexing a body of recited literature; a binary addressing system in ritual form.", "ch": "Computing without written numbers (embodied & ritual computation)", "out": [{"to": "era-7/48", "t": "Electricity Generated or Demanded"}, {"to": "era-9/157", "t": "All the Submarines of the United States of America"}], "img": "media/cards/9d6d19fc3275.webp", "cred": "Toluaye · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AJogo%20de%20Ikin%20Orossi.JPG"}, {"t": "Sona sand drawings (Chokwe, Angola/DR Congo)", "b": "single-line figures traced over dot grids by memorized rules — Eulerian paths and recursive algorithms executed as art.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/018bd84c953f.webp", "cred": "OmarTheKingFr · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKalunga-lusona.jpg"}, {"t": "Marshall Islands stick charts", "b": "ocean swell patterns and their interference around <a class=\"xl\" href=\"#era-5/51\">islands<\/a> encoded in lashed sticks and shells — an analog model of wave dynamics, memorized before the voyage and left ashore.", "ch": "Computing without written numbers (embodied & ritual computation)", "out": [{"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}], "in": [{"to": "era-5/40", "t": "Ammassalik Wooden Maps"}, {"to": "era-5/44", "t": "Polynesian Genealogical Instrument"}, {"to": "thread-M/0", "t": "Sound over distance"}], "img": "media/cards/3c3c242528cd.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMarshall%20Islands%20stick%20chart%2C%20Rebbelib%20type.%20LOC%202010586182.jpg"}, {"t": "Polynesian wayfinding", "b": "star compass, dead reckoning, and the etak reference-island system — voyages of thousands of miles computed continuously in the navigator's head.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/25d1c4813a2f.webp", "cred": "S. Percy Smith · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APolynesian%20navigation%20device%20showing%20directions%20of%20winds%2C%20waves%20and%20islands.jpg"}, {"t": "Mancala-family games (Africa, Middle East, Asia)", "b": "seed-counting and capture strategy — arithmetic and lookahead as play.", "ch": "Computing without written numbers (embodied & ritual computation)", "img": "media/cards/162a5a983b64.webp", "cred": "MozMozJ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Yao_People_Playing_%22Bawo%22.jpg"}, {"t": "Theme card", "b": "computation has always lived in ritual, art, navigation, and games — alongside and long before written mathematics.", "ch": "Computing without written numbers (embodied & ritual computation)"}]}, {"id": "thread-G", "kind": "thread", "title": "Thread G: Cryptography: computing to conceal and reveal", "sub": "", "cards": [{"t": "Overview", "b": "Caesar cipher (antiquity) → <a class=\"xl\" href=\"#era-3/6\">al-Kindi<\/a>'s frequency analysis (9th c.) → Alberti's cipher disk (1467) → Vigenère (1553) → <a class=\"xl\" href=\"#era-5/6\"><a class=\"xl\" href=\"#era-5/12\">Babbage<\/a><\/a> & Kasiski break it (1850s–63) → Rejewski's bomba vs. Enigma (1932) → Turing/Welchman Bombe & <a class=\"xl\" href=\"#era-7/6\"><a class=\"xl\" href=\"#thread-J/6\">Colossus<\/a><\/a> (1940s) → DES (1977) → Diffie–Hellman & RSA (1976–77) → elliptic <a class=\"xl\" href=\"#era-6/14\">curves<\/a> → Shor's quantum threat (1994) → NIST post-quantum standards (2024). Theme: an arms race that repeatedly *forced* the invention of faster computation — including the first programmable electronic computer.", "out": [{"to": "era-7/6", "t": "Colossus (Bletchley Park)"}, {"to": "era-3/6", "t": "al-Kindi"}, {"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}, {"to": "era-6/14", "t": "Solid 3D Curves for Engineering"}, {"to": "era-5/12", "t": "Babbage: Analytical Engine"}, {"to": "thread-J/6", "t": "Colossus erased"}]}]}, {"id": "thread-H", "kind": "thread", "title": "Thread H: The Art of Reckoning", "sub": "how people *actually* calculated", "cards": [{"t": "Roman numerals are a recording notation, nearly useless for arithmet…", "b": "Roman numerals are a *recording* <a class=\"xl\" href=\"#thread-T/21\">notation<\/a>, nearly useless for arithmetic — try multiplying XLVII × XXXIX on paper. Romans didn't; nobody did.", "ch": "The Roman paradox: numerals for writing, machines for computing", "out": [{"to": "thread-T/21", "t": "Notation is a program"}], "img": "media/cards/f3f4737d9ca1.webp", "cred": "Alex1011 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:CuttySarkRomNum.jpg"}, {"t": "Day-to-day arithmetic ran on pebbles (calculi) on lined counting boa…", "b": "Day-to-day arithmetic ran on **pebbles (calculi) on lined counting <a class=\"xl\" href=\"#era-9/246\"><a class=\"xl\" href=\"#era-9/247\">boards<\/a><\/a>** and on the **portable bronze hand <a class=\"xl\" href=\"#era-4/26\">abacus<\/a>** — grooved slots for units through millions, plus extra slots for base-12 fractions (unciae). A merchant's pocket device, ~2,000 years before the pocket calculator.", "ch": "The Roman paradox: numerals for writing, machines for computing", "out": [{"to": "era-4/26", "t": "Wearable Abacus from the Qing Dynasty"}, {"to": "era-9/247", "t": "Graph Boards"}, {"to": "era-9/246", "t": "Kanban Boards"}]}, {"t": "Key card for students", "b": "the numeral was the *output format*; the board was the *processor*. <a class=\"xl\" href=\"#thread-T/21\">Notation<\/a> ≠ computation.", "ch": "The Roman paradox: numerals for writing, machines for computing", "out": [{"to": "thread-T/21", "t": "Notation is a program"}]}, {"t": "Linguistic-fossils card", "b": "*<a class=\"xl\" href=\"#era-8/11\">calculus<\/a>/calculate* (<a class=\"xl\" href=\"#era-2/12\">pebble<\/a>), *exchequer* (the checkered counting cloth of the <a class=\"xl\" href=\"#thread-U/4\">English<\/a> treasury), the shop *counter* (the counting table), *bank* (the money-changer's bench where the board sat).", "ch": "The Roman paradox: numerals for writing, machines for computing", "out": [{"to": "thread-U/4", "t": "Newton translated the Emerald Tablet into English with commentary…"}, {"to": "era-8/11", "t": "Calculus reaches high school; the New Math follows"}, {"to": "era-2/12", "t": "Pebble Voting"}]}, {"t": "Counting boards with cast counters (jetons) remained standard across E…", "b": "Counting <a class=\"xl\" href=\"#era-9/246\"><a class=\"xl\" href=\"#era-9/247\">boards<\/a><\/a> with cast counters (jetons) remained standard across Europe into the 1600s–1700s. Samuel Pepys — Cambridge graduate, senior naval administrator — hired a tutor at age 29 (1662) to learn the multiplication table. Written arithmetic was a *specialist skill* long after board-reckoning was universal.", "ch": "The Roman paradox: numerals for writing, machines for computing", "out": [{"to": "era-9/246", "t": "Kanban Boards"}, {"to": "era-9/247", "t": "Graph Boards"}]}, {"t": "The suanpan (China, 2+5 beads) and soroban (Japan, 1+4 beads)…", "b": "The **suanpan** (China, 2+5 beads) and **soroban** (Japan, 1+4 beads) are not museum pieces — millions of children in Japan, China, Taiwan, Korea, India, and Southeast Asia train on them today in schools and after-school academies, with **kyū/dan ranking exams** graded like martial arts.", "ch": "The living abacus: East Asian abacus education today", "img": "media/cards/f84c90a8b15f.webp", "cred": "N509FZ · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AROC-era%20abacus%20at%20China%20National%20Museum%20of%20Women%20and%20Children%20%2820210909140914%29.jpg"}, {"t": "The schoty, Russia's abacus, was still clicking on shop counters i…", "b": "The **schoty**, Russia's <a class=\"xl\" href=\"#era-4/26\">abacus<\/a>, was still clicking on shop counters into the 1990s. Western Europe abandoned the counting board; most of the world never stopped.", "ch": "The living abacus: East Asian abacus education today", "out": [{"to": "era-4/26", "t": "Wearable Abacus from the Qing Dynasty"}], "img": "media/cards/f6846fa9a6a4.webp", "cred": "Syced · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAbacus%20actually%20in%20use%20at%20kimono%20shop%20in%20Otaru.jpg"}, {"t": "Anzan (暗算) — the internalized machine", "b": "advanced students stop needing the physical soroban. They visualize it and move imaginary beads — you can watch champions' fingers flicking over an empty desk. The machine has been *installed in the mind*.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Flash anzan", "b": "multi-digit numbers flashed on screen faster than they can be read aloud; top competitors correctly sum 15 three-digit numbers shown in under two seconds. National soroban championships and the Mental Calculation World Cup keep the tradition elite and alive.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Research on expert abacus users suggests they shift arithmetic from ve…", "b": "<a class=\"xl\" href=\"#thread-U/18\">Research<\/a> on <a class=\"xl\" href=\"#era-9/138\">expert<\/a> <a class=\"xl\" href=\"#era-4/26\">abacus<\/a> users suggests they shift arithmetic from verbal processing toward **visuospatial imagery** — they compute with a mental picture rather than with inner speech.", "ch": "The living abacus: East Asian abacus education today", "out": [{"to": "era-9/138", "t": "Expert systems and the AI winters"}, {"to": "era-4/26", "t": "Wearable Abacus from the Qing Dynasty"}, {"to": "thread-U/18", "t": "Research programs harden into science"}], "in": [{"to": "era-4/13", "t": "Galileo's geometric and military compass (the sector)"}, {"to": "era-6/18", "t": "R.A. Fisher"}, {"to": "era-7/2", "t": "Stedman's 3D Periodic Table"}, {"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}]}, {"t": "The payoff card (core to the site's thesis):", "b": "the tool does not replace the skill — practiced deeply enough, the tool *becomes* the skill. A student who masters a calculating machine ends up carrying it in their head. This is the strongest answer to \"why practice by hand when machines exist?\"", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Finger reckoning (dactylonomy)", "b": "Bede's system to 9,999; Mediterranean and Middle Eastern market-traders' finger systems; complement-based finger multiplication for the 6–10 times tables — arithmetic carried on the body.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/11389e04dd59.webp", "cred": "Wound theology · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFinger%20reckoning%20cropped%20from%20Wellcome%20Library%20MS.509.jpg"}, {"t": "Doubling and halving", "b": "<a class=\"xl\" href=\"#era-2/7\">Egyptian<\/a> multiplication by repeated doubling, and its folk survival, \"Russian peasant multiplication\" — secretly *binary multiplication*, the method inside every CPU today. (Superb card: the pharaoh's scribe and the microchip run the same algorithm.)", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}], "in": [{"to": "era-1/2", "t": "Ishango bone (Congo)"}, {"to": "era-2/5", "t": "Rhind Mathematical Papyrus (Egypt)"}]}, {"t": "Table lookup as a way of life", "b": "<a class=\"xl\" href=\"#era-2/4\">Babylonian<\/a> multiplication and reciprocal tablets; <a class=\"xl\" href=\"#era-2/27\">Ptolemy's<\/a> chords; <a class=\"xl\" href=\"#era-3/17\"><a class=\"xl\" href=\"#thread-L/3\">medieval<\/a><\/a> computus tables for Easter; Toledan and Alfonsine astronomical tables. For most of history, \"computing\" largely meant *looking up* someone else's frozen labor.", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "thread-L/3", "t": "Medieval universities"}, {"to": "era-3/17", "t": "Medieval counting houses & jetons"}, {"to": "era-2/4", "t": "Babylonian mathematical tablets"}, {"to": "era-2/27", "t": "Ptolemy's Almagest"}]}, {"t": "Quarter-square multiplication", "b": "ab = [(a+b)² − (a−b)²]/4 — multiply using only a table of squares plus addition and subtraction; used from Babylon to 19th-century table books.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Lattice (gelosia) multiplication", "b": "the grid method from <a class=\"xl\" href=\"#thread-K/21\">Indian<\/a>/Islamic mathematics, standard in the abbaco schools — and now back in modern elementary classrooms.", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "thread-K/21", "t": "Indian tala"}], "in": [{"to": "era-3/14", "t": "Italian abbaco schools (scuole d'abbaco)"}], "img": "media/cards/ee57a6a04236.webp", "cred": "Brigban · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3ALattice%20multiplication%20step%203.jpg"}, {"t": "Casting out nines", "b": "the universal error-check of hand arithmetic, transmitted through <a class=\"xl\" href=\"#era-3/4\">al-Khwarizmi<\/a>'s tradition — checksum logic centuries before checksums.", "ch": "Before Napier: the toolkit of tricks", "out": [{"to": "era-3/4", "t": "al-Khwarizmi (House of Wisdom, Baghdad)"}]}, {"t": "Prosthaphaeresis", "b": "trigonometric identities as a multiplication machine (see Era 4) — proof that the *hunger* for fast multiplication predates the means.", "ch": "Before Napier: the toolkit of tricks", "img": "media/cards/74a56a50fa54.webp", "cred": "Dominic3203 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AProof%20for%20Sum-to-Product%20Identities.jpg"}, {"t": "Logarithm tables (Briggs onward)", "b": "the <a class=\"xl\" href=\"#thread-A/10\">single<\/a> most important calculating aid of the scientific era; <a class=\"xl\" href=\"#era-8/16\">engineers<\/a>, navigators, gunners, and schoolchildren computed with them into the 1970s.", "ch": "After Napier: three centuries of augmented hand-calculation", "out": [{"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}, {"to": "thread-A/10", "t": "Single modern AI GPU"}], "img": "media/cards/9d3139a3bdc0.webp", "cred": "Matthias Bernegger · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Bernegger_Manuale_136.jpg"}, {"t": "The slide rule", "b": "logarithms made physical — analog multiplication at a glance; \"slipstick\" culture, belt holsters, carried aboard <a class=\"xl\" href=\"#era-8/76\"><a class=\"xl\" href=\"#thread-O/3\">Apollo<\/a><\/a> as backup.", "ch": "After Napier: three centuries of augmented hand-calculation", "out": [{"to": "thread-O/3", "t": "Core rope & Apollo"}, {"to": "era-8/76", "t": "The Apollo Guidance Computer"}], "in": [{"to": "era-4/15", "t": "Gunter's scale"}, {"to": "era-8/151", "t": "HP-35 pocket scientific calculator"}], "img": "media/cards/27397d846189.webp", "cred": "Jacek Halicki · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2023%20Suwak%20logarytmiczny%20%281%29.jpg"}, {"t": "Ready reckoners", "b": "cheap printed books of precomputed prices, interest, wages, and conversions — the shopkeeper's lookup table from the 1600s well into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation", "in": [{"to": "thread-R/2", "t": "The infrastructure of trust"}], "img": "media/cards/6c9e4c0f2865.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AThe%20Ready-Reckoner.jpg"}, {"t": "Nomograms (d'Ocagne, 1880s)", "b": "computation as *drawing* — lay a straightedge across printed scales and read off the answer; used for artillery, engineering, and medicine (some clinical nomograms survive today).", "ch": "After Napier: three centuries of augmented hand-calculation", "in": [{"to": "thread-I/15", "t": "Still alive in medicine"}]}, {"t": "Planimeters and integraphs", "b": "trace a curve's outline with a stylus, read its area off a dial — mechanical integration.", "ch": "After Napier: three centuries of augmented hand-calculation", "img": "media/cards/c5bd012902a7.webp", "cred": "«Военная энциклопедия И. Д. Сытина». Том 2 (Санкт-Петербург; 1911). · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3A%D0%98%D0%BB%D0%BB%D1%8E%D1%81%D1%82%D1%80%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BA%20%D1%81%D1%82%D0%B0%D1%82%D1%8C%D0%B5%20%C2%AB%D0%90%D0%BC%D1%81%D0%BB%D0%B5%D1%80%D0%B0%20%D0%BF%D0%BB%D0%B0%D0%BD%D0%B8%D0%BC%D0%B5%D1%82%D1%80%C2%BB.%20%D0%92%D0%BE%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BD%D1%86%D0%B8%D0%BA%D0%BB%D0%BE%D0%BF%D0%B5%D0%B4%D0%B8%D1%8F%20%D0%A1%D1%8B%D1%82%D0%B8%D0%BD%D0%B0%20%28%D0%A1%D0%B0%D0%BD%D0%BA%D1%82-%D0%9F%D0%B5%D1%82%D0%B5%D1%80%D0%B1%D1%83%D1%80%D0%B3%2C%201911-1915%29.jpg"}, {"t": "Specialized aids to the very end", "b": "<a class=\"xl\" href=\"#era-5/45\">Genaille–Lucas rulers<\/a> (1891) and dozens of similar devices sold to clerks and accountants into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation", "out": [{"to": "era-5/45", "t": "Genaille–Lucas rulers"}]}, {"t": "Professional lightning calculators", "b": "Zerah Colburn (factoring large numbers mentally as a child, 1810s), <a class=\"xl\" href=\"#era-4/39\"><a class=\"xl\" href=\"#era-5/14\">George<\/a><\/a> Parker Bidder (from stage calculator to great railway engineer), <a class=\"xl\" href=\"#era-5/11\">Alexander<\/a> Aitken (perhaps the best-documented calculating mind), Shakuntala Devi (multiplied two 13-digit numbers in 28 seconds, 1980).", "ch": "Lightning minds: mental calculators and speed systems", "out": [{"to": "era-5/11", "t": "Alexander Bain patents the fax"}, {"to": "era-4/39", "t": "George Adams' Solid Geometry Models"}, {"to": "era-5/14", "t": "George Boole"}]}, {"t": "The Trachtenberg system", "b": "high-speed arithmetic rules developed by Jakow Trachtenberg *entirely in his head while imprisoned in Nazi camps* — calculation as survival of the mind.", "ch": "Lightning minds: mental calculators and speed systems", "img": "media/cards/60e1d56abd89.webp", "cred": "Holretz · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A2FingerMethod-third%20digit.png"}, {"t": "\"Vedic mathematics\" (Bharati Krishna Tirtha, pub. 1965)", "b": "sutra-based speed techniques (\"all from 9 and the last from 10,\" \"vertically and crosswise\"); a modern system rather than an <a class=\"xl\" href=\"#thread-J/0\">ancient<\/a> Vedic one, but pedagogically potent and hugely popular in India.", "ch": "Lightning minds: mental calculators and speed systems", "out": [{"to": "thread-J/0", "t": "Ancient roots"}]}, {"t": "Everyday mental tricks", "b": "as mini-cards: complements (\"make ten\"), left-to-right addition, ×5 via ×10÷2, ×25 via ×100÷4, squaring numbers ending in 5, and 47×99 = 4,700 − 47.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Closing card", "b": "when calculation was economically vital, societies invested enormously in *human* computational skill — tables, tools, tricks, and training. Today that need is met by machines running 10¹⁸ operations per second — but the trained mind remains the only place where *<a class=\"xl\" href=\"#thread-E/2\">understanding<\/a>* happens.", "ch": "Lightning minds: mental calculators and speed systems", "out": [{"to": "thread-E/2", "t": "Understanding what the machine does 10²⁵ times."}]}]}, {"id": "thread-I", "kind": "thread", "title": "Thread I: Computing with the World: water, analog & unconventional machines", "sub": "", "cards": [{"t": "Clepsydrae", "b": "from <a class=\"xl\" href=\"#era-2/7\">Egyptian<\/a> outflow bowls to Ctesibius' feedback-regulated clocks (the first known feedback control) to elaborate <a class=\"xl\" href=\"#era-2/20\"><a class=\"xl\" href=\"#era-2/26\">Chinese<\/a><\/a> and Islamic water-clock towers (Su Song 1088, <a class=\"xl\" href=\"#era-3/8\">al-Jazari<\/a> 1206) — time itself was water-computed for three millennia.", "ch": "Water computing", "out": [{"to": "era-2/7", "t": "Egyptian rope-stretchers (harpedonaptai)"}, {"to": "era-2/20", "t": "Chinese counting rods and the suanpan (abacus)"}, {"to": "era-3/8", "t": "al-Jazari"}, {"to": "era-2/26", "t": "Chinese Seismoscope"}]}, {"t": "Lukyanov's water integrator (1936)", "b": "PDEs as plumbing — water levels are the variables, tube resistances the coefficients; adjust the valves, read the solution. Mass-produced in the USSR, used for dams, mines, and rocketry into the 1980s.", "ch": "Water computing"}, {"t": "The MONIAC (1949)", "b": "Keynesian macroeconomics in transparent tanks — raise taxes and literally watch <a class=\"xl\" href=\"#era-6/36\">consumption<\/a> drain. Fourteen built; one still runs demonstrations in New Zealand's central bank museum.", "ch": "Water computing", "out": [{"to": "era-6/36", "t": "3D Visualizations of Power Consumption"}], "in": [{"to": "era-7/36", "t": "Moniac: A Hydromechanical Machine to Teach Economics"}], "img": "media/cards/262f49792327.webp", "cred": "Unlisted/Unknown · No restrictions", "credurl": "https://commons.wikimedia.org/wiki/File%3APhillips%20and%20MONIAC%20LSE.jpg"}, {"t": "Fluidics (1960s)", "b": "logic gates made of nothing but jets and channels — no electronics, immune to radiation and EMP; used in aircraft, industrial control, even missile systems; reborn today as **microfluidic logic** in lab-on-a-chip devices.", "ch": "Water computing", "img": "media/cards/a62b64119e3a.webp", "cred": "Herbert.Oertel / www.prof-oertel.de · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFluidic%20Oscillator.png"}, {"t": "The liquid brain (2003)", "b": "researchers used ripples on the <a class=\"xl\" href=\"#era-6/2\">surface<\/a> of a bucket of water as the <a class=\"xl\" href=\"#thread-I/23\">reservoir<\/a> in a \"liquid state machine,\" successfully distinguishing spoken words — a literal bucket of water performing <a class=\"xl\" href=\"#thread-L/12\">pattern<\/a> recognition.", "ch": "Water computing", "out": [{"to": "thread-L/12", "t": "Pattern card"}, {"to": "era-6/2", "t": "Crum Brown's Mathematical Surface"}, {"to": "thread-I/23", "t": "Reservoir computing"}], "img": "media/cards/32916a4ed568.webp", "cred": "Laboratoires Servier · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ANervous%20system%20-%20Cerebrospinal%20fluid%20--%20Smart-Servier.png"}, {"t": "Theme card", "b": "water was humanity's first continuous quantity. Time, then economies, then differential equations were all made to *flow*.", "ch": "Water computing"}, {"t": "The integrator lineage", "b": "James Thomson's ball-and-disk integrator → his brother Lord Kelvin's tide predictor and harmonic analyzer → Bush's differential analyzer (Era 6) — continuous mathematics done by wheels.", "ch": "Mechanical & electrical analog computing"}, {"t": "Fire control", "b": "Dreyer Tables and Rangekeepers through the Mark 1 — shipboard analog computers tracking moving targets from moving platforms in real time, decades before digital could; still aboard recommissioned battleships in the 1990s.", "ch": "Mechanical & electrical analog computing", "img": "media/cards/23531fc8847a.webp", "cred": "U.S. Navy, Bureau of Naval Personnel (Transfered by \n\nJostikas/Original uploaded · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3AMark%201A%20Fire%20Control%20Computer%20Controls.jpg"}, {"t": "Field analogies", "b": "electrolytic tanks and conductive paper \"compute\" electric and aerodynamic fields; stretched rubber sheets solve potential problems — let the physics find the answer.", "ch": "Mechanical & electrical analog computing"}, {"t": "Network analyzers", "b": "scale-model power grids used to compute the behavior of real power grids into the 1960s.", "ch": "Mechanical & electrical analog computing"}, {"t": "The op-amp era", "b": "room-sized patch-panel analog computers simulate aircraft, rockets, and reactors; the very name \"operational amplifier\" means *an amplifier that performs mathematical operations*.", "ch": "Mechanical & electrical analog computing"}, {"t": "Theme card", "b": "for continuous problems — tides, trajectories, <a class=\"xl\" href=\"#era-8/62\">flight<\/a> — analog machines were *faster than digital for decades*. Digital won on precision and programmability, not on any monopoly over mathematics.", "ch": "Mechanical & electrical analog computing", "out": [{"to": "era-8/62", "t": "Lunar Models for Preparing Moon Flight"}]}, {"t": "Graphical statics (1860s)", "b": "bridges and roofs designed by drawing force polygons — Eiffel-era engineering computed with straightedge and pencil.", "ch": "Graphical computing: the nomograph, expanded", "in": [{"to": "era-9/17", "t": "Graphical Waterfall"}]}, {"t": "Nomography proper (d'Ocagne, 1884)", "b": "alignment charts where laying a straightedge across three scales *is* the calculation; grounded in projective geometry and determinants.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "War by straightedge", "b": "WWI and WWII artillery fired on nomogram-computed solutions; engineering handbooks carried alignment charts for everything from pipe flow to beam loads.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Still alive in medicine", "b": "clinical <a class=\"xl\" href=\"#thread-H/21\">nomograms<\/a> (cardiac risk, drug dosing, oncology prognosis) remain in use — a 19th-century computing technology at the bedside.", "ch": "Graphical computing: the nomograph, expanded", "out": [{"to": "thread-H/21", "t": "Nomograms (d'Ocagne, 1880s)"}]}, {"t": "Pedagogy card", "b": "students can *build* a working nomogram for the ideal gas law or Ohm's law with paper and ruler — constructing a computer that has no moving parts at all.", "ch": "Graphical computing: the nomograph, expanded", "in": [{"to": "thread-L/1", "t": "Scribal schools (Egypt, Babylon)"}]}, {"t": "Soap films", "b": "dip a wire frame, and the film instantly settles into a minimal <a class=\"xl\" href=\"#era-6/2\">surface<\/a> — near-instant \"solutions\" to problems (Plateau, Steiner trees) that strain digital computers.", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-6/2", "t": "Crum Brown's Mathematical Surface"}], "img": "media/cards/4b6b251b44ed.webp", "cred": "Nikk · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ASoap%20film.jpg"}, {"t": "Kitchen analog", "b": "spaghetti sort (cut rods to length, tap the bundle — the tallest is found in one step); string <a class=\"xl\" href=\"#era-9/246\"><a class=\"xl\" href=\"#era-9/247\">boards<\/a><\/a> that find shortest paths by pulling taut.", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-9/246", "t": "Kanban Boards"}, {"to": "era-9/247", "t": "Graph Boards"}], "in": [{"to": "era-10/8", "t": "Common Core & the CS-for-all push"}, {"to": "thread-L/11", "t": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standard…"}]}, {"t": "Toys that are computers", "b": "dominoes as logic gates; <a class=\"xl\" href=\"#era-9/189\">marble<\/a> machines (Digi-Comp II, today's <a class=\"xl\" href=\"#era-6/41\"><a class=\"xl\" href=\"#thread-J/19\">Turing<\/a><\/a> Tumble); the Tinkertoy computer (Hillis & Silverman, MIT) that plays perfect tic-tac-toe.", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-9/189", "t": "Durrell Bishop's Marble Answering Machine"}, {"to": "era-6/41", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "thread-J/19", "t": "Alan Turing"}], "img": "media/cards/3fb40ac2d7b5.webp", "cred": "Christian Ursilva from København, Danmark · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Lego_by_Christian_Ursilva_%282025%29.jpg"}, {"t": "The billiard-ball computer (Fredkin & Toffoli, 1982)", "b": "a thought experiment showing computation from nothing but elastic collisions — foundational to reversible and quantum computing.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Wet computers", "b": "<a class=\"xl\" href=\"#era-9/201\">Adleman's<\/a> DNA computation (1994); <a class=\"xl\" href=\"#era-5/28\"><a class=\"xl\" href=\"#era-7/18\">molecular<\/a><\/a> logic gates; slime mold (*Physarum*) solving mazes (2000) and re-deriving the Tokyo rail network (2010).", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-5/28", "t": "Van't Hoff's Molecular Paper Models"}, {"to": "era-9/201", "t": "Leonard Adleman's DNA computer"}, {"to": "era-7/18", "t": "Electron Density Map and Molecular Model of Penicillin"}]}, {"t": "Cellular automata", "b": "Conway's Game of Life (1970) — trivial rules yielding universal computation; Wolfram's systematic exploration.", "ch": "Nature computes: unconventional and physical computation", "img": "media/cards/8ae8d595c5a4.webp", "cred": "Lucas Vieira · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Gospers_glider_gun.gif"}, {"t": "Reservoir computing", "b": "any sufficiently rich dynamical system — water, lasers, mechanical springs — can serve as a machine-learning substrate.", "ch": "Nature computes: unconventional and physical computation", "in": [{"to": "thread-I/4", "t": "The liquid brain (2003)"}], "img": "media/cards/f86bdba3413a.webp", "cred": "D Cat laz · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ACalcul%20par%20reservoir.png"}, {"t": "The analog AI revival (2020s)", "b": "memristor crossbars multiply <a class=\"xl\" href=\"#era-8/106\">matrices<\/a> via Ohm's and Kirchhoff's laws; photonic chips do it with interference of light — physics-as-processor returning precisely because AI's arithmetic appetite (Thread A) has outgrown comfortable digital scaling.", "ch": "Nature computes: unconventional and physical computation", "out": [{"to": "era-8/106", "t": "Jacques Bertin's Reorderable Matrices"}]}, {"t": "Closing card", "b": "digital was a choice, not a destiny. Anything with reliable physics can compute. Electronics won on precision, programmability, and perfect copying — but the world itself has been doing mathematics all along, and students should know the machine in their pocket is one answer among many.", "ch": "Nature computes: unconventional and physical computation"}]}, {"id": "thread-J", "kind": "thread", "title": "Thread J: The Secret History: computation classified", "sub": "", "cards": [{"t": "Ancient roots", "b": "Herodotus' tattooed scalp and wax-tablet warnings (Era 2); Aeneas Tacticus' catalogue of hidden-message tricks.", "ch": "Steganography: hiding the message itself", "in": [{"to": "era-2/14", "t": "The beacon relay"}, {"to": "era-2/28", "t": "Roman hand abacus"}, {"to": "era-4/9", "t": "Casaubon dates the Hermetica"}, {"to": "thread-H/26", "t": "\"Vedic mathematics\" (Bharati Krishna Tirtha, pub. 1965)"}, {"to": "thread-M/3", "t": "Carrier pigeons"}, {"to": "thread-U/3", "t": "the turn"}, {"to": "thread-U/16", "t": "The lucky wrongness"}]}, {"t": "Invisible inks from antiquity through both World Wars; the Cardan gril…", "b": "Invisible inks from antiquity through both World Wars; the Cardan grille (1550) — a mask that turns an innocent letter into a cipher; null ciphers where only every nth word counts.", "ch": "Steganography: hiding the message itself", "in": [{"to": "era-4/4", "t": "Codex Vergara (Aztec/Nahua)"}, {"to": "thread-U/6", "t": "The productive irony"}]}, {"t": "Microdots (WWII)", "b": "whole pages photographed down to the size of a period — J. Edgar Hoover called them \"the enemy's masterpiece of espionage.\"", "ch": "Steganography: hiding the message itself", "img": "media/cards/504302fe9200.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:German_microdots_World_War_II_Mexico_Spain.jpg"}, {"t": "Printer tracking dots", "b": "the machine identification code secretly stamped by color laser printers, publicly decoded in 2005 — a hidden message in *your* documents.", "ch": "Steganography: hiding the message itself", "in": [{"to": "era-10/0", "t": "Printer tracking dots decoded"}], "img": "media/cards/6a37f1c66aaf.webp", "cred": "Anton · CC BY-SA 2.5", "credurl": "https://commons.wikimedia.org/wiki/File%3APrintermarkrp.jpg"}, {"t": "Digital steganography and watermarking today — including proposals to…", "b": "Digital <a class=\"xl\" href=\"#era-2/13\">steganography<\/a> and watermarking today — including proposals to statistically watermark AI-generated text: steganography contemplated at the scale of trillions of words.", "ch": "Steganography: hiding the message itself", "out": [{"to": "era-2/13", "t": "Steganography enters history"}], "img": "media/cards/1dbddad506d1.webp", "cred": "Trithemius, Johannes. Steganographia. Frankfurt: Johannes Saurius?, 1606. Digiti · Public ", "credurl": "https://commons.wikimedia.org/wiki/File%3ATrithemius-Johannes-Steganographia-Johannes-Saurius%2C-1608.-Digitized-photographic-reproduction-provided-by-the-Herzog-August-Bibliothek.jpg"}, {"t": "Card theme", "b": "cryptography scrambles a message; <a class=\"xl\" href=\"#era-2/13\">steganography<\/a> denies it exists. Both are computation bent toward concealment.", "ch": "Steganography: hiding the message itself", "out": [{"to": "era-2/13", "t": "Steganography enters history"}]}, {"t": "Colossus erased", "b": "ten machines; most dismantled and the drawings burned by order after the war; engineer Tommy Flowers, forbidden to speak, watches ENIAC take the crown of \"first\" — full details classified until 2000. Textbooks taught a wrong history for half a century.", "ch": "The machines themselves were secret", "in": [{"to": "thread-G/0", "t": "Cryptography: computing to conceal and reveal"}, {"to": "thread-M/10", "t": "The paper-tape lineage"}, {"to": "thread-U/22", "t": "The Yates card"}], "img": "media/cards/a87bc2faf398.webp", "cred": "Willem Janszoon Blaeu · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ANova%20totius%20terrarum%20orbis%20geographica%20ac%20hydrographica%20tabula%20RMG%20F0410.tiff"}, {"t": "The Bombes", "b": "British and US Navy models (600 WAVES ran NCR-built Bombes in Dayton, all sworn to secrecy) destroyed or hidden postwar; Poland's founding contribution — Rejewski's bomba — nearly erased from the record.", "ch": "The machines themselves were secret", "img": "media/cards/339ad0aa6413.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Wartime_picture_of_a_Bletchley_Park_Bombe.jpg"}, {"t": "SIGSALY and Delilah (Era 7)", "b": "secure digital voice — the birth of digital audio — locked away for decades; <a class=\"xl\" href=\"#era-7/8\"><a class=\"xl\" href=\"#era-7/43\"><a class=\"xl\" href=\"#era-6/41\"><a class=\"xl\" href=\"#thread-J/19\">Turing<\/a><\/a>'s<\/a> Delilah<\/a> report unreleased for ~70 years.", "ch": "The machines themselves were secret", "out": [{"to": "era-7/8", "t": "Turing's Delilah"}, {"to": "era-7/43", "t": "Turing's \"Computing Machinery and Intelligence\""}, {"to": "era-6/41", "t": "Alan Turing, \"On Computable Numbers\""}, {"to": "thread-J/19", "t": "Alan Turing"}], "img": "media/cards/a8037b98ad0b.webp", "cred": "U.S. Army Signal Corps · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASIGSALY%20receiver%20terminal.jpg"}, {"t": "The OCR connection", "b": "the first commercial <a class=\"xl\" href=\"#thread-O/5\">optical<\/a> <a class=\"xl\" href=\"#era-4/25\">character<\/a> reader, GISMO (1951), was built by David Shepard — a cryptanalyst at the NSA's predecessor agency, <a class=\"xl\" href=\"#era-5/48\">teaching<\/a> machines to *read* text after days spent teaching them to *break* it. Machine reading and machine codebreaking grew from the same soil, and Turing-era pattern-recognition and statistical methods fed both.", "ch": "The machines themselves were secret", "out": [{"to": "thread-O/5", "t": "Optical & solid state"}, {"to": "era-4/25", "t": "Wilkins's *Real Character"}, {"to": "era-5/48", "t": "James Ive's Mechanical Teaching Map"}]}, {"t": "D-Day by tide machine", "b": "Doodson computes Normandy's tides for a site he knows only as \"Position Z\" — computation on a need-to-know basis (Era 7).", "ch": "The machines themselves were secret", "img": "media/cards/a47d592102dc.webp", "cred": "William M. Connolley · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:DSCN1739-thomson-tide-machine.jpg"}, {"t": "Bombsight oaths", "b": "Norden bombardiers swore to defend the device's secrecy with their lives; naval fire-control mechanisms were crown jewels of state.", "ch": "The machines themselves were secret", "img": "media/cards/b9d0cf8eedd2.webp", "cred": "Allan J. Cronin · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:Norden.JPG"}, {"t": "Nuclear computing", "b": "ENIAC's first job, MANIAC, the Monte Carlo method — all born classified; Los Alamos ran on rooms of human computers before the machines arrived.", "ch": "The machines themselves were secret"}, {"t": "Venona", "b": "US decryption of Soviet cables, worked from 1943, kept secret until **1995** — a fifty-year computation in a vault.", "ch": "The machines themselves were secret"}, {"t": "GCHQ's stolen thunder", "b": "<a class=\"xl\" href=\"#era-8/115\"><a class=\"xl\" href=\"#era-9/9\">public-key cryptography<\/a> invented in secret<\/a>, 1970–74; unrevealed until 1997 — the inventors watched the world celebrate others for their own discovery, and said nothing.", "ch": "The machines themselves were secret", "out": [{"to": "era-9/9", "t": "Public-key cryptography (Diffie–Hellman, RSA)"}, {"to": "era-8/115", "t": "Public-key cryptography invented in secret"}]}, {"t": "NSA and the industry", "b": "<a class=\"xl\" href=\"#era-8/77\">Harvest<\/a> (1962), influence on IBM's Stretch, decades as supercomputing's quietest best customer; the DES S-box mystery — IBM had independently discovered *differential cryptanalysis* in 1974 and, at NSA's request, kept the attack secret for ~20 years while the public suspected a backdoor (the secret changes had actually *strengthened* the cipher).", "ch": "The machines themselves were secret", "out": [{"to": "era-8/77", "t": "NSA's Harvest"}], "img": "media/cards/7b308543779b.webp", "cred": "National Security Agency · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ANational%20Security%20Agency%20headquarters%2C%20Fort%20Meade%2C%20Maryland.jpg"}, {"t": "Operation Rubicon (revealed 2020)", "b": "the CIA and BND secretly *owned* <a class=\"xl\" href=\"#era-9/199\">Crypto<\/a> AG, selling compromised cipher machines to 100+ governments for decades — the supply chain itself as the wiretap.", "ch": "The machines themselves were secret", "out": [{"to": "era-9/199", "t": "The Crypto Wars"}], "in": [{"to": "thread-A/13", "t": "The punchline card"}], "img": "media/cards/e510164dda9b.webp", "cred": "Photograph by Rama, Wikimedia Commons, Cc-by-sa-2.0-fr · CC BY-SA 2.0 fr", "credurl": "https://commons.wikimedia.org/wiki/File:Hagelin_CX-52-IMG_0568-white.jpg"}, {"t": "Still secret now", "b": "classified supercomputers absent from the TOP500 list; TEMPEST emission-security standards; cryptanalytic capabilities we can only infer. An <a class=\"xl\" href=\"#thread-Q/4\">honest<\/a> card can say: *parts of this timeline are still blank, and some blanks are deliberate.*", "ch": "The machines themselves were secret", "out": [{"to": "thread-Q/4", "t": "Honest closing card"}]}, {"t": "Oath-bound silence", "b": "Bletchley's ~10,000 workers, including married couples who didn't tell each other until the 1970s; ENIAC's programmers and the Navy's WAVES uncredited for decades.", "ch": "The human cost — and the rewritten record"}, {"t": "Alan Turing", "b": "defined computation, helped win the war — his heroism itself classified — prosecuted in 1952, dead in 1954; public apology 2009, royal pardon 2013. Secrecy meant his country punished him without knowing whom it was punishing.", "ch": "The human cost — and the rewritten record", "in": [{"to": "era-6/9", "t": "Hilbert's program"}, {"to": "era-7/8", "t": "Turing's Delilah"}, {"to": "thread-C/0", "t": "Ideas"}, {"to": "thread-I/19", "t": "Toys that are computers"}, {"to": "thread-J/8", "t": "SIGSALY and Delilah (Era 7)"}], "img": "media/cards/22da2382e343.webp", "cred": "Elliott &amp; Fry · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Alan_turing_header.jpg"}, {"t": "Historiography card for students", "b": "because the fastest machines were secret, the *public* history of computing was wrong for 30–50 years — and is still being declassified. Primary sources keep surfacing. This history is a computation that hasn't halted.", "ch": "The human cost — and the rewritten record"}]}, {"id": "thread-K", "kind": "thread", "title": "Thread K: Ethnomathematics: the mathematics of the world's peoples", "sub": "", "cards": [{"t": "Ubiratan D'Ambrosio", "b": "names the discipline (1984): the mathematics of identifiable cultural groups — not only \"civilizations\" but carpenters, tailors, weavers, navigators, street vendors. Everyone's math counts.", "ch": "The field itself", "in": [{"to": "era-9/177", "t": "Ethnomathematics becomes a field"}]}, {"t": "Founders' shelf", "b": "Zaslavsky's *Africa Counts* (1973); Marcia & <a class=\"xl\" href=\"#era-4/5\"><a class=\"xl\" href=\"#era-5/27\">Robert<\/a><\/a> Ascher decoding quipu mathematics; Paulus <a class=\"xl\" href=\"#thread-K/7\">Gerdes<\/a> on sona and <a class=\"xl\" href=\"#era-9/195\">weaving<\/a> geometry; Ron Eglash's *African Fractals* (1999).", "ch": "The field itself", "out": [{"to": "era-5/27", "t": "Robert Henry Thurston’s Glyptic Models"}, {"to": "era-9/195", "t": "Slumber: Brainwave Weaving"}, {"to": "thread-K/7", "t": "Kente, Ndebele, and mud-cloth symmetry systems; Gerdes on the theo…"}, {"to": "era-4/5", "t": "Robert Recorde invents \"=\""}], "in": [{"to": "era-6/40", "t": "William & Elizebeth Friedman"}, {"to": "thread-U/21", "t": "The honest-history card"}]}, {"t": "Alan Bishop's six universal activities", "b": "— counting, locating, measuring, designing, playing, explaining: every documented culture does all six. A perfect organizing card.", "ch": "The field itself"}, {"t": "Fractal architecture (Eglash)", "b": "recursive, self-similar village layouts (Ba-ila), <a class=\"xl\" href=\"#thread-K/6\">Ethiopian<\/a> processional crosses, Mokoulek — scaling geometry as design tradition.", "ch": "Africa", "out": [{"to": "thread-K/6", "t": "Ethiopian peasant multiplication"}]}, {"t": "The binary lineage", "b": "Ifá's 256 odu → <a class=\"xl\" href=\"#era-3/17\"><a class=\"xl\" href=\"#thread-L/3\">medieval<\/a><\/a> Islamic and <a class=\"xl\" href=\"#thread-L/9\">European<\/a> geomancy's 16 binary figures → (Eglash's argued thread) influences reaching Leibniz — binary divination millennia before binary machines.", "ch": "Africa", "out": [{"to": "era-3/17", "t": "Medieval counting houses & jetons"}, {"to": "thread-L/3", "t": "Medieval universities"}, {"to": "thread-L/9", "t": "Klein's Meran reforms (1905) push functions and calculus into European…"}]}, {"t": "Borana calendar (Kenya/Ethiopia)", "b": "a working lunar-stellar calendar computed by specialists without writing.", "ch": "Africa"}, {"t": "Ethiopian peasant multiplication", "b": "doubling-and-halving — binary arithmetic as folk method (cross-ref H3).", "ch": "Africa", "in": [{"to": "thread-K/3", "t": "Fractal architecture (Eglash)"}]}, {"t": "Kente, Ndebele, and mud-cloth symmetry systems; Gerdes on the theo…", "b": "Kente, Ndebele, and mud-cloth **symmetry systems**; Gerdes on the theorems hidden inside basket-weaving; Yoruba base-20 subtractive numerals (45 said as \"five from ten from three twenties\").", "ch": "Africa", "in": [{"to": "era-9/177", "t": "Ethnomathematics becomes a field"}, {"to": "thread-K/1", "t": "Founders' shelf"}]}, {"t": "Kinship algebra", "b": "Warlpiri \"skin name\" marriage systems form genuine finite groups (the Aschers' analysis: a dihedral group of order 8) — abstract algebra lived as <a class=\"xl\" href=\"#era-5/51\">social<\/a> structure.", "ch": "Oceania & Australia", "out": [{"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}]}, {"t": "Songlines", "b": "routes across a continent stored and retrieved as song — geography as computed, memorized sequence.", "ch": "Oceania & Australia"}, {"t": "Māori kōwhaiwhai rafter patterns and tukutuku lattice panels", "b": "systematic symmetry classes; <a class=\"xl\" href=\"#era-5/51\">Pacific<\/a> navigation and PNG body-counting (cross-ref Thread F).", "ch": "Oceania & Australia", "out": [{"to": "era-5/51", "t": "Tallies Used as Social Displays on Pacific Islands"}]}, {"t": "Aztec Codex Vergara surveying (Era 4)", "b": "field areas via indigenous algorithms and fractional units — colonial-era math running parallel to Europe's.", "ch": "The Americas", "img": "media/cards/1a4537a24c02.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:CodexMendoza01.jpg"}, {"t": "Maya time-mathematics, quipu & yupana (cross-refs); Navajo weaving s…", "b": "Maya time-mathematics, quipu & yupana (cross-refs); **Navajo <a class=\"xl\" href=\"#era-9/195\">weaving<\/a> symmetry** and sandpainting geometry; **wampum** belts as treaty records — data woven in shell.", "ch": "The Americas", "out": [{"to": "era-9/195", "t": "Slumber: Brainwave Weaving"}]}, {"t": "Kaktovik numerals (1994)", "b": "schoolchildren inventing a numeral system that reaches Unicode — <a class=\"xl\" href=\"#era-9/177\">ethnomathematics<\/a> happening *now* (Era 9).", "ch": "The Americas", "out": [{"to": "era-9/177", "t": "Ethnomathematics becomes a field"}]}, {"t": "Kolam / rangoli (Tamil Nadu and beyond)", "b": "dot-grid, single-line threshold drawings executed from memory each dawn — formally studied by computer scientists as picture languages and array grammars; algorithms performed as devotion, mostly by women.", "ch": "Asia"}, {"t": "Sangaku & wasan (Era 4)", "b": "geometry as temple offering; Seki's determinants.", "ch": "Asia", "in": [{"to": "era-4/30", "t": "Seki Takakazu and wasan (Japan)"}]}, {"t": "Girih tiles (Era 3)", "b": "; **Balinese pawukon calendar**: ten concurrent week-lengths running simultaneously — daily life scheduled by least-common-multiple.", "ch": "Asia"}, {"t": "Yan tan tethera", "b": "Brythonic base-20 sheep-scoring chants surviving among shepherds into the 20th century — a numeral system preserved as work-song.", "ch": "European folk mathematics"}, {"t": "Split tally sticks", "b": "as unforgeable contracts (and the 1834 <a class=\"xl\" href=\"#era-5/8\">Parliament<\/a> fire, Era 5); **knitting and lace patterns as executable code** — knitters \"read\" compact instruction languages; wartime knitting was even used to smuggle coded messages (cross-ref Thread J).", "ch": "European folk mathematics", "out": [{"to": "era-5/8", "t": "The tally sticks burn Parliament"}]}, {"t": "Change ringing (Era 4)", "b": "permutation theory in the belfry; quilt-block geometry and its symmetry groups.", "ch": "European folk mathematics", "in": [{"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}]}, {"t": "Talking drums (West/Central Africa)", "b": "two-tone transmission of full phrases using tonal-language redundancy — long-distance messaging whose information-theoretic cleverness stunned later <a class=\"xl\" href=\"#era-8/16\">engineers<\/a>.", "ch": "Sound & rhythm as computation", "out": [{"to": "era-8/16", "t": "US Army Corps of Engineers San Francisco Bay Model"}], "in": [{"to": "era-8/149", "t": "ARPANET"}, {"to": "thread-L/3", "t": "Medieval universities"}, {"to": "thread-M/0", "t": "Sound over distance"}, {"to": "thread-T/20", "t": "Cross-links"}]}, {"t": "Indian tala", "b": "cycles and konnakol spoken rhythm: recursive subdivision performed at speed.", "ch": "Sound & rhythm as computation", "in": [{"to": "thread-H/15", "t": "Lattice (gelosia) multiplication"}]}, {"t": "Euclidean rhythms (Toussaint, 2004)", "b": "a huge share of world rhythm patterns are <a class=\"xl\" href=\"#era-7/48\">generated<\/a> by <a class=\"xl\" href=\"#era-2/18\">Euclid's<\/a> GCD algorithm — a 2,300-year-old algorithm, dancing.", "ch": "Sound & rhythm as computation", "out": [{"to": "era-2/18", "t": "Euclid's Elements"}, {"to": "era-7/48", "t": "Electricity Generated or Demanded"}]}, {"t": "Nunes, Carraher & Schliemann, Brazil (1985–93)", "b": "child street vendors ~98% accurate on transaction arithmetic — and ~37% on the *same problems* posed as school-style written exercises.", "ch": "Street mathematics (the pedagogy bombshell)"}, {"t": "Card thes
