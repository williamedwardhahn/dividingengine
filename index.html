n", "credurl": "https://commons.wikimedia.org/wiki/File%3ACarrier%20Pigeon%20%28PSF%29.jpg"}, {"t": "The Chappe optical telegraph (1794, Era 4)", "b": "a mechanical national network complete with protocols, acknowledgments, flow control, encryption, and — by 1834 — its first hacker exploit. \"The mechanical internet,\" half a century before Morse.", "ch": "Signals before electricity"}, {"t": "Heliographs and flag semaphore", "b": "mirror-flash telegraphy served armies into the 20th century; naval flag codes ran fleets.", "ch": "Signals before electricity"}, {"t": "The Victorian Internet (Standage's framing)", "b": "<a class=\"xl\" href=\"#era-5/9\">the electric telegraph<\/a> brings news tickers, wire fraud, long-distance romances, and even weddings conducted by telegraph — every social phenomenon of the internet, rehearsed in the 1800s.", "ch": "The wire", "out": [{"to": "era-5/9", "t": "The electric telegraph (Cooke & Wheatstone; Morse)"}]}, {"t": "Codes as economics", "b": "per-word cable pricing spawns commercial codebooks compressing whole sentences into single words — compression, invented by accountants.", "ch": "The wire"}, {"t": "Cable mathematics", "b": "the 1858 transatlantic cable dies of over-voltage ignorance; Kelvin's analysis and mirror galvanometer save 1866 — signal theory learned the hard way, by ocean.", "ch": "The wire", "img": "media/cards/383917a5060f.webp", "cred": "NeuroWiki Case · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ACableEquationFig.png"}, {"t": "Pneumatic tube networks", "b": "under Paris, London, Berlin, New York: physical packet delivery, some running into the 1980s.", "ch": "The wire", "img": "media/cards/5d8bca65c4ed.webp", "cred": "Jérome Ferri · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGroupes%20surpresseurs-d%C3%A9presseurs%20%C3%A0%20Paris-Central%20DSCN3056.jpg"}, {"t": "The paper-tape lineage", "b": "<a class=\"xl\" href=\"#era-5/24\">Baudot's 5-bit code<\/a> → teleprinters → telex — and punched tape becomes early computer I/O; <a class=\"xl\" href=\"#era-7/8\">Colossus<\/a> read enciphered teleprinter tape at 5,000 characters/second (Threads G, J). Communication gear and computers share one bloodstream.", "ch": "The wire", "out": [{"to": "era-5/24", "t": "Baudot's 5-bit code"}, {"to": "era-7/8", "t": "Colossus (Bletchley Park)"}]}, {"t": "The telephone era", "b": "Bell (1876), exchanges, Strowger's dial (1891), and generations of <a class=\"xl\" href=\"#era-5/31\">switchboard operators<\/a> — human packet routers (Thread B) — automated away exactly as the human computers would be.", "ch": "The wire", "out": [{"to": "era-5/31", "t": "Switchboard operators"}], "img": "media/cards/4dfc0e03426e.webp", "cred": "inazakira · CC BY-SA 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ATelephone%20of%20Taisho%20Era%20-%20Niigata%20Prefectural%20Museum%20of%20History.jpg"}, {"t": "Fax before phones", "b": "Bain (1843) and Caselli's pantelegraph in commercial service by 1865 — image transmission is older than voice transmission.", "ch": "The wire"}, {"t": "The photophone (Bell, 1880)", "b": "voice carried on a sunbeam — Bell called it his greatest invention; it waited a century for fiber optics to vindicate it.", "ch": "Through the air"}, {"t": "Radio", "b": "Hertz's laboratory waves → Marconi's transatlantic \"S\" (1901) → broadcasting (KDKA, 1920) → radar in WWII, which poured money into the electronics and mathematics that built the computer industry.", "ch": "Through the air"}, {"t": "Satellites", "b": "Sputnik's beep (1957) → Telstar's live TV (1962) → GPS: atomic-clock time signals turned into position by relativistic computation — Einstein running silently in every phone.", "ch": "Through the air", "img": "media/cards/16318f2665b2.webp", "cred": "Expedition 20 Crew, NASA · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ASoyuz%20TMA-16%20approaching%20ISS.jpg"}, {"t": "Shannon (1948)", "b": "one theory for every channel — drum, wire, light, radio — with the *bit* as universal currency. Communication and computation formally become a single subject.", "ch": "The digital merger", "in": [{"to": "era-6/46", "t": "Claude Shannon's master's thesis"}], "img": "media/cards/0dfe55fd722a.webp", "cred": "Jacobs, Konrad · CC BY-SA 2.0 de", "credurl": "https://commons.wikimedia.org/wiki/File%3AClaudeShannon%20MFO3807.jpg"}, {"t": "Error correction", "b": "Hamming (1950), Reed–Solomon (1960), and their descendants in every phone and spacecraft — arithmetic that heals damaged messages mid-flight.", "ch": "The digital merger"}, {"t": "Packet switching → ARPANET → TCP/IP → the Web (Eras 8–9)", "b": "the network becomes a computer; the computer becomes a network.", "ch": "The digital merger"}, {"t": "Fiber", "b": "Kao's 1966 insight that glass could carry light for kilometers; TAT-8 (1988) crosses the Atlantic; today undersea fiber carries ~99% of intercontinental data along routes eerily echoing the 1866 cable map.", "ch": "The digital merger", "img": "media/cards/173eae5ab6f4.webp", "cred": "Cjp24 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ACarbon%20fiber.jpg"}, {"t": "Convergence", "b": "the smartphone is telegraph + telephone + radio + television + camera + library + computer — every channel in this thread, fused into a slab.", "ch": "The digital merger"}, {"t": "Twins, not neighbors", "b": "communication and computation are both transformations of encoded symbols. Every era's signaling system needed codes, and every code invited computation — Morse's compression, cable codebooks, Baudot's binary, <a class=\"xl\" href=\"#era-6/46\">Shannon<\/a>'s unification.", "ch": "Theme cards", "out": [{"to": "era-6/46", "t": "Claude Shannon's master's thesis"}]}, {"t": "Numbers travel first", "b": "each new fastest channel carried prices, odds, tides, and war before it carried anything else.", "ch": "Theme cards"}, {"t": "The latency ladder (companion to Thread A's speed ladder)", "b": "courier (days) → beacon (minutes, one bit) → Chappe (minutes, low bandwidth) → telegraph (seconds) → light in fiber (milliseconds) — and today the speed of light itself is the wall: high-frequency traders build microwave towers because fiber's path is microseconds too *curved*. Latency, not arithmetic, is now often the scarce resource.", "ch": "Theme cards"}, {"t": "Pedagogy card", "b": "a student who understands Morse's short-E and long-Q already understands the core idea of data compression — 19th-century hand-skills as a royal road into information theory.", "ch": "Theme cards"}]}, {"id": "thread-N", "kind": "thread", "title": "Thread N: When Computation Fails", "sub": "", "cards": [{"t": "The opening card is Babbage's motive", "b": "he built engines *because human tables were full of errors* — this whole subject begins with failure."}, {"t": "Therac-25 (1985–87)", "b": "race conditions in a radiation-therapy machine kill patients — software safety engineering is born of tragedy.", "in": [{"to": "era-9/557", "t": "The famous failures"}]}, {"t": "Patriot missile (1991)", "b": "0.1 seconds has no exact binary representation; 100 hours of clock drift = a 687-meter miss and 28 dead soldiers. Floating point as life and death (see IEEE 754, Era 9).", "in": [{"to": "era-9/557", "t": "The famous failures"}], "img": "media/cards/92fe5dff83ac.webp", "cred": "Government Press Office (Israel) · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AFlickr%20-%20Government%20Press%20Office%20%28GPO%29%20-%20Patriot%20missiles%20being%20launched%20to%20intercept%20an%20Iraqi%20Scud%20missile.jpg"}, {"t": "Pentium FDIV (1994)", "b": "a few missing lookup-table entries; discovered by a mathematician (Thomas Nicely) cross-checking prime computations — caught because a human was *verifying by independent calculation*. A $475M recall.", "in": [{"to": "era-9/557", "t": "The famous failures"}], "img": "media/cards/6c47f98ea4bf.webp", "cred": "Konstantin Lanzet · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AKL%20Intel%20Pentium%20A80501.jpg"}, {"t": "Ariane 5 (1996)", "b": "a 64-bit float jammed into a 16-bit integer; reused code from a slower rocket; $370M of fireworks in 37 seconds.", "img": "media/cards/4cf08da289d8.webp", "cred": "SkywalkerPL · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AAriane%205%20EPS%20Upper%20Stage.jpg"}, {"t": "Mars Climate Orbiter (1999)", "b": "one team used pound-seconds, the other newton-seconds — Thread F's \"number as quantity\" lesson, fatal at Mars. Units are not decoration.", "in": [{"to": "era-9/557", "t": "The famous failures"}], "img": "media/cards/cb56abad1941.webp", "cred": "NASA/JPL/Corby Waste · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMars%20Climate%20Orbiter%202.jpg"}, {"t": "Y2K (2000)", "b": "two-digit years meet the millennium; a massive global remediation *works*, so smoothly that people now call it a hoax — the \"successful prevention looks like overreaction\" card.", "img": "media/cards/4430e33af3b4.webp", "cred": "Bug de l'an 2000 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ABug%20de%20l%27an%202000.jpg"}, {"t": "Reinhart–Rogoff (2013)", "b": "an Excel range error (plus contestable choices) in a paper that had steered global austerity policy — found by a graduate student who *redid the arithmetic*. The site's best modern argument for checking by hand.", "img": "media/cards/8b1fd6f4f8b4.webp", "cred": "ShuBraque · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AExchange%20rate%20regime%20of%20EU%20countries%20according%20to%20Reinhart%20and%20Rogoff.png"}, {"t": "Lorenz (1963)", "b": "chaos discovered through rounding — some systems have mathematical forecast horizons no supercomputer can push past."}, {"t": "Gödel & the halting problem", "b": "Gödel showed in 1931 that any system strong enough to describe arithmetic contains true statements it cannot prove; <a class=\"xl\" href=\"#era-6/43\">Turing<\/a> showed in 1936 that no program can decide, in general, whether another program will ever stop. These are limits on computation itself, not on our cleverness or our hardware — and both were proved before a single electronic computer existed to be limited.", "out": [{"to": "era-6/43", "t": "Alan Turing, \"On Computable Numbers\""}], "img": "media/cards/55bbd9c8e924.webp", "cred": "Unknown authorUnknown author · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AYoung%20Kurt%20G%C3%B6del%20as%20a%20student%20in%201925.jpg"}, {"t": "Closing card", "b": "machines compute wrong at exactly the same speed they compute right. <a class=\"xl\" href=\"#thread-E/1\">Estimation<\/a>, unit sense, and sanity checks — the skills of hand arithmetic — are the human firmware that catches the machine (Glenn trusted Johnson, not the computer; Nicely caught Intel).", "out": [{"to": "thread-E/1", "t": "Estimation and error-checking (Glenn trusting Johnson over the machine…"}]}]}, {"id": "thread-O", "kind": "thread", "title": "Thread O: Memory: How Machines Remember", "sub": "", "cards": [{"t": "Before machines", "b": "clay tablets, quipu knots, tally sticks, books, card catalogs — every era's storage (cross-refs Eras 1–3, Thread S)."}, {"t": "Bits as echoes", "b": "mercury delay lines store numbers as circulating sound pulses (EDSAC); Williams tubes store them as glowing spots on a CRT — memory you could *hear* and *see*."}, {"t": "Core memory (1950s–70s)", "b": "thousands of ferrite rings, each threaded by hand — for two decades, nearly every bit on Earth passed through the fingers of women doing precision textile work.", "img": "media/cards/0f42aa0be29e.webp", "cred": "José Luis Briz Velasco · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AMuseo%20de%20Inform%C3%A1tica%20Hist%C3%B3rica%20%28MIH%29%20%E2%80%93%20UNIZAR%20%E2%80%93%20Magnetic-core%20memory%208k%20x%2012%20bit%20H-212%20%E2%80%93%20close%20up.jpg"}, {"t": "Core rope & Apollo", "b": "program memory physically *woven* — wire through a core = 1, around it = 0; NASA engineers called it \"LOL memory\" (little old ladies). Software you could hold, made by weavers (Threads B, Q; Jacquard's descendants).", "img": "media/cards/ccb393f372de.webp", "cred": "Nova13 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AApollo%20guidiance%20computer%20ferrit%20core%20memory.jpg"}, {"t": "The magnetic era", "b": "drum → tape → RAMAC's 5 MB ton (1956) → floppy (1971) → the hard-drive density explosion."}, {"t": "Optical & solid state", "b": "CD (1982, with Reed–Solomon armor — Thread M), flash memory (Masuoka, 1987), SSDs; experimental DNA storage — data written back into molecules, where Era 1's tokens began.", "img": "media/cards/133375015980.webp", "cred": "Jacopo Bertolotti · CC0", "credurl": "https://commons.wikimedia.org/wiki/File%3AOptical%20fibres%20modes%20vs%20wavelength.gif"}, {"t": "The price-of-a-bit ladder (companion to Thread A)", "b": "from dollars per bit to trillions of bits per dollar — memory's own vertiginous curve, worth its own comparison card."}, {"t": "Theme card", "b": "storage has always been embodied labor — scribes, knotters, weavers, threaders — until suddenly it wasn't; remembering *how* memory was made keeps the abstraction honest."}]}, {"id": "thread-P", "kind": "thread", "title": "Thread P: The Data Thread: Probability, Statistics & Seeing Numbers", "sub": "", "cards": [{"t": "Born at the gambling table and the plague ledger", "b": "<a class=\"xl\" href=\"#era-4/19\">Pascal<\/a>–Fermat (1654) make chance calculable; Graunt (1662) reads London's death rolls as *data*; Halley (1693) prices annuities — the state and commerce learn to compute risk.", "out": [{"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}]}, {"t": "Bayes and Laplace", "b": "inverse probability — updating belief by arithmetic; Laplace computes planetary masses with it, and modern AI is soaked in it."}, {"t": "Gauss", "b": "least squares and the normal curve — error itself becomes lawful (Ceres, Era 5)."}, {"t": "The picture-makers", "b": "<a class=\"xl\" href=\"#era-4/43\">Playfair<\/a> invents the chart (1786); <a class=\"xl\" href=\"#era-5/35\">Nightingale<\/a> weaponizes it (1858); Minard's Napoleon-in-Russia map — often called the finest graphic ever drawn; Tukey's exploratory data analysis; today's dashboards.", "out": [{"to": "era-4/43", "t": "William Playfair invents the line and bar chart (pie chart 1801)"}, {"to": "era-5/35", "t": "Nightingale's rose diagrams"}]}, {"t": "The uncomfortable card", "b": "<a class=\"xl\" href=\"#era-5/37\">Galton and Pearson<\/a> built correlation and regression in the service of eugenics; Fisher too was entangled. Methods outlive motives — users must supply the ethics. Taught honestly, this is one of the site's most important cards.", "out": [{"to": "era-5/37", "t": "Galton and Pearson"}]}, {"t": "\"Statistics\" contains \"state\"", "b": "censuses from Babylon to <a class=\"xl\" href=\"#era-5/43\">Hollerith<\/a> (1890) to modern \"big data\" — the same problem at 10¹⁵ scale.", "out": [{"to": "era-5/43", "t": "Herman Hollerith"}], "in": [{"to": "thread-L/16", "t": "Case files"}]}, {"t": "Closing card", "b": "statistics is the mathematics most adults actually need, and Thread L explains why school still teaches so little of it."}]}, {"id": "thread-Q", "kind": "thread", "title": "Thread Q: Labor & Automation: Who Does the Work?", "sub": "", "cards": [{"t": "The Turk, twice", "b": "Kempelen's 1770 hoax hid a human inside the machine; Amazon's Mechanical Turk (2005) and today's global data-labeling workforce hide thousands of humans inside \"AI.\" Same card, 250 years apart — always ask who's inside the box."}, {"t": "The Luddites, corrected (1811)", "b": "machine-breaking as collective bargaining by other means, not technophobia — the most slandered workers in industrial history.", "img": "media/cards/095c622169ba.webp", "cred": "Unknown. 195 years since publication, copyright extinguished · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ALuddite.jpg"}, {"t": "The computing proletariat", "b": "de Prony's pyramid → table factories → typing pools → comptometer rooms → \"computer\" quietly ceasing to be a job title (1950s–60s) → switchboard automation (Strowger to direct dial) → phototypesetting ending hot-metal careers → the ATM paradox (teller employment *rose* for decades as cheap branches multiplied — automation reshapes rather than simply deletes)."}, {"t": "The contests as ritual", "b": "John Henry vs. the steam drill; the 1946 soroban vs. electric calculator match; Kasparov (1997); Lee Sedol (2016) — cultures stage man-vs-machine duels at every threshold, and the site's students are living through the next one."}, {"t": "Honest closing card", "b": "automation transitions are real, painful, uneven — and navigable. Every generation on this timeline adapted; understanding the machine, rather than merely operating or fearing it, has always been the strongest position. That is what this site is for."}]}, {"id": "thread-R", "kind": "thread", "title": "Thread R: Commerce as Computation", "sub": "", "cards": [{"t": "Writing was invented by accountants", "b": "<a class=\"xl\" href=\"#era-1/4\">Mesopotamian<\/a> tokens → clay envelopes → cuneiform (Era 1) — literacy itself is a spinoff of inventory.", "out": [{"to": "era-1/4", "t": "Mesopotamian clay tokens"}]}, {"t": "Pacioli's mirror (1494)", "b": "double-entry bookkeeping — debits equal credits, a checksum you can run by candlelight; Goethe called it one of the finest inventions of the human mind."}, {"t": "The infrastructure of trust", "b": "bills of exchange, interest tables, <a class=\"xl\" href=\"#thread-H/20\">ready reckoners<\/a> (Thread H4), actuarial tables (Thread P), the Medici network moving value as *messages* (Thread M).", "out": [{"to": "thread-H/20", "t": "Ready reckoners"}]}, {"t": "Speed is money", "b": "Reuters' pigeons, the Blanc brothers' telegraph hack (1834), the ticker tape (1867), and today's microwave HFT links (Thread M5) — finance has always bought the fastest channel first."}, {"t": "The retail stack", "b": "cash registers → the barcode's first beep (1974, a pack of Wrigley's gum) → credit-card networks authorizing billions of transactions → the ATM (1967) → <a class=\"xl\" href=\"#era-9/35\">VisiCalc<\/a> putting a ledger in every office (Era 9).", "out": [{"to": "era-9/35", "t": "VisiCalc"}]}, {"t": "The tally stick reborn", "b": "blockchain (2008) — distributed, unforgeable, split-record ledgers; Era 5's burned sticks would recognize the idea instantly."}, {"t": "Theme card", "b": "from clay tokens to high-frequency trading, commerce has been computation's most reliable paymaster — most machines on this timeline were bought to count money."}]}, {"id": "thread-S", "kind": "thread", "title": "Thread S: The Card and the Link: From Library to HyperCard", "sub": "", "cards": [{"t": "Alexandria's Pinakes (Era 2)", "b": "the catalog is older than almost everything it catalogs.", "in": [{"to": "era-2/6", "t": "Water clocks (clepsydrae) (Egypt, then Babylon, Greece, China)"}]}, {"t": "Monks as search engines", "b": "concordances and indexes compiled by hand — years of labor to let a reader \"query\" scripture; the florilegium as a curated feed."}, {"t": "Cards take over", "b": "Gesner's paper slips (1540s); revolutionary France catalogs seized libraries on the backs of playing cards (1790s); the card catalog and Dewey standardize retrieval."}, {"t": "Otlet's Mundaneum (1910)", "b": "12 million cards, a query-by-mail service, and a 1934 vision of screens networked to a universal repository — a paper internet, dreamed in Brussels.", "img": "media/cards/b015be883f54.webp", "cred": "Mr N · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AMundaneum%20Mons.jpg"}, {"t": "The lineage of the dream", "b": "Bush's Memex (1945) → Licklider's \"Man-Computer Symbiosis\" (1960) → <a class=\"xl\" href=\"#era-8/201\">Engelbart<\/a>'s Demo (1968) → Nelson's hypertext and Xanadu (1965) → PLATO's community (1960s–70s) → Kay's Dynabook → PARC's Alto → <a class=\"xl\" href=\"#era-9/364\">Macintosh<\/a> (1984).", "out": [{"to": "era-8/201", "t": "Engelbart's \"Mother of All Demos\""}, {"to": "era-9/364", "t": "Macintosh"}]}, {"t": "HyperCard (1987)", "b": "Atkinson's \"software erector set\" — teachers, artists, and kids building linked-card stacks without \"programming\"; *Myst* was built in it; Ward Cunningham designed the first wiki as \"<a class=\"xl\" href=\"#era-9/360\">HyperCard<\/a> for the web\"; countless classrooms made their first software in it.", "out": [{"to": "era-9/360", "t": "HyperCard (Bill Atkinson, Apple)"}], "img": "media/cards/83ec55944381.webp", "cred": "osaMu · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3APowerBook%20550c%20%282373696262%29.jpg"}, {"t": "The Web (1991)", "b": "hypertext's global victory — and a card on what was lost (two-way links, Xanadu's transclusion and micropayment dreams)."}, {"t": "Mission card", "b": "this site is deliberately built as a HyperCard-style stack. Its *form* is an artifact from its own timeline — students navigate the history of computation using a beloved piece of it."}]}, {"id": "thread-T", "kind": "thread", "title": "Thread T: The Harmony Thread: music, myth & the mathematical universe", "sub": "", "cards": [{"t": "The monochord (Era 2)", "b": "Pythagorean legend — hammers in a smithy, then a single string divided — reveals that consonance lives in small whole-number ratios; the first physical law expressed numerically, and the founding *proof* that nature obeys mathematics.", "ch": "The music of the spheres"}, {"t": "Musica universalis", "b": "Plato's *Timaeus* tunes the world-soul; Cicero's *Dream of Scipio* lets Scipio *hear* the planets; Boethius (Era 3) transmits the doctrine and plants music in the **quadrivium** — for a millennium, the educated studied music as a branch of mathematics, between arithmetic and astronomy.", "ch": "The music of the spheres"}, {"t": "Kepler's wager (1619)", "b": "if the heavens are harmonic, their chords can be computed — and inside *Harmonices Mundi*, amid planetary scales and angelic choirs, sits the third law of planetary motion. Mysticism, methodically pursued, delivered mechanics.", "ch": "The music of the spheres"}, {"t": "The metaphor that never died", "b": "modern physics still speaks of vibrating strings, resonant modes, and harmonics — from spectroscopy to quantum mechanics, <a class=\"xl\" href=\"#era-2/11\">the monochord<\/a>'s vocabulary runs straight through science.", "ch": "The music of the spheres", "out": [{"to": "era-2/11", "t": "The monochord"}]}, {"t": "*Harmonie universelle* (1636)", "b": "~1,500 pages measuring everything musical — construction, dimensions, stringing, and technique for lutes, viols, violins, keyboards, winds, drums, and bells, so precisely recorded that modern luthiers still reconstruct 17th-century instruments from it.", "ch": "Mersenne: the friar who counted sound", "in": [{"to": "era-9/543", "t": "GIMPS"}], "img": "media/cards/860fa8bff8c7.webp", "cred": "Marin Mersenne, publié à Paris en 1636 · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AMarin%20Mersenne%20-%20Harmonie%20universelle%201636%20%28page%20de%20titre%29.png"}, {"t": "The string laws", "b": "vary one thing at a time — length, tension (weights hung from strings), thickness, material (gut, brass, even gold wire) — yielding frequency ∝ (1/L)·√(T/μ). The conceptual leap: pitch is a *rate of vibration*, a countable physical event, not an abstract proportion.", "ch": "Mersenne: the friar who counted sound", "in": [{"to": "era-4/18", "t": "Mersenne's *Harmonie universelle"}]}, {"t": "Counting sound itself", "b": "strings and ropes long enough that their swings can be counted by eye against a pulse — then the laws scale those slow counts up to hundreds of vibrations per second, assigning real numbers to musical notes for the first time. This is why he's called the father of acoustics.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The harmonic-series puzzle", "b": "one plucked string faintly sounds its octave, twelfth, and double octave *simultaneously* — how can one body vibrate at several rates at once? Mersenne posed the question over and over in letters; the answer (superposition of modes) took Sauveur, Daniel Bernoulli, and finally Fourier. A friar's puzzlement drove a century of mathematics.", "ch": "Mersenne: the friar who counted sound"}, {"t": "Consonance as coincidence", "b": "intervals sound sweet when their vibrations line up often — the octave every 2nd cycle, the fifth every 6th; dissonances rarely align. Not the modern account, but it moved consonance from number mysticism into physics, with intervals ranked on principle.", "ch": "Mersenne: the friar who counted sound", "img": "media/cards/c8e08d0b5a1e.webp", "cred": "Hyacinth (talk) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Perfect_octave_on_C.png"}, {"t": "Computing equal temperament", "b": "the octave split into 12 identical semitones of ratio ¹²√2 ≈ 1.05946 — computed via mean proportionals (logarithms were brand new) and printed as string lengths for fretting. Fretted lutes practically forced equal temperament; Mersenne's arithmetic helped legitimize the tuning that now underlies nearly all Western music.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The combinatorics of song", "b": "factorials tabulated up to 64!; all **720 permutations of a six-note hexachord printed in full** across several pages; 22! melodies — sextillions — declared beyond all the world's singers. One of the first applications of combinatorics to an art, feeding straight into <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a>'s combinatorial dreams (see Llull, Era 3).", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "The human internet hub", "b": "Mersenne's correspondence web — Descartes (whose first work, the *Compendium musicae*, was written for this circle), Galileo, Fermat, <a class=\"xl\" href=\"#era-4/19\">Pascal<\/a>, Doni, experimenters across Europe testing echoes, resonance, sound underwater. Before journals existed, *he* was the network — and music was his test case proving nature obeys mathematical law.", "ch": "Mersenne: the friar who counted sound", "out": [{"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}]}, {"t": "Still in the machine", "b": "Mersenne primes (2^p−1) drive GIMPS, the distributed search that finds nearly every record prime (Era 9), and the *Mersenne Twister* generates the random numbers inside countless simulations. Four centuries on, the friar's name is compiled into running code.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The Tower of Babel", "b": "the myth of one lost universal tongue — and the centuries-long scholarly quest to recover or rebuild the \"Adamic language\" in which words perfectly matched things.", "ch": "Babel and the perfect language", "in": [{"to": "era-10/38", "t": "Radio 4: Codes that Changed the World: The Tower of Babel"}], "img": "media/cards/073f93d25232.webp", "cred": "Pieter Brueghel the Elder · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3APieter%20Bruegel%20the%20Elder%20-%20The%20Tower%20of%20Babel%20%28Vienna%29%20-%20Google%20Art%20Project%20-%20edited.jpg"}, {"t": "The 17th-century projects", "b": "Dalgarno's and Wilkins's constructed philosophical languages (1668) classify all of reality into a symbol system — Borges made Wilkins famous again; <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> turns the quest computational: a *characteristica universalis* plus a *calculus ratiocinator*, so that disputes end with \"let us calculate\" (Thread C; Llull, Era 3).", "ch": "Babel and the perfect language", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Babel answered sideways", "b": "the perfect language never arrived for humans — it arrived for machines. Boole's algebra, Frege's notation, and finally programming languages and protocols: humanity's actual universal tongues turned out to be code and TCP/IP (Thread M).", "ch": "Babel and the perfect language"}, {"t": "Musical and constructed tongues", "b": "<a class=\"xl\" href=\"#era-5/7\">Solresol<\/a> (1827) — words made of do-re-mi, equally speakable, singable, playable, or whistled; Esperanto; Interlingua feeding the first machine-translation dreams (Era 8).", "ch": "Babel and the perfect language", "out": [{"to": "era-5/7", "t": "Solresol"}]}, {"t": "The mythic tongue", "b": "the secret speech of birds granted to Solomon and Siegfried, the alchemists' \"green language,\" Attar's *Conference of the Birds* (1177) — a spiritual quest structured like an algorithm, thirty birds seeking the one.", "ch": "The language of the birds"}, {"t": "From myth to data", "b": "<a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> transcribes birdsong into staff notation (1650) — animal sound becomes recordable information; his arca musarithmica composes by combinatorial lookup.", "ch": "The language of the birds", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}]}, {"t": "The modern research program", "b": "bioacoustics and machine learning now parse whale codas, birdsong syntax, and bee dances — today's AI projects to decode animal communication are the language of the birds pursued with GPUs.", "ch": "The language of the birds"}, {"t": "Cross-links", "b": "whistled human languages (Thread M) and <a class=\"xl\" href=\"#thread-K/20\">talking drums<\/a> (Thread K) — people already speak in pitch.", "ch": "The language of the birds", "out": [{"to": "thread-K/20", "t": "Talking drums (West/Central Africa)"}], "in": [{"to": "thread-L/23", "t": "How We Came to Teach Math This Way"}], "img": "media/cards/d63ded3c5484.webp", "cred": "Cjp24 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AStructures%20of%20macromolecules.png"}, {"t": "Notation is a program", "b": "Guido's staff (Era 3) plots pitch against time — arguably the first graph — and a score is a set of instructions executed by performers; the player-piano roll is literally a punched program, Jacquard's first cousin; MIDI (1983) turns performance into a live data stream.", "ch": "Music as computation"}, {"t": "Algorithmic composition, four centuries deep", "b": "<a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a>'s box (1650) → 18th-century musical dice games → <a class=\"xl\" href=\"#thread-K/19\">change ringing<\/a>'s permutation \"programs\" (Era 4) → the *Illiac Suite* and MUSIC I (1957) → today's generative AI music.", "ch": "Music as computation", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}, {"to": "thread-K/19", "t": "Change ringing (Era 4)"}]}, {"t": "Fourier closes Mersenne's case (1822)", "b": "every sound is a sum of sines; with the FFT (Era 8) this becomes the arithmetic inside MP3s, Auto-Tune, speech recognition, and every phone call — your earbuds run 19th-century heat theory answering a 17th-century friar's question.", "ch": "Music as computation"}, {"t": "The hearing sciences", "b": "Sauveur names acoustics (1701); <a class=\"xl\" href=\"#era-5/25\">Helmholtz<\/a> dissects hearing with resonators (1863) — the ear itself revealed as a frequency analyzer.", "ch": "Music as computation", "out": [{"to": "era-5/25", "t": "Helmholtz's *On the Sensations of Tone"}]}, {"t": "Theme card", "b": "music was the laboratory where the West first learned that number governs nature — the quadrivium's bridge from arithmetic to physics. Every audio app is downstream of a monochord, and a student practicing scales is running the oldest experiment in mathematical physics.", "ch": "Music as computation"}]}, {"id": "thread-U", "kind": "thread", "title": "Thread U: The Hermetic Thread: esotericism and the making of science", "sub": "", "cards": [{"t": "The Emerald Tablet and the Corpus Hermeticum", "b": "\"as above, so below\" — texts attributed to Hermes Trismegistus and believed older than Moses; in 1463 Cosimo de' Medici orders Ficino to set Plato aside and translate Hermes *first*. The Renaissance reboots with magic at the front of the queue.", "ch": "The current", "img": "media/cards/d274cba6a187.webp", "cred": "The wub · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AEmerald%20Tablet%2C%20Rosicrucian%20Alchemy%20Exhibit.jpg"}, {"t": "The Renaissance magi", "b": "Pico della Mirandola weds Kabbalah to philosophy; Agrippa's *De occulta philosophia* treats number as power; Giulio Camillo builds a walk-in Memory Theatre of all knowledge and Giordano Bruno turns memory palaces into combinatorial art — information architecture in occult dress (Thread S).", "ch": "The current"}, {"t": "John Dee (Era 4)", "b": "the *Monas Hieroglyphica*'s cosmic glyph and the Mathematical Preface that sold Euclid to England's navigators and artisans; the imperial adviser with the realm's greatest library also transcribed \"angelic\" language by scrying. One mind, both worlds, no contradiction felt.", "ch": "The current", "img": "media/cards/5a2a6eeb7580.webp", "cred": "Unidentified painter · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AJohn%20Dee%20Ashmolean.jpg"}, {"t": "the turn", "b": "Casaubon's philology dates the Hermetica to late antiquity, the same year <a class=\"xl\" href=\"#era-4/8\">Napier<\/a> publishes logarithms — the prestige of ancient magic starts falling just as computational power starts compounding.", "d": "1614", "ch": "The current", "out": [{"to": "era-4/8", "t": "John Napier: logarithms"}]}, {"t": "Newton translated the Emerald Tablet into English with commentary…", "b": "Newton translated the **Emerald Tablet** into English with commentary and left ~a million manuscript words on alchemy — more than he wrote on physics — from a private laboratory he ran for decades.", "ch": "Newton, the last of the magicians"}, {"t": "The Keynes verdict (1936)", "b": "buying Newton's hidden papers at Sotheby's, Keynes reported that Newton \"was not the first of the age of reason. He was the last of the magicians.\"", "ch": "Newton, the last of the magicians"}, {"t": "The productive irony", "b": "universal gravitation — invisible action at a distance — was attacked by mechanist critics (<a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> among them) as an \"occult quality.\" A mind at home with hidden forces could accept the equation his rationalist rivals gagged on. The mysticism may have *enabled* the physics.", "ch": "Newton, the last of the magicians", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Computing doomsday", "b": "Newton applied his calculating powers to biblical chronology, concluding in one manuscript that the apocalypse would come \"not before 2060\" — the supreme calculator, running eschatology as arithmetic.", "ch": "Newton, the last of the magicians"}, {"t": "Still being decrypted", "b": "the Chymistry of Isaac Newton project is digitizing the alchemical papers now — an archive suppressed for centuries not by classification (Thread J) but by embarrassment.", "ch": "Newton, the last of the magicians"}, {"t": "For Leibniz, binary was theology", "b": "1 as God, 0 as nothing — creation *ex nihilo* re-enacted inside every number. He designed a medallion celebrating it: *omnibus ex nihilo ducendis sufficit unum* — \"to derive everything from nothing, one suffices.\"", "ch": "Leibniz, the binary God, and the I Ching"}, {"t": "1701–03", "b": "missionary Joachim Bouvet mails him Shao Yong's circular hexagram diagram; <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> recognizes the 64 figures as his binary numbers and publishes the connection in his memoir on binary arithmetic — Chinese divination and European theology meeting inside the number system that would run every computer on Earth (Era 2).", "ch": "Leibniz, the binary God, and the I Ching", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}], "in": [{"to": "era-2/8", "t": "I Ching hexagrams (China)"}]}, {"t": "The Kabbalist cousin", "b": "<a class=\"xl\" href=\"#era-3/11\">Abulafia<\/a>'s letter permutations and gematria (Era 3) belong to the same current as Llull's wheels — sacred combinatorics that <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> inherited for his *ars combinatoria* and universal characteristic (Thread T).", "ch": "Leibniz, the binary God, and the I Ching", "out": [{"to": "era-3/11", "t": "Abraham Abulafia's letter permutations"}, {"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Athanasius Kircher, S.J. (1602–1680)", "b": ", Collegio Romano: some forty books claiming nearly every subject, a famous museum, and a continental reputation as \"master of a hundred arts.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "in": [{"to": "era-8/15", "t": "Computer music begins"}, {"to": "thread-T/18", "t": "From myth to data"}, {"to": "thread-T/22", "t": "Algorithmic composition, four centuries deep"}, {"to": "thread-U/15", "t": "The data network"}, {"to": "thread-U/17", "t": "The rival hub"}], "img": "media/cards/d6b6b90a5284.webp", "cred": "Cornelis Bloemaert · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3AAthanasius%20Kircher.jpg"}, {"t": "The media inventor", "b": "*Ars Magna Lucis et Umbrae* (1646) popularizes the magic lantern — projected images, the ancestor of cinema and every screen (Thread M); his museum featured statues speaking through hidden voice tubes and a piped \"Delphic oracle\" — immersive audio, 1670s; plus the arca musarithmica composition box (Thread T) and the notorious cat piano he described (mercifully, likely never built).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The knowledge engines", "b": "*Ars Magna Sciendi* (1669) rebuilds Llull's combinatorics as a general logic of discovery; *Polygraphia nova* (1663) offers a universal writing-and-cipher scheme with a translation box — Babel-reversal as hardware (Thread T; Thread G).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "img": "media/cards/579be82f8f31.webp", "cred": "Google · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AGoogle%20Knowledge%20Panel.png"}, {"t": "The data network", "b": "from *Magnes* (1641) on, <a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> compiled magnetic declination, tide, and astronomical reports mailed in by Jesuit missionaries worldwide — a standing, global, crowdsourced observation network centuries before \"citizen science.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}], "img": "media/cards/32392bf40661.webp", "cred": "Defense Science Board · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ADefense%20Data%20Network%20as%20envisioned%20by%20the%20Defense%20Science%20Board%2C%20December%201982.jpg"}, {"t": "The lucky wrongness", "b": "his hieroglyph \"translations\" were mystical fantasy — but his claim that Coptic descends from ancient Egyptian was *right* and underpinned Champollion's real decipherment; his microscope study of plague victims' blood (*Scrutinium Pestis*, 1658) reported \"little worms\" — pointing toward germ theory for partly wrong reasons; he had himself lowered toward Vesuvius' glowing crater for *Mundus Subterraneus* (1665) — wrong about the subterranean fire-channels, right that you should go look.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The rival hub", "b": "like Mersenne (Thread T), <a class=\"xl\" href=\"#thread-U/12\">Kircher<\/a> anchored a continental correspondence web; the young <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> wrote to him in admiration. Patron saint of interdisciplinarity — and a standing lesson that spectacular error, honestly pursued and publicly shared, can still drag knowledge forward.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)", "out": [{"to": "thread-U/12", "t": "Athanasius Kircher, S.J. (1602–1680)"}, {"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Research programs harden into science", "b": "harmony-hunting → celestial mechanics (Kepler, Thread T); alchemy → chemistry (Boyle worked the same furnaces); perfect-language dreams → symbolic logic and code (Thread T); memory arts → information architecture (Thread S); Kabbalist and Llullian combinatorics → <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> → Boole → circuits.", "ch": "Why this belongs on a computation timeline", "out": [{"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Astrology fed astronomy", "b": "Kepler cast horoscopes to pay for planet-hunting — \"astrology, the foolish daughter, feeds her wise mother astronomy.\"", "ch": "Why this belongs on a computation timeline"}, {"t": "Secrecy's training ground", "b": "alchemical ciphers, coded recipes, and priority-guarding anagrams (Galileo announced discoveries to Kepler as scrambled letters) rehearsed the habits that became scientific priority claims and cryptographic practice (Thread J).", "ch": "Why this belongs on a computation timeline"}, {"t": "The honest-history card", "b": "none of this endorses magic. It corrects the textbook myth of pure rationalists. The founders were whole people chasing hidden order everywhere — and some of those hunts found mathematics. Motivation and method can be separated only in hindsight; today's \"of course\" was once somebody's heresy.", "ch": "Why this belongs on a computation timeline"}, {"t": "The Yates card", "b": "20th-century scholarship (Frances Yates and successors) recovered this suppressed lineage. Like <a class=\"xl\" href=\"#era-7/8\">Colossus<\/a> (Thread J), part of science's own history was long left out of the story — this time from embarrassment rather than classification. History is a computation that hasn't halted (Thread L).", "ch": "Why this belongs on a computation timeline", "out": [{"to": "era-7/8", "t": "Colossus (Bletchley Park)"}], "img": "media/cards/006608333360.webp", "cred": "U.S. Army Air Forces · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File%3ALegion%20of%20Merit%20%E2%80%93%20Yates%2C%20Donald%20N.jpg"}]}, {"id": "about", "kind": "apparatus", "title": "About", "sub": "what this is, and why you were not taught it", "cards": [{"t": "About", "d": "since 2013", "b": "Dividing Engine is an archive of the history of computation, assembled by <strong>William Edward Hahn, PhD<\/strong>, who began it in 2013 to put automation and artificial intelligence back into historical context.<br><br>He is an Associate Professor of Mathematical Sciences at Florida Atlantic University, and founder and director of the <strong>Machine Perception and Cognitive Robotics Laboratory<\/strong>, which he co-founded there in 2014. His doctorate is in sparse coding and compressed sensing; before that, neural networks. He has been collecting this material for about as long as he has been running the lab.<br><br>The premise has not changed since the beginning: <em>you cannot see where a technology is going without knowing where it has been.<\/em> Everything here — the films, the cards, the timeline — exists to make that history visible to people who were never shown it."}, {"t": "The machine itself", "d": "8 September 2026", "plates": [{"src": "media/museum/679a6d2c4b72.webp", "alt": "A brass and iron dividing engine on a wooden tripod frame, in a museum case", "cap": "Dividing engine for making scales on instruments, late 1700s, modified 1800s. Made in England. Science Museum, London — object no. 1925-478."}, {"src": "media/museum/c26441cd2826.webp", "alt": "The toothed dividing plate of the engine seen from above", "cap": "The dividing plate. A sextant or octant was fixed above it, and the engine’s precision screw and ratchet stepped the divisions round."}, {"src": "media/museum/1e1fe74a57e3.webp", "alt": "Oil portrait of Jesse Ramsden seated beside a dividing engine", "cap": "Jesse Ramsden (1735–1800), painted by Robert Home about 1790. A dividing engine stands at his hand. Lent by the Royal Society."}], "hand": "Photographs — William Edward Hahn, 8 September 2026", "b": "Thirteen years after starting this archive, I stood in front of one.<br><br>A dividing engine does a single job: it marks an accurate scale. Before it, every degree on every sextant, octant and theodolite was stepped off by hand with dividers, and the instrument was only ever as good as one man’s eye and his patience. The engine cut the divisions mechanically — repeatably, and finer than a hand can hold. <strong>Jesse Ramsden<\/strong> built the first in London in the 1770s, and the government’s Board of Longitude paid him to hand the design to his competitors: scales meant sextants, sextants meant navigation, and navigation meant ships.<br><br>It is a machine for making other machines trustworthy — the precondition for measurement, and one almost nobody is taught.<br><br>Half an hour earlier, in the same building, I had been photographing <a class=\"xl\" href=\"#era-5/6\">Babbage<\/a>’s Difference Engine No. 2.", "out": [{"to": "era-5/6", "t": "Charles Babbage: Difference Engine"}]}, {"t": "Why almost none of this was taught to you", "d": "", "b": "The history of computing falls into a gap between two departments, and neither one reaches in.<br><br>It is <strong>too old for technical training<\/strong>, which starts at the current framework and works forward — a course on machine learning begins at the point where the present toolchain begins, and everything earlier is a charming anecdote if it is mentioned at all. And it is <strong>too new to be treated as history<\/strong>, a discipline still deciding what to make of the twentieth century.<br><br>So it is taught almost nowhere. And what fell into that gap is not the footnotes. It is most of the important ideas."}, {"t": "Have you heard of any of these?", "d": "", "b": "Water computers. Machines built to simulate nerve impulses and model neurons in brass and oil. Torpedo inertial guidance. Optical bomb sights. Fire-control gun directors solving differential equations continuously while the ship rolled underneath them.<br><br>No?<br><br>There is a reason, and it is not that these were minor. <strong>Military advantage is not a curriculum.<\/strong> The computing that mattered most was, for decades, the computing nobody was told about — and the silence outlived the secrecy that caused it. The machines were declassified. The teaching never caught up.<br><br>They are all in here. Start with <a class=\"xl\" href=\"#era-6/29\">Naval fire-control computers<\/a>, <a class=\"xl\" href=\"#thread-J/11\">Bombsight oaths<\/a>, the Torpedo Data Computer, McCulloch &amp; Pitts, or the <a class=\"xl\" href=\"#era-6/28\">tide-predicting machines<\/a>, and follow the links out.", "out": [{"to": "era-6/29", "t": "Naval fire-control computers (Dreyer Table, Ford Rangekeeper, the US Navy's Mark 1)"}, {"to": "thread-J/11", "t": "Bombsight oaths"}, {"to": "era-6/28", "t": "Tide-predicting machines (Kelvin and successors)"}]}, {"t": "You were told not to use a calculator", "d": "", "img": "media/museum/c29f3069ef23.webp", "cred": "Sinclair Cambridge pocket calculator, 1970s", "b": "Calculators are not a modern convenience. They are <strong>four hundred years old<\/strong>. <a class=\"xl\" href=\"#era-4/17\">Schickard<\/a> built one in 1623, <a class=\"xl\" href=\"#era-4/19\">Pascal<\/a> in 1642, <a class=\"xl\" href=\"#era-4/23\">Leibniz<\/a> in 1673. By the time you were told to put yours away, every consequential calculation on earth — navigation, ballistics, actuarial tables, spaceflight — had been done by machine for generations, and in many cases by rooms of people organised to work like one.<br><br>The picture you were given, of mathematics as something a person does alone with a pencil, is not a description of how mathematics has ever been done at scale. It is a misdirection — away from the tools, away from who had them, and away from what having them was worth.<br><br>That is what this archive is for.", "out": [{"to": "era-4/17", "t": "Wilhelm Schickard's \"calculating clock\""}, {"to": "era-4/19", "t": "Blaise Pascal: the Pascaline"}, {"to": "era-4/23", "t": "Gottfried Leibniz: stepped reckoner"}]}, {"t": "Where to start", "d": "", "special": "start", "b": ""}]}, {"id": "contents", "kind": "apparatus", "title": "Contents", "sub": "the whole archive, in order", "cards": [{"t": "Contents", "b": "", "special": "contents"}]}, {"id": "index", "kind": "apparatus", "title": "Index", "sub": "every name, alphabetically", "cards": [{"t": "Index", "b": "", "special": "index"}]}, {"id": "glossary", "kind": "apparatus", "title": "Glossary", "sub": "terms, as the cards define them", "cards": [{"t": "Glossary", "b": "", "special": "glossary"}]}, {"id": "undated", "kind": "undated", "title": "Undated Film", "sub": "378 films whose year is not yet known", "cards": [{"t": "1980s Advances in Robotics and Computer Engineering", "b": "", "kindc": "film", "status": "live", "img": "media/yt/n44xWyX9k0g.jpg", "dur": 897, "by": "PeriscopeFilm", "v": "n44xWyX9k0g", "coll": ["dividing-engine"]}, {"t": "22-turtle", "b": "", "kindc": "film", "status": "live", "img": "media/yt/KzWDwhBD3ts.jpg", "dur": 147, "by": "Cynthia Solomon", "v": "KzWDwhBD3ts", "coll": ["dividing-engine"]}, {"t": "2500marvinshort", "b": "", "kindc": "film", "status": "live", "img": "media/yt/c4kMzrDr4jQ.jpg", "dur": 285, "by": "Cynthia Solomon", "v": "c4kMzrDr4jQ", "coll": ["div function cardYear(cd){

function linkTerms(cd){

              .replace(/^[\s.,:;'"]+|[\s.,:;'"]+$/g,"");

  if(_app) return _app;
  const contents=[], index={}, glossary=[], pts=[];
  let undated=0;
  for(const s of STACKS){
    if(s.id==="home" || s.kind==="apparatus") { }
    if(s.id!=="home" && s.kind!=="apparatus"){
      contents.push({id:s.id, kind:s.kind||"thread", title:s.title, short:shortName(s),
        sub:s.sub||"", n:s.cards.length,
        film:s.cards.filter(c=>c.kindc==="film").length,
        cards:s.cards.map((c,i)=>({t:c.t||"", d:c.d||"", to:`${s.id}/${i}`,
                                   film:c.kindc==="film"?1:0}))});
    }
    s.cards.forEach((c,i)=>{
      if(s.id==="home"||s.kind==="apparatus"||c.special) return;
      const y = cardYear(c);
      if(y===null) undated++;
      else pts.push({y, to:`${s.id}/${i}`, t:(c.t||"").slice(0,70), f:c.kindc==="film"?1:0});
      if(c.kindc==="film") return;
      for(const term of linkTerms(c))
        (index[term] = index[term]||[]).push({to:`${s.id}/${i}`, in:shortName(s)});
      const body=(c.b||"").replace(/<[^>]+>/g,"").trim();
      const title=(c.t||"").trim();
      if(body && title.length>3 && title.toLowerCase()!=="overview"){
        const first=body.split(/(?<=[.;])\s/)[0].trim();
        if(first.length>=24 && first.length<=240)
          glossary.push({t:title, g:first, to:`${s.id}/${i}`, d:c.d||""});
      }
    });
  }
  const ix={}, seenG=new Set(), gl=[];
  Object.keys(index).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
    .forEach(k=>{ if(index[k].length<=6) ix[k]=index[k]; });
  glossary.sort((a,b)=>a.t.toLowerCase().localeCompare(b.t.toLowerCase()))
    .forEach(g=>{ const k=g.t.toLowerCase(); if(!seenG.has(k)){seenG.add(k); gl.push(g);} });
  pts.sort((a,b)=>a.y-b.y);
  _app = {contents, index:ix, glossary:gl, time:{pts, undated}};
  return _app;
}

function md(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")

let SHORT = null;
function shortOf(id){

function linkify(h){
  // "(Thread T)" is a manuscript note; a book says "The Harmony Thread".
  h = h.replace(/\(?\bThread ([A-Z])(\d?)\b\)?/g,(m,L)=> byId["thread-"+L]!==undefined
      ? `<a class="x" href="#thread-${L}/0">${shortOf("thread-"+L)||m}</a>` : m);
  h = h.replace(/Era (\d{1,2})\b/g,(m,n)=> byId["era-"+n]!==undefined
      ? `<a class="x" href="#era-${n}/0">${m}</a>` : m);
  return h;
}
function fmtSci(x){
  if(!isFinite(x)) return "\u221e";
  const e=Math.floor(Math.log10(x)), man=x/Math.pow(10,e);
  return `${man.toFixed(1)}\u00d710<sup>${e}</sup>`;
}
function humanTime(sec){
  if(sec<1) return sec.toPrecision(2)+" s";
  if(sec<60) return Math.round(sec)+" s";
  if(sec<3600) return Math.round(sec/60)+" min";
  if(sec<86400) return Math.round(sec/3600)+" h";
  const yr=sec/3.156e7;
  if(yr<1) return Math.round(sec/86400)+" days";
  if(yr<1e4) return Math.round(yr).toLocaleString()+" years";
  if(sec<AGE_UNIVERSE_S) return fmtSci(yr)+" years";
  return fmtSci(sec/AGE_UNIVERSE_S)+" \u00d7 age of universe";
}

function computeLadder(){
  const secs = Math.max(1, +($("#secs").value||30));
  const yourRate = 1/secs;
  let rows = [["You, by hand", yourRate], ...LADDER];
  let h = `<table class="hc"><tr><th>Computer</th><th>ops / second</th><th>One training run</th></tr>`;
  for(const [name,rate] of rows){
    h += `<tr><td>${name}</td><td class="num">${fmtSci(rate)}</td><td class="num">${humanTime(TRAINING_RUN/rate)}</td></tr>`;
  }
  h += `</table>`;
  const mult = (TRAINING_RUN/yourRate)/AGE_UNIVERSE_S;
  h += `<div class="punch">Working nonstop at your pace, one training run would take you about <strong>${fmtSci(mult)} times the age of the universe</strong>. Every one of those operations is the arithmetic you are learning. The tradition is yours; only the speed has changed.</div>`;
  $("#ladderout").innerHTML = h;
}

let _page = null;                       // {items, render, limit, chunk, host}
function paginate(hostSel, items, rowHtml, chunk){
  _page = {items, rowHtml, chunk, limit:chunk, host:hostSel};
  paintPage(false);
  const s = $("#pmore");
  if(s && "IntersectionObserver" in window){
    new IntersectionObserver(es=>{
      if(es[0].isIntersecting && _page && _page.limit < _page.items.length){
        _page.limit += _page.chunk; paintPage(true);
      }
    },{rootMargin:"700px"}).observe(s);
  }
}
function paintPage(append){
  if(!_page) return;
  const host = $(_page.host); if(!host) return;
  const from = append ? host.children.length : 0;
  const html = _page.items.slice(from, _page.limit).map(_page.rowHtml).join("");
  if(append) host.insertAdjacentHTML("beforeend", html); else host.innerHTML = html;
  const shown = Math.min(_page.limit, _page.items.length), s=$("#pmore");
  if(s){ s.hidden = shown >= _page.items.length;
         s.textContent = `showing ${shown} of ${_page.items.length} — scroll for more`; }
}

  const nf = FILMS.length;
  const nc = STACKS.reduce((a,s)=>a + s.cards.filter(c=>c.kindc!=="film").length, 0);
  let h = `<div class="startcard">
    <p class="slede">The history of computation as <em>one timeline</em> —
      from a notched bone to the machines we now call AI.</p>
    <p class="ssub">${nf.toLocaleString()} archival films · ${nc.toLocaleString()} cards · 45,000 years</p>`;

  const ways = START.map(x=>{
    const got = cardByTitle(x.t);
    if(!got) return "";
    // the opening About card carries plates rather than a single picture
    const img = got.cd.img || (got.cd.plates && got.cd.plates[0] && got.cd.plates[0].src) || "";
    return `<a href="#${STACKS[got.si].id}/${got.ci}"><span class="hf"><img src="${esc(img)}"
      alt="" loading="lazy" decoding="async"></span><span class="hk">${esc(x.k)}</span>
      <span class="ht">${esc(got.cd.t||"")}</span></a>`;
  }).join("");
  if(ways) h += `<h3>Four ways in</h3>
    <p class="snote">the machine this is named for, and three of the best things here</p>
    <div class="startgrid">${ways}</div>`;

  const P = (DATA.picks||[]);
  if(P.length) h += `<h3>Ten films to start with</h3>
    <p class="snote">short, and not where a history of computing usually begins</p>
    <div class="shelf">${P.map(p=>`
      <a href="#${p.to}"><span class="pf">${p.dur?`<span class="pd">${fmtDur(p.dur)}</span>`:""}
        <img src="${esc(p.img||"")}" alt="" loading="lazy" decoding="async"></span>
        <span class="pn">${p.d?`<span class="py">${esc(p.d)}</span>`:""}${esc(p.t)}</span>
        <span class="pw">${esc(p.why||"")}</span></a>`).join("")}</div>
    <p class="snote"><a class="x" href="#films">All ${nf.toLocaleString()} films &rarr;</a></p>`;

  return h + `</div>`;
}



function paintSheet(append){
  const from = append ? $("#sheet").children.length : 0;
  const slice = sList.slice(from, sLimit);
  const h = slice.map(f=>{
    const cd=f.cd;
    const bad = cd.status==="dead" ? '<span class="sbad">lost</span>'
              : cd.status==="blocked" ? '<span class="sbad off">off-site</span>' : "";
    return `<li class="${cd.status==="dead"?"sdead":""}"><a href="#${STACKS[f.st].id}/${f.c}" data-s="${f.st}" data-c="${f.c}">
      <span class="sfr">${bad}${cd.dur?`<span class="sdur">${fmtDur(cd.dur)}</span>`:""}
      <img src="${esc(cd.img||"")}" alt="" loading="lazy" decoding="async"></span>
      <span class="smeta"><span class="sy">${cd.d?esc(cd.d):"—"}</span><span class="sn">${esc(cd.t)}</span></span>
    </a></li>`;}).join("");
  if(append) $("#sheet").insertAdjacentHTML("beforeend",h); else $("#sheet").innerHTML=h;
  const shown=Math.min(sLimit,sList.length);
  $("#smore").hidden = shown>=sList.length;
  $("#smore").textContent = "Showing "+shown+" of "+sList.length+" — scroll for more";
}
function initSheet(){
  const eras = STACKS.map((s,i)=>({s,i})).filter(x=>x.s.kind==="era"&&x.s.cards.some(c=>c.kindc==="film"));
  const colls = (DATA.colls)||{};
  const used = {};
  FILMS.forEach(f=>(f.cd.coll||[]).forEach(c=>{ used[c]=(used[c]||0)+1; }));
  $("#sera").innerHTML =
    '<option value="all">All films</option>' +
    `<option value="playable">Plays here (${FILMS.filter(f=>f.cd.status==="live").length})</option>` +
    `<optgroup label="Era">` +
      eras.map(x=>`<option value="era:${x.s.id}">${esc(x.s.title.replace(/^Era \d+: /,""))}</option>`).join("") +
    `</optgroup>` +
    (Object.keys(used).length ? `<optgroup label="Collection">` +
      Object.keys(used).sort((a,b)=>used[b]-used[a]).map(c=>
        `<option value="coll:${esc(c)}">${esc(colls[c]||c)} (${used[c]})</option>`).join("") +
      `</optgroup>` : "");
  $("#sq").addEventListener("input", sheetFilter);
  $("#sera").addEventListener("change", sheetFilter);
  $("#sheet").addEventListener("click", e=>{
    const a=e.target.closest("a[data-s]"); if(!a) return;
    e.preventDefault(); sheetOff(); go(+a.dataset.s, +a.dataset.c);
  });
  if("IntersectionObserver" in window){
    new IntersectionObserver(es=>{
      if(es[0].isIntersecting && sLimit<sList.length){ sLimit+=120; paintSheet(true); }
    },{rootMargin:"600px"}).observe($("#smore"));
  }
  sheetFilter();
}

/* ── the scale: 45,000 years, and where you are on them ──────────────── */
const T = APP.time;
// The archive ends at 2000: that is the catalogue's cutoff and where the film
// record thins. Running the axis to the present would spend room on nothing.
const END = 2000;
let gear = "deep";                       // "deep" (log, all of it) | "century"
const bp = y => Math.max(1, END - y);
function xOf(y){
  if(gear==="century"){
    const a=1890, b=END;
    return Math.max(0, Math.min(100, (y-a)/(b-a)*100));
  }
  const lo = Math.log10(bp(T.pts.length? T.pts[0].y : -43000));
  return Math.max(0, Math.min(100, (Math.log10(bp(y)) - lo) / (0 - lo) * 100));
}
function visible(p){ return gear!=="century" || p.y>=1890; }
function drawScale(){
  const W = T.undated ? 88 : 100;
  const sc = x => x*W/100;
  let h="";
  for(const p of T.pts){
    if(!visible(p)) continue;
    h += `<span class="tk${p.f?" f":""}" style="left:${sc(xOf(p.y)).toFixed(3)}%;height:${p.f?7:11}px"></span>`;
  }
  $("#ticks").innerHTML = h;
  const marks = gear==="century"
    ? [1900,1920,1940,1960,1980,2000]
    : [-40000,-10000,-3000,-500,500,1500,1800,1900,1960,END];
  $("#bands").innerHTML = marks.map(y=>{
    const lab = y<0? `${Math.abs(y)>=1000?(Math.abs(y)/1000)+"k":Math.abs(y)} BCE` : String(y);
    return `<div class="band" style="left:${sc(xOf(y)).toFixed(3)}%"><span>${lab}</span></div>`;
  }).join("");
  $("#axis").style.right = T.undated ? (100-W)+"%" : "0";
  const ub = $("#undband");
  if(T.undated){ ub.hidden=false; ub.style.left=(W+4)+"%"; ub.style.width=(100-W-4)+"%"; }
  else ub.hidden = true;
  placeMark();
}
function placeMark(){
  const st = STACKS[cur.s], cd = st && st.cards[cur.c];
  const m = $("#mark");
  if(!cd || $("#deskarea").hidden){ m.hidden=true; return; }
  const y = cardYear(cd);
  if(y===null || !visible({y})){ m.hidden=true; return; }
  const W = T.undated ? 88 : 100;
  m.hidden=false;
  m.style.left = (xOf(y)*W/100).toFixed(3)+"%";
}
function nearestTo(pct){
  const W = T.undated ? 88 : 100;
  let best=null, bd=1e9;
  for(const p of T.pts){
    if(!visible(p)) continue;
    const d = Math.abs(xOf(p.y)*W/100 - pct);
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}
function initScale(){
  drawScale();
  const el = $("#scaleinner");
  el.addEventListener("mousemove", e=>{
    const r=el.getBoundingClientRect(), pct=(e.clientX-r.left)/r.width*100;
    const p=nearestTo(pct); const tip=$("#stip");
    if(!p){ tip.hidden=true; return; }
    tip.hidden=false;
    tip.textContent = (p.y<0? Math.abs(p.y)+" BCE" : p.y)+"  "+p.t;
    tip.style.left = Math.max(6, Math.min(94, pct))+"%";
  });
  el.addEventListener("mouseleave", ()=>{ $("#stip").hidden=true; });
  el.addEventListener("click", e=>{
    const r=el.getBoundingClientRect(), pct=(e.clientX-r.left)/r.width*100;
    const p=nearestTo(pct); if(p) location.hash = p.to;
  });
  $("#undband").addEventListener("click", e=>{
    e.stopPropagation();                 // sits inside the scale; do not travel twice
    location.hash = "undated/0";
  });
  $("#gear").addEventListener("click", ()=>{
    gear = gear==="deep" ? "century" : "deep";
    $("#gear").textContent = gear==="deep" ? "deep time" : "the filmed century";
    drawScale();
  });
}

function render(push=true){
  const st = STACKS[cur.s], cd = st.cards[cur.c];
  const want = `#${st.id}/${cur.c}`;
  if(push){ if(location.hash !== want) location.hash = want; }
  else if(location.hash !== want) history.replaceState(null,"",want);
  $("#stacklbl").textContent = st.title + (st.sub? " \u2014 "+st.sub : "");
  let h = `<div class="fade">`;
  const kindWord = st.kind==="era" ? "Timeline"
                 : st.kind==="undated" ? "Not yet dated" : "Stack";
  h += `<div class="eyebrow"><span>${kindWord}</span>` +
       (cd.ch? `<span class="ch">${esc(cd.ch)}</span>`:"") + `</div>`;
  if(cd.d) h += `<span class="date">${esc(cd.d)}</span><br>`;
  h += `<h1 class="cardtitle">${md(esc(cd.t))}</h1>`;
  if(cd.special==="ladder") h += renderLadder();
  else if(cd.special==="contents") h += renderContents();
  else if(cd.special==="index"){ h += renderIndex(); setTimeout(wireIndex,0); }
  else if(cd.special==="glossary"){ h += renderGlossary(); setTimeout(wireGlossary,0); }
  else if(cd.special==="map") h += renderMap();
  else if(cd.special==="start") h += renderStart();
  else if(cd.kindc==="film") h += renderFilm(cd);
  else {
    if(cd.plates) h += renderPlates(cd);
    if(cd.img) h += `<figure class="cardpic"><img src="${esc(cd.img)}" alt="" loading="lazy">` +
      (cd.cred? `<figcaption>${cd.credurl?`<a href="${esc(cd.credurl)}" target="_blank" rel="noopener">${esc(cd.cred)}</a>`:esc(cd.cred)}</figcaption>`:"") +
      `</figure>`;
    h += `<div class="body">${linkify(md(cd.b.includes("<")? cd.b : esc(cd.b)))}</div>`;
  }
  h += renderLinks(cd);
  h += `</div>`;
  $("#content").innerHTML = h;
  if(cd.special==="ladder"){ computeLadder(); $("#secs").addEventListener("input",computeLadder); }
  $("#progfill").style.width = ((cur.c+1)/st.cards.length*100)+"%";
  placeMark();
  $("#prevb").disabled = (cur.s===0 && cur.c===0);
  const lastStack = cur.s===STACKS.length-1, lastCard = cur.c===st.cards.length-1;
  $("#nextb").disabled = lastStack && lastCard;
  $("#nextstackb").style.display = lastStack? "none":"";
  $("#counter").textContent = `Card ${cur.c+1} of ${st.cards.length}`;
  window.scrollTo({top:0});
}
function go(s,c,push=true){ sheetOff(); cur={s:Math.max(0,Math.min(s,STACKS.length-1)),c:0};
  cur.c = Math.max(0,Math.min(c,STACKS[cur.s].cards.length-1)); render(push); }
function step(dir){
  let {s,c}=cur; c+=dir;
  if(c<0){ if(s>0){s--; c=STACKS[s].cards.length-1;} else c=0; }
  else if(c>=STACKS[s].cards.length){ if(s<STACKS.length-1){s++;c=0;} else c=STACKS[s].cards.length-1; }
  go(s,c);
}
function showSheet(){ sheetOn(); }
function fromHash(){
  const m = location.hash.replace(/^#/,"").split("/");
  if(m[0]==="films"){ sheetOn(false); return true; }
  if(byId[m[0]]!==undefined){ go(byId[m[0]], +(m[1]||0), false); return true; }
  return false;
}

function buildGo(){
  const g=$("#golist");
  let h = `<a href="#home/0">Home</a><div class="sep"></div><div class="grp">REFERENCE</div>`;
  ["about","contents","index","glossary"].forEach(id=>{
    if(byId[id]!==undefined) h += `<a href="#${id}/0">${esc(STACKS[byId[id]].title)}</a>`;
  });
  h += `<div class="sep"></div><div class="grp">TIMELINE</div>`;
  for(const s of STACKS) if(s.kind==="era") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  h += `<div class="sep"></div><div class="grp">THREADS</div>`;
  for(const s of STACKS) if(s.kind==="thread") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  g.innerHTML=h;
}
function wander(){
  const pool=[]; STACKS.forEach((s,i)=>s.cards.forEach((_,j)=>{ if(!(i===cur.s&&j===cur.c)) pool.push([i,j]); }));
  const [s,c]=pool[Math.floor(Math.random()*pool.length)]; go(s,c);
}
function doFind(q){
  q=q.trim().toLowerCase(); if(!q) return;
  const found={id:"found",kind:"thread",title:`Found: \u201c${q}\u201d`,sub:"",cards:[]};
  STACKS.forEach(s=>{ if(s.id==="found") return;
    s.cards.forEach((cd,j)=>{
      if((cd.t+" "+(cd.d||"")+" "+cd.b).toLowerCase().includes(q))
        found.cards.push({...cd, ch:s.title});
    });});
  if(!found.cards.length){ found.cards.push({t:"Nothing found", b:`No card mentions \u201c${esc(q)}\u201d. Try a shorter word \u2014 or add the card yourself (see Home).`}); }
  const i = byId["found"];
  if(i!==undefined) STACKS[i]=found; else { byId["found"]=STACKS.length; STACKS.push(found); }
  go(byId["found"],0);
}

document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="home") go(0,0);
  if(act==="sheet"){ e.preventDefault(); sheetOn(); }
  if(act==="wander") wander();
  if(act==="back") history.back();
  if(act==="find"){ $("#finddlg").showModal(); $("#findq").select(); }
  const menu=$("#gomenu"); if(menu.open && !e.target.closest("#gomenu")) menu.open=false;
  if(e.target.closest("#golist a")) menu.open=false;
});
$("#prevb").onclick=()=>step(-1);
$("#nextb").onclick=()=>step(1);
$("#nextstackb").onclick=()=>go(cur.s+1,0);
$("#findgo").onclick=()=>{ $("#finddlg").close(); doFind($("#findq").value); };
$("#findcancel").onclick=()=>$("#finddlg").close();
$("#findq").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#finddlg").close(); doFind($("#findq").value);} });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||$("#finddlg").open) return;
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
  if(e.key.toLowerCase()==="h") go(0,0);
  if(e.key.toLowerCase()==="w") wander();
  if(e.key.toLowerCase()==="f"){ e.preventDefault(); $("#finddlg").showModal(); $("#findq").select(); }
});
let tx=null;
document.addEventListener("touchstart",e=>{ tx=e.changedTouches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>60 && !$("#finddlg").open) step(dx<0?1:-1);
},{passive:true});
window.addEventListener("hashchange",()=>{ if(!fromHash()) sheetOn(false); });

buildGo();
initScale();
initSheet();
if(!fromHash()) sheetOn(false);   // no hash -> land on the films, as it was
</script>
