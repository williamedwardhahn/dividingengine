: ["dividing-engine"]}, {"t": "Wendy Carlos demonstrates her Moog Synthesizer in 1970", "b": "", "kindc": "film", "status": "live", "d": "1970", "img": "media/yt/4SBDH5uhs4Q.jpg", "dur": 236, "by": "soup", "v": "4SBDH5uhs4Q", "coll": ["dividing-engine"]}, {"t": "Physical Display to Study Perception", "d": "1970", "b": "Stuart Anstis, a professor of psychology at UCSD, built this device for studying perceptual illusions. I made this movie clip in the 1970’s, when I had more hair than brains. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/physical-display-to-study-perception/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Byron's Bender", "d": "1970", "b": "In the early 1970's, crystallographer Byron Rubin invented a tool that bends wires to make proteins models. The tool was popular until the 1990s. Byron Rubin became an artist who builds large-scale molecular sculptures. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/byrons-bender/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "MoMA Poll: Participatory Bar Chart", "d": "1970", "b": "German-American artist Hans Haacke created a participatory physical bar chart as part of a 1970 exhibition at the Museum of Modern Art (MoMA). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/moma-poll-haackes-participatory-bar-chart/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "3D Sankey Diagram", "d": "1970", "b": "This physical 3D Sankey diagram shows complex energy flows and was created in the 70s by the Center for Strategic & International Studies (CSIS). Little information is available about it. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/3d-sankey-diagram/\" by": "evltube", "v": "8qh6jRzjmcY", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "The Lighthill Debate", "b": "", "kindc": "film", "status": "live", "d": "1973", "img": "media/yt/yReDbeY7ZMU.jpg", "dur": 846, "by": "bilkable", "v": "yReDbeY7ZMU", "coll": ["dividing-engine-original"]}, {"t": "The Year They Discovered People (Bonus Edition)", "b": "", "kindc": "film", "status": "live", "d": "1973", "img": "media/yt/pd8l7PRBpTw.jpg", "dur": 939, "by": "AT&T Tech Channel", "v": "pd8l7PRBpTw", "coll": ["att-archives"]}, {"t": "Mazamet Ville Morte", "d": "1973", "b": "In 1973, the French town of Mazamet had a population that closely matched the nationwide number of motor vehicule deaths across the previous year. A TV reporter decided to show all inhabitants lying on the floor to symbolize these deaths. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/mazamet-ville-morte/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "The Ultra secret breaks", "b": "Winterbotham's *The Ultra Secret* reveals Bletchley Park; thousands of oath-bound veterans finally learn what the person at the next desk had been doing — and the history of computing has to be rewritten.", "d": "1974", "img": "media/cards/5fbeb918bc48.webp", "cred": "Elgaard · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:EnigmaMachine_Warzawa.jpg"}, {"t": "Integrated circuit (Kilby, Noyce)", "b": "Jack Kilby at Texas Instruments built a working circuit in a single slab of germanium in September 1958, wires still hanging off it. Robert Noyce at Fairchild arrived at the same idea months later and solved the part Kilby had not — using Jean Hoerni's planar process to lay the connections down in the same operation that made the components. Kilby proved it was possible; Noyce made it manufacturable, and the count of components on one chip started doubling.", "d": "1958–59", "img": "media/cards/6f28d4694ea2.webp", "cred": "Mister rf · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A07R01.jpg"}, {"t": "The golden age of electronic analog computers", "b": "patch-panel machines built from op-amps (\"operational\" = performing mathematical operations) solve differential equations for aerospace and industry — often faster than early digital machines; fluidic logic (gates made of nothing but jets and channels) computes with air and water, no electronics at all; hybrid analog–digital installations linger into the 1980s.", "d": "1950s–60s"}, {"t": "NASA's human computers (Katherine Johnson, Dorothy Vaughan, Mary Jackson)", "b": "trajectories computed by hand; John Glenn asks Johnson to *check the electronic computer's numbers by hand* before flying — the handoff moment between human and machine computation.", "d": "1950s–60s", "img": "media/cards/3c470d4f4157.webp", "cred": "NACA (NASA) · Public domain", "credurl": "https://commons.wikimedia.org/wiki/File:Human_computers_-_Dryden.jpg"}, {"t": "IBM System/360", "b": "IBM bet the company — five billion dollars, more than the Manhattan Project — on one idea: a *family* of machines, from small to enormous, that all ran the same software. Before this, a bigger computer meant rewriting everything. Compatibility as a product is why your software survives your hardware, and it is the reason mainframes from the 1960s still have descendants running banks.", "d": "1964", "img": "media/cards/d00d08b2b3e0.webp", "cred": "Sandstein · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AIBM%20system%20360-50%20console%20-%20MfK%20Bern.jpg"}, {"t": "Moore's Law", "b": "stated: Gordon Moore had four data points and wrote a magazine piece predicting the trend would hold for a decade. It held for fifty years, and stopped being an observation somewhere along the way — the whole industry began planning to it, so it became a schedule everyone agreed to meet. A self-fulfilling prophecy is still a prophecy that came true.", "d": "1965", "in": [{"to": "era-10/3", "t": "In Business: Computers Chipped"}], "img": "media/cards/567a26ea2f6b.webp", "cred": "Max Roser, Hannah Ritchie · CC BY 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AMoore%27s%20Law%20Transistor%20Count%201970-2020.png"}, {"t": "Engelbart's \"Mother of All Demos\"", "b": "ninety minutes in San Francisco in which Douglas Engelbart showed a mouse, windows, hypertext links, shared-screen collaboration, live video conferencing and version control — all of it working, over a leased line to a machine 30 miles away. Almost everything on your screen right now was demonstrated that afternoon, to an audience that mostly did not know what it was looking at.", "d": "1968", "in": [{"to": "era-7/53", "t": "Vannevar Bush's Memex (\"As We May Think\")"}, {"to": "thread-S/4", "t": "The lineage of the dream"}], "img": "media/cards/b4d5ea26b254.webp", "cred": "SRI International · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:SRI_Douglas_Engelbart_1968.jpg"}, {"t": "Computer algebra begins (Macsyma)", "b": "machines now do *symbolic* mathematics — algebra and calculus, not just arithmetic.", "d": "1968–71"}, {"t": "ARPANET", "b": "computers begin talking to each other — built on packet switching (Baran, Davies): messages chopped into independently routed fragments; email (1971) becomes the surprise killer app; TCP/IP (designed 1974, adopted 1983) becomes the internet's common tongue.", "d": "1969", "img": "media/cards/f7062bed0237.webp", "cred": "Semaforo GMS · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AArpanet%20in%20the%201970s.png"}, {"t": "Intel 4004", "b": "designed for a Japanese desk calculator, 2,300 transistors, four bits at a time. Intel's contribution was refusing to build the twelve custom chips the customer ordered and building one programmable one instead — the same silicon could be a calculator, a till or a traffic light, depending on what you loaded into it. Intel had to buy back the rights from the calculator company to sell it to anyone else.", "d": "1971", "img": "media/cards/a0f9ccb9205c.webp", "cred": "Stelo.xyz, Pttn, or Thomas Nguyen · CC BY-SA 4.0", "credurl": "https://commons.wikimedia.org/wiki/File:Intel_C4004.jpg"}, {"t": "HP-35 pocket scientific calculator", "b": "Bill Hewlett asked for a slide rule that fitted in a shirt pocket, and market research told HP nobody would buy one at $395. They sold a hundred thousand in the first year. Keuffel & Esser, who had made slide rules since the 1860s, stopped in 1976 — an entire skilled practice, taught to every engineer alive, obsolete inside four years.", "d": "1972", "img": "media/cards/3f7e86f30320.webp", "cred": "Seth Morabito · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3AHP%2035%20Calculator.jpg"}, {"t": "Careers: Line Worker", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/kIdO7iwxQqA.jpg", "dur": 288, "by": "AT&T Tech Channel", "v": "kIdO7iwxQqA", "coll": ["att-archives"]}, {"t": "Careers: Service Representative", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/sptrIBK32oA.jpg", "dur": 336, "by": "AT&T Tech Channel", "v": "sptrIBK32oA", "coll": ["att-archives"]}, {"t": "Crystal Growth Morphologies, a 1974 microscopic film study from Bell Laboratories", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/Y3GwvN5W1dE.jpg", "dur": 644, "by": "AT&T Tech Channel", "v": "Y3GwvN5W1dE", "coll": ["att-archives"]}, {"t": "Draw Me a Telephone", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/38Q0mLJ7aQo.jpg", "dur": 751, "by": "AT&T Tech Channel", "v": "38Q0mLJ7aQo", "coll": ["att-archives"]}, {"t": "Early CGI Facial Animation", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/SPMFhcC4SvQ.jpg", "dur": 221, "by": "VintageCG", "v": "SPMFhcC4SvQ", "coll": ["vintage-cg"]}, {"t": "Faces and Body Parts - First talking polygonal human", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/_kElpJjW8Yk.jpg", "dur": 221, "by": "Ultimate History of CGI", "v": "_kElpJjW8Yk", "coll": ["dividing-engine"]}, {"t": "Jacque Fresco - Introduction to Sociocyberneering - Larry King", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/lBIdk-fgCeQ.jpg", "dur": 2536, "by": "Jacque Fresco Foundation", "v": "lBIdk-fgCeQ", "coll": ["dividing-engine"]}, {"t": "One Day, a Computer Will Fit on a Desk", "b": "", "kindc": "film", "status": "blocked", "d": "1974", "img": "media/yt/sTdWQAKzESA.jpg", "dur": 87, "by": "ABC News In-depth", "v": "sTdWQAKzESA", "coll": ["dividing-engine-original"]}, {"t": "The Engineer", "b": "", "kindc": "film", "status": "blocked", "d": "1974", "img": "media/yt/EtC9YsFqnBo.jpg", "dur": 724, "by": "AT&T Tech Channel", "v": "EtC9YsFqnBo", "coll": ["att-archives"]}, {"t": "U.S. Navy Mark 86 MOD 3 Digital Gun Fire Control System 1974 Training Film", "b": "", "kindc": "film", "status": "live", "d": "1974", "img": "media/yt/L3TiEhc3mdI.jpg", "dur": 1520, "by": "PeriscopeFilm", "v": "L3TiEhc3mdI", "coll": ["advantage"]}, {"t": "Appel & Haken prove the Four Color Theorem by computer", "b": "the first major theorem whose proof *requires* machine computation — mathematics itself changed.", "d": "1976"}, {"t": "The Wembley tote machine", "b": "a totalisator from the greyhound stadium, computing live odds across every bet as it was placed and driving a giant display — real-time computation as public entertainment, decades before the phrase existed.", "d": "c. 1955", "img": "media/museum/afeaa9ce7db4.webp", "cred": "Totalisator from Wembley Greyhound Stadium, about 1955"}, {"t": "The London Hospital Survival Predictor", "b": "A machine that compared a coma patient's brain measurements against stored cases and pointed a needle between S for survive and D for die. Clinical prediction, in a box, with a dial.", "d": "c. 1972", "im h industry falling behind in its use of silicon chip technology? By using microelectronics in its products or in production, a company can improve its competitiveness enormously.", "kindc": "film", "status": "offsite", "d": "1980", "img": "media/clp/dc135901c8a5.jpg", "dur": 2350, "by": "BBC", "v": "8f7e42a1aab14aa79e31a0460bc5a641", "url": "https://clp.bbcrewind.co.uk/8f7e42a1aab14aa79e31a0460bc5a641", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Silicon Factor: So What's It All about?", "b": "The silicon chip, unnoticed by most of us a few years ago, is now something everybody has heard about, few understand and many are beginning to fear.", "kindc": "film", "status": "offsite", "d": "1980", "img": "media/clp/7fc067db48ef.jpg", "dur": 2369, "by": "BBC", "v": "2264a5e86a4aa2e8b36ed6acee9f6462", "url": "https://clp.bbcrewind.co.uk/2264a5e86a4aa2e8b36ed6acee9f6462", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Slatemakers", "b": "", "kindc": "film", "status": "live", "d": "1980", "img": "media/yt/zPLp-yT5NPA.jpg", "dur": 2985, "by": "Christopher Sykes", "v": "zPLp-yT5NPA", "coll": ["dividing-engine"]}, {"t": "Xerox Mockingbird", "b": "", "kindc": "film", "status": "live", "d": "1980", "img": "media/yt/p45NXD_iPPI.jpg", "dur": 513, "by": "VintageCG", "v": "p45NXD_iPPI", "coll": ["vintage-cg"]}, {"t": "People on a Giant World Map", "d": "1980", "b": "The World Game Workshop used a giant (basketball court size) world map to display population growth, distribution, and density, energy use, food and a host of other global variables and problems. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/giant-global-map-data-visualizations/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Feynman, \"Simulating Physics with Computers\"", "b": "Feynman's complaint was practical — simulating quantum systems on an ordinary computer costs exponentially more as the system grows, so nature is doing something our machines cannot follow. His conclusion: stop trying, and build the simulator out of quantum mechanics itself. 'Nature isn't classical, dammit, and if you want to make a simulation of nature, you'd better make it quantum mechanical.'", "d": "1981", "img": "media/cards/5ea6ff69291d.webp", "cred": "Copyright Tamiko Thiel 1984 · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ARichardFeynman-PaineMansionWoods1984%20copyrightTamikoThiel%20bw.jpg"}, {"t": "Abel and Associates Demo Reel - 1981", "b": "", "kindc": "film", "status": "blocked", "d": "1981", "img": "media/yt/QwpOSZeGmzw.jpg", "dur": 598, "by": "VintageCG", "v": "QwpOSZeGmzw", "coll": ["dividing-engine"]}, {"t": "Bell Labs Animation Processor circa 1981", "b": "", "kindc": "film", "status": "blocked", "d": "1981", "img": "media/yt/98EyJG-xmu4.jpg", "dur": 751, "by": "Sandy Ressler", "v": "98EyJG-xmu4", "coll": ["dividing-engine"]}, {"t": "Carla's Island", "b": "", "kindc": "film", "status": "live", "d": "1981", "img": "media/yt/kO-JB1WHmRc.jpg", "dur": 292, "by": "VintageCG", "v": "kO-JB1WHmRc", "coll": ["vintage-cg"]}, {"t": "Electrical Materials Research: 1981", "b": "", "kindc": "film", "status": "live", "d": "1981", "img": "media/yt/-H6zp-6vWME.jpg", "dur": 679, "by": "Imperial College London", "v": "-H6zp-6vWME", "coll": ["dividing-engine"]}, {"t": "Evans & Sutherland CT5 Flight Simulator", "b": "", "kindc": "film", "status": "live", "d": "1981", "img": "media/yt/6W-qb_jHRhA.jpg", "dur": 348, "by": "VintageCG", "v": "6W-qb_jHRhA", "coll": ["dividing-engine"]}, {"t": "How Computer Graphics Will Change the World", "b": "", "kindc": "film", "status": "live", "d": "1981", "img": "media/yt/W8-54-9J9ns.jpg", "dur": 2966, "by": "BBC Archive", "v": "W8-54-9J9ns", "coll": ["dividing-engine"]}, {"t": "Image West Demo Reel", "b": "", "kindc": "film", "status": "blocked", "d" in Control: Making Things Move", "b": "An introduction to the world of robotics. 3: Making Things Move: IAN MCNAUGHT-DAVIS continues his exploration of the principles behind the use of the computer in robotics by finding out how to make things move - even using a home micro.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/2d78823e37de.jpg", "dur": 1476, "by": "BBC", "v": "778bb5cb1e9d471cdb498c80e42e5193", "url": "https://clp.bbcrewind.co.uk/778bb5cb1e9d471cdb498c80e42e5193", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Computers in Control: Recognising the Obvious", "b": "An introduction to the world of robotics 5: Recognising the Obvious : We see, hear and interpret the real world with ease.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/ac0ad8d4b956.jpg", "dur": 1476, "by": "BBC", "v": "bb2fe68bfc6d69306da112c9515b9713", "url": "https://clp.bbcrewind.co.uk/bb2fe68bfc6d69306da112c9515b9713", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Digital Productions 1984 Demo Reel", "b": "", "kindc": "film", "status": "live", "d": "1984", "img": "media/yt/N6u7yF2HtCw.jpg", "dur": 141, "by": "VintageCG", "v": "N6u7yF2HtCw", "coll": ["vintage-cg"]}, {"t": "Easy Microcomputing - 1984 - VHS Tape - (Future Computers FX30 & Sinclair QL)", "b": "", "kindc": "film", "status": "live", "d": "1984", "img": "media/yt/ZA-r7SjIWYA.jpg", "dur": 4616, "by": "The Centre for Computing History", "v": "ZA-r7SjIWYA", "coll": ["dividing-engine"]}, {"t": "Electronic Office - Office on the Move (Episode 1)", "b": "", "kindc": "film", "status": "live", "d": "1984", "img": "media/yt/iTPS0jOBFxc.jpg", "dur": 1457, "by": "TheOldComputerDotCom", "v": "iTPS0jOBFxc", "coll": ["computers-101"]}, {"t": "Electronic Office - Wiring up the Organization (Episode 3)", "b": "", "kindc": "film", "status": "live", "d": "1984", "img": "media/yt/r2jRc3RGjKc.jpg", "dur": 1440, "by": "TheOldComputerDotCom", "v": "r2jRc3RGjKc", "coll": ["computers-101"]}, {"t": "Electronic Office -The Stand-alone Micro (Episode 2)", "b": "", "kindc": "film", "status": "live", "d": "1984", "img": "media/yt/DjKNp73vPAA.jpg", "dur": 1462, "by": "TheOldComputerDotCom", "v": "DjKNp73vPAA", "coll": ["computers-101"]}, {"t": "Electronic Office: Changing with the Times", "b": "4: Changing with the Times How do modern electronic methods affect the working habits and culture of an old established daily newspaper? IAN MCNAUGHT-DAVIS finds out with the help of journalists, editors and others at the New York Times.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/09b7eb862bbb.jpg", "dur": 1425, "by": "BBC", "v": "f26d99c48dec090dd9e4771b2d7075fc", "url": "https://clp.bbcrewind.co.uk/f26d99c48dec090dd9e4771b2d7075fc", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Electronic Office: Easy to Use?", "b": "6: Easy to Use? : Computer manufacturers at present claim 'ease of use' for their machines. In reality most computers are far from easy to use. In this last programme IAN MCNAUGHT-DAVIS takes a look at some of the work being done to humanise the technology.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/b075afe9682f.jpg", "dur": 1472, "by": "BBC", "v": "f3ef5977cac4d11eb901234a05081a29", "url": "https://clp.bbcrewind.co.uk/f3ef5977cac4d11eb901234a05081a29", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Electronic Office: Office on the Move", "b": "1: Office on the Move : The combination of ever cheaper computers and improved telecommunications has produced a quiet revolution on the desks of secretaries, clerks, middle managers and executives, sometimes for good, sometimes for ill. IAN MCNAUGHT-DAVIS.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/fd791b597959.jpg", "dur": 1468, "by": "BBC", "v": "6af06e4ea2010d2cb19f0afa7125e3ad", "url": "https://clp.bbcrewind.co.uk/6af06e4ea2010d2cb19f0afa7125e3ad", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Electronic Office: The Stand-alone Micro", "b": "2: The Stand-alone Micro : Most of the computers in business are being used for relatively straightforward tasks like word processing, financial planning and simple data base management.", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/946f351a716b.jpg", "dur": 1484, "by": "BBC", "v": "11fb8f62b7ff21ea5593a259c62fa713", "url": "https://clp.bbcrewind.co.uk/11fb8f62b7ff21ea5593a259c62fa713", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Electronic Office: Wiring up the Organisation", "b": "3: Wiring up the Organisation : A microcomputer on its own can perform many useful tasks in the office but as soon as an organisation starts linking computers together into a network, its whole style of working may change dramatically, with a consequent…", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/36c5bcba4852.jpg", "dur": 1481, "by": "BBC", "v": "095aac83264ed22376dffda6ce7e6516", "url": "https://clp.bbcrewind.co.uk/095aac83264ed22376dffda6ce7e6516", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Electronic Office: Wiring up the World", "b": "5: Wiring up the World : The microcomputing revolution in business would mean little without the telephone network. Companies can exchange data electronically with each other and even with us, their customers, in a fraction of a second, and this is having a…", "kindc": "film", "status": "offsite", "d": "1984", "img": "media/clp/e70b1f69f1fa.jpg", "dur": 1465, "by": "BBC", "v": "a753672677b875d625e039a3d65c40c9", "url": "https://clp.bbcrewind.co.uk/a753672677b875d625e039a3d65c40c9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "First Flight", "b": "", "kindc": "film", "status": "blocked", "d": "1984", : "BBC", "v": "f05772fc46f05c389eccda12e0ea2dd4", "url": "https://clp.bbcrewind.co.uk/f05772fc46f05c389eccda12e0ea2dd4", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 6", "b": "Lesley Judd , Fred Harris and Freff report on the world of information technology. This week: a look behind the scenes at one of the world's most successful games software companies.", "kindc": "film", "status": "offsite", "d": "1985", "img": "media/clp/b0b4e54b6a15.jpg", "dur": 1772, "by": "BBC", "v": "39c8602e0054a7c1602817236e2359e0", "url": "https://clp.bbcrewind.co.uk/39c8602e0054a7c1602817236e2359e0", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 8", "b": "A look at new developments in information technology by the only live computer programme on television. Boston, Massachusetts has the only museum in the world in which all the exhibits are less than 40 years old.", "kindc": "film", "status": "offsite", "d": "1985", "img": "media/clp/eb4e3096176d.jpg", "dur": 1797, "by": "BBC", "v": "5faadf2f1ba2710d5d17fb3c6d4fba7b", "url": "https://clp.bbcrewind.co.uk/5faadf2f1ba2710d5d17fb3c6d4fba7b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 9", "b": "A look at new developments in information technology. American reporter Freff risks using a computer database before buying a painting in a New York antique shop.", "kindc": "film", "status": "offsite", "d": "1985", "img": "media/clp/8adcaa68a594.jpg", "dur": 1779, "by": "BBC", "v": "cbd2f4b4421a9e8c3eb259761e655ce2", "url": "https://clp.bbcrewind.co.uk/cbd2f4b4421a9e8c3eb259761e655ce2", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Garth Hill School OB", "b": "Every primary and secondary school in Britain has a computer. No other country in the world can make that boast. In March the Government is axing the Microelectronics Ed ll": ["dividing-engine"]}, {"t": "Micro Live: AI & Expert Systems", "b": "In this week's programme on Artificial Intelligence, Ian McNaught-Davis asks if the computer will ever be able to make judgments, learn from its mistakes, or write creatively.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/b119b4919879.jpg", "dur": 1775, "by": "BBC", "v": "ef4f182cf7c462df73fd830b3d792788", "url": "https://clp.bbcrewind.co.uk/ef4f182cf7c462df73fd830b3d792788", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: CMU 1", "b": "A weekly look at the world of computers and information technology with Ian McNaught-Davis and Fred Harris. From America, Freff reports from Pittsburgh, Pennsylvania, where Carnegie Mellon University is engaged in a massive computer project.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/4007c406b716.jpg", "dur": 1776, "by": "BBC", "v": "619591f1d2f4034c8cc195ab1f8dc358", "url": "https://clp.bbcrewind.co.uk/619591f1d2f4034c8cc195ab1f8dc358", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Electronic Information (Andrew Neil)", "b": "A weekly look at the world of computers and information technology. Long Distance Information Electronic information is changing the way we do business - forcing even the most ancient British institutions to update themselves.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/fa1d2e2e9adb.jpg", "dur": 1769, "by": "BBC", "v": "7631142fef7b92b7994093adccc308b1", "url": "https://clp.bbcrewind.co.uk/7631142fef7b92b7994093adccc308b1", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Email", "b": "The weekly look at the world of information technology. A recent survey showed that about 70 per cent of telephone calls fail to get through - either because numbers are engaged or people aren't at their desks.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/69544a55f662.jpg", "dur": 1768, "by": "BBC", "v": "84d4e8864f710803798b76759b7c754c", "url": "https://clp.bbcrewind.co.uk/84d4e8864f710803798b76759b7c754c", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 1", "b": "The weekly look at the world of information technology with Lesley Judd Ian McNaught-Davis and Fred Harris. The home-computer industry has recently seen important changes of fortune for some of its major players, including Sir Clive Sinclair , Alan Sugar of…", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/a6b16d5b29ff.jpg", "dur": 1776, "by": "BBC", "v": "8ff4e887dd50cfd080b93041d4573dd9", "url": "https://clp.bbcrewind.co.uk/8ff4e887dd50cfd080b93041d4573dd9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 12", "b": "This week Micro Live visits a garden centre which uses a database to help its customers find the plants they need and Fred Harris explains how to use a database on a home micro.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/a05ac54ca403.jpg", "dur": 1752, "by": "BBC", "v": "c3650c988f53ec6773e17bfb7e12d351", "url": "https://clp.bbcrewind.co.uk/c3650c988f53ec6773e17bfb7e12d351", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 14", "b": "A live look at new developments in information technology. Is Prestel a world-beating information service or just a hacker's delight? Fred Harris investigates British Telecom's dial-up service, and compares it with the French system, Minitel.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/70142e67a51d.jpg", "dur": 1777, "by": "BBC", "v": "27453c8e8f5f6df8996bc66ffd0a88dc", "url": "https://clp.bbcrewind.co.uk/27453c8e8f5f6df8996bc66ffd0a88dc", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 17", "b": "Imagine a machine that can read out loud from any book or magazine; or a synthesiser that can reproduce the sound of an entire orchestra. Both were invented by Ray Kurzweil ... Freff reports from Boston.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/ec490e6d05ac.jpg", "dur": 1791, "by": "BBC", "v": "084ad1208ce7a6f8f2acb28af9f64dcc", "url": "https://clp.bbcrewind.co.uk/084ad1208ce7a6f8f2acb28af9f64dcc", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 18", "b": "Computers have undoubtedly changed the way many people work since they were first introduced into business in the 1950s. Technology is poised to be much more widely used and to change some jobs hitherto seen as 'safe' - including those in the professions.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/bc7b7f16169f.jpg", "dur": 1813, "by": "BBC", "v": "172eb8c63b0b1976e2ae8d242ecb048c", "url": "https://clp.bbcrewind.co.uk/172eb8c63b0b1976e2ae8d242ecb048c", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 19", "b": "Training an RAF air traffic controller costs around £86,000. Lesley Judd tries out the multi-million-pound simulator at RAF Shawbury, and reports on a new micro-based training aid that will soon be installed in control towers around the country.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/dbe365e67e35.jpg", "dur": 1781, "by": "BBC", "v": "5a6bf9de719288ad4e8beff98bc2650d", "url": "https://clp.bbcrewind.co.uk/5a6bf9de719288ad4e8beff98bc2650d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 2", "b": "The weekly programme on information and computer technology. Fred Harris looks at some of the best games for the home micro - including those which involve more than mindlessly 'zapping' aliens - from the electronic version of \"Trivial Pursuit' to a game that…", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/b92c916be0de.jpg", "dur": 1808, "by": "BBC", "v": "40423b67418bd2254f381a3f6ce1faa9", "url": "https://clp.bbcrewind.co.uk/40423b67418bd2254f381a3f6ce1faa9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 20", "b": "In the last programme of the series, Fred Harris talks to John Coll about the meaning of 'benchmarks', and contrasts the performance of the Commodore Amiga with the Atari 520ST.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/ee298a946862.jpg", "dur": 1779, "by": "BBC", "v": "be4d23d20200fca1b1db963376852c3f", "url": "https://clp.bbcrewind.co.uk/be4d23d20200fca1b1db963376852c3f", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 3", "b": "The weekly look at information technology - with Lesley Judd and Fred Harris. Choosing a word processor? Advice on how to get what you really need.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/1f6b120a4aee.jpg", "dur": 1788, "by": "BBC", "v": "61f5ceb07dc6acef4c61500c47556559", "url": "https://clp.bbcrewind.co.uk/61f5ceb07dc6acef4c61500c47556559", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Episode 6", "b": "With Lesley Judd and Ian McNaught-Davis. Twelve-inch laser discs had a short, unsuccessful life for domestic video, but the smaller compact discs have really taken off. Now discs similar to CDs can be used to store data for computers.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/e961e0d16f5c.jpg", "dur": 1764, "by": "BBC", "v": "921c7672faa48270b1546952a0b5465d", "url": "https://clp.bbcrewind.co.uk/921c7672faa48270b1546952a0b5465d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Microprocessor Revolution in Cars", "b": "Fred Harris and Lesley Judd look at the increasing use of computers in cars and show how the Rover Sterling uses a micro to control everything from its fuel supply to its anti-lock braking.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/2b4f3cebc18f.jpg", "dur": 1782, "by": "BBC", "v": "004a9675400f128382ad0065129d9ce5", "url": "https://clp.bbcrewind.co.uk/004a9675400f128382ad0065129d9ce5", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Snooping & Micros for Small Businesses Pt1", "b": "The weekly look at the world of information technology. Miami city managers have commissioned a new system of computerised radios that can be reprogrammed from headquarters - particularly useful for the police.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/d596c037caa9.jpg", "dur": 1771, "by": "BBC", "v": "a152da0bc1cfe07b5d5181a0ded546de", "url": "https://clp.bbcrewind.co.uk/a152da0bc1cfe07b5d5181a0ded546de", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Snooping & Micros for Small Businesses Pt2", "b": "The weekly look at the world of information technology - with Fred Harris and lan MeNaught-Davis. Finding your way around a computer system can be frustrating; psychologist Professor David Canter explores the endless corridors of unfriendly operating systems.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/6c1b9937c7c2.jpg", "dur": 1770, "by": "BBC", "v": "bc6a2ee96d726f3c3f9a5341f3226204", "url": "https://clp.bbcrewind.co.uk/bc6a2ee96d726f3c3f9a5341f3226204", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: Which Computer Show", "b": "The first Micro Live of 1986 comes from the computer industry's most important exhibition - this week's Which Computer? show, at the National Exhibition Centre, near Birmingham.", "kindc": "film", "status": "offsite", "d": "1986", "img": "media/clp/9600a6cb1e38 le: The Generation Game", "b": "A compilation of items from the recent series Micro Live. The Generation Game Watch programme", "kindc": "film", "status": "offsite", "d": "1987", "img": "media/clp/724f19e2f6cf.jpg", "dur": 1478, "by": "BBC", "v": "03d7d2f8bcfbf32e64a083c82e999dd5", "url": "https://clp.bbcrewind.co.uk/03d7d2f8bcfbf32e64a083c82e999dd5", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro File: Too Risky", "b": "Fred Harris and Lesley Judd with some of the best items from the recent series: Too Risky. Innovation is a risky business, though it can sometimes pay off. Micro Live talks to Sir Clive Sinclair and looks at a ship with wings.", "kindc": "film", "status": "offsite", "d": "1987", "img": "media/clp/64854def86a6.jpg", "dur": 1447, "by": "BBC", "v": "a33f0ee97f8e7f446424189b5a7372d8", "url": "https://clp.bbcrewind.co.uk/a33f0ee97f8e7f446424189b5a7372d8", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro File: What's in it for me?", "b": "Lesley Judd and Fred Harris with a selection from the recent series of Micro Live. What's in IT for Me? If you know nothing about computers, here's a back-to-basics look at word processing, stock control and accounts.", "kindc": "film", "status": "offsite", "d": "1987", "img": "media/clp/954ae2b4f641.jpg", "dur": 1476, "by": "BBC", "v": "1efd07154052f80e5e030f69e30ae373", "url": "https://clp.bbcrewind.co.uk/1efd07154052f80e5e030f69e30ae373", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Micro Live: CMU 2", "b": "With Lesley Judd. Are computers going to the dogs? Harringay Stadium is one of the few tracks which hasn't replaced its electro-mechanical tote system with a computer.", "kindc": "film", "status": "offsite", "d": "1987", "img": "media/clp/12eff870fb79.jpg", "dur": 1783, "by": "BBC", "v": "a6fe0363b4a49b52a037207c42c91766", "url": "https://clp.bbcrewind.co.uk/a6fe0363b4a49b52a037207c42c91766", puter room walking tour, 1992", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/SZ1RcNxiNX8.jpg", "dur": 825, "by": "NSF NCAR Archives", "v": "SZ1RcNxiNX8", "coll": ["dividing-engine"]}, {"t": "Heads I win Tails you lose - LMS 1992", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/fvSXxFeYkTw.jpg", "dur": 2923, "by": "Imperial College London", "v": "fvSXxFeYkTw", "coll": ["dividing-engine"]}, {"t": "Japan’s Electronic Industry", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/ihkRwArnc1k.jpg", "dur": 2442, "by": "RC286", "v": "ihkRwArnc1k", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "Live From Bell Labs", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/vpdzk08rW7A.jpg", "dur": 3205, "by": "AT&T Tech Channel", "v": "vpdzk08rW7A", "coll": ["att-archives"]}, {"t": "SCAM: Starving Computer Artists Market", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/uqmSnUkftkU.jpg", "dur": 99, "by": "VintageCG", "v": "uqmSnUkftkU", "coll": ["vintage-cg"]}, {"t": "The Machine that Changed the World", "b": "", "kindc": "film", "status": "live", "d": "1992", "img": "media/yt/kYFRdV1r4nU.jpg", "v": "kYFRdV1r4nU", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "Durrell Bishop's Marble Answering Machine", "d": "1992", "b": "In 1992, Durrell <a class=\"xl\" href=\"#thread-K/2\">Bishop<\/a>, then a student at the Royal College of Art, came up with an original answering machine design that is considered as one of the first tangible user interfaces (TUIs). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/durrell-bishops-marble-answering-machine/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys", "out": [{"to": "thread-K/2", "t": "Alan Bishop's six universal activities"}]}, {"t": "Tactile Infographics", "d": "1992", "b": "In 1994 the American Printing House for the Blind publishes a short guidebook explaining how to convey infographics for the blind using tactile graphics (first and second images). Most of it is inspired by a 1992 book by Polly Edman. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/tactile-infographics/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "AT&T's vision of the future, circa 1993", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/yFWCoeZjx8A.jpg", "dur": 879, "by": "AT&T Tech Channel", "v": "yFWCoeZjx8A", "coll": ["att-archives"]}, {"t": "Building Your Future 1993", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/SKWCOZgz6jM.jpg", "dur": 709, "by": "Imperial College London", "v": "SKWCOZgz6jM", "coll": ["dividing-engine"]}, {"t": "Chuck Moore (Forth) Presentation 1993 - Part 2 of 2", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/Dbd7Xu0ibJM.jpg", "dur": 632, "by": "ForthFreak", "v": "Dbd7Xu0ibJM", "coll": ["dividing-engine"]}, {"t": "Electrochromic Displays and Windows: 1993", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/8mFkkMtl4lM.jpg", "dur": 645, "by": "Imperial College London", "v": "8mFkkMtl4lM", "coll": ["dividing-engine"]}, {"t": "How to see objects in four dimensions - LMS 1993", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/g3oPi8Yv36A.jpg", "dur": 3251, "by": "Imperial College London", "v": "g3oPi8Yv36A", "coll": ["dividing-engine"]}, {"t": "Live From Bell Labs", "b": "", "kindc": "film", "status": "blocked", "d": "1993", "img": "media/yt/CMscCYxwawI.jpg", "dur": 3469, "by": "AT&T Tech Channel", "v": "CMscCYxwawI", "coll": ["att-archives"]}, {"t": "Neighborhood", "b": "", "kindc": "film", "status": "live", "d": "1993", "img": "media/yt/MPdKKRYGf1U.jpg", "dur": 713, "by": "AT&T Tech Channel", "v": "MPdKKRYGf1U", "coll": ["att-archives"]}, {"t": "Slumber: Brainwave Weaving", "d": "1993", "b": "Slumber was a multi-year gallery installation/performance by artist Janine Antoni. From the website description: Performance with loom, yarn, bed, nightgown, EEG Machine and artist’s REM reading. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/slumber-brainwave-weaving/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Kaktovik numerals", "b": "Iñupiaq middle-school students in Alaska *invent* a base-20 numeral system to fit their language's counting words; it spreads across Inuit communities and enters Unicode in 2022 — proof that numeral systems are still being born.", "d": "1994"}, {"t": "NCTM standards and the \"Math Wars\"", "b": "reform vs. back-to-basics battles over calculators, standard algorithms, and understanding — every side arguing, mostly without the history, about a 4,000-year-old question (Thread L).", "d": "1989–2000s"}, {"t": "World Wide Web", "b": "goes public: Tim Berners-Lee wrote the proposal at CERN in 1989 to stop physicists losing each other's documents; his manager's note on it read 'vague, but exciting'. What made it spread was not the technology but the licence — CERN put it in the public domain in 1993, with no fee and no permission needed, and every competing hypertext system that charged for itself disappeared.", "d": "1991", "in": [{"to": "era-10/41", "t": "Radio 4: Computing Britain: Connected Thinking"}, {"to": "era-10/83", "t": "Aleks in Wonderland: The Story of the Internet: The World Wide Villain"}]}, {"t": "The Crypto Wars", "b": "strong encryption legally classed as a *munition*; PGP's Phil Zimmermann under criminal investigation for \"exporting\" code; RSA printed on T-shirts as civil disobedience; the Clipper chip's key-escrow scheme defeated — mathematics itself contested as a weapon.", "d": "1990s"}, {"t": "Shor's algorithm", "b": "a quantum computer could factor huge numbers efficiently — threatening RSA and igniting the race to build one.", "d": "1994"}, {"t": "Leonard Adleman's DNA computer", "b": "a seven-city Hamiltonian-path problem solved by molecules in a test tube — biochemistry as processor.", "d": "1994", "in": [{"to": "thread-I/21", "t": "Wet computers"}]}, {"t": "Are YOU Ready for the INTERNET?", "b": "", "kindc": "film", "status": "live", "d": "1994", "img": "media/yt/XpZ5STahhPE.jpg", "dur": 308, "by": "BBC Archive", "v": "XpZ5STahhPE", "coll": ["dividing-engine"]}, {"t": "Danny Hillis: Back to the future (of 1994)", "b": "", "kindc": "film", "status": "live", "d": "1994", "img": "media/yt/gdg4mU-wuhI.jpg", "dur": 1150, "by": "TED", "v": "gdg4mU-wuhI", "coll": ["dividing-engine"]}, {"t": "Fermat's Last Theorem - LMS 1994", "b": "", "kindc": "film", "status": "live", "d": "1994", "img": "media/yt/N1Zn4ZqoIeE.jpg", "dur": 1573, "by": "Imperial College London", "v": "N1Zn4ZqoIeE", "coll": ["dividing-engine"]}, {"t": "The Complete Animator - With Fred Harris - Acorn Archimedes Computer - 1994", "b": "", "kindc": "film", "status": "live", "d": "1994", "img": "media/yt/HDgB3vQzjRs.jpg", "dur": 1628, "by": "The Centre for Computing History", "v": "HDgB3vQzjRs", "coll": ["dividing-engine"]}, {"t": "Arthur C Clarke - Fractals: The Colours of Infinity", "b": "", "kindc": "film", "status": "live", "d": "1995", "img": "media/yt/DyeR19m8gGk.jpg", "dur": 3225, "by": "ados4k", "v": "DyeR19m8gGk", "coll": ["dividing-engine"]}, {"t": "Hamming, \"Artificial Intelligence - Part I\" (April 7, 1995)", "b": "", "kindc": "film", "status": "live", "d": "1995", "img": "media/yt/aq_PLEQ9YzI.jpg", "dur": 2915, "by": "securitylectures", "v": "aq_PLEQ9YzI", "coll": ["hamming-lectures"]}, {"t": "Hamming, \"Artificial Intelligence - Part II\" (April 11, 1995)", "b": "", "kindc": "film", "status": "live", "d": "1995", "img": "media/yt/URp-uq3_T3Q.jpg", "dur": 2704, "by": "securitylectures", " 864, "by": "Imperial College London", "v": "a3IeDV8iJyM", "coll": ["dividing-engine"]}, {"t": "Wild Geometry - LMS 1995", "b": "", "kindc": "film", "status": "live", "d": "1995", "img": "media/yt/DbdeTnfHaAg.jpg", "dur": 2598, "by": "Imperial College London", "v": "DbdeTnfHaAg", "coll": ["dividing-engine"]}, {"t": "San Diego TeleManufacturing Facility", "d": "1995", "b": "In 1995, Mike Bailey from the San Diego Supercomputer Center created the SDSC TeleManufacturing Facility to help scientists visualize their data in physical form. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/sdsc-telemanufacturing-facility/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Loren Madsen's Early Data Sculptures", "d": "1995", "b": "Californian artist Loren Madsen has been making data sculptures since 1995 and still continues today. CPI / Cost of Living (left image) is the first of his series: A lamination is one year. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/cpi-cost-of-living/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "GIMPS", "b": "the Great Internet Mersenne Prime Search — volunteers' idle PCs hunt primes of the form 2^p−1, and nearly every record prime since is one; SETI@home (1999) takes distributed volunteer computing mainstream. The friar of <a class=\"xl\" href=\"#thread-T/4\">*Harmonie universelle*<\/a> is still on computation's leaderboard (Thread T).", "d": "1996", "out": [{"to": "thread-T/4", "t": "*Harmonie universelle* (1636)"}]}, {"t": "Bill Gates", "b": "", "kindc": "film", "status": "live", "d": "1996", "img": "media/yt/M1EsIusQJQM.jpg", "dur": 3308, "by": "zarjesve", "v": "M1EsIusQJQM", "coll": ["dividing-engine-original"]}, {"t": "Computer Pioneers", "b": "", "kindc": "film", "status": "live", "d": "1996", "img": "media/yt/qundvme1Tik.jpg", "dur": 3206, "by": "Computer History Museum", "v": "qundvme1Tik", "coll": ["dividing-engine-original", "dividing-engine"]}, {"t": "Silicon Vision Misha Mahowald", "b": "", "kindc": "film", "status": "live", "d": "1996", "img": "media/screen-shot-2015-11-15-at_med.png", "v": "x28ktma", "emb": "https://www.dailymotion.com/embed/video/x28ktma", "url": "https://www.dailymotion.com/embed/video/x28ktma", "coll": ["dividing-engine-original"]}, {"t": "Tomorrow's World 1996 - 30-line TV restored from 1927-28 and 1933", "b": "", "kindc": "film", "status": "live", "d": "1996", "img": "media/yt/Rg6Qtdz6cwQ.jpg", "dur": 386, "by": "TVDawn", "v": "Rg6Qtdz6cwQ", "coll": ["dividing-engine"]}, {"t": "Triumph of the Nerds", "b": "", "kindc": "film", "status": "live", "d": "1996", "img": "media/yt/rr9lmaEfhY4.jpg", "dur": 9122, "by": "EggHead", "v": "rr9lmaEfhY4", "via": "EggHead", "coll": ["dividing-engine-original"]}, {"t": "Ned Kahn's Wind-Visualizing Facades", "d": "1996", "b": "Since 1996, Nothern California artist Ned Kahn creates large-scale installations that visualize wind patterns. The left image shows Wind veil (2000), a facade of a parking garage covered with 80,000 small aluminum panels that are hinged to move freely in the w… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/ned-kahns-wind-visualizing-facades/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Deep Blue defeats Kasparov", "b": "brute-force search beats the world chess champion (~200 million positions/second).", "d": "1997", "img": "media/cards/903f01c9d20c.webp", "cred": "James the photographer · CC BY 2.0", "credurl": "https://commons.wikimedia.org/wiki/File%3ADeep%20Blue.jpg"}, {"t": "Apple 1997 - January 1988", "b": "", "kindc": "film", "status": "live", "d": "1997", "img": "media/yt/SwSMuo_bg7g.jpg", "dur": 456, "by": "The ReDiscovered Future", "v": "SwSMuo_bg7g", "coll": ["dividing-engine"]}, {"t": "How to study random shapes - LMS 1997", "b": "", "kindc": "film", "status": "live", "d": "1997", "img": "media/yt/VG2fwan2-9M.jpg", "dur": 3166, "by": "Imperial College London", "v": "VG2fwan2-9M", "coll": ["dividing-engine"]}, {"t": "Ilya Prigogine (Илья Пригожин) - The End of Certainty (Interview 1997)", "b": "", "kindc": "film", "status": "live", "d": "1997", "img": "media/yt/FZtLoN3n9X8.jpg", "dur": 2478, "by": "Nomen Nominandum", "v": "FZtLoN3n9X8", "coll": ["dividing-engine"]}, {"t": "Staying ahead of the opposition - LMS 1997", "b": "", "kindc": "film", "status": "live", "d": "1997", "img": "media/yt/LWCc1UEL1zE.jpg", "dur": 2794, "by": "Imperial College London", "v": "LWCc1UEL1zE", "coll": ["dividing-engine"]}, {"t": "Level: Hans Hemmert's Same-Height Shoes", "d": "1997", "b": "“Level” (1997), Styrodur/rubber/Velcro/measuring device, 50 pairs of platform shoes with heights of 5-43 cm, installation view at Galerie Gebauer Berlin, © Hans Hemmert and VG Bild Kunst. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/level-hans-hemmerts-same-height-shoes/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Google", "b": "PageRank's move was to stop reading pages and start reading the links between them — a page is important if important pages point at it, which is circular until you solve it as an eigenvector problem. The judgement was outsourced to the structure of the web itself. It worked so completely that within a few years the verb replaced the noun.", "d": "1998"}, {"t": "The famous failures", "b": "<a class=\"xl\" href=\"#thread-N/1\">Therac-25<\/a>'s radiation deaths, the <a class=\"xl\" href=\"#thread-N/2\">Patriot missile<\/a>'s clock drift (1991), the <a class=\"xl\" href=\"#thread-N/3\">Pentium FDIV<\/a> bug (1994), Ariane 5's overflow explosion (1996), the <a class=\"xl\" href=\"#thread-N/5\">Mars Climate Orbiter<\/a>'s unit mix-up (1999), and Y2K (2000) — machines compute wrong exactly as fast as they compute right (Thread N).", "d": "1985–2000", "out": [{"to": "thread-N/1", "t": "Therac-25 (1985–87)"}, {"to": "thread-N/2", "t": "Patriot missile (1991)"}, {"to": "thread-N/3", "t": "Pentium FDIV (1994)"}, {"to": "thread-N/5", "t": "Mars Climate Orbiter (1999)"}]}, {"t": "Chuck Moore (Forth) Fireside Chat 1998", "b": "", "kindc": "film", "status": "live", "d": "1998", "img": "media/yt/40ZIKHJ1H5E.jpg", "dur": 3982, "by": "ForthFreak", "v": "40ZIKHJ1H5E", "coll": ["dividing-engine"]}, {"t": "Lego Mindstorms Teaser 1998", "b": "", "kindc": "film", "status": "live", "d": "1998", "img": "media/yt/q27TLyz4qSE.jpg", "dur": 157, "by": "lorirocks777", "v": "q27TLyz4qSE", "coll": ["dividing-engine"]}, {"t": "The Computer Chronicles - PDAs", "b": "", "kindc": "film", "status": "live", "d": "1998", "img": "media/yt/KsSilNkU2yM.jpg", "dur": 1591, "by": "The Computer Chronicles", "v": "KsSilNkU2yM", "coll": ["dividing-engine"]}, {"t": "GPU (term coined with NVIDIA GeForce 256)", "b": "graphics chips that will later, unexpectedly, power AI.", "d": "1999", "img": "media/cards/c258aa4a39ee.webp", "cred": "Berkut · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File%3A6600GT%20GPU.jpg"}, {"t": "WISARD", "b": "Igor Aleksander, John Stonham and Bruce Wilkie at Brunel built one of the first working applications of an artificial neural network — a machine that recognised human faces. Its 'knowledge' is the wiring.", "d": "1981", "img": "media/museum/c8473f4fc29c.webp", "cred": "WISARD's wiring — Brunel University, 1981"}, {"t": "Murray Gell-Mann: Complex Systems", "b": "", "kindc": "film", "status": "live", "d": "1999", "img": "media/screen-shot-2015-08-10-at_360-2.png", "v": "107176739", "emb": "https://player.vimeo.com/video/107176739", "url": "https://player.vimeo.com/video/107176739", "coll": ["dividing-engine-original"]}, {"t": "The Atanasoff-Berry Computer", "b": "", "kindc": "film", "status": "live", "d": "1999", "img": "media/yt/YyxGIbtMS9E.jpg", "dur": 687, "by": "Computer History Museum", "v": "YyxGIbtMS9E", "coll": ["dividing-engine-original"]}, {"t": "Year 1999 A D", "b": "", "kindc": "film", "status": "live", "d": "1999", "img": "media/yt/TAELQX7EvPo.jpg", "dur": 1473, "by": "A/V Geeks 16mm Films", "v": "TAELQX7EvPo", "coll": ["dividing-engine"]}, {"t": "Jonathan Chertok's Mathematical Plaster Models", "d": "1999", "b": "Since 1999, independent researcher and architect Jonathan Chertok has been digitally reconstructing and 3D-printing historical plaster models from 19th-century mathematical model collections, originally hand-crafted in the 1860s and cataloged in early 20th-cen… <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/jonathan-chertoks-reproductions-of-mathematical-plaster-models/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "World's Largest Solid Terrain Model", "d": "1999", "b": "In 2006, a mysterious 900x700m solid terrain model with military facilities was discovered by a German Google Earth user next to the Chinese town of Huangyangtan. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/worlds-largest-solid-terrain-model/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "History of AT&T, Part I (with Bonus Edition Introduction)", "b": "", "kindc": "film", "status": "live", "d": "2000", "img": "media/yt/YIcOGTTKWzU.jpg", "dur": 554, "by": "AT&T Tech Channel", "v": "YIcOGTTKWzU", "coll": ["att-archives"]}, {"t": "Three Dimensional Television?", "b": "", "kindc": "film", "status": "live", "d": "2000", "img": "media/yt/d7YKO9V6kSg.jpg", "dur": 381, "by": "BBC Archive", "v": "d7YKO9V6kSg", "coll": ["dividing-engine"]}, {"t": "A Shape Display Appears in a Movie", "d": "2000", "b": "An imaginary ultra high-resolution 2.5D shape display appears in the 2000 movie X-Men. The rendering and animations are visually quite appealing. Notice how impossible overhangs appear at 0:27 (the bridge) and 0:33 (the torch of the Statue of Liberty). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/a-shape-display-appears-in-a-movie/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Kanban Boards", "d": "2000", "b": "A Kanban board is a task management tool where sticky notes representing work items are moved across a board to reflect their state of advancement. The simplest form has three states: to do, in progress, and done (left image). <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/kanban-boards/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "Graph Boards", "d": "2000", "b": "Mathematics and geometry are often taught to blind students using a cork board with raised grid lines, push pins and rubber bands. <span class=\"src\">&mdash; <a href=\"https://dataphys.org/list/graph-board/\" target=\"_blank\" rel=\"noopener\">List of Physical Visualizations<\/a>, Pierre Dragicevic and Yvonne Jansen<\/span>", "kindc": "dataphys"}, {"t": "High Tech Hawaii", "b": "", "kindc": "film", "status": "live", "d": "2001", "img": "media/cc1820hawaiione_000023_med.jpeg", "v": "CC1820HAWAIIONE", "emb": "https://archive.org/embed/CC1820HAWAIIONE", "url": "https://archive.org/embed/CC1820HAWAIIONE", "coll": ["dividing-engine-original"]}, {"t": "The Future of Artificial Intelligence", "b": "", "kindc": "film", "status": "live", "d": "2001", "img": "media/yt/DH8JYz-98tA.jpg", "dur": 3503, "by": "BBC Archive", "v": "DH8JYz-98tA", "coll": ["dividing-engine"]}, {"t": "Orange - Future Home - Technology and Computers of Early 2000s - August 2002", "b": "", "kindc": "film", "status": "live", "d": "2002", "img": "media/yt/__HqK-lHGI0.jpg", "dur": 1221, "by": "The Centre for Computing History", "v": "__HqK-lHGI0", "coll": ["dividing-engine"]}, {"t": "First Born - The Technology of 2003, Predicted in 1991", "b": "", "kindc": "film", "status": "live", "d": "2003", "img": "media/yt/1OVjVDf-Uto.jpg", "dur": 551, "by": "AT&T Tech Channel", "v": "1OVjVDf-Uto", "coll": ["att-archives"]}]}, {"id": "era-10", "kind": "era", "title": "Era 10: The Age of Massive Computation & AI", "sub": "2005 – present", "cards": [{"t": "Printer tracking dots decoded", "b": "researchers reveal that color laser printers secretly stamp nearly every page with faint yellow dots encoding the printer's serial number and a timestamp — steganography hiding in plain sight in every office.", "d": "2005", "img": "media/cards/1f4f937a7a8c.webp", "cred": "Anton · CC BY-SA 2.5", "credurl": "https://commons.wikimedia.org/wiki/File:Printermarkrp.jpg"}, {"t": "Cloud computing (AWS) and CUDA", "b": "two unglamorous changes that decided the next twenty years. AWS made computing something you rent by the hour, so a startup no longer needed a machine room; CUDA let the massively parallel chip built for drawing triangles be aimed at arbitrary mathematics. Neither was aimed at artificial intelligence. Both turned out to be its preconditions.", "d": "2006–07"}, {"t": "The iPhone", "b": "every channel in Thread M and a supercomputer, fused into a pocket slab — within 15 years, most of humanity computes constantly without ever calling it computing.", "d": "2007", "in": [{"to": "era-10/77", "t": "50 Things That Made the Modern Economy: iPhone"}], "img": "media/cards/a135eb4e193c.webp", "cred": "Pangkakit at Japanese Wikipedia · CC BY 2.5", "credurl": "https://commons.wikimedia.org/wiki/File%3AApple%20iPhone.jpg"}, {"t": "In Business: Computers Chipped", "b": "Computers Chipped: For 40 years, computer chips have doubled in speed and power every two years. But maintaining the pace is becoming more difficult. Peter Day asks if <a class=\"xl\" href=\"#era-8/200\">Moore's law<\/a> has set a trap for the industry at the heart of the way business works.", "kindc": "film", "status": "offsite", "d": "2007", "img": "media/clp/bbc36c21d0bb.jpg", "dur": 1674, "by": "BBC", "v": "04461cb96dea4a3b942c52e95d99b7a7", "url": "https://clp.bbcrewind.co.uk/04461cb96dea4a3b942c52e95d99b7a7", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive", "out": [{"to": "era-8/200", "t": "Moore's Law"}]}, {"t": "Apple Future Concept Video - Healthcare in 2008 - Made in1988", "b": "", "kindc": "film", "status": "live", "d": "2008", "img": "media/yt/_K9r9GyrXII.jpg", "dur": 402, "by": "Original YouTube Creator", "v": "_K9r9GyrXII", "coll": ["dividing-engine"]}, {"t": "In Business: Bring on the Bandwidth", "b": "The internet needs more and more bandwidth to provide on-demand services that users want. But can the system cope? Peter Day asks the experts, including the writer George Gilder. Producer Neil Koenig Watch programme", "kindc": "film", "status": "offsite", "d": "2008", "img": "media/clp/b051f6e32a64.jpg", "dur": 1668, "by": "BBC", "v": "cbf7f4885c13ff44a4c4f91c6a3e35e9", "url": "https://clp.bbcrewind.co.uk/cbf7f4885c13ff44a4c4f91c6a3e35e9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Stuxnet", "b": "malware physically destroys uranium centrifuges — computation as kinetic weapon (Thread J).", "d": "2010"}, {"t": "In Business: Chips off the Old Block", "b": "Once upon a time, British computing led the world. In a mobile world, some people think it might be happening again. From Bletchley Park to Bristol, Peter Day reports on the past, present and future of computers UK. Watch programme", "kindc": "film", "status": "offsite", "d": "2010", "img": "media/clp/c519801ab07b.jpg", "dur": 1678, "by": "BBC", "v": "9800065253b6441fd92a736a75df4c3d", "url": "https://clp.bbcrewind.co.uk/9800065253b6441fd92a736a75df4c3d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: Not Just Silicon", "b": "Silicon Valley California is the place where for the past fifty years new enterprise has thrived more effectively than anywhere else in the world.", "kindc": "film", "status": "offsite", "d": "2010", "img": "media/clp/7a36a3518911.jpg", "dur": 1635, "by": "BBC", "v": "3ffb1579d6afe88ab6c96e2ead005871", "url": "https://clp.bbcrewind.co.uk/3ffb1579d6afe88ab6c96e2ead005871", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: Operation Robot", "b": "The revolution in the operating theatre is only just beginning, but robotic surgery could change the way we think about healthcare ... and the way surgeons work.", "kindc": "film", "status": "offsite", "d": "2010", "img": "media/clp/0958fabb8d31.jpg", "dur": 1675, "by": "BBC", "v": "edb63fab4da37668a35cf0184e99bd3a", "url": "https://clp.bbcrewind.co.uk/edb63fab4da37668a35cf0184e99bd3a", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "IBM Watson wins Jeopardy!", "b": "Watson beat Ken Jennings and Brad Rutter by running hundreds of scoring algorithms in parallel over a corpus it held entirely in memory, then betting on its own confidence. It was not a language model and it did not understand the questions; it was very good search plus statistics plus nerve. Jennings wrote on his final answer: 'I for one welcome our new computer overlords.'", "d": "2011", "img": "media/cards/7b1e1d75ef95.webp", "cred": "Clockready · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:IBM_Watson.PNG"}, {"t": "In Business: For Your Information", "b": "Information seems to be moving right to the heart of the 21st century economy but nobody really knows what it is or how it works.", "kindc": "film", "status": "offsite", "d": "2011", "img": "media/clp/f610f58173ef.jpg", "dur": 1684, "by": "BBC", "v": "003cddc392f55111c6995ac798a6ef37", "url": "https://clp.bbcrewind.co.uk/003cddc392f55111c6995ac798a6ef37", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: New Dimension", "b": "Three-D printing may be the next revolution in manufacturing. It's being used to make things in a completely different way from the mass production we've been familiar with ever since Henry Ford introduced the production line more than 100 years ago.", "kindc": "film", "status": "offsite", "d": "2011", "img": "media/clp/72088478e3b8.jpg", "dur": 1668, "by": "BBC", "v": "63cc9d48c861e68bad030d568ea9dd32", "url": "https://clp.bbcrewind.co.uk/63cc9d48c861e68bad030d568ea9dd32", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: Strike Up the Broadband", "b": "The government's aim is clear: by 2015, it wants Britain to have the best superfast broadband network in Europe. The internet is so essential to businesses, the argument goes, that the network over which internet traffic travels is becoming a vital part of…", "kindc": "film", "status": "offsite", "d": "2012", "img": "media/clp/a25f1a996743.jpg", "dur": 1692, "by": "BBC", "v": "c508615ef2738ebaab3651f66cdffb0b", "url": "https://clp.bbcrewind.co.uk/c508615ef2738ebaab3651f66cdffb0b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "The Snowden disclosures", "b": "the documents showed collection at the scale of whole populations rather than named suspects — an architectural choice, made possible only because storage and processing had become cheap enough that keeping everything cost less than deciding what to keep. The technical history in this archive is the precondition for the political fact.", "d": "2013"}, {"t": "Petascale (Roadrunner)", "b": "the first machine past a thousand trillion operations a second, at Los Alamos, and it got there with the Cell processor designed for the PlayStation 3. Supercomputing had stopped meaning exotic custom hardware and started meaning enormous numbers of ordinary parts, wired well — which is also why the games industry keeps turning up in this history.", "d": "2008"}, {"t": "Common Core & the CS-for-all push", "b": "parents nationwide discover they can't help with elementary homework — the generational gap made visible at the kitchen table; code.org (2013) and England's national computing curriculum (2014) attempt to close an 80-year CS teaching gap; Conrad Wolfram campaigns for computer-based math education (Thread L).", "d": "2010–14"}, {"t": "AlexNet / ImageNet moment", "b": "Krizhevsky, Sutskever and Hinton cut the image-recognition error rate by roughly ten points in one year, on two consumer graphics cards in a bedroom. Nothing in the method was new — convolutional networks and backpropagation were decades old. What was new was enough labelled data and enough compute, arriving together. The field changed direction within months.", "d": "2012"}, {"t": "Horizon: Defeating the Hackers", "b": "Horizon explores the murky and fast-paced world of hackers who are out to steal money and identities, and meets the scientists joining forces to help defeat them. Watch programme", "kindc": "film", "status": "offsite", "d": "2013", "img": "media/clp/993bb2d38d2a.jpg", "dur": 3522, "by": "BBC", "v": "4d0ecef0b3fe869b89942fe8825b7c6d", "url": "https://clp.bbcrewind.co.uk/4d0ecef0b3fe869b89942fe8825b7c6d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Horizon: Monitor Me", "b": "Horizon explores the boom in health-related apps and gadgets, as well as how technology is helping medical professionals monitor fitness and health in unprecedented ways. Watch programme", "kindc": "film", "status": "offsite", "d": "2013", "img": "media/clp/a2176abf2737.jpg", "dur": 3484, "by": "BBC", "v": "d7234b515c1dd3904d46f248766679c9", "url": "https://clp.bbcrewind.co.uk/d7234b515c1dd3904d46f248766679c9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Horizon: The Age of Big Data", "b": "Horizon tests the limits of the data revolution, crime prediction in LA, financial formulas in the city of London and a South African attempt to catalogue the entire cosmos. Watch programme", "kindc": "film", "status": "offsite", "d": "2013", "img": "media/clp/d7fb8e46c97d.jpg", "dur": 3526, "by": "BBC", "v": "be31396a3f6f3b96107baa9274ea182f", "url": "https://clp.bbcrewind.co.uk/be31396a3f6f3b96107baa9274ea182f", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: Sounds Familiar", "b": "After years of promise, voice recognition is at last becoming a significant method of using computers and accessing the Internet.", "kindc": "film", "status": "offsite", "d": "2013", "img": "media/clp/f98ee33175b3.jpg", "dur": 1678, "by": "BBC", "v": "7bf0cf75225a4ae3e474af46bcfa228d", "url": "https://clp.bbcrewind.co.uk/7bf0cf75225a4ae3e474af46bcfa228d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "In Business: The Internet of Things", "b": "Six billion people worldwide already have mobile phones. Now the experts are talking about the coming Internet of Things: 50 billion interconnected objects, from cows to coffee machines. Peter Day asks what it means and how it may happen.", "kindc": "film", "status": "offsite", "d": "2013", "img": "media/clp/7c5b0cce57b6.jpg", "dur": 1677, "by": "BBC", "v": "2874d485fc6186ab7a553933003d616c", "url": "https://clp.bbcrewind.co.uk/2874d485fc6186ab7a553933003d616c", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Desert Island Discs: Dame Wendy Hall", "b": "Fellow of both the Royal Academy of Engineering and the Royal Society, Dame Wendy fought long and hard to prove that her type of web science was highly significant and here to stay.", "kindc": "film", "status": "offsite", "d": "2014", "img": "media/clp/862a8f64adee.jpg", "dur": 1874, "by": "BBC", "v": "e7f892058ba6e05b4525b1d , "b": "The city went crazy for dot com companies in 1999. But in March 2000, the boom suddenly turned into a bust. Hannah discovers that technology then wasn't up to the job. Watch programme", "kindc": "film", "status": "offsite", "d": "2015", "img": "media/clp/71bb9e29c2c0.jpg", "dur": 828, "by": "BBC", "v": "1e406de062269d6748911119cf80aed2", "url": "https://clp.bbcrewind.co.uk/1e406de062269d6748911119cf80aed2", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Computing Britain: Electronic Brains", "b": "From the mobile phone to the office computer, mathematician Hannah Fry looks back at 70 years of computing history, to reveal the UK's lead role in developing the technology we use today.", "kindc": "film", "status": "offsite", "d": "2015", "img": "media/clp/9b82b3ec8e5a.jpg", "dur": 828, "by": "BBC", "v": "efb1ec060f9dc10b94f6e43d8bb39d60", "url": "https://clp.bbcrewind.co.uk/efb1ec060f9dc10b94f6e43d8bb39d60", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Computing Britain: ERNIE Picks Prizes", "b": "‘Savings with a Thrill’: In 1956, adverts enticed the British public with a brand new opportunity. Buy premium bonds for one pound, for the chance to win a thousand. At the time, it was a fortune - half the price of the average house.", "kindc": "film", "status": "offsite", "d": "2015", "img": "media/clp/69afd4467558.jpg", "dur": 827, "by": "BBC", "v": "4d3897576911664980b6755c40a45c6d", "url": "https://clp.bbcrewind.co.uk/4d3897576911664980b6755c40a45c6d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Computing Britain: LEO the Electronic Office", "b": "Hannah Fry hears the incredible story of how a chain of British teashops produced the first office computer in the world.J Lyons and Company was the UK's largest catering company, with 250 teashops across the country.", "kindc": "film", "status": "offsite", "d": "2015", "img": "me 44, "by": "BBC", "v": "3ccd89c1b6e8a537ad1b2df756907214", "url": "https://clp.bbcrewind.co.uk/3ccd89c1b6e8a537ad1b2df756907214", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Amazon Web (Data) Services", "b": "Amazon Web Services has announced it is opening its first data centre in the UK. Gavin Jackson is Managing Director of Amazon Web Services UK and Ireland. Watch programme", "kindc": "film", "status": "offsite", "d": "2016", "img": "media/clp/eef62ef6e801.jpg", "dur": 187, "by": "BBC", "v": "c5364360118df95dec8685777b3d275f", "url": "https://clp.bbcrewind.co.uk/c5364360118df95dec8685777b3d275f", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): BT Openreach - Broadband for All", "b": "Broadband Access, BT Openreach - should it be split from BT? Gavin Patterson, Chief Executive of BT responds to criticism about those not able to access super-fast broadband. Watch programme", "kindc": "film", "status": "offsite", "d": "2016", "img": "media/clp/e32a30edda63.jpg", "dur": 538, "by": "BBC", "v": "be79da0ad12c4568d20cc5060c9fe40e", "url": "https://clp.bbcrewind.co.uk/be79da0ad12c4568d20cc5060c9fe40e", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Hacking TV Stations", "b": "Morning news and current affairs: Russian Hacking of a French TV Station (TV5Monde) report by Gordon Corera Watch programme", "kindc": "film", "status": "offsite", "d": "2016", "img": "media/clp/381db5470ddf.jpg", "dur": 281, "by": "BBC", "v": "e431d591d2857d418f53b09b73312ebb", "url": "https://clp.bbcrewind.co.uk/e431d591d2857d418f53b09b73312ebb", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Radio 4: Today (Item): Quantum Computers", "b": "Morning news and current affairs: Quantum Computing at the University of Sussex report. Watch programme", "kindc": "film", "status": "offsite", "d t Archive"}, {"t": "\"Attention Is All You Need\"", "b": "eight authors at Google threw away the recurrence that sequence models had been built on and kept only the attention mechanism — every position looking at every other position at once. The point was that it parallelises, and so it scales. It was written to improve machine translation. Every large language model since is this architecture.", "d": "2017", "img": "media/cards/ed8cf2369444.webp", "cred": "Yuening Jia · CC BY-SA 3.0", "credurl": "https://commons.wikimedia.org/wiki/File:The-Transformer-model-architecture.png"}, {"t": "50 Things That Made the Modern Economy: Barcode", "b": "How vast mega-stores emerged with the help of a design originally drawn in the sand in 1948 by Joseph Woodland as he sat on a Florida beach, observing the furrows left behind, an idea came to him which would – eventually – become the barcode.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/7867db91c420.jpg", "dur": 545, "by": "BBC", "v": "b4da0ecd8f464253b2045bb0288f06a7", "url": "https://clp.bbcrewind.co.uk/b4da0ecd8f464253b2045bb0288f06a7", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: Battery", "b": "Murderers in early 19th century London feared surviving their executions. That’s because their bodies were often handed to scientists for strange anatomical experiments.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/ba0d01c60d13.jpg", "dur": 538, "by": "BBC", "v": "88161c5d8b9ab125ee10fc3e84c880f9", "url": "https://clp.bbcrewind.co.uk/88161c5d8b9ab125ee10fc3e84c880f9", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: Compiler", "b": "Installing Windows might take 5,000 years without the compiler, a remarkable innovation which made modern computing possible.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/9da6c654a4b9.jpg", "dur": 553, "by": "BBC", "v": "e18b326f2e86e0d4e148513297bbf550", "url": "https://clp.bbcrewind.co.uk/e18b326f2e86e0d4e148513297bbf550", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: Google", "b": "The words 'clever' and 'death' crop up less often than 'Google' in conversation. That’s according to researchers at the University of Lancaster in the UK. It took just two decades for Google to reach this cultural ubiquity.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/dfefa43b376f.jpg", "dur": 552, "by": "BBC", "v": "f5a37913eb9ae954f48234eafa8eaf32", "url": "https://clp.bbcrewind.co.uk/f5a37913eb9ae954f48234eafa8eaf32", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: iPhone", "b": "Surprisingly, Uncle Sam played an essential role in the creation and development of <a class=\"xl\" href=\"#era-10/2\">the iPhone<\/a> - of course, much has been written about the late Steve Jobs and other leading figures at Apple and their role in making the modern icon, and its subsequent impact…", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/238fcd3b29c5.jpg", "dur": 554, "by": "BBC", "v": "b4221e5057b4766818392b2ba75501e8", "url": "https://clp.bbcrewind.co.uk/b4221e5057b4766818392b2ba75501e8", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive", "out": [{"to": "era-10/2", "t": "The iPhone"}]}, {"t": "50 Things That Made the Modern Economy: M-Pesa", "b": "Transferring money by text message is far safer and more convenient than cash. M-Pesa, as it is known, first took off in Kenya. The idea was to make it easier for small businesses to repay micro-finance loans.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/ee255cf8dd26.jpg", "dur": 559, "by": "BBC", "v": "dce7d94f435092acc5bcf436a5a3376b", "url": "https://clp.bbcrewind.co.uk/dce7d94f435092acc5bcf436a5a3376b", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: Public Key Cryptography", "b": "Take a very large prime number – one that is not divisible by anything other than itself. Then take another. Multiply them together. That is simple enough, and it gives you a very, very large “semi-prime” number.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/c5afb0e05cc0.jpg", "dur": 539, "by": "BBC", "v": "e244506fc063f3196a9947848ea0ac6a", "url": "https://clp.bbcrewind.co.uk/e244506fc063f3196a9947848ea0ac6a", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "50 Things That Made the Modern Economy: Robot", "b": "Robots threaten the human workforce, but their ubiquity and growing competence make them crucial to the modern economy. In 1961 General Motors installed the first Unimate at one of its plants.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/d5ff3d54a7ee.jpg", "dur": 539, "by": "BBC", "v": "9514cc00d98b49871ed40fcd51e69907", "url": "https://clp.bbcrewind.co.uk/9514cc00d98b49871ed40fcd51e69907", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Aleks in Wonderland: The Story of the Internet: Attack of the Zombie Baby Monitors", "b": "Can we Control the Dark Side of the Internet?The Internet is the world's most widely used communications tool. It's a fast and efficient way of delivering information.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/af412d7337c2.jpg", "dur": 1676, "by": "BBC", "v": "db5c4a3716b600938440f21fa55c1190", "url": "https://clp.bbcrewind.co.uk/db5c4a3716b600938440f21fa55c1190", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Aleks in Wonderland: The Story of the Internet: The International League of Geeky Gentlemen", "b": "Just how did the Internet become the most powerful communications medium on the planet, and why does it seem to be an uncontrollable medium for good and bad? With no cross border regulation the internet can act as an incredible force for connecting people and…", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/dbfda3efd06a.jpg", "dur": 1673, "by": "BBC", "v": "c677532852e1653596537c401b379e64", "url": "https://clp.bbcrewind.co.uk/c677532852e1653596537c401b379e64", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Aleks in Wonderland: The Story of the Internet: The World Wide Villain", "b": "With the coming of the <a class=\"xl\" href=\"#era-9/521\">World Wide Web<\/a> in the 1990s internet access opened up to everybody, it was no longer the preserve of academics and computer hobbyists.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/25cb9bb999fb.jpg", "dur": 1684, "by": "BBC", "v": "68166381d2c3049e9c6808e7a3708d95", "url": "https://clp.bbcrewind.co.uk/68166381d2c3049e9c6808e7a3708d95", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive", "out": [{"to": "era-9/521", "t": "World Wide Web"}]}, {"t": "Desert Island Discs: Demis Hassabis", "b": "Kirsty Young's castaway is Dr Demis Hassabis. An artificial intelligence researcher and co-founder and CEO of DeepMind, he is also a neuroscientist, a computer games designer, an entrepreneur, and in his youth, a world-class chess player.", "kindc": "film", "status": "offsite", "d": "2017", "img": "media/clp/c1ad3f6d8ae1.jpg", "dur": 2160, "by": "BBC", "v": "3262c0920f6ec40dd0a8fd50a688980d", "url": "https://clp.bbcrewind.co.uk/3262c0920f6ec40dd0a8fd50a688980d", "coll": ["bbc-clp"], "holder": "the BBC Computer Literacy Project Archive"}, {"t": "Horizon: Cyber Attack - The Day the NHS Stopped", "b": "A few weeks ago, the National Health Service was hit by a widespread and devastating cyber attack - Horizon tells the inside story of one of the most challenging days in the history of the NHS.
