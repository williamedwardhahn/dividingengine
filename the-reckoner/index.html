<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reckoner — A History of Computation</title>
<style>
/* ============================================================
   THE RECKONER — HyperCard's model, a manuscript's manners.
   Warm paper, ink serif, one rubric red. No chrome, no noise.
   ============================================================ */
:root{
  --paper:#f4efe4; --sheet:#fdfbf5; --ink:#231e15; --faint:#7a7161;
  --rubric:#9a3b28; --line:#ddd4c2; --soft:#efe8d8;
  --serif:"Iowan Old Style",Charter,"Palatino Linotype",Palatino,Georgia,serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.62;
  background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1px);
  background-size:5px 5px;
}
::selection{background:var(--rubric);color:var(--sheet)}
a{color:var(--rubric)}

/* ---------- header ---------- */
#menubar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:2px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 18px;
}
#menubar .brand{
  font-style:italic;font-size:19px;letter-spacing:.2px;margin-right:auto;
}
#menubar .brand b{font-style:normal;font-weight:700}
.mi{
  font-family:var(--serif);font-size:14.5px;color:var(--ink);background:none;border:0;
  padding:7px 11px;cursor:pointer;border-radius:999px;
}
.mi:hover,.mi:focus-visible,details.menu[open]>summary.mi{background:var(--ink);color:var(--sheet)}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
.dropdown{
  position:absolute;right:0;top:calc(100% + 8px);min-width:290px;max-height:68vh;overflow:auto;
  background:var(--sheet);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 14px 40px rgba(40,28,10,.14);padding:8px 0;
}
.dropdown a{display:block;padding:6px 18px;color:var(--ink);text-decoration:none;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dropdown a:hover,.dropdown a:focus-visible{background:var(--soft)}
.dropdown .grp{padding:10px 18px 4px;font-size:11px;letter-spacing:.18em;color:var(--rubric);font-weight:700}
.dropdown .sep{border-top:1px solid var(--line);margin:6px 0}

/* ---------- the card ---------- */
#deskarea{display:flex;justify-content:center;padding:34px 16px 80px}
#card{
  width:100%;max-width:780px;background:var(--sheet);
  border:1px solid var(--line);border-radius:4px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 16px 44px rgba(50,35,12,.08);
  overflow:hidden;
}
#tbar{padding:22px 52px 0;display:flex;align-items:baseline;gap:14px}
#tbar .lbl{
  font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rubric);
}
#tbar .box{display:none}
#progress{height:2px;background:var(--soft);margin:14px 52px 0;border-radius:2px;overflow:hidden}
#progress i{display:block;height:100%;background:var(--rubric);width:0;transition:width .25s ease}
#content{padding:26px 52px 34px;min-height:340px}
.eyebrow{display:flex;gap:12px;font-size:12.5px;letter-spacing:.06em;color:var(--faint);margin:0 0 6px}
.eyebrow .ch{margin-left:auto;font-style:italic;letter-spacing:0;text-align:right}
.date{
  display:inline-block;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  color:var(--rubric);border:1px solid color-mix(in srgb,var(--rubric) 45%,var(--line));
  border-radius:999px;padding:3px 12px;margin:6px 0 14px;background:color-mix(in srgb,var(--rubric) 5%,var(--sheet));
}
h1.cardtitle{
  font-size:clamp(26px,4.6vw,34px);line-height:1.16;margin:2px 0 16px;
  font-weight:700;letter-spacing:-.012em;text-wrap:balance;
}
.body{font-size:17px;color:var(--ink)}
.body em{font-style:italic}
.body strong{font-weight:700}
a.x{
  color:var(--rubric);font-weight:600;text-decoration:underline;
  text-decoration-color:color-mix(in srgb,var(--rubric) 40%,transparent);
  text-underline-offset:3px;text-decoration-thickness:1px;border-radius:2px;
}
a.x:hover,a.x:focus-visible{text-decoration-color:var(--rubric)}
sup{font-size:.72em}

/* ---------- nav strip ---------- */
#navbar{
  display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);
  padding:16px 52px;background:color-mix(in srgb,var(--soft) 45%,var(--sheet));flex-wrap:wrap;
}
.btn{
  font-family:var(--serif);font-size:15px;color:var(--ink);background:var(--sheet);
  border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;
  min-height:40px;transition:background .12s,color .12s,border-color .12s;
}
.btn:hover{border-color:var(--ink)}
.btn:active{background:var(--ink);color:var(--sheet)}
.btn:disabled{opacity:.32;cursor:default;border-color:var(--line)}
.btn.arrow{width:44px;padding:0;font-size:17px;line-height:1}
#counter{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.05em}
:focus-visible{outline:2px solid var(--rubric);outline-offset:2px;border-radius:3px}

/* ---------- widgets ---------- */
table.hc{border-collapse:collapse;width:100%;margin:16px 0;font-family:var(--mono);font-size:12.5px}
table.hc th,table.hc td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
table.hc th{font-family:var(--serif);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
table.hc tr:first-child th{border-top:2px solid var(--ink)}
table.hc td.num{text-align:right;white-space:nowrap}
table.hc tr:nth-child(2) td{font-weight:700;color:var(--rubric)}
.field{
  font-family:var(--mono);font-size:16px;border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;width:96px;background:var(--sheet);color:var(--ink);
}
.field:focus{border-color:var(--rubric);outline:none}
.punch{
  border-left:3px solid var(--rubric);background:color-mix(in srgb,var(--rubric) 4%,var(--sheet));
  padding:14px 18px;margin:18px 0 6px;font-size:16.5px;border-radius:0 6px 6px 0;
}
.small{font-size:13px;color:var(--faint)}
ul.map{list-style:none;padding:0;margin:0 0 8px;columns:2;column-gap:34px}
ul.map li{margin:0 0 7px;break-inside:avoid;font-size:15.5px}
ul.map .small{margin-left:6px}
@media (max-width:600px){
  ul.map{columns:1}
  #tbar,#content,#navbar{padding-left:24px;padding-right:24px}
  #progress{margin-left:24px;margin-right:24px}
}
kbd{
  font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;
  padding:1px 6px;border-radius:5px;background:var(--sheet);
}

/* ---------- find dialog ---------- */
dialog{
  border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);
  padding:26px;max-width:440px;width:92%;font-family:var(--serif);
  box-shadow:0 24px 70px rgba(40,28,10,.25);
}
dialog::backdrop{background:rgba(58,46,24,.35);backdrop-filter:blur(2px)}
dialog h2{font-size:20px;margin:0 0 14px;font-style:italic;font-weight:600}
dialog input{
  width:100%;font-family:var(--serif);font-size:17px;border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;background:var(--paper);color:var(--ink);
}
dialog input:focus{border-color:var(--rubric);outline:none}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

@media (prefers-reduced-motion:no-preference){
  #card .fade{animation:rise .18s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
@media print{#menubar,#navbar,#progress{display:none}#card{box-shadow:none;border:0}}
</style>
</head>
<body>

<nav id="menubar" aria-label="Menu">
  <span class="brand"><b>The Reckoner</b> · a history of computation</span>
  <button class="mi" data-act="home">Home</button>
  <details class="menu" id="gomenu">
    <summary class="mi">Go &#9662;</summary>
    <div class="dropdown" id="golist"></div>
  </details>
  <button class="mi" data-act="find">Find</button>
  <button class="mi" data-act="wander">Wander</button>
  <button class="mi" data-act="back">Back</button>
</nav>

<main id="deskarea">
  <article id="card" aria-live="polite">
    <div id="tbar"><span class="lbl" id="stacklbl">Stack</span></div>
    <div id="progress"><i id="progfill"></i></div>
    <div id="content"></div>
    <div id="navbar">
      <button class="btn arrow" id="prevb" aria-label="Previous card">&#8592;</button>
      <button class="btn arrow" id="nextb" aria-label="Next card">&#8594;</button>
      <button class="btn" id="nextstackb">Next stack</button>
      <span id="counter"></span>
    </div>
  </article>
</main>

<dialog id="finddlg">
  <h2>Find in all cards</h2>
  <input id="findq" type="search" placeholder="abacus, Turing, tide, Mersenne&#8230;" aria-label="Search text">
  <div class="row">
    <button class="btn" id="findcancel">Cancel</button>
    <button class="btn" id="findgo">Find</button>
  </div>
</dialog>

{"t": "The incommensurability crisis", "b": "the diagonal of a square has no whole-number ratio to its side (√2 is irrational); Greek thought splits *arithmos* (discrete number) from *megethos* (continuous magnitude).", "d": "c. 450–400 BCE"}, {"t": "Eudoxus' theory of proportion", "b": "rigorous treatment of irrational magnitudes — the ancestor of the real numbers, completed by Dedekind 2,200 years later.", "d": "c. 370 BCE"}, {"t": "Salamis Tablet", "b": "oldest surviving counting board (Greek).", "d": "c. 300 BCE"}, {"t": "Euclid's Elements", "b": "axiomatic method; Euclid's algorithm for GCD — an algorithm still taught and still running in computers today.", "d": "c. 300 BCE"}, {"t": "The Library of Alexandria", "b": "humanity's first attempt at total information storage and retrieval; Callimachus' *Pinakes* catalog is the ancestor of every index, card catalog, database, and search engine (Thread S).", "d": "c. 295 BCE"}, {"t": "Chinese counting rods and the suanpan (abacus)", "b": "fast positional arithmetic; skilled operators rival early electronic calculators.", "d": "c. 200 BCE onward"}, {"t": "Nine Chapters on the Mathematical Art (China)", "b": "algorithm-first mathematics — systems of linear equations solved by rod manipulation (essentially Gaussian elimination), negative numbers as red/black rods.", "d": "c. 200 BCE – 200 CE"}, {"t": "Maya Long Count", "b": "earliest dated zero in the Americas; base-20 numeration serving that civilization's central quantity — *time*.", "d": "c. 36 BCE"}, {"t": "Antikythera mechanism", "b": "geared analog computer predicting eclipses and planetary positions; ~30 bronze gears.", "d": "c. 150–100 BCE"}, {"t": "Hero of Alexandria", "b": "programmable automata (pegged drums = stored program in embryo).", "d": "c. 60 CE"}, {"t": "Ptolemy's Almagest", "b": "massive trigonometric (chord) tables — centuries of \"compute\" frozen into a book.", "d": "c. 150 CE"}, {"t": "Roman hand abacus", "b": "pocket calculator of the ancient world."}]}, {"id": "era-3", "kind": "era", "title": "Era 3: Zero, Algorithms & Medieval Machines", "sub": "500 – 1500", "cards": [{"t": "Boethius' *De institutione musica", "b": "*: music sorted into *mundana* (the spheres), *humana* (body and soul), and *instrumentalis* (what we hear); his textbook fixes music inside the quadrivium beside arithmetic, geometry, and astronomy — for a thousand years, music class *was* math class (Thread T).", "d": "c. 520"}, {"t": "Brahmagupta (India)", "b": "rules for zero and negative numbers; zero as a number, not just a placeholder.", "d": "c. 628"}, {"t": "Bede's finger reckoning", "b": "*De computo vel loquela digitorum* — a standardized system for counting to 9,999 on two hands; monks compute the date of Easter (*computus* — the medieval word family that gives us \"computer\").", "d": "725"}, {"t": "The dust board (takht)", "b": "Islamic arithmeticians compute Hindu numerals on erasable sand boards — algorithms designed around *erasing as you go*, later adapted to pen and paper.", "d": "9th–12th c."}, {"t": "al-Khwarizmi (House of Wisdom, Baghdad)", "b": "*Al-jabr* (→ \"algebra\") and his text on Hindu numerals (→ \"algorithm\" from his Latinized name). Computation as rule-following procedure.", "d": "c. 820"}, {"t": "Banu Musa brothers", "b": "*Book of Ingenious Devices*, programmable machines and automata.", "d": "9th c."}, {"t": "al-Kindi", "b": "*On Deciphering Cryptographic Messages* — frequency analysis; statistics as a computational weapon (see Cryptography thread).", "d": "9th c."}, {"t": "al-Jazari", "b": "elaborate programmable automata, including a programmable drum machine (camshaft \"programming\").", "d": "1206"}, {"t": "Girih tiles (Islamic world)", "b": "five decorated tiles generating intricate quasi-periodic ornament — patterns on the Darb-i Imam shrine anticipate Penrose tilings by five centuries (recognized only in 2007).", "d": "c. 1200s–1400s"}, {"t": "The mechanical clock & verge escapement (Europe)", "b":  "Inca quipu & yupana", "b": "knotted-cord decimal data storage administering an empire without writing, paired with the yupana grid counting board — database and calculator, together.", "d": "c. 1400s"}, {"t": "Astrolabes & equatoria", "b": "analog computers for astronomy carried in the hand."}, {"t": "Guido of Arezzo", "b": "the musical staff — pitch plotted against time, arguably the first graph, six centuries before Descartes' coordinates; solmization (do–re–mi) and the Guidonian hand turn a monk's palm into memory hardware (Thread T).", "d": "c. 1025"}, {"t": "Su Song's astronomical clock tower (China)", "b": "a 12-meter water-driven celestial computer — escapement, rotating armillary sphere, and time-announcing manikins.", "d": "1088"}, {"t": "Zij tables (Islamic world)", "b": "vast computed astronomical handbooks; al-Kashi (Samarkand, 1424) calculates π to 16 decimal places and perfects decimal fractions — a precision record standing nearly two centuries.", "d": "8th–15th c."}, {"t": "The Kerala school (Madhava of Sangamagrama, India)", "b": "infinite series for π, sine, and cosine — power-series results two centuries before Newton and Leibniz.", "d": "c. 1400"}]}, {"id": "era-4", "kind": "era", "title": "Era 4: The Calculating Revolution", "sub": "1500 – 1800", "cards": [{"t": "Luca Pacioli codifies double-entry bookkeeping", "b": "debits must equal credits — a built-in checksum for commerce, and the information system that will finance everything else on this timeline (Thread R).", "d": "1494"}, {"t": "Adam Ries", "b": "German *Rechenmeister* whose vernacular arithmetic textbooks teach a nation to calculate — \"nach Adam Riese\" (\"per Adam Ries\") still means \"correctly computed\" in German today.", "d": "1522"}, {"t": "Codex Vergara (Aztec/Nahua)", "b": "surveyors' records of chinampa field areas using indigenous fractional units (arrows, hearts, hands) — sophisticated land-area computation running in parallel with, and invisible to, European mathematics.", "d": "c. 1540s"}, {"t": "Robert Recorde invents \"=\"", "b": "English math textbooks written as teacher–student dialogues; the equals sign born of a teacher's impatience with writing \"is equal to\" over and over.", "d": "1557"}, {"t": "John Dee", "b": "the *Monas Hieroglyphica* compresses the cosmos into a single occult glyph; six years later his Mathematical Preface to the first English Euclid preaches mathematics' power to navigators, artisans, and engineers — the magus as math evangelist, one mind holding both worlds (Thread U).", "d": "1564/1570"}, {"t": "Prosthaphaeresis", "b": "astronomers (Wittich, Clavius; used in Tycho Brahe's observatory) convert multiplication into addition via trigonometric identities — the trick logarithms would soon make obsolete.", "d": "1580s"}, {"t": "John Napier: logarithms", "b": "multiplication converted into addition — arguably the greatest \"computational speedup\" before electronics.", "d": "1614"}, {"t": "Casaubon dates the Hermetica", "b": "philology proves the \"primordially ancient\" Hermetic texts are late-antique — Hermes' stock falls in the very year Napier's logarithms appear; one revolution demotes magic while another accelerates mathematics (Thread U).", "d": "1614"}, {"t": "Napier's bones", "b": "multiplication rods for laypeople.", "d": "1617"}, {"t": "Henry Briggs: base-10 logarithm tables", "b": "computed by hand to 14 decimal places; log tables become the working engine of science and engineering for the next 350 years — schoolchildren still carried them in the 1970s.", "d": "1617–1624"}, {"t": "Japanese soroban", "b": "refined 1/4-bead abacus; in a famous 1946 Tokyo contest a soroban operator beat a US Army electric calculator in four of five rounds.", "d": "c. 1600s"}, {"t": "Galileo's geometric and military compass (the sector)", "b": "a hinged brass calculating instrument for gunners and surveyors; Galileo manufactured and sold them with lessons — a scientist funding research by selling calculators.", "d": "1597"}, {"t": "Kepler's *Harmonices Mundi", "b": "*: hunting the chords of the planets, he finds the third law of planetary motion — music-of-the-spheres mysticism delivering hard celestial mechanics (Thread T).", "d": "1619"}, {"t": "Gunter's scale", "b": "logarithms engraved on wood, worked with dividers — the missing link between Napier's tables and the slide rule.", "d": "1620"}, {"t": "William Oughtred: slide rule", "b": "the engineer's computer for the next 350 years (Apollo astronauts carried them).", "d": "c. 1622"}, {"t": "Wilhelm Schickard's \"calculating clock\"", "b": "first known mechanical calculator (destroyed by fire; long forgotten).", "d": "1623"}, {"t": "Mersenne's *Harmonie universelle", "b": "*: pitch measured as countable vibrations per second (by watching the slow swings of very long strings, then scaling up by law); the string laws — frequency ∝ (1/L)·√(T/μ) — from varying one parameter at a time; equal temperament's ¹²√2 ≈ 1.05946 computed and printed as fret lengths; and all 720 permutations of a six-note hexachord tabulated, with 22! melodies declared inexhaustible. Acoustics founded, Western music retuned, and combinatorics applied to art — in one 1,500-page book (Thread T).", "d": "1636"}, {"t": "Blaise Pascal: the Pascaline", "b": "mechanical addition/subtraction with carry — built at age 19 for his tax-collector father.", "d": "1642"}, {"t": "Kircher's *Musurgia universalis* and arca musarithmica", "b": "birdsong transcribed into musical notation, and a box that composes music by combinatorial lookup — an algorithmic composition machine (Thread T).", "d": "1650"}, {"t": "Kircher's engines of everything", "b": "the magic lantern popularized (projected images — ancestor of every screen), museum statues that speak through hidden voice tubes, a universal cipher-language with a translation box (*Polygraphia nova*, 1663), Llull's combinatorics rebuilt as a general logic of discovery (*Ars Magna Sciendi*, 1669), and a worldwide Jesuit network mailing him magnetic and tide observations — a one-man platform era, three centuries early (Thread U).", "d": "1641–1669"}, {"t": "Gottfried Leibniz: stepped reckoner", "b": "all four operations; Leibniz also formalizes **binary arithmetic (1703)** and dreams of mechanized reasoning (\"Calculemus!\").", "d": "1673"}, {"t": "Change ringing formalized (Fabian Stedman, England)", "b": "bell-ringers systematically enumerate permutations — working group theory in church towers, 150 years before mathematicians name it.", "d": "1668–77"}, {"t": "Wilkins's *Real Character", "b": "*: a constructed philosophical language classifying every concept — the Babel-reversing project that Leibniz would turn computational (Thread T).", "d": "1668"}, {"t": "Sauveur names \"acoustics\"", "b": "harmonics identified, named, and measured — Mersenne's puzzle of one string sounding many pitches at once begins to yield (Thread T).", "d": "1701"}, {"t": "Leibniz, Bouvet, and the binary God", "b": "Jesuit missionary Joachim Bouvet mails Leibniz the I Ching's hexagram circle; Leibniz reads the 64 figures as his own binary arithmetic and publishes the connection — for him binary was theology, 1 as God and 0 as nothing, creation *ex nihilo* inside every number; he even designed a commemorative medallion of it (Era 2; Thread U).", "d": "1701–03"}, {"t": "Newton the alchemist", "b": "translator of the Emerald Tablet into English, author of roughly a million manuscript words on alchemy (more than on physics), and computer of biblical chronologies — including a calculation that the apocalypse comes \"not before 2060.\" When Keynes bought the long-hidden papers at auction in 1936, he concluded Newton was \"not the first of the age of reason\" but \"the last of the magicians\" (Thread U).", "d": "c. 1680s–1727"}, {"t": "Seki Takakazu and wasan (Japan)", "b": "determinants before Leibniz publishes them, Bernoulli numbers before Bernoulli — an independent Japanese mathematical tradition whose devotees hang **sangaku**, carved geometry problems, as offerings in shrines and temples.", "d": "1683"}, {"t": "The Gregorian calendar reform", "b": "Clavius' commission computes away accumulated drift — Thursday, October 4 is followed by Friday, October 15. Arithmetic edits reality's date.", "d": "1582"}, {"t": "Modern notation is invented", "b": "Viète's letters for unknowns, then Descartes' x, y, z and exponents; +, −, ×, and Recorde's = spread in the same era — algebraic symbolism as a compact machine language for *human* computation.", "d": "1591–1637"}, {"t": "Pascal & Fermat's correspondence", "b": "a gambler's dispute births probability theory — chance becomes calculable (Thread P).", "d": "1654"}, {"t": "Graunt's Bills of Mortality and Halley's life table", "b": "death counted, tabulated, and priced into annuities — statistics and the actuarial profession begin (Thread P).", "d": "1662/1693"}, {"t": "Halley's comet", "b": "predicted by computation to return; it does, on schedule, sixteen years after Halley's death — hand calculation forecasting the heavens (Thread P).", "d": "1705/1758"}, {"t": "Vaucanson's automata", "b": "the flute player and the \"digesting duck\" make mechanical life a public sensation; his automated loom work leads directly to Jacquard.", "d": "1739"}, {"t": "Bayes' theorem (published posthumously)", "b": "belief updated by arithmetic — the mathematics now beating inside spam filters and AI.", "d": "1763"}, {"t": "The Mechanical Turk", "b": "Kempelen's chess \"automaton\" conceals a human player and fools Europe for 84 years — the permanent lesson that claimed machine intelligence may hide human labor (Thread Q; Amazon later names its crowdwork platform after it).", "d": "1770"}, {"t": "William Playfair invents the line and bar chart (pie chart 1801)", "b": "data becomes picture (Thread P).", "d": "1786"}, {"t": "The metric system (and the failed decimal clock)", "b": "revolutionary France rationalizes measurement; decimal time dies within two years — Sumer's base-60 hours outlast the guillotine (Thread F callback).", "d": "1790s"}, {"t": "Human computing as a profession", "b": "observatories and navies employ rooms of people grinding out tables (Nautical Almanac, 1767).", "d": "1700s"}, {"t": "de Prony's logarithm project (France)", "b": "tables produced by a *pyramid of human computers* using division of labor — an assembly line for arithmetic, explicitly inspired by Adam Smith. A \"computer\" is a job title, not a machine.", "d": "1790s"}, {"t": "The Chappe optical telegraph (France)", "b": "semaphore towers relay coded messages Paris–Lille in minutes, growing into a ~5,000 km state network with protocols, acknowledgments, error control, and encrypted payloads its own operators couldn't read; in 1834 the Blanc brothers bribe operators to smuggle bond-market signals through it — history's first network hack (Thread M).", "d": "1794"}]}, {"id": "era-5", "kind": "era", "title": "Era 5: The Industrialization of Calculation", "sub": "1800 – 1900", "cards": [{"t": "The blackboard", "b": "enters classrooms (popularized at West Point): the dominant educational display technology for the next two centuries.", "d": "c. 1801"}, {"t": "Jacquard loom", "b": "punched cards control weaving — programs stored on cards, data controlling machines.", "d": "1804"}, {"t": "The Prussian school model", "b": "age-graded classrooms, state curricula, and \"normal schools\" that turn teacher training into an institution — the template exported worldwide, and the machinery through which curriculum lag propagates (see Thread L).", "d": "1810s–40s"}, {"t": "Thomas de Colmar's Arithmometer", "b": "first commercially successful calculator; offices begin to mechanize.", "d": "1820–1851"}, {"t": "Fourier's *Théorie analytique de la chaleur", "b": "*: every signal is a sum of pure sine waves — the theorem that finally answers Mersenne's harmonic puzzle and later becomes, via the FFT, MP3s, Auto-Tune, and speech recognition (Thread T; Thread M).", "d": "1822"}, {"t": "Charles Babbage: Difference Engine", "b": "automatic polynomial table calculation, motivated by errors in human-computed tables.", "d": "1822"}, {"t": "Solresol", "b": "Sudre's constructed language built entirely from the seven solfège notes — speakable, singable, playable on a violin, or whistled across a valley (Thread T; Thread M).", "d": "1827"}, {"t": "The tally sticks burn Parliament", "b": "centuries of split-tally records — matching halves as unforgeable medieval receipts — are carelessly incinerated, and the overloaded furnaces burn down the Houses of Parliament. Legacy-data destruction, spectacularly literal.", "d": "1834"}, {"t": "The electric telegraph (Cooke & Wheatstone; Morse)", "b": "messages become electric pulses; Morse code is a variable-length compression code — common letters short, rare letters long — a century before information theory named the idea.", "d": "1837–44"}, {"t": "Alexander Bain patents the fax", "b": "images by wire decades *before* the telephone; Caselli's pantelegraph carries commercial fax traffic in 1860s France.", "d": "1843"}, {"t": "Babbage: Analytical Engine", "b": "mill (CPU), store (memory), punched-card input, conditional branching — the general-purpose computer, designed a century early, never built.", "d": "1837"}, {"t": "Ada Lovelace's Notes", "b": "first published algorithm intended for a machine (Bernoulli numbers); her insight that such a machine could manipulate *symbols*, not just numbers — even compose music.", "d": "1843"}, {"t": "George Boole", "b": "logic reduced to algebra of 0 and 1 — the mathematics that circuits would later speak.", "d": "1847/1854"}, {"t": "Scheutz difference engine", "b": "Babbage's idea actually built and sold.", "d": "1853"}, {"t": "Office machine boom", "b": "Odhner wheel, comptometer, cash register — arithmetic becomes clerical infrastructure.", "d": "1873–1887"}, {"t": "The transatlantic cable", "b": "continents wired together; Kelvin's mirror galvanometer — sensitive enough to read a whisper of current after 3,000 km — makes it work, and per-word pricing spawns commercial codebooks: compression driven by economics.", "d": "1858/1866"}, {"t": "Baudot's 5-bit code", "b": "fixed-length binary character encoding for multiplexed telegraphy — direct ancestor of teleprinters, telex, and ASCII (\"baud\" preserves his name).", "d": "1870"}, {"t": "Helmholtz's *On the Sensations of Tone", "b": "*: hearing itself dissected with tuned resonators — physiological acoustics founded (Thread T).", "d": "1863"}, {"t": "Sound becomes data", "b": "Scott de Martinville's phonautograph *records* sound it cannot play back; Edison's phonograph plays it — audio as stored signal (Thread M; Thread T).", "d": "1857/1877"}, {"t": "Telephone and automatic exchange", "b": "Bell's telephone; then Strowger — an undertaker convinced the operator was diverting his business calls — invents dial switching: machine routing begins replacing human routing.", "d": "1876/1891"}, {"t": "The photophone (Bell & Tainter)", "b": "voice carried 213 meters between Washington rooftops on a modulated beam of sunlight — no wires at all. Bell called it his greatest invention, greater than the telephone; the world had no use for it until fiber optics and free-space laser links vindicated the idea a century later (Thread M3).", "d": "1880"}, {"t": "Switchboard operators", "b": "overwhelmingly women, hand-routing the world's calls — the communication twin of the human computers (Thread B).", "d": "1878–1950s"}, {"t": "Gauss finds Ceres", "b": "least squares recovers a lost dwarf planet from 41 days of observations — the mathematics of taming measurement error, computed by hand (Thread P).", "d": "1801"}, {"t": "The Luddites", "b": "skilled weavers smash stocking frames — not hatred of technology but a labor revolt against immiseration; the corrective card for history's most misused insult (Thread Q).", "d": "1811–16"}, {"t": "Neptune discovered \"with the point of his pen\"", "b": "Le Verrier computes an unseen planet's position from Uranus' wobbles; astronomers find it within one degree — hand computation's greatest triumph.", "d": "1846"}, {"t": "Nightingale's rose diagrams", "b": "statistical graphics as political weapon — army sanitation reformed by chart (Thread P).", "d": "1858"}, {"t": "Jevons' \"logic piano\"", "b": "a machine that performs Boolean inference — mechanical logic, halfway between Boole and Shannon.", "d": "1869"}, {"t": "Galton and Pearson", "b": "correlation and regression, the modern statistical toolkit — created in deep entanglement with eugenics: a card teaching that computation is not morally neutral (Thread P).", "d": "1880s–1901"}, {"t": "Herman Hollerith", "b": "punched-card tabulators process the US Census in record time; his company later merges into **IBM**.", "d": "1890"}, {"t": "Genaille–Lucas rulers", "b": "Napier's bones perfected — multiplication by pure sight-reading, no carrying; a reminder that \"calculating aids\" kept evolving right up to the electronic age.", "d": "1891"}, {"t": "The Committee of Ten (US)", "b": "secondary mathematics standardized into arithmetic → algebra → geometry → trigonometry — the course sequence most students still walk today, frozen before the airplane flew (see Thread L).", "d": "1893"}]}, {"id": "era-6", "kind": "era", "title": "Era 6: Human Computers, Analog Machines & Theory", "sub": "1900 – 1940", "cards": [{"t": "Harvard Observatory computers (Williamina Fleming, Annie Jump Cannon, Henrietta Leavitt)", "b": "women \"computers\" classify hundreds of thousands of stars; Leavitt's computed relation lets us measure the universe.", "d": "1870s–1920s"}, {"t": "Marconi's transatlantic wireless", "b": "the letter \"S\" crosses an ocean without wires; radio makes signals *broadcast* rather than routed.", "d": "1901"}, {"t": "Felix Klein names the \"double discontinuity\"", "b": "university mathematics and school mathematics fail to connect in either direction — the feedback loop that lets curricula lag the frontier by generations (Thread L); Klein founds the first international commission on mathematics teaching the same year.", "d": "1908"}, {"t": "Hilbert's program", "b": "23 problems, then the Entscheidungsproblem — can all mathematics be mechanically decided? \"We must know, we will know\": the dare that Gödel and Turing answer.", "d": "1900/1928"}, {"t": "Otlet's Mundaneum (Brussels)", "b": "12+ million index cards answering queries by mail and telegraph — a paper search engine; by 1934 Otlet sketches networked screens querying it remotely (Thread S).", "d": "1910"}, {"t": "Torres Quevedo", "b": "a *working* chess endgame automaton (no hidden human this time), essays anticipating floating-point arithmetic, and a remotely commanded electromechanical calculator — Spain's forgotten bridge between Babbage and the electronic age.", "d": "1912–20"}, {"t": "Richardson's \"forecast factory\"", "b": "a fantasy of 64,000 human computers in a vast hall predicting weather in real time — the dream ENIAC fulfills in 1950.", "d": "1922"}, {"t": "R.A. Fisher", "b": "design of experiments, significance testing, modern statistics — forged at an agricultural research station and now the operating system of empirical science (Thread P).", "d": "1920s"}, {"t": "Gödel's incompleteness theorems", "b": "any sufficiently rich formal system contains truths it cannot prove — mechanized reason has hard limits, discovered before the machines even arrive.", "d": "1931"}, {"t": "Tide-predicting machines (Kelvin and successors)", "b": "analog gear-and-pulley computers used into the 1960s (including for D-Day planning).", "d": "1872–20th c."}, {"t": "Naval fire-control computers (Dreyer Table, Ford Rangekeeper, the US Navy's Mark 1)", "b": "shipboard mechanical analog computers solving moving-target ballistics in real time; analog gunnery computers served at sea into the 1990s.", "d": "1912–1945"}, {"t": "Vladimir Lukyanov's water integrator (USSR)", "b": "partial differential equations solved by water levels in interconnected glass tubes — originally for heat flow in concrete; mass-produced and used in Soviet engineering for decades (see Thread I).", "d": "1936"}, {"t": "Vannevar Bush's differential analyzer", "b": "room-sized analog computer solving differential equations.", "d": "1927–1931"}, {"t": "WPA Mathematical Tables Project", "b": "hundreds of human computers employed during the Depression producing math tables.", "d": "1935–1938"}, {"t": "William & Elizebeth Friedman", "b": "the married founders of modern American cryptanalysis — Elizebeth breaks rum-runner and Nazi spy networks (credit classified for decades; the FBI took it); William's team breaks Japan's PURPLE machine (1940) without ever seeing one — reconstructing a computer from its outputs alone.", "d": "1920s–1940"}, {"t": "Alan Turing, \"On Computable Numbers\"", "b": "the universal machine; a precise definition of \"computation\" itself — and of its limits.", "d": "1936"}, {"t": "Alonzo Church: lambda calculus (with the Church–Turing thesis emerging)", "b": ".", "d": "1936"}, {"t": "Claude Shannon's master's thesis", "b": "Boolean algebra = switching circuits. Logic becomes hardware.", "d": "1937"}, {"t": "Konrad Zuse: Z1–Z3", "b": "the Z3 (1941) is the first working programmable, fully automatic digital computer (binary, electromechanical).", "d": "1938–1941"}]}, {"id": "era-7", "kind": "era", "title": "Era 7: The Electronic Breakthrough", "sub": "1940 – 1955", "cards": [{"t": "Atanasoff–Berry Computer", "b": "first electronic digital calculating device (not programmable).", "d": "1942"}, {"t": "Colossus (Bletchley Park)", "b": "first programmable electronic computer, breaking German ciphers; after the war most are dismantled and the drawings burned by order — secret for 30 years, full details classified until 2000.", "d": "1943–44"}, {"t": "SIGSALY", "b": "the first secure digital voice system (and first PCM transmission) — 50-ton terminals carrying Churchill–Roosevelt calls; its existence stayed secret until 1976.", "d": "1943"}, {"t": "Turing's Delilah", "b": "a portable encrypted-voice machine Turing built in near-total secrecy; the technical report wasn't released for nearly 70 years.", "d": "1943–45"}, {"t": "D-Day's tides", "b": "Arthur Doodson computes invasion tides on Kelvin-type tide-predicting machines from anonymized harmonic constants for a location he knows only as \"Position Z\" — the computer wasn't cleared to know it was Normandy.", "d": "1944"}, {"t": "Harvard Mark I (Aiken/IBM)", "b": "electromechanical giant; Grace Hopper programs it; the famous \"bug\" (an actual moth) comes later on Mark II.", "d": "1944"}, {"t": "ENIAC", "b": "~5,000 additions per second — a thousand times faster than any person. Programmed by six women (Jean Bartik, Betty Holberton, et al.) whose work went unrecognized for decades.", "d": "1945"}, {"t": "ENIAC's first real job (classified)", "b": "hydrogen-bomb feasibility calculations on a million punched cards; at Los Alamos, von Neumann and Ulam's **Monte Carlo method** is born classified, following wartime rooms of human computers and Feynman's punched-card \"assembly line.\"", "d": "1945–46"}, {"t": "von Neumann's EDVAC report", "b": "the stored-program architecture nearly every computer still uses.", "d": "1945"}, {"t": "Manchester Baby (1948) & EDSAC (1949)", "b": "first stored-program computers actually running.", "d": "1946–49"}, {"t": "The MONIAC (Bill Phillips, LSE)", "b": "the national economy simulated hydraulically — income, taxes, savings, and imports as colored water flowing through tanks and valves; about 14 were built for universities and central banks.", "d": "1949"}, {"t": "The transistor (Bardeen, Brattain, Shockley at Bell Labs)", "b": ".", "d": "1947"}, {"t": "Shannon's \"A Mathematical Theory of Communication\"", "b": "the bit; information becomes a quantity.", "d": "1948"}, {"t": "The Curta", "b": "a pocket-sized mechanical calculator of astonishing precision, designed by Curt Herzstark while imprisoned in Buchenwald; beloved by engineers and rally drivers until the 1970s.", "d": "1948"}, {"t": "Hamming codes", "b": "error-*correcting* codes, born of weekend frustration with crashing punched-card runs — mathematics that lets messages heal themselves; Reed–Solomon codes (1960) later shield everything from CDs to deep-space probes.", "d": "1950"}, {"t": "McCulloch & Pitts", "b": "neurons modeled as logic gates — the paper von Neumann cites in the EDVAC report; brains and computers become each other's mirrors.", "d": "1943"}, {"t": "Vannevar Bush's Memex (\"As We May Think\")", "b": "an imagined desk that links documents by association — the essay that inspires Engelbart, Nelson, and ultimately HyperCard and the Web (Thread S).", "d": "1945"}, {"t": "Wiener's *Cybernetics", "b": "*: feedback and control unify machines, animals, and organizations — a surprise bestseller that makes \"thinking machines\" a public question.", "d": "1948"}, {"t": "ENIAC computes the first numerical weather forecasts", "b": "Richardson's 1922 fantasy, realized in 28 years.", "d": "1950"}, {"t": "LEO I", "b": "the world's first business computer — built by J. Lyons & Co., a British *teashop chain*, to schedule cakes and payroll (Thread R).", "d": "1951"}, {"t": "Turing's \"Computing Machinery and Intelligence\"", "b": "can machines think? The imitation game.", "d": "1950"}, {"t": "UNIVAC I", "b": "computers go commercial; predicts the 1952 election on live TV.", "d": "1951"}, {"t": "Grace Hopper's A-0 compiler", "b": "programs that write programs; path to human-readable code.", "d": "1952"}]}, {"id": "era-8", "kind": "era", "title": "Era 8: Computation Becomes Infrastructure", "sub": "1955 – 1975", "cards": [{"t": "FORTRAN", "b": "scientists stop writing machine code; formulas become programs.", "d": "1957"}, {"t": "Computer music begins", "b": "the *Illiac Suite* (Hiller & Isaacson), the first substantial computer-composed score, and Max Mathews' MUSIC I at Bell Labs, the first widely used sound-synthesis program — Kircher's 1650 composition box, electrified (Thread T).", "d": "1957"}, {"t": "Calculus reaches high school; the New Math follows", "b": "AP Calculus debuts 268 years after Newton's *Principia*; then Sputnik panic pushes set theory into elementary classrooms via teachers who were never trained in it — the curriculum-lag engine demonstrated at national scale, and reversed within 15 years (Thread L).", "d": "1955–58"}, {"t": "Setun (Moscow State University)", "b": "the only production *balanced-ternary* computer — digits −1, 0, +1; about 50 built; a road not taken.", "d": "1958"}, {"t": "Core memory and SAGE", "b": "Forrester's magnetic cores (every bit threaded by hand, mostly by women textile workers) power SAGE air defense — 24 networked vacuum-tube giants, the largest computers ever built, birthplace of the modem (Threads O, J).", "d": "1953–58"}, {"t": "Machine translation: hype and crash", "b": "the Georgetown demo promises translation \"solved within five years\"; the 1966 ALPAC report kills funding — AI's first boom-and-winter cycle (Thread N).", "d": "1954–66"}, {"t": "The Dartmouth workshop", "b": "\"artificial intelligence\" is named, with a proposal expecting major progress from ten men in two months.", "d": "1956"}, {"t": "IBM RAMAC 305", "b": "the first hard drive — 5 MB in a one-ton cabinet, leased at $3,200/month (Thread O).", "d": "1956"}, {"t": "Lisp (McCarthy) and the perceptron (Rosenblatt)", "b": "the two souls of AI — symbols and neurons; the Navy demos a learning machine to breathless headlines, and Minsky & Papert's *Perceptrons* (1969) freezes neural nets for a generation.", "d": "1958"}, {"t": "PLATO", "b": "computerized education with touch screens, message boards, and multiplayer games — online community, decades early (Threads L, S).", "d": "1960"}, {"t": "Landauer's principle", "b": "erasing one bit has a minimum energy cost — computation *is* physics; the ultimate floor beneath Thread A's energy figures.", "d": "1961"}, {"t": "Spacewar! (MIT PDP-1)", "b": "the video game — play will eventually bankroll the GPU industry that powers AI.", "d": "1962"}, {"t": "Lorenz discovers chaos", "b": "re-entering rounded numbers into a weather model reveals sensitive dependence — some computations have *mathematical* forecast horizons no hardware can beat (Thread N).", "d": "1963"}, {"t": "The FFT (Cooley–Tukey) and \"hypertext\" (Nelson)", "b": "the algorithm that makes signal processing feasible (with roots in Gauss's notebooks), and the word that names linked text (Thread S) — one year, two futures.", "d": "1965"}, {"t": "ELIZA", "b": "Weizenbaum's 200-line chatbot \"therapist\"; users pour out their hearts to pattern-matching, and Weizenbaum spends the rest of his life warning about what he'd seen.", "d": "1966"}, {"t": "The Apollo Guidance Computer", "b": "Margaret Hamilton's team writes the software that lands on the Moon (she popularizes the term \"software engineering\"); its core-*rope* program memory is hand-woven, wire by wire, by women factory workers — \"LOL memory.\" Weaving literally becomes software: Jacquard's loop, closed (Threads B, O, Q).", "d": "1966–69"}, {"t": "NSA's Harvest", "b": "a one-of-a-kind IBM supercomputer built solely for codebreaking; the agency quietly becomes the world's largest employer of mathematicians and a hidden patron of the computer industry.", "d": "1962"}, {"t": "Public-key cryptography invented in secret", "b": "Ellis, Cocks, and Williamson at GCHQ discover \"non-secret encryption\" — the RSA and Diffie–Hellman ideas — years before the public did; classified until 1997 (see Thread J).", "d": "1970–74"}, {"t": "The Ultra secret breaks", "b": "Winterbotham's *The Ultra Secret* reveals Bletchley Park; thousands of oath-bound veterans finally learn what the person at the next desk had been doing — and the history of computing has to be rewritten.", "d": "1974"}, {"t": "Integrated circuit (Kilby, Noyce)", "b": ".", "d": "1958–59"}, {"t": "The golden age of electronic analog computers", "b": "patch-panel machines built from op-amps (\"operational\" = performing mathematical operations) solve differential equations for aerospace and industry — often faster than early digital machines; fluidic logic (gates made of nothing but jets and channels) computes with air and water, no electronics at all; hybrid analog–digital installations linger into the 1980s.", "d": "1950s–60s"}, {"t": "NASA's human computers (Katherine Johnson, Dorothy Vaughan, Mary Jackson)", "b": "trajectories computed by hand; John Glenn asks Johnson to *check the electronic computer's numbers by hand* before flying — the handoff moment between human and machine computation.", "d": "1950s–60s"}, {"t": "IBM System/360", "b": "the mainframe standard; BASIC brings programming to students.", "d": "1964"}, {"t": "Moore's Law", "b": "stated: transistor counts double roughly every two years.", "d": "1965"}, {"t": "Engelbart's \"Mother of All Demos\"", "b": "mouse, windows, hypertext, video calls — in one demo.", "d": "1968"}, {"t": "Computer algebra begins (Macsyma)", "b": "machines now do *symbolic* mathematics — algebra and calculus, not just arithmetic.", "d": "1968–71"}, {"t": "ARPANET", "b": "computers begin talking to each other — built on packet switching (Baran, Davies): messages chopped into independently routed fragments; email (1971) becomes the surprise killer app; TCP/IP (designed 1974, adopted 1983) becomes the internet's common tongue.", "d": "1969"}, {"t": "Intel 4004", "b": "the microprocessor — a computer on a chip.", "d": "1971"}, {"t": "HP-35 pocket scientific calculator", "b": "the slide rule dies within a decade. C and Unix are born the same era.", "d": "1972"}, {"t": "Appel & Haken prove the Four Color Theorem by computer", "b": "the first major theorem whose proof *requires* machine computation — mathematics itself changed.", "d": "1976"}]}, {"id": "era-9", "kind": "era", "title": "Era 9: Personal, Symbolic & Networked", "sub": "1975 – 2005", "cards": [{"t": "Dynabook and Xerox PARC's Alto", "b": "Kay imagines a computer-book for children; PARC builds the GUI, ethernet, and laser printing — the future assembled a decade early, famously toured by Steve Jobs (Thread S).", "d": "1968–73"}, {"t": "Altair 8800, Apple II, Commodore PET, TRS-80", "b": "computers enter homes.", "d": "1975–77"}, {"t": "Public-key cryptography (Diffie–Hellman, RSA)", "b": "security built on computational *hardness* — the difficulty of factoring becomes a lock protecting the world's communications.", "d": "1976–77"}, {"t": "VisiCalc", "b": "the spreadsheet — arithmetic automated for everyone with a desk; the \"killer app.\"", "d": "1979"}, {"t": "Seymour Papert's *Mindstorms* and Logo", "b": "children programming turtles as a way of *doing* mathematics — constructionism's high-water mark, largely washed back out of schools within two decades.", "d": "1980"}, {"t": "Feynman, \"Simulating Physics with Computers\"", "b": "nature is quantum-mechanical; proposes quantum computers.", "d": "1981"}, {"t": "HyperCard (Bill Atkinson, Apple)", "b": "linked cards, home-made software, hypertext for the masses — the design inspiration for this very site.", "d": "1987"}, {"t": "Expert systems and the AI winters", "b": "MYCIN and XCON boom; the Lighthill report (1973) and the late-80s collapse bust — AI's hype cycle runs twice before 2012, a pattern every modern student should know (Thread N).", "d": "1970s–80s"}, {"t": "Cray-1", "b": "supercomputing's icon — 160 megaflops in a C-shaped couch with its own upholstered seating.", "d": "1976"}, {"t": "MIDI", "b": "musical performance becomes a real-time data protocol — every synthesizer on Earth learns one language (Thread T).", "d": "1983"}, {"t": "Macintosh", "b": "the GUI goes mass-market; HyperCard follows three years later (Thread S).", "d": "1984"}, {"t": "IEEE 754 floating point (Kahan)", "b": "the number format standardized — the *actual arithmetic* of virtually every FLOP in Thread A's ladder; also the format whose subtleties cause several of Thread N's disasters.", "d": "1985"}, {"t": "Backpropagation popularized (Rumelhart, Hinton, Williams)", "b": "multi-layer neural networks learn internal representations — the seed that flowers in 2012.", "d": "1986"}, {"t": "Mathematica (and Maple, 1982)", "b": "full computer algebra systems; a laptop can now outperform any historical mathematician at symbolic manipulation.", "d": "1988"}, {"t": "TI-81 graphing calculator", "b": "machine computation lands on every student's school desk — the classroom debate over \"calculators vs. by-hand\" begins in earnest.", "d": "1990"}, {"t": "Ethnomathematics becomes a field", "b": "Zaslavsky's *Africa Counts* (1973), D'Ambrosio naming the discipline (1984), the Aschers' mathematical decoding of quipus, Gerdes on sona geometry, Eglash's *African Fractals* (1999) — scholarship finally documents the world's mathematical traditions on their own terms (see Thread K).", "d": "1973–99"}, {"t": "Kaktovik numerals", "b": "Iñupiaq middle-school students in Alaska *invent* a base-20 numeral system to fit their language's counting words; it spreads across Inuit communities and enters Unicode in 2022 — proof that numeral systems are still being born.", "d": "1994"}, {"t": "NCTM standards and the \"Math Wars\"", "b": "reform vs. back-to-basics battles over calculators, standard algorithms, and understanding — every side arguing, mostly without the history, about a 4,000-year-old question (Thread L).", "d": "1989–2000s"}, {"t": "World Wide Web", "b": "goes public (Berners-Lee, 1989 proposal).", "d": "1991"}, {"t": "The Crypto Wars", "b": "strong encryption legally classed as a *munition*; PGP's Phil Zimmermann under criminal investigation for \"exporting\" code; RSA printed on T-shirts as civil disobedience; the Clipper chip's key-escrow scheme defeated — mathematics itself contested as a weapon.", "d": "1990s"}, {"t": "Shor's algorithm", "b": "a quantum computer could factor huge numbers efficiently — threatening RSA and igniting the race to build one.", "d": "1994"}, {"t": "Leonard Adleman's DNA computer", "b": "a seven-city Hamiltonian-path problem solved by molecules in a test tube — biochemistry as processor.", "d": "1994"}, {"t": "GIMPS", "b": "the Great Internet Mersenne Prime Search — volunteers' idle PCs hunt primes of the form 2^p−1, and nearly every record prime since is one; SETI@home (1999) takes distributed volunteer computing mainstream. The friar of *Harmonie universelle* is still on computation's leaderboard (Thread T).", "d": "1996"}, {"t": "Deep Blue defeats Kasparov", "b": "brute-force search beats the world chess champion (~200 million positions/second).", "d": "1997"}, {"t": "Google", "b": "computation organizes the world's information.", "d": "1998"}, {"t": "The famous failures", "b": "Therac-25's radiation deaths, the Patriot missile's clock drift (1991), the Pentium FDIV bug (1994), Ariane 5's overflow explosion (1996), the Mars Climate Orbiter's unit mix-up (1999), and Y2K (2000) — machines compute wrong exactly as fast as they compute right (Thread N).", "d": "1985–2000"}, {"t": "GPU (term coined with NVIDIA GeForce 256)", "b": "graphics chips that will later, unexpectedly, power AI.", "d": "1999"}]}, {"id": "era-10", "kind": "era", "title": "Era 10: The Age of Massive Computation & AI", "sub": "2005 – present", "cards": [{"t": "Printer tracking dots decoded", "b": "researchers reveal that color laser printers secretly stamp nearly every page with faint yellow dots encoding the printer's serial number and a timestamp — steganography hiding in plain sight in every office.", "d": "2005"}, {"t": "Cloud computing (AWS) and CUDA", "b": "renting oceans of compute; GPUs opened to general math.", "d": "2006–07"}, {"t": "The iPhone", "b": "every channel in Thread M and a supercomputer, fused into a pocket slab — within 15 years, most of humanity computes constantly without ever calling it computing.", "d": "2007"}, {"t": "Stuxnet", "b": "malware physically destroys uranium centrifuges — computation as kinetic weapon (Thread J).", "d": "2010"}, {"t": "IBM Watson wins Jeopardy!", "b": "language question-answering at champion level — the decade's opening bell.", "d": "2011"}, {"t": "The Snowden disclosures", "b": "the public learns the scale of computational mass surveillance (Thread J).", "d": "2013"}, {"t": "Petascale (Roadrunner)", "b": "10¹⁵ operations per second.", "d": "2008"}, {"t": "Common Core & the CS-for-all push", "b": "parents nationwide discover they can't help with elementary homework — the generational gap made visible at the kitchen table; code.org (2013) and England's national computing curriculum (2014) attempt to close an 80-year CS teaching gap; Conrad Wolfram campaigns for computer-based math education (Thread L).", "d": "2010–14"}, {"t": "AlexNet / ImageNet moment", "b": "deep learning works, powered by GPUs; modern AI era begins.", "d": "2012"}, {"t": "AlphaGo defeats Lee Sedol", "b": "intuition-like play from neural networks plus search.", "d": "2016"}, {"t": "\"Attention Is All You Need\"", "b": "the transformer architecture behind modern language models.", "d": "2017"}, {"t": "GPT-3, then ChatGPT", "b": "large language models reach the public; training runs consume ~10²³–10²⁵ floating-point operations.", "d": "2020–2022"}, {"t": "Frontier supercomputer", "b": "first official exascale machine — over 10¹⁸ operations per second.", "d": "2022"}, {"t": "Nature computes", "b": "slime mold (Physarum) re-derives the Tokyo rail network layout (2010); researchers use ripples in a literal bucket of water as a \"liquid state machine\" for speech-pattern recognition (2003) — see Thread I.", "d": "2000s–2010s"}, {"t": "Google's Sycamore \"quantum supremacy\" claim", "b": "a quantum processor performs a (contrived) task believed intractable for classical machines.", "d": "2019"}, {"t": "AlphaFold 2", "b": "protein structure prediction effectively solved — computation as an instrument of scientific *discovery*, honored with a Nobel Prize in 2024.", "d": "2020"}, {"t": "Operation Rubicon revealed", "b": "Crypto AG, the trusted Swiss cipher-machine maker, had been secretly owned by the CIA and West German BND for decades — half the world bought its \"secure\" machines from its adversaries.", "d": "2020"}, {"t": "NIST post-quantum cryptography standards", "b": "computation's future begins reshaping its own security.", "d": "2024"}, {"t": "computing still classified", "b": "intelligence-agency supercomputers absent from public rankings; TEMPEST emission-security standards partly secret; nuclear-stockpile machines behind closed doors — the fastest computers on Earth may not be the ones we know about (see Thread J).", "d": "Today"}, {"t": "Frontier AI training runs (~10²⁵–10²⁶ FLOPs)", "b": "and formal proof assistants (Lean, Coq) verifying real mathematics — machines now assist at every level from arithmetic to proof.", "d": "2020s"}, {"t": "The analog revival", "b": "in-memory, memristor, and photonic chips perform AI's matrix arithmetic with raw physics (currents, light) instead of digital logic — computing's oldest idea returning at the frontier, driven by AI's appetite for multiplication (Thread A).", "d": "2020s"}]}, {"id": "thread-A", "kind": "thread", "title": "Thread A: The Speed Ladder", "sub": "the emotional core of the site", "cards": [{"t": "Overview", "b": "Approximate sustained arithmetic rates, for direct comparison cards:"}, {"t": "Human with pencil", "b": "~0.01–0.05 operations/sec (a multi-digit multiplication takes ~20–60 s)"}, {"t": "Skilled abacus operator", "b": "~1 op/sec bursts"}, {"t": "de Prony's table project", "b": "~100 human computers for years → millions of table entries"}, {"t": "Mechanical desk calculator", "b": "~0.1–0.5 ops/sec"}, {"t": "ENIAC (1945)", "b": "~5×10³ additions/sec"}, {"t": "IBM System/360 (1964)", "b": "~10⁵–10⁶ ops/sec"}, {"t": "Cray-1 (1976)", "b": "~1.6×10⁸ FLOP/s"}, {"t": "Intel Pentium (1993)", "b": "~10⁸"}, {"t": "Smartphone (2020s)", "b": "~10¹¹–10¹²"}, {"t": "Single modern AI GPU", "b": "~10¹⁴–10¹⁵ FLOP/s"}, {"t": "Frontier/exascale cluster", "b": ">10¹⁸ FLOP/s"}, {"t": "One frontier AI training run", "b": "~10²⁵–10²⁶ total FLOPs"}, {"t": "The punchline card", "b": "a student doing one operation per second, nonstop, would need vastly longer than the age of the universe (~4×10¹⁷ seconds) to perform the arithmetic of a single modern AI training run — yet every one of those operations is the same kind of arithmetic the student practices by hand."}]}, {"id": "thread-B", "kind": "thread", "title": "Thread B: Human Computers", "sub": "", "cards": [{"t": "Overview", "b": "Tally-keepers → scribes → table-makers → de Prony's pyramid → Harvard Observatory women → WPA project → Bletchley → ENIAC programmers → NASA's hidden figures → \"computer\" stops meaning a person (~1950s)."}]}, {"id": "thread-C", "kind": "thread", "title": "Thread C: Ideas", "sub": "the mathematics itself", "cards": [{"t": "Overview", "b": "Positional notation → zero → algorithms (al-Khwarizmi) → logarithms → binary → Boolean logic → computability (Turing/Church) → information theory (Shannon) → complexity theory (P vs NP, 1971 Cook) → machine proof."}]}, {"id": "thread-D", "kind": "thread", "title": "Thread D: Machines", "sub": "", "cards": [{"t": "Overview", "b": "Tally bone → abacus → Antikythera → astrolabe → Pascaline → Jacquard loom → Analytical Engine → tabulators → analog computers → ENIAC → transistor → IC → microprocessor → GPU → AI accelerators."}]}, {"id": "thread-E", "kind": "thread", "title": "Thread E: Why Learn It by Hand?", "sub": "pedagogical cards", "cards": [{"t": "Every era's mathematicians practiced the previous era's methods.", "b": "Every era's mathematicians practiced the previous era's methods."}, {"t": "Estimation and error-checking (Glenn trusting Johnson over the machine…", "b": "Estimation and error-checking (Glenn trusting Johnson over the machine)."}, {"t": "Understanding what the machine does 10²⁵ times.", "b": "Understanding *what* the machine does 10²⁵ times."}, {"t": "The tradition argument", "b": "hand arithmetic connects a student to the Ishango bone."}, {"t": "The internalization argument", "b": "soroban masters prove that a deeply practiced tool becomes a mental faculty (see Thread H2 — anzan)."}]}, {"id": "thread-F", "kind": "thread", "title": "Thread F: What Is a Number?", "sub": "cross-cultural conceptions of number & data", "cards": [{"t": "Egypt — number as measure. Number lives in physical quantities", "b": "the cubit (length), setat (area), hekat (grain volume), deben (weight), the 365-day civil calendar (time). Unit fractions exist for fair division — how to split 7 loaves among 10 workers. Mathematics is a scribe's craft, taught by worked example, validated by *working*: \"the correct method of reckoning.\"", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Greece — number as idea. Sharp split between arithmos (a multitude…", "b": "*Greece — number as idea.* Sharp split between *arithmos* (a multitude of discrete units) and *megethos* (continuous magnitude), and between *logistikē* (mere reckoning — low prestige, left to slaves and merchants) and *arithmētikē* (theory of number — philosophy). Mathematics is validated by *proof*: it must be shown to be necessarily true.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "The twist", "b": "* Herodotus reports the Greeks learned geometry from Egyptian rope-stretchers. Measurement became abstraction; the surveyor's craft became the philosopher's object.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Contrast cards", "b": "* procedure vs. proof · scribe vs. philosopher · \"does it work?\" vs. \"why must it be true?\" · number embedded in things vs. number as a thing itself.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Payoff card for students", "b": "* every math student recapitulates both traditions — first you *compute* like an Egyptian scribe, then you learn to *prove* like a Greek. Both are the tradition.", "ch": "Featured comparison stack: Egypt vs. Greece"}, {"t": "Mesopotamia", "b": "* no single \"number\" at first — separate metrological systems for grain, land, silver, and time; the abstract sexagesimal system emerges from bureaucracy. Our hours, minutes, and degrees are its living fossil.", "ch": "Other conception-of-number cards"}, {"t": "China", "b": "* number as a physical rod on a counting board — manipulable, spatial; negative numbers simply rods of another color.", "ch": "Other conception-of-number cards"}, {"t": "India", "b": "* numbers as Sanskrit words and verse (mathematics recited and memorized); zero and the infinite admitted as legitimate objects of calculation.", "ch": "Other conception-of-number cards"}, {"t": "Maya", "b": "* number as time — dates, calendar cycles, numbers personified as gods; base-20 with head-glyph numerals.", "ch": "Other conception-of-number cards"}, {"t": "Inca", "b": "* data without writing — knot type, knot position, cord color, and cord hierarchy as the fields of an imperial database.", "ch": "Other conception-of-number cards"}, {"t": "Bodies and bases", "b": "* base-5, 10, 20, 60; 27-body-part counting systems of Papua New Guinea; Yoruba base-20 with subtractive construction — the human body as the first numeral system.", "ch": "Other conception-of-number cards"}, {"t": "Data as length, weight, time, quantity", "b": "* a synthesis card — before number was abstract, every culture computed *with the world itself*: ropes, stones, beads, knots, shadows, water clocks, balance scales.", "ch": "Other conception-of-number cards"}, {"t": "I Ching (China)", "b": "64 hexagrams from binary lines — divination as combinatorics (see Era 2 and the Leibniz connection).", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Ifá divination (Yoruba, West Africa)", "b": "256 odu generated from 8 binary casts — exactly one byte of states, each indexing a body of recited literature; a binary addressing system in ritual form.", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Sona sand drawings (Chokwe, Angola/DR Congo)", "b": "single-line figures traced over dot grids by memorized rules — Eulerian paths and recursive algorithms executed as art.", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Marshall Islands stick charts", "b": "ocean swell patterns and their interference around islands encoded in lashed sticks and shells — an analog model of wave dynamics, memorized before the voyage and left ashore.", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Polynesian wayfinding", "b": "star compass, dead reckoning, and the etak reference-island system — voyages of thousands of miles computed continuously in the navigator's head.", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Mancala-family games (Africa, Middle East, Asia)", "b": "seed-counting and capture strategy — arithmetic and lookahead as play.", "ch": "Computing without written numbers (embodied & ritual computation)"}, {"t": "Theme card", "b": "computation has always lived in ritual, art, navigation, and games — alongside and long before written mathematics.", "ch": "Computing without written numbers (embodied & ritual computation)"}]}, {"id": "thread-G", "kind": "thread", "title": "Thread G: Cryptography: computing to conceal and reveal", "sub": "", "cards": [{"t": "Overview", "b": "Caesar cipher (antiquity) → al-Kindi's frequency analysis (9th c.) → Alberti's cipher disk (1467) → Vigenère (1553) → Babbage & Kasiski break it (1850s–63) → Rejewski's bomba vs. Enigma (1932) → Turing/Welchman Bombe & Colossus (1940s) → DES (1977) → Diffie–Hellman & RSA (1976–77) → elliptic curves → Shor's quantum threat (1994) → NIST post-quantum standards (2024). Theme: an arms race that repeatedly *forced* the invention of faster computation — including the first programmable electronic computer."}]}, {"id": "thread-H", "kind": "thread", "title": "Thread H: The Art of Reckoning", "sub": "how people *actually* calculated", "cards": [{"t": "Roman numerals are a recording notation, nearly useless for arithmet…", "b": "Roman numerals are a *recording* notation, nearly useless for arithmetic — try multiplying XLVII × XXXIX on paper. Romans didn't; nobody did.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Day-to-day arithmetic ran on pebbles (calculi) on lined counting boa…", "b": "Day-to-day arithmetic ran on **pebbles (calculi) on lined counting boards** and on the **portable bronze hand abacus** — grooved slots for units through millions, plus extra slots for base-12 fractions (unciae). A merchant's pocket device, ~2,000 years before the pocket calculator.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Key card for students", "b": "the numeral was the *output format*; the board was the *processor*. Notation ≠ computation.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Linguistic-fossils card", "b": "*calculus/calculate* (pebble), *exchequer* (the checkered counting cloth of the English treasury), the shop *counter* (the counting table), *bank* (the money-changer's bench where the board sat).", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "Counting boards with cast counters (jetons) remained standard across E…", "b": "Counting boards with cast counters (jetons) remained standard across Europe into the 1600s–1700s. Samuel Pepys — Cambridge graduate, senior naval administrator — hired a tutor at age 29 (1662) to learn the multiplication table. Written arithmetic was a *specialist skill* long after board-reckoning was universal.", "ch": "The Roman paradox: numerals for writing, machines for computing"}, {"t": "The suanpan (China, 2+5 beads) and soroban (Japan, 1+4 beads)…", "b": "The **suanpan** (China, 2+5 beads) and **soroban** (Japan, 1+4 beads) are not museum pieces — millions of children in Japan, China, Taiwan, Korea, India, and Southeast Asia train on them today in schools and after-school academies, with **kyū/dan ranking exams** graded like martial arts.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "The schoty, Russia's abacus, was still clicking on shop counters i…", "b": "The **schoty**, Russia's abacus, was still clicking on shop counters into the 1990s. Western Europe abandoned the counting board; most of the world never stopped.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Anzan (暗算) — the internalized machine", "b": "advanced students stop needing the physical soroban. They visualize it and move imaginary beads — you can watch champions' fingers flicking over an empty desk. The machine has been *installed in the mind*.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Flash anzan", "b": "multi-digit numbers flashed on screen faster than they can be read aloud; top competitors correctly sum 15 three-digit numbers shown in under two seconds. National soroban championships and the Mental Calculation World Cup keep the tradition elite and alive.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Research on expert abacus users suggests they shift arithmetic from ve…", "b": "Research on expert abacus users suggests they shift arithmetic from verbal processing toward **visuospatial imagery** — they compute with a mental picture rather than with inner speech.", "ch": "The living abacus: East Asian abacus education today"}, {"t": "The payoff card (core to the site's thesis):", "b": "the tool does not replace the skill — practiced deeply enough, the tool *becomes* the skill. A student who masters a calculating machine ends up carrying it in their head. This is the strongest answer to \"why practice by hand when machines exist?\"", "ch": "The living abacus: East Asian abacus education today"}, {"t": "Finger reckoning (dactylonomy)", "b": "Bede's system to 9,999; Mediterranean and Middle Eastern market-traders' finger systems; complement-based finger multiplication for the 6–10 times tables — arithmetic carried on the body.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Doubling and halving", "b": "Egyptian multiplication by repeated doubling, and its folk survival, \"Russian peasant multiplication\" — secretly *binary multiplication*, the method inside every CPU today. (Superb card: the pharaoh's scribe and the microchip run the same algorithm.)", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Table lookup as a way of life", "b": "Babylonian multiplication and reciprocal tablets; Ptolemy's chords; medieval computus tables for Easter; Toledan and Alfonsine astronomical tables. For most of history, \"computing\" largely meant *looking up* someone else's frozen labor.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Quarter-square multiplication", "b": "ab = [(a+b)² − (a−b)²]/4 — multiply using only a table of squares plus addition and subtraction; used from Babylon to 19th-century table books.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Lattice (gelosia) multiplication", "b": "the grid method from Indian/Islamic mathematics, standard in the abbaco schools — and now back in modern elementary classrooms.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Casting out nines", "b": "the universal error-check of hand arithmetic, transmitted through al-Khwarizmi's tradition — checksum logic centuries before checksums.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Prosthaphaeresis", "b": "trigonometric identities as a multiplication machine (see Era 4) — proof that the *hunger* for fast multiplication predates the means.", "ch": "Before Napier: the toolkit of tricks"}, {"t": "Logarithm tables (Briggs onward)", "b": "the single most important calculating aid of the scientific era; engineers, navigators, gunners, and schoolchildren computed with them into the 1970s.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "The slide rule", "b": "logarithms made physical — analog multiplication at a glance; \"slipstick\" culture, belt holsters, carried aboard Apollo as backup.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Ready reckoners", "b": "cheap printed books of precomputed prices, interest, wages, and conversions — the shopkeeper's lookup table from the 1600s well into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Nomograms (d'Ocagne, 1880s)", "b": "computation as *drawing* — lay a straightedge across printed scales and read off the answer; used for artillery, engineering, and medicine (some clinical nomograms survive today).", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Planimeters and integraphs", "b": "trace a curve's outline with a stylus, read its area off a dial — mechanical integration.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Specialized aids to the very end", "b": "Genaille–Lucas rulers (1891) and dozens of similar devices sold to clerks and accountants into the 20th century.", "ch": "After Napier: three centuries of augmented hand-calculation"}, {"t": "Professional lightning calculators", "b": "Zerah Colburn (factoring large numbers mentally as a child, 1810s), George Parker Bidder (from stage calculator to great railway engineer), Alexander Aitken (perhaps the best-documented calculating mind), Shakuntala Devi (multiplied two 13-digit numbers in 28 seconds, 1980).", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "The Trachtenberg system", "b": "high-speed arithmetic rules developed by Jakow Trachtenberg *entirely in his head while imprisoned in Nazi camps* — calculation as survival of the mind.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "\"Vedic mathematics\" (Bharati Krishna Tirtha, pub. 1965)", "b": "sutra-based speed techniques (\"all from 9 and the last from 10,\" \"vertically and crosswise\"); a modern system rather than an ancient Vedic one, but pedagogically potent and hugely popular in India.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Everyday mental tricks", "b": "as mini-cards: complements (\"make ten\"), left-to-right addition, ×5 via ×10÷2, ×25 via ×100÷4, squaring numbers ending in 5, and 47×99 = 4,700 − 47.", "ch": "Lightning minds: mental calculators and speed systems"}, {"t": "Closing card", "b": "when calculation was economically vital, societies invested enormously in *human* computational skill — tables, tools, tricks, and training. Today that need is met by machines running 10¹⁸ operations per second — but the trained mind remains the only place where *understanding* happens.", "ch": "Lightning minds: mental calculators and speed systems"}]}, {"id": "thread-I", "kind": "thread", "title": "Thread I: Computing with the World: water, analog & unconventional machines", "sub": "", "cards": [{"t": "Clepsydrae", "b": "from Egyptian outflow bowls to Ctesibius' feedback-regulated clocks (the first known feedback control) to elaborate Chinese and Islamic water-clock towers (Su Song 1088, al-Jazari 1206) — time itself was water-computed for three millennia.", "ch": "Water computing"}, {"t": "Lukyanov's water integrator (1936)", "b": "PDEs as plumbing — water levels are the variables, tube resistances the coefficients; adjust the valves, read the solution. Mass-produced in the USSR, used for dams, mines, and rocketry into the 1980s.", "ch": "Water computing"}, {"t": "The MONIAC (1949)", "b": "Keynesian macroeconomics in transparent tanks — raise taxes and literally watch consumption drain. Fourteen built; one still runs demonstrations in New Zealand's central bank museum.", "ch": "Water computing"}, {"t": "Fluidics (1960s)", "b": "logic gates made of nothing but jets and channels — no electronics, immune to radiation and EMP; used in aircraft, industrial control, even missile systems; reborn today as **microfluidic logic** in lab-on-a-chip devices.", "ch": "Water computing"}, {"t": "The liquid brain (2003)", "b": "researchers used ripples on the surface of a bucket of water as the reservoir in a \"liquid state machine,\" successfully distinguishing spoken words — a literal bucket of water performing pattern recognition.", "ch": "Water computing"}, {"t": "Theme card", "b": "water was humanity's first continuous quantity. Time, then economies, then differential equations were all made to *flow*.", "ch": "Water computing"}, {"t": "The integrator lineage", "b": "James Thomson's ball-and-disk integrator → his brother Lord Kelvin's tide predictor and harmonic analyzer → Bush's differential analyzer (Era 6) — continuous mathematics done by wheels.", "ch": "Mechanical & electrical analog computing"}, {"t": "Fire control", "b": "Dreyer Tables and Rangekeepers through the Mark 1 — shipboard analog computers tracking moving targets from moving platforms in real time, decades before digital could; still aboard recommissioned battleships in the 1990s.", "ch": "Mechanical & electrical analog computing"}, {"t": "Field analogies", "b": "electrolytic tanks and conductive paper \"compute\" electric and aerodynamic fields; stretched rubber sheets solve potential problems — let the physics find the answer.", "ch": "Mechanical & electrical analog computing"}, {"t": "Network analyzers", "b": "scale-model power grids used to compute the behavior of real power grids into the 1960s.", "ch": "Mechanical & electrical analog computing"}, {"t": "The op-amp era", "b": "room-sized patch-panel analog computers simulate aircraft, rockets, and reactors; the very name \"operational amplifier\" means *an amplifier that performs mathematical operations*.", "ch": "Mechanical & electrical analog computing"}, {"t": "Theme card", "b": "for continuous problems — tides, trajectories, flight — analog machines were *faster than digital for decades*. Digital won on precision and programmability, not on any monopoly over mathematics.", "ch": "Mechanical & electrical analog computing"}, {"t": "Graphical statics (1860s)", "b": "bridges and roofs designed by drawing force polygons — Eiffel-era engineering computed with straightedge and pencil.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Nomography proper (d'Ocagne, 1884)", "b": "alignment charts where laying a straightedge across three scales *is* the calculation; grounded in projective geometry and determinants.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "War by straightedge", "b": "WWI and WWII artillery fired on nomogram-computed solutions; engineering handbooks carried alignment charts for everything from pipe flow to beam loads.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Still alive in medicine", "b": "clinical nomograms (cardiac risk, drug dosing, oncology prognosis) remain in use — a 19th-century computing technology at the bedside.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Pedagogy card", "b": "students can *build* a working nomogram for the ideal gas law or Ohm's law with paper and ruler — constructing a computer that has no moving parts at all.", "ch": "Graphical computing: the nomograph, expanded"}, {"t": "Soap films", "b": "dip a wire frame, and the film instantly settles into a minimal surface — near-instant \"solutions\" to problems (Plateau, Steiner trees) that strain digital computers.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Kitchen analog", "b": "spaghetti sort (cut rods to length, tap the bundle — the tallest is found in one step); string boards that find shortest paths by pulling taut.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Toys that are computers", "b": "dominoes as logic gates; marble machines (Digi-Comp II, today's Turing Tumble); the Tinkertoy computer (Hillis & Silverman, MIT) that plays perfect tic-tac-toe.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "The billiard-ball computer (Fredkin & Toffoli, 1982)", "b": "a thought experiment showing computation from nothing but elastic collisions — foundational to reversible and quantum computing.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Wet computers", "b": "Adleman's DNA computation (1994); molecular logic gates; slime mold (*Physarum*) solving mazes (2000) and re-deriving the Tokyo rail network (2010).", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Cellular automata", "b": "Conway's Game of Life (1970) — trivial rules yielding universal computation; Wolfram's systematic exploration.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Reservoir computing", "b": "any sufficiently rich dynamical system — water, lasers, mechanical springs — can serve as a machine-learning substrate.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "The analog AI revival (2020s)", "b": "memristor crossbars multiply matrices via Ohm's and Kirchhoff's laws; photonic chips do it with interference of light — physics-as-processor returning precisely because AI's arithmetic appetite (Thread A) has outgrown comfortable digital scaling.", "ch": "Nature computes: unconventional and physical computation"}, {"t": "Closing card", "b": "digital was a choice, not a destiny. Anything with reliable physics can compute. Electronics won on precision, programmability, and perfect copying — but the world itself has been doing mathematics all along, and students should know the machine in their pocket is one answer
