 among many.", "ch": "Nature computes: unconventional and physical computation"}]}, {"id": "thread-J", "kind": "thread", "title": "Thread J: The Secret History: computation classified", "sub": "", "cards": [{"t": "Ancient roots", "b": "Herodotus' tattooed scalp and wax-tablet warnings (Era 2); Aeneas Tacticus' catalogue of hidden-message tricks.", "ch": "Steganography: hiding the message itself"}, {"t": "Invisible inks from antiquity through both World Wars; the Cardan gril…", "b": "Invisible inks from antiquity through both World Wars; the Cardan grille (1550) — a mask that turns an innocent letter into a cipher; null ciphers where only every nth word counts.", "ch": "Steganography: hiding the message itself"}, {"t": "Microdots (WWII)", "b": "whole pages photographed down to the size of a period — J. Edgar Hoover called them \"the enemy's masterpiece of espionage.\"", "ch": "Steganography: hiding the message itself"}, {"t": "Printer tracking dots", "b": "the machine identification code secretly stamped by color laser printers, publicly decoded in 2005 — a hidden message in *your* documents.", "ch": "Steganography: hiding the message itself"}, {"t": "Digital steganography and watermarking today — including proposals to…", "b": "Digital steganography and watermarking today — including proposals to statistically watermark AI-generated text: steganography contemplated at the scale of trillions of words.", "ch": "Steganography: hiding the message itself"}, {"t": "Card theme", "b": "cryptography scrambles a message; steganography denies it exists. Both are computation bent toward concealment.", "ch": "Steganography: hiding the message itself"}, {"t": "Colossus erased", "b": "ten machines; most dismantled and the drawings burned by order after the war; engineer Tommy Flowers, forbidden to speak, watches ENIAC take the crown of \"first\" — full details classified until 2000. Textbooks taught a wrong history for half a century.", "ch": "The machines themselves were secret"}, {"t": "The Bombes", "b": "British and US Navy models (600 WAVES ran NCR-built Bombes in Dayton, all sworn to secrecy) destroyed or hidden postwar; Poland's founding contribution — Rejewski's bomba — nearly erased from the record.", "ch": "The machines themselves were secret"}, {"t": "SIGSALY and Delilah (Era 7)", "b": "secure digital voice — the birth of digital audio — locked away for decades; Turing's Delilah report unreleased for ~70 years.", "ch": "The machines themselves were secret"}, {"t": "The OCR connection", "b": "the first commercial optical character reader, GISMO (1951), was built by David Shepard — a cryptanalyst at the NSA's predecessor agency, teaching machines to *read* text after days spent teaching them to *break* it. Machine reading and machine codebreaking grew from the same soil, and Turing-era pattern-recognition and statistical methods fed both.", "ch": "The machines themselves were secret"}, {"t": "D-Day by tide machine", "b": "Doodson computes Normandy's tides for a site he knows only as \"Position Z\" — computation on a need-to-know basis (Era 7).", "ch": "The machines themselves were secret"}, {"t": "Bombsight oaths", "b": "Norden bombardiers swore to defend the device's secrecy with their lives; naval fire-control mechanisms were crown jewels of state.", "ch": "The machines themselves were secret"}, {"t": "Nuclear computing", "b": "ENIAC's first job, MANIAC, the Monte Carlo method — all born classified; Los Alamos ran on rooms of human computers before the machines arrived.", "ch": "The machines themselves were secret"}, {"t": "Venona", "b": "US decryption of Soviet cables, worked from 1943, kept secret until **1995** — a fifty-year computation in a vault.", "ch": "The machines themselves were secret"}, {"t": "GCHQ's stolen thunder", "b": "public-key cryptography invented in secret, 1970–74; unrevealed until 1997 — the inventors watched the world celebrate others for their own discovery, and said nothing.", "ch": "The machines themselves were secret"}, {"t": "NSA and the industry", "b": "Harvest (1962), influence on IBM's Stretch, decades as supercomputing's quietest best customer; the DES S-box mystery — IBM had independently discovered *differential cryptanalysis* in 1974 and, at NSA's request, kept the attack secret for ~20 years while the public suspected a backdoor (the secret changes had actually *strengthened* the cipher).", "ch": "The machines themselves were secret"}, {"t": "Operation Rubicon (revealed 2020)", "b": "the CIA and BND secretly *owned* Crypto AG, selling compromised cipher machines to 100+ governments for decades — the supply chain itself as the wiretap.", "ch": "The machines themselves were secret"}, {"t": "Still secret now", "b": "classified supercomputers absent from the TOP500 list; TEMPEST emission-security standards; cryptanalytic capabilities we can only infer. An honest card can say: *parts of this timeline are still blank, and some blanks are deliberate.*", "ch": "The machines themselves were secret"}, {"t": "Oath-bound silence", "b": "Bletchley's ~10,000 workers, including married couples who didn't tell each other until the 1970s; ENIAC's programmers and the Navy's WAVES uncredited for decades.", "ch": "The human cost — and the rewritten record"}, {"t": "Alan Turing", "b": "defined computation, helped win the war — his heroism itself classified — prosecuted in 1952, dead in 1954; public apology 2009, royal pardon 2013. Secrecy meant his country punished him without knowing whom it was punishing.", "ch": "The human cost — and the rewritten record"}, {"t": "Historiography card for students", "b": "because the fastest machines were secret, the *public* history of computing was wrong for 30–50 years — and is still being declassified. Primary sources keep surfacing. This history is a computation that hasn't halted.", "ch": "The human cost — and the rewritten record"}]}, {"id": "thread-K", "kind": "thread", "title": "Thread K: Ethnomathematics: the mathematics of the world's peoples", "sub": "", "cards": [{"t": "Ubiratan D'Ambrosio", "b": "names the discipline (1984): the mathematics of identifiable cultural groups — not only \"civilizations\" but carpenters, tailors, weavers, navigators, street vendors. Everyone's math counts.", "ch": "The field itself"}, {"t": "Founders' shelf", "b": "Zaslavsky's *Africa Counts* (1973); Marcia & Robert Ascher decoding quipu mathematics; Paulus Gerdes on sona and weaving geometry; Ron Eglash's *African Fractals* (1999).", "ch": "The field itself"}, {"t": "Alan Bishop's six universal activities", "b": "— counting, locating, measuring, designing, playing, explaining: every documented culture does all six. A perfect organizing card.", "ch": "The field itself"}, {"t": "Fractal architecture (Eglash)", "b": "recursive, self-similar village layouts (Ba-ila), Ethiopian processional crosses, Mokoulek — scaling geometry as design tradition.", "ch": "Africa"}, {"t": "The binary lineage", "b": "Ifá's 256 odu → medieval Islamic and European geomancy's 16 binary figures → (Eglash's argued thread) influences reaching Leibniz — binary divination millennia before binary machines.", "ch": "Africa"}, {"t": "Borana calendar (Kenya/Ethiopia)", "b": "a working lunar-stellar calendar computed by specialists without writing.", "ch": "Africa"}, {"t": "Ethiopian peasant multiplication", "b": "doubling-and-halving — binary arithmetic as folk method (cross-ref H3).", "ch": "Africa"}, {"t": "Kente, Ndebele, and mud-cloth symmetry systems; Gerdes on the theo…", "b": "Kente, Ndebele, and mud-cloth **symmetry systems**; Gerdes on the theorems hidden inside basket-weaving; Yoruba base-20 subtractive numerals (45 said as \"five from ten from three twenties\").", "ch": "Africa"}, {"t": "Kinship algebra", "b": "Warlpiri \"skin name\" marriage systems form genuine finite groups (the Aschers' analysis: a dihedral group of order 8) — abstract algebra lived as social structure.", "ch": "Oceania & Australia"}, {"t": "Songlines", "b": "routes across a continent stored and retrieved as song — geography as computed, memorized sequence.", "ch": "Oceania & Australia"}, {"t": "Māori kōwhaiwhai rafter patterns and tukutuku lattice panels", "b": "systematic symmetry classes; Pacific navigation and PNG body-counting (cross-ref Thread F).", "ch": "Oceania & Australia"}, {"t": "Aztec Codex Vergara surveying (Era 4)", "b": "field areas via indigenous algorithms and fractional units — colonial-era math running parallel to Europe's.", "ch": "The Americas"}, {"t": "Maya time-mathematics, quipu & yupana (cross-refs); Navajo weaving s…", "b": "Maya time-mathematics, quipu & yupana (cross-refs); **Navajo weaving symmetry** and sandpainting geometry; **wampum** belts as treaty records — data woven in shell.", "ch": "The Americas"}, {"t": "Kaktovik numerals (1994)", "b": "schoolchildren inventing a numeral system that reaches Unicode — ethnomathematics happening *now* (Era 9).", "ch": "The Americas"}, {"t": "Kolam / rangoli (Tamil Nadu and beyond)", "b": "dot-grid, single-line threshold drawings executed from memory each dawn — formally studied by computer scientists as picture languages and array grammars; algorithms performed as devotion, mostly by women.", "ch": "Asia"}, {"t": "Sangaku & wasan (Era 4)", "b": "geometry as temple offering; Seki's determinants.", "ch": "Asia"}, {"t": "Girih tiles (Era 3)", "b": "; **Balinese pawukon calendar**: ten concurrent week-lengths running simultaneously — daily life scheduled by least-common-multiple.", "ch": "Asia"}, {"t": "Yan tan tethera", "b": "Brythonic base-20 sheep-scoring chants surviving among shepherds into the 20th century — a numeral system preserved as work-song.", "ch": "European folk mathematics"}, {"t": "Split tally sticks", "b": "as unforgeable contracts (and the 1834 Parliament fire, Era 5); **knitting and lace patterns as executable code** — knitters \"read\" compact instruction languages; wartime knitting was even used to smuggle coded messages (cross-ref Thread J).", "ch": "European folk mathematics"}, {"t": "Change ringing (Era 4)", "b": "permutation theory in the belfry; quilt-block geometry and its symmetry groups.", "ch": "European folk mathematics"}, {"t": "Talking drums (West/Central Africa)", "b": "two-tone transmission of full phrases using tonal-language redundancy — long-distance messaging whose information-theoretic cleverness stunned later engineers.", "ch": "Sound & rhythm as computation"}, {"t": "Indian tala", "b": "cycles and konnakol spoken rhythm: recursive subdivision performed at speed.", "ch": "Sound & rhythm as computation"}, {"t": "Euclidean rhythms (Toussaint, 2004)", "b": "a huge share of world rhythm patterns are generated by Euclid's GCD algorithm — a 2,300-year-old algorithm, dancing.", "ch": "Sound & rhythm as computation"}, {"t": "Nunes, Carraher & Schliemann, Brazil (1985–93)", "b": "child street vendors ~98% accurate on transaction arithmetic — and ~37% on the *same problems* posed as school-style written exercises.", "ch": "Street mathematics (the pedagogy bombshell)"}, {"t": "Card thesis", "b": "mathematics lives in context and purpose; schooling that strips both can strip the competence too. Bridges directly into Thread L.", "ch": "Street mathematics (the pedagogy bombshell)"}, {"t": "Closing card", "b": "\"ethnomathematics\" is not math for *other* people. Our own school mathematics — the 1893 sequence, the standard algorithms — is also somebody's cultural tradition (see Thread L). All mathematics is somebody's ethnomathematics.", "ch": "Street mathematics (the pedagogy bombshell)"}]}, {"id": "thread-L", "kind": "thread", "title": "Thread L: How We Came to Teach Math This Way", "sub": "the lag, and the orphaned history", "cards": [{"t": "The edubba (c. 2000 BCE)", "b": "clay-tablet homework, table-copying, teacher's model on one side and student's shaky copy on the other — the problem set is as old as writing.", "ch": "The 4,000-year classroom"}, {"t": "Scribal schools (Egypt, Babylon)", "b": "worked examples, rote-plus-variation — recognizably modern pedagogy.", "ch": "The 4,000-year classroom"}, {"t": "Greece", "b": "the **quadrivium** (arithmetic, geometry, music, astronomy); Plato's \"let no one ignorant of geometry enter\"; **Euclid as the textbook for ~2,200 years** — no book but scripture has taught longer.", "ch": "The 4,000-year classroom"}, {"t": "Medieval universities", "b": "computus and *oral* disputation — for most of history, math was examined by talking, not writing.", "ch": "The 4,000-year classroom"}, {"t": "The two-track split", "b": "university mathematics for the learned; **abbaco schools** (Era 3) for merchants' children — a practical/academic divide that still structures curricula.", "ch": "The 4,000-year classroom"}, {"t": "Vernacular revolution", "b": "Adam Ries (1522), Robert Recorde (1557) — cheap printed textbooks in living languages; mass numeracy becomes possible.", "ch": "The 4,000-year classroom"}, {"t": "The exam is invented", "b": "the Cambridge Tripos (18th–19th c.) creates the written, timed, ranked mathematics examination — and instantly, the coaching industry, cramming, and teach-to-the-test. Modern assessment is a ~250-year-old technology with known side effects.", "ch": "The 4,000-year classroom"}, {"t": "The Prussian machine (1810s–40s)", "b": "age grades, state curriculum, normal schools; the blackboard (c. 1801). The delivery system we still use predates the telegraph.", "ch": "The 4,000-year classroom"}, {"t": "The freeze", "b": "the Committee of Ten (1893) fixes arithmetic → algebra → geometry → trig; with calculus added (1955), that is *still* the standard walk — designed for 1890s college prep, not for a world that runs on statistics, linear algebra, and algorithms.", "ch": "The 4,000-year classroom"}, {"t": "Klein's Meran reforms (1905) push functions and calculus into European…", "b": "Klein's Meran reforms (1905) push functions and calculus into European schools; the US largely declines.", "ch": "The reform pendulum"}, {"t": "New Math (1957–58, post-Sputnik)", "b": "set theory handed to teachers who had never studied it — the definitive national-scale demonstration of the training gap; collapsed by the early 1970s (*Why Johnny Can't Add*, 1973; Tom Lehrer's satire in between).", "ch": "The reform pendulum"}, {"t": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standard…", "b": "Back-to-basics (1970s) → calculator wars (1975 onward) → NCTM standards (1989) → **Math Wars** (1990s) → high-stakes testing (2001) → **Common Core** (2010), where parents' inability to help with homework put the generational gap on every kitchen table → computer-based-math movement (2010s).", "ch": "The reform pendulum"}, {"t": "Pattern card", "b": "the pendulum swings roughly every 15–20 years — about one teacher-generation. That is not a coincidence; it's the lag mechanism oscillating.", "ch": "The reform pendulum"}, {"t": "The arithmetic of the gap", "b": "a teacher certified in year X teaches until ~X+35. Their methods were largely absorbed not in training but as a *student* around X−15 — Lortie's \"apprenticeship of observation\" (1975): ~13,000 hours of watching teachers before training even begins. Their textbooks were written by authors trained around X−40. So classroom content routinely trails the frontier by 50–100 years — *before* compounding.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Compounding card", "b": "each generation can only pass on what it received plus the little it retrained on; whatever a generation misses, the next generation cannot inherit. Gaps don't just persist — they *accumulate*, era over era, like the curriculum's own dark matter.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Klein's double discontinuity (1908)", "b": "future teachers experience university math as irrelevant to school math, then return to classrooms and teach school math untouched by university math — the loop that locks the lag in place.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Case files", "b": "Calculus (1687) → standard high-school course in 1955: **~270 years**. Statistics (Fisher, 1920s) → still marginal in K-12 a century on. Computer science (1936–1950s) → still not universal after ~80 years. Linear algebra — the actual arithmetic of AI (Thread A) — effectively absent from school. Log tables were still being taught *after* the HP-35 made them obsolete.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Curriculum as geology", "b": "every stratum was deposited by a dead era's needs — navigation left trigonometry, commerce left arithmetic drill, the Cold War left New Math's residue, the testing era left procedure-first habits. Little is ever removed. The sediment *is* the syllabus. Students deserve to be told which layer they're standing on.", "ch": "The lag engine (core thesis card-set)"}, {"t": "Too old for computing class", "b": "a programming course can't spare a week for Babbage, never mind Sumer; \"history of computing\" is one slide on day one.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Too new for history class", "b": "school history runs out of steam around 1945–1990; the eighty most computationally transformative years in the human story belong to *no* course, no teacher, no exam.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "So the lineage is kept by museums, retro-computing hobbyists, and docu…", "b": "So the lineage is kept by museums, retro-computing hobbyists, and documentaries — while students carry 10¹²-FLOP/s devices with zero formal knowledge of where they came from.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Mathematics' own history is orphaned the same way", "b": "a student can finish calculus without hearing a single date, and even the names are wrong (\"Gaussian\" elimination appears in the *Nine Chapters*, ~2,000 years before Gauss).", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Mission card", "b": "this site lives deliberately in that gap — the history too old for CS and too new for History — built for the students who need it most: the ones practicing, by hand, the very operations machines now perform 10¹⁸ times per second.", "ch": "The orphaned history (the site's reason to exist)"}, {"t": "Overview", "b": "**L5. Cross-links**: Thread E (why learn it by hand) · H2 (anzan — training that demonstrably works) · K8 (street math — context carries competence) · Thread A (what the curriculum hasn't caught up to) · Thread J (why even the recent history went untaught: much of it was classified).", "ch": "The orphaned history (the site's reason to exist)"}]}, {"id": "thread-M", "kind": "thread", "title": "Thread M: The Signal: a history of communication technology", "sub": "", "cards": [{"t": "Sound over distance", "b": "talking drums (Thread K7), signal horns, church bells, and **whistled languages** — Silbo Gomero in the Canary Islands compresses Spanish into whistles that carry across whole valleys, still taught in schools there today.", "ch": "Signals before electricity"}, {"t": "Light and smoke", "b": "beacon chains from Aeschylus' Troy relay to the Great Wall's smoke towers to England's Armada beacons (1588) — one bit (\"they're coming\"), delivered at the speed of sight.", "ch": "Signals before electricity"}, {"t": "Relay infrastructure", "b": "Persia's Royal Road couriers (Herodotus' \"neither snow nor rain…\" describes them), Rome's cursus publicus, and the Inca **chasqui** runners — who carried *quipus*: a data network transporting data structures (Thread F).", "ch": "Signals before electricity"}, {"t": "Carrier pigeons", "b": "from ancient Egypt to Reuters' founding pigeon fleet (1850) to WWII medal-winning birds — packets with wings.", "ch": "Signals before electricity"}, {"t": "The Chappe optical telegraph (1794, Era 4)", "b": "a mechanical national network complete with protocols, acknowledgments, flow control, encryption, and — by 1834 — its first hacker exploit. \"The mechanical internet,\" half a century before Morse.", "ch": "Signals before electricity"}, {"t": "Heliographs and flag semaphore", "b": "mirror-flash telegraphy served armies into the 20th century; naval flag codes ran fleets.", "ch": "Signals before electricity"}, {"t": "The Victorian Internet (Standage's framing)", "b": "the electric telegraph brings news tickers, wire fraud, long-distance romances, and even weddings conducted by telegraph — every social phenomenon of the internet, rehearsed in the 1800s.", "ch": "The wire"}, {"t": "Codes as economics", "b": "per-word cable pricing spawns commercial codebooks compressing whole sentences into single words — compression, invented by accountants.", "ch": "The wire"}, {"t": "Cable mathematics", "b": "the 1858 transatlantic cable dies of over-voltage ignorance; Kelvin's analysis and mirror galvanometer save 1866 — signal theory learned the hard way, by ocean.", "ch": "The wire"}, {"t": "Pneumatic tube networks", "b": "under Paris, London, Berlin, New York: physical packet delivery, some running into the 1980s.", "ch": "The wire"}, {"t": "The paper-tape lineage", "b": "Baudot's 5-bit code → teleprinters → telex — and punched tape becomes early computer I/O; Colossus read enciphered teleprinter tape at 5,000 characters/second (Threads G, J). Communication gear and computers share one bloodstream.", "ch": "The wire"}, {"t": "The telephone era", "b": "Bell (1876), exchanges, Strowger's dial (1891), and generations of switchboard operators — human packet routers (Thread B) — automated away exactly as the human computers would be.", "ch": "The wire"}, {"t": "Fax before phones", "b": "Bain (1843) and Caselli's pantelegraph in commercial service by 1865 — image transmission is older than voice transmission.", "ch": "The wire"}, {"t": "The photophone (Bell, 1880)", "b": "voice carried on a sunbeam — Bell called it his greatest invention; it waited a century for fiber optics to vindicate it.", "ch": "Through the air"}, {"t": "Radio", "b": "Hertz's laboratory waves → Marconi's transatlantic \"S\" (1901) → broadcasting (KDKA, 1920) → radar in WWII, which poured money into the electronics and mathematics that built the computer industry.", "ch": "Through the air"}, {"t": "Satellites", "b": "Sputnik's beep (1957) → Telstar's live TV (1962) → GPS: atomic-clock time signals turned into position by relativistic computation — Einstein running silently in every phone.", "ch": "Through the air"}, {"t": "Shannon (1948)", "b": "one theory for every channel — drum, wire, light, radio — with the *bit* as universal currency. Communication and computation formally become a single subject.", "ch": "The digital merger"}, {"t": "Error correction", "b": "Hamming (1950), Reed–Solomon (1960), and their descendants in every phone and spacecraft — arithmetic that heals damaged messages mid-flight.", "ch": "The digital merger"}, {"t": "Packet switching → ARPANET → TCP/IP → the Web (Eras 8–9)", "b": "the network becomes a computer; the computer becomes a network.", "ch": "The digital merger"}, {"t": "Fiber", "b": "Kao's 1966 insight that glass could carry light for kilometers; TAT-8 (1988) crosses the Atlantic; today undersea fiber carries ~99% of intercontinental data along routes eerily echoing the 1866 cable map.", "ch": "The digital merger"}, {"t": "Convergence", "b": "the smartphone is telegraph + telephone + radio + television + camera + library + computer — every channel in this thread, fused into a slab.", "ch": "The digital merger"}, {"t": "Twins, not neighbors", "b": "communication and computation are both transformations of encoded symbols. Every era's signaling system needed codes, and every code invited computation — Morse's compression, cable codebooks, Baudot's binary, Shannon's unification.", "ch": "Theme cards"}, {"t": "Numbers travel first", "b": "each new fastest channel carried prices, odds, tides, and war before it carried anything else.", "ch": "Theme cards"}, {"t": "The latency ladder (companion to Thread A's speed ladder)", "b": "courier (days) → beacon (minutes, one bit) → Chappe (minutes, low bandwidth) → telegraph (seconds) → light in fiber (milliseconds) — and today the speed of light itself is the wall: high-frequency traders build microwave towers because fiber's path is microseconds too *curved*. Latency, not arithmetic, is now often the scarce resource.", "ch": "Theme cards"}, {"t": "Pedagogy card", "b": "a student who understands Morse's short-E and long-Q already understands the core idea of data compression — 19th-century hand-skills as a royal road into information theory.", "ch": "Theme cards"}]}, {"id": "thread-N", "kind": "thread", "title": "Thread N: When Computation Fails", "sub": "", "cards": [{"t": "The opening card is Babbage's motive", "b": "he built engines *because human tables were full of errors* — this whole subject begins with failure."}, {"t": "Therac-25 (1985–87)", "b": "race conditions in a radiation-therapy machine kill patients — software safety engineering is born of tragedy."}, {"t": "Patriot missile (1991)", "b": "0.1 seconds has no exact binary representation; 100 hours of clock drift = a 687-meter miss and 28 dead soldiers. Floating point as life and death (see IEEE 754, Era 9)."}, {"t": "Pentium FDIV (1994)", "b": "a few missing lookup-table entries; discovered by a mathematician (Thomas Nicely) cross-checking prime computations — caught because a human was *verifying by independent calculation*. A $475M recall."}, {"t": "Ariane 5 (1996)", "b": "a 64-bit float jammed into a 16-bit integer; reused code from a slower rocket; $370M of fireworks in 37 seconds."}, {"t": "Mars Climate Orbiter (1999)", "b": "one team used pound-seconds, the other newton-seconds — Thread F's \"number as quantity\" lesson, fatal at Mars. Units are not decoration."}, {"t": "Y2K (2000)", "b": "two-digit years meet the millennium; a massive global remediation *works*, so smoothly that people now call it a hoax — the \"successful prevention looks like overreaction\" card."}, {"t": "Reinhart–Rogoff (2013)", "b": "an Excel range error (plus contestable choices) in a paper that had steered global austerity policy — found by a graduate student who *redid the arithmetic*. The site's best modern argument for checking by hand."}, {"t": "Lorenz (1963)", "b": "chaos discovered through rounding — some systems have mathematical forecast horizons no supercomputer can push past."}, {"t": "Gödel & the halting problem", "b": "some questions no computer can ever decide — failure elevated to theorem."}, {"t": "Closing card", "b": "machines compute wrong at exactly the same speed they compute right. Estimation, unit sense, and sanity checks — the skills of hand arithmetic — are the human firmware that catches the machine (Glenn trusted Johnson, not the computer; Nicely caught Intel)."}]}, {"id": "thread-O", "kind": "thread", "title": "Thread O: Memory: How Machines Remember", "sub": "", "cards": [{"t": "Before machines", "b": "clay tablets, quipu knots, tally sticks, books, card catalogs — every era's storage (cross-refs Eras 1–3, Thread S)."}, {"t": "Bits as echoes", "b": "mercury delay lines store numbers as circulating sound pulses (EDSAC); Williams tubes store them as glowing spots on a CRT — memory you could *hear* and *see*."}, {"t": "Core memory (1950s–70s)", "b": "thousands of ferrite rings, each threaded by hand — for two decades, nearly every bit on Earth passed through the fingers of women doing precision textile work."}, {"t": "Core rope & Apollo", "b": "program memory physically *woven* — wire through a core = 1, around it = 0; NASA engineers called it \"LOL memory\" (little old ladies). Software you could hold, made by weavers (Threads B, Q; Jacquard's descendants)."}, {"t": "The magnetic era", "b": "drum → tape → RAMAC's 5 MB ton (1956) → floppy (1971) → the hard-drive density explosion."}, {"t": "Optical & solid state", "b": "CD (1982, with Reed–Solomon armor — Thread M), flash memory (Masuoka, 1987), SSDs; experimental DNA storage — data written back into molecules, where Era 1's tokens began."}, {"t": "The price-of-a-bit ladder (companion to Thread A)", "b": "from dollars per bit to trillions of bits per dollar — memory's own vertiginous curve, worth its own comparison card."}, {"t": "Theme card", "b": "storage has always been embodied labor — scribes, knotters, weavers, threaders — until suddenly it wasn't; remembering *how* memory was made keeps the abstraction honest."}]}, {"id": "thread-P", "kind": "thread", "title": "Thread P: The Data Thread: Probability, Statistics & Seeing Numbers", "sub": "", "cards": [{"t": "Born at the gambling table and the plague ledger", "b": "Pascal–Fermat (1654) make chance calculable; Graunt (1662) reads London's death rolls as *data*; Halley (1693) prices annuities — the state and commerce learn to compute risk."}, {"t": "Bayes and Laplace", "b": "inverse probability — updating belief by arithmetic; Laplace computes planetary masses with it, and modern AI is soaked in it."}, {"t": "Gauss", "b": "least squares and the normal curve — error itself becomes lawful (Ceres, Era 5)."}, {"t": "The picture-makers", "b": "Playfair invents the chart (1786); Nightingale weaponizes it (1858); Minard's Napoleon-in-Russia map — often called the finest graphic ever drawn; Tukey's exploratory data analysis; today's dashboards."}, {"t": "The uncomfortable card", "b": "Galton and Pearson built correlation and regression in the service of eugenics; Fisher too was entangled. Methods outlive motives — users must supply the ethics. Taught honestly, this is one of the site's most important cards."}, {"t": "\"Statistics\" contains \"state\"", "b": "censuses from Babylon to Hollerith (1890) to modern \"big data\" — the same problem at 10¹⁵ scale."}, {"t": "Closing card", "b": "statistics is the mathematics most adults actually need, and Thread L explains why school still teaches so little of it."}]}, {"id": "thread-Q", "kind": "thread", "title": "Thread Q: Labor & Automation: Who Does the Work?", "sub": "", "cards": [{"t": "The Turk, twice", "b": "Kempelen's 1770 hoax hid a human inside the machine; Amazon's Mechanical Turk (2005) and today's global data-labeling workforce hide thousands of humans inside \"AI.\" Same card, 250 years apart — always ask who's inside the box."}, {"t": "The Luddites, corrected (1811)", "b": "machine-breaking as collective bargaining by other means, not technophobia — the most slandered workers in industrial history."}, {"t": "The computing proletariat", "b": "de Prony's pyramid → table factories → typing pools → comptometer rooms → \"computer\" quietly ceasing to be a job title (1950s–60s) → switchboard automation (Strowger to direct dial) → phototypesetting ending hot-metal careers → the ATM paradox (teller employment *rose* for decades as cheap branches multiplied — automation reshapes rather than simply deletes)."}, {"t": "The contests as ritual", "b": "John Henry vs. the steam drill; the 1946 soroban vs. electric calculator match; Kasparov (1997); Lee Sedol (2016) — cultures stage man-vs-machine duels at every threshold, and the site's students are living through the next one."}, {"t": "Honest closing card", "b": "automation transitions are real, painful, uneven — and navigable. Every generation on this timeline adapted; understanding the machine, rather than merely operating or fearing it, has always been the strongest position. That is what this site is for."}]}, {"id": "thread-R", "kind": "thread", "title": "Thread R: Commerce as Computation", "sub": "", "cards": [{"t": "Writing was invented by accountants", "b": "Mesopotamian tokens → clay envelopes → cuneiform (Era 1) — literacy itself is a spinoff of inventory."}, {"t": "Pacioli's mirror (1494)", "b": "double-entry bookkeeping — debits equal credits, a checksum you can run by candlelight; Goethe called it one of the finest inventions of the human mind."}, {"t": "The infrastructure of trust", "b": "bills of exchange, interest tables, ready reckoners (Thread H4), actuarial tables (Thread P), the Medici network moving value as *messages* (Thread M)."}, {"t": "Speed is money", "b": "Reuters' pigeons, the Blanc brothers' telegraph hack (1834), the ticker tape (1867), and today's microwave HFT links (Thread M5) — finance has always bought the fastest channel first."}, {"t": "The retail stack", "b": "cash registers → the barcode's first beep (1974, a pack of Wrigley's gum) → credit-card networks authorizing billions of transactions → the ATM (1967) → VisiCalc putting a ledger in every office (Era 9)."}, {"t": "The tally stick reborn", "b": "blockchain (2008) — distributed, unforgeable, split-record ledgers; Era 5's burned sticks would recognize the idea instantly."}, {"t": "Theme card", "b": "from clay tokens to high-frequency trading, commerce has been computation's most reliable paymaster — most machines on this timeline were bought to count money."}]}, {"id": "thread-S", "kind": "thread", "title": "Thread S: The Card and the Link: From Library to HyperCard", "sub": "this site's own ancestry", "cards": [{"t": "Alexandria's Pinakes (Era 2)", "b": "the catalog is older than almost everything it catalogs."}, {"t": "Monks as search engines", "b": "concordances and indexes compiled by hand — years of labor to let a reader \"query\" scripture; the florilegium as a curated feed."}, {"t": "Cards take over", "b": "Gesner's paper slips (1540s); revolutionary France catalogs seized libraries on the backs of playing cards (1790s); the card catalog and Dewey standardize retrieval."}, {"t": "Otlet's Mundaneum (1910)", "b": "12 million cards, a query-by-mail service, and a 1934 vision of screens networked to a universal repository — a paper internet, dreamed in Brussels."}, {"t": "The lineage of the dream", "b": "Bush's Memex (1945) → Licklider's \"Man-Computer Symbiosis\" (1960) → Engelbart's Demo (1968) → Nelson's hypertext and Xanadu (1965) → PLATO's community (1960s–70s) → Kay's Dynabook → PARC's Alto → Macintosh (1984)."}, {"t": "HyperCard (1987)", "b": "Atkinson's \"software erector set\" — teachers, artists, and kids building linked-card stacks without \"programming\"; *Myst* was built in it; Ward Cunningham designed the first wiki as \"HyperCard for the web\"; countless classrooms made their first software in it."}, {"t": "The Web (1991)", "b": "hypertext's global victory — and a card on what was lost (two-way links, Xanadu's transclusion and micropayment dreams)."}, {"t": "Mission card", "b": "this site is deliberately built as a HyperCard-style stack. Its *form* is an artifact from its own timeline — students navigate the history of computation using a beloved piece of it."}]}, {"id": "thread-T", "kind": "thread", "title": "Thread T: The Harmony Thread: music, myth & the mathematical universe", "sub": "", "cards": [{"t": "The monochord (Era 2)", "b": "Pythagorean legend — hammers in a smithy, then a single string divided — reveals that consonance lives in small whole-number ratios; the first physical law expressed numerically, and the founding *proof* that nature obeys mathematics.", "ch": "The music of the spheres"}, {"t": "Musica universalis", "b": "Plato's *Timaeus* tunes the world-soul; Cicero's *Dream of Scipio* lets Scipio *hear* the planets; Boethius (Era 3) transmits the doctrine and plants music in the **quadrivium** — for a millennium, the educated studied music as a branch of mathematics, between arithmetic and astronomy.", "ch": "The music of the spheres"}, {"t": "Kepler's wager (1619)", "b": "if the heavens are harmonic, their chords can be computed — and inside *Harmonices Mundi*, amid planetary scales and angelic choirs, sits the third law of planetary motion. Mysticism, methodically pursued, delivered mechanics.", "ch": "The music of the spheres"}, {"t": "The metaphor that never died", "b": "modern physics still speaks of vibrating strings, resonant modes, and harmonics — from spectroscopy to quantum mechanics, the monochord's vocabulary runs straight through science.", "ch": "The music of the spheres"}, {"t": "*Harmonie universelle* (1636)", "b": "~1,500 pages measuring everything musical — construction, dimensions, stringing, and technique for lutes, viols, violins, keyboards, winds, drums, and bells, so precisely recorded that modern luthiers still reconstruct 17th-century instruments from it.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The string laws", "b": "vary one thing at a time — length, tension (weights hung from strings), thickness, material (gut, brass, even gold wire) — yielding frequency ∝ (1/L)·√(T/μ). The conceptual leap: pitch is a *rate of vibration*, a countable physical event, not an abstract proportion.", "ch": "Mersenne: the friar who counted sound"}, {"t": "Counting sound itself", "b": "strings and ropes long enough that their swings can be counted by eye against a pulse — then the laws scale those slow counts up to hundreds of vibrations per second, assigning real numbers to musical notes for the first time. This is why he's called the father of acoustics.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The harmonic-series puzzle", "b": "one plucked string faintly sounds its octave, twelfth, and double octave *simultaneously* — how can one body vibrate at several rates at once? Mersenne posed the question over and over in letters; the answer (superposition of modes) took Sauveur, Daniel Bernoulli, and finally Fourier. A friar's puzzlement drove a century of mathematics.", "ch": "Mersenne: the friar who counted sound"}, {"t": "Consonance as coincidence", "b": "intervals sound sweet when their vibrations line up often — the octave every 2nd cycle, the fifth every 6th; dissonances rarely align. Not the modern account, but it moved consonance from number mysticism into physics, with intervals ranked on principle.", "ch": "Mersenne: the friar who counted sound"}, {"t": "Computing equal temperament", "b": "the octave split into 12 identical semitones of ratio ¹²√2 ≈ 1.05946 — computed via mean proportionals (logarithms were brand new) and printed as string lengths for fretting. Fretted lutes practically forced equal temperament; Mersenne's arithmetic helped legitimize the tuning that now underlies nearly all Western music.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The combinatorics of song", "b": "factorials tabulated up to 64!; all **720 permutations of a six-note hexachord printed in full** across several pages; 22! melodies — sextillions — declared beyond all the world's singers. One of the first applications of combinatorics to an art, feeding straight into Leibniz's combinatorial dreams (see Llull, Era 3).", "ch": "Mersenne: the friar who counted sound"}, {"t": "The human internet hub", "b": "Mersenne's correspondence web — Descartes (whose first work, the *Compendium musicae*, was written for this circle), Galileo, Fermat, Pascal, Doni, experimenters across Europe testing echoes, resonance, sound underwater. Before journals existed, *he* was the network — and music was his test case proving nature obeys mathematical law.", "ch": "Mersenne: the friar who counted sound"}, {"t": "Still in the machine", "b": "Mersenne primes (2^p−1) drive GIMPS, the distributed search that finds nearly every record prime (Era 9), and the *Mersenne Twister* generates the random numbers inside countless simulations. Four centuries on, the friar's name is compiled into running code.", "ch": "Mersenne: the friar who counted sound"}, {"t": "The Tower of Babel", "b": "the myth of one lost universal tongue — and the centuries-long scholarly quest to recover or rebuild the \"Adamic language\" in which words perfectly matched things.", "ch": "Babel and the perfect language"}, {"t": "The 17th-century projects", "b": "Dalgarno's and Wilkins's constructed philosophical languages (1668) classify all of reality into a symbol system — Borges made Wilkins famous again; Leibniz turns the quest computational: a *characteristica universalis* plus a *calculus ratiocinator*, so that disputes end with \"let us calculate\" (Thread C; Llull, Era 3).", "ch": "Babel and the perfect language"}, {"t": "Babel answered sideways", "b": "the perfect language never arrived for humans — it arrived for machines. Boole's algebra, Frege's notation, and finally programming languages and protocols: humanity's actual universal tongues turned out to be code and TCP/IP (Thread M).", "ch": "Babel and the perfect language"}, {"t": "Musical and constructed tongues", "b": "Solresol (1827) — words made of do-re-mi, equally speakable, singable, playable, or whistled; Esperanto; Interlingua feeding the first machine-translation dreams (Era 8).", "ch": "Babel and the perfect language"}, {"t": "The mythic tongue", "b": "the secret speech of birds granted to Solomon and Siegfried, the alchemists' \"green language,\" Attar's *Conference of the Birds* (1177) — a spiritual quest structured like an algorithm, thirty birds seeking the one.", "ch": "The language of the birds"}, {"t": "From myth to data", "b": "Kircher transcribes birdsong into staff notation (1650) — animal sound becomes recordable information; his arca musarithmica composes by combinatorial lookup.", "ch": "The language of the birds"}, {"t": "The modern research program", "b": "bioacoustics and machine learning now parse whale codas, birdsong syntax, and bee dances — today's AI projects to decode animal communication are the language of the birds pursued with GPUs.", "ch": "The language of the birds"}, {"t": "Cross-links", "b": "whistled human languages (Thread M) and talking drums (Thread K) — people already speak in pitch.", "ch": "The language of the birds"}, {"t": "Notation is a program", "b": "Guido's staff (Era 3) plots pitch against time — arguably the first graph — and a score is a set of instructions executed by performers; the player-piano roll is literally a punched program, Jacquard's first cousin; MIDI (1983) turns performance into a live data stream.", "ch": "Music as computation"}, {"t": "Algorithmic composition, four centuries deep", "b": "Kircher's box (1650) → 18th-century musical dice games → change ringing's permutation \"programs\" (Era 4) → the *Illiac Suite* and MUSIC I (1957) → today's generative AI music.", "ch": "Music as computation"}, {"t": "Fourier closes Mersenne's case (1822)", "b": "every sound is a sum of sines; with the FFT (Era 8) this becomes the arithmetic inside MP3s, Auto-Tune, speech recognition, and every phone call — your earbuds run 19th-century heat theory answering a 17th-century friar's question.", "ch": "Music as computation"}, {"t": "The hearing sciences", "b": "Sauveur names acoustics (1701); Helmholtz dissects hearing with resonators (1863) — the ear itself revealed as a frequency analyzer.", "ch": "Music as computation"}, {"t": "Theme card", "b": "music was the laboratory where the West first learned that number governs nature — the quadrivium's bridge from arithmetic to physics. Every audio app is downstream of a monochord, and a student practicing scales is running the oldest experiment in mathematical physics.", "ch": "Music as computation"}]}, {"id": "thread-U", "kind": "thread", "title": "Thread U: The Hermetic Thread: esotericism and the making of science", "sub": "", "cards": [{"t": "The Emerald Tablet and the Corpus Hermeticum", "b": "\"as above, so below\" — texts attributed to Hermes Trismegistus and believed older than Moses; in 1463 Cosimo de' Medici orders Ficino to set Plato aside and translate Hermes *first*. The Renaissance reboots with magic at the front of the queue.", "ch": "The current"}, {"t": "The Renaissance magi", "b": "Pico della Mirandola weds Kabbalah to philosophy; Agrippa's *De occulta philosophia* treats number as power; Giulio Camillo builds a walk-in Memory Theatre of all knowledge and Giordano Bruno turns memory palaces into combinatorial art — information architecture in occult dress (Thread S).", "ch": "The current"}, {"t": "John Dee (Era 4)", "b": "the *Monas Hieroglyphica*'s cosmic glyph and the Mathematical Preface that sold Euclid to England's navigators and artisans; the imperial adviser with the realm's greatest library also transcribed \"angelic\" language by scrying. One mind, both worlds, no contradiction felt.", "ch": "The current"}, {"t": "the turn", "b": "Casaubon's philology dates the Hermetica to late antiquity, the same year Napier publishes logarithms — the prestige of ancient magic starts falling just as computational power starts compounding.", "d": "1614", "ch": "The current"}, {"t": "Newton translated the Emerald Tablet into English with commentary…", "b": "Newton translated the **Emerald Tablet** into English with commentary and left ~a million manuscript words on alchemy — more than he wrote on physics — from a private laboratory he ran for decades.", "ch": "Newton, the last of the magicians"}, {"t": "The Keynes verdict (1936)", "b": "buying Newton's hidden papers at Sotheby's, Keynes reported that Newton \"was not the first of the age of reason. He was the last of the magicians.\"", "ch": "Newton, the last of the magicians"}, {"t": "The productive irony", "b": "universal gravitation — invisible action at a distance — was attacked by mechanist critics (Leibniz among them) as an \"occult quality.\" A mind at home with hidden forces could accept the equation his rationalist rivals gagged on. The mysticism may have *enabled* the physics.", "ch": "Newton, the last of the magicians"}, {"t": "Computing doomsday", "b": "Newton applied his calculating powers to biblical chronology, concluding in one manuscript that the apocalypse would come \"not before 2060\" — the supreme calculator, running eschatology as arithmetic.", "ch": "Newton, the last of the magicians"}, {"t": "Still being decrypted", "b": "the Chymistry of Isaac Newton project is digitizing the alchemical papers now — an archive suppressed for centuries not by classification (Thread J) but by embarrassment.", "ch": "Newton, the last of the magicians"}, {"t": "For Leibniz, binary was theology", "b": "1 as God, 0 as nothing — creation *ex nihilo* re-enacted inside every number. He designed a medallion celebrating it: *omnibus ex nihilo ducendis sufficit unum* — \"to derive everything from nothing, one suffices.\"", "ch": "Leibniz, the binary God, and the I Ching"}, {"t": "1701–03", "b": "missionary Joachim Bouvet mails him Shao Yong's circular hexagram diagram; Leibniz recognizes the 64 figures as his binary numbers and publishes the connection in his memoir on binary arithmetic — Chinese divination and European theology meeting inside the number system that would run every computer on Earth (Era 2).", "ch": "Leibniz, the binary God, and the I Ching"}, {"t": "The Kabbalist cousin", "b": "Abulafia's letter permutations and gematria (Era 3) belong to the same current as Llull's wheels — sacred combinatorics that Leibniz inherited for his *ars combinatoria* and universal characteristic (Thread T).", "ch": "Leibniz, the binary God, and the I Ching"}, {"t": "Athanasius Kircher, S.J. (1602–1680)", "b": ", Collegio Romano: some forty books claiming nearly every subject, a famous museum, and a continental reputation as \"master of a hundred arts.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The media inventor", "b": "*Ars Magna Lucis et Umbrae* (1646) popularizes the magic lantern — projected images, the ancestor of cinema and every screen (Thread M); his museum featured statues speaking through hidden voice tubes and a piped \"Delphic oracle\" — immersive audio, 1670s; plus the arca musarithmica composition box (Thread T) and the notorious cat piano he described (mercifully, likely never built).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The knowledge engines", "b": "*Ars Magna Sciendi* (1669) rebuilds Llull's combinatorics as a general logic of discovery; *Polygraphia nova* (1663) offers a universal writing-and-cipher scheme with a translation box — Babel-reversal as hardware (Thread T; Thread G).", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The data network", "b": "from *Magnes* (1641) on, Kircher compiled magnetic declination, tide, and astronomical reports mailed in by Jesuit missionaries worldwide — a standing, global, crowdsourced observation network centuries before \"citizen science.\"", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The lucky wrongness", "b": "his hieroglyph \"translations\" were mystical fantasy — but his claim that Coptic descends from ancient Egyptian was *right* and underpinned Champollion's real decipherment; his microscope study of plague victims' blood (*Scrutinium Pestis*, 1658) reported \"little worms\" — pointing toward germ theory for partly wrong reasons; he had himself lowered toward Vesuvius' glowing crater for *Mundus Subterraneus* (1665) — wrong about the subterranean fire-channels, right that you should go look.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "The rival hub", "b": "like Mersenne (Thread T), Kircher anchored a continental correspondence web; the young Leibniz wrote to him in admiration. Patron saint of interdisciplinarity — and a standing lesson that spectacular error, honestly pursued and publicly shared, can still drag knowledge forward.", "ch": "Kircher: the man who knew everything (and was wrong about most of it)"}, {"t": "Research programs harden into science", "b": "harmony-hunting → celestial mechanics (Kepler, Thread T); alchemy → chemistry (Boyle worked the same furnaces); perfect-language dreams → symbolic logic and code (Thread T); memory arts → information architecture (Thread S); Kabbalist and Llullian combinatorics → Leibniz → Boole → circuits.", "ch": "Why this belongs on a computation timeline"}, {"t": "Astrology fed astronomy", "b": "Kepler cast horoscopes to pay for planet-hunting — \"astrology, the foolish daughter, feeds her wise mother astronomy.\"", "ch": "Why this belongs on a computation timeline"}, {"t": "Secrecy's training ground", "b": "alchemical ciphers, coded recipes, and priority-guarding anagrams (Galileo announced discoveries to Kepler as scrambled letters) rehearsed the habits that became scientific priority claims and cryptographic practice (Thread J).", "ch": "Why this belongs on a computation timeline"}, {"t": "The honest-history card", "b": "none of this endorses magic. It corrects the textbook myth of pure rationalists. The founders were whole people chasing hidden order everywhere — and some of those hunts found mathematics. Motivation and method can be separated only in hindsight; today's \"of course\" was once somebody's heresy.", "ch": "Why this belongs on a computation timeline"}, {"t": "The Yates card", "b": "20th-century scholarship (Frances Yates and successors) recovered this suppressed lineage. Like Colossus (Thread J), part of science's own history was long left out of the story — this time from embarrassment rather than classification. History is a computation that hasn't halted (Thread L).", "ch": "Why this belongs on a computation timeline"}]}]};

/* ---------- hand-authored Home stack ---------- */
const AGE_UNIVERSE_S = 4.35e17;
const TRAINING_RUN   = 3e26;
const LADDER = [
  ["A skilled abacus operator", 1],
  ["A mechanical desk calculator", 0.3],
  ["ENIAC (1945)", 5e3],
  ["IBM System/360 (1964)", 5e5],
  ["Cray-1 (1976)", 1.6e8],
  ["A 2020s smartphone", 1e12],
  ["One modern AI GPU", 1e15],
  ["An exascale supercomputer", 2e18],
];
const HOME = {
  id:"home", kind:"home", title:"Home", sub:"", cards:[
   {t:"Welcome to The Reckoner", d:"c. 43,000 BCE \u2013 today",
    b:"This is a complete history of computation, told as a stack of linked cards. The form is borrowed from HyperCard \u2014 Bill Atkinson's 1987 \u201csoftware erector set\u201d \u2014 not for its look but for its <em>model</em>: cards, stacks, links, and the freedom to wander. It remains the most elegant container ever devised for connected knowledge, and it sits on this timeline itself (Thread S).<br><br>The thesis is simple: <strong>mathematics has been done by machines, and machine-like systems of people, for as long as mathematics has existed.</strong> When you practice arithmetic by hand, you are practicing a living tradition that runs from notched bones through rooms full of human computers to chips performing arithmetic at speeds no one can picture. This stack exists to help you picture it anyway.<br><br>Walk forward with <strong>\u2192</strong>. Open <strong>Go</strong> to jump anywhere. Or press <strong>Wander</strong> and let history find you."},
   {t:"How to use this stack", b:"<strong>Eras 1\u201310</strong> are the timeline, from tally bones to frontier AI. <strong>Threads A\u2013U</strong> are themes that cut across time: human computers, secrecy, ethnomathematics, harmony, failure, memory, the hermetic current, and more.<br><br>Words like Thread J or Era 4 inside any card are links \u2014 follow them the way you'd follow a thought. <strong>Find</strong> searches every card. <strong>Back</strong> retraces your steps, and <kbd>\u2190</kbd> <kbd>\u2192</kbd> flip cards. On a phone, swipe.<br><br>There is no required order. A stack of cards, unlike a textbook, trusts you to wander."},
   {t:"Try it: the Speed Ladder", d:"the punchline", special:"ladder", b:""},
   {t:"The map", special:"map", b:""},
   {t:"Why learn it by hand, then?", b:"Because every era's mathematicians trained on the previous era's methods. Because estimation and number sense are how humans catch machines being confidently wrong \u2014 John Glenn would not fly until Katherine Johnson re-checked the electronic computer's numbers by hand, and the Pentium bug was caught by a mathematician verifying primes independently (Thread N). Because soroban masters prove that a tool practiced deeply enough becomes a mental faculty (Thread H). And because when you carry a digit, you are doing precisely what a GPU does 10<sup>15</sup> times each second \u2014 you and the machine are practicing the same tradition (Thread E)."},
   {t:"Add your own cards", b:"This site is modular by design. Every era, thread, and card was generated from a single markdown file (<em>history-of-computation-master-list.md</em>) by a small build script.<br><br>To extend it: add a bullet under any <strong>## Era</strong> or <strong>### Thread</strong> heading, in the form <em>- **date \u2014 Title**: body text\u2026</em>, then re-run <em>build.py</em>. The bullet becomes a card; mentions of \u201cThread X\u201d or \u201cEra N\u201d become links automatically. History is a computation that hasn't halted \u2014 keep adding to it.<br><br><span class='small'>Figures on the Speed Ladder are order-of-magnitude estimates; frontier-training-run size (~3\u00d710<sup>26</sup> FLOPs) reflects public 2026 estimates.</span>"}
  ]
};

/* ================================================================ */
const STACKS = [HOME, ...DATA.stacks];
const byId = Object.fromEntries(STACKS.map((s,i)=>[s.id,i]));
let cur = {s:0,c:0};
const hist = [];

const $ = s=>document.querySelector(s);
const esc = t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function md(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
          .replace(/\*(.+?)\*/g,"<em>$1</em>");
}
function linkify(h){
  h = h.replace(/Thread ([A-Z])(\d?)\b/g,(m,L)=> byId["thread-"+L]!==undefined
      ? `<a class="x" href="#thread-${L}/0">${m}</a>` : m);
  h = h.replace(/Era (\d{1,2})\b/g,(m,n)=> byId["era-"+n]!==undefined
      ? `<a class="x" href="#era-${n}/0">${m}</a>` : m);
  return h;
}
function fmtSci(x){
  if(!isFinite(x)) return "\u221e";
  const e=Math.floor(Math.log10(x)), man=x/Math.pow(10,e);
  return `${man.toFixed(1)}\u00d710<sup>${e}</sup>`;
}
function humanTime(sec){
  if(sec<1) return sec.toPrecision(2)+" s";
  if(sec<60) return Math.round(sec)+" s";
  if(sec<3600) return Math.round(sec/60)+" min";
  if(sec<86400) return Math.round(sec/3600)+" h";
  const yr=sec/3.156e7;
  if(yr<1) return Math.round(sec/86400)+" days";
  if(yr<1e4) return Math.round(yr).toLocaleString()+" years";
  if(sec<AGE_UNIVERSE_S) return fmtSci(yr)+" years";
  return fmtSci(sec/AGE_UNIVERSE_S)+" \u00d7 age of universe";
}

function renderLadder(){
  return `
  <p>A modern frontier AI model is trained with roughly <strong>3\u00d710<sup>26</sup></strong> arithmetic operations \u2014 additions and multiplications, the very operations you practice.</p>
  <p>How long does one multi-digit multiplication take <em>you</em>, by hand?
     <input id="secs" class="field" type="number" min="1" max="600" value="30" aria-label="Seconds per operation"> seconds</p>
  <div id="ladderout"></div>
  <p class="small">Rates are order-of-magnitude estimates. See Thread A for the full ladder, and Thread L for why none of this is in your textbook.</p>`;
}
function computeLadder(){
  const secs = Math.max(1, +($("#secs").value||30));
  const yourRate = 1/secs;
  let rows = [["You, by hand", yourRate], ...LADDER];
  let h = `<table class="hc"><tr><th>Computer</th><th>ops / second</th><th>One training run</th></tr>`;
  for(const [name,rate] of rows){
    h += `<tr><td>${name}</td><td class="num">${fmtSci(rate)}</td><td class="num">${humanTime(TRAINING_RUN/rate)}</td></tr>`;
  }
  h += `</table>`;
  const mult = (TRAINING_RUN/yourRate)/AGE_UNIVERSE_S;
  h += `<div class="punch">Working nonstop at your pace, one training run would take you about <strong>${fmtSci(mult)} times the age of the universe</strong>. Every one of those operations is the arithmetic you are learning. The tradition is yours; only the speed has changed.</div>`;
  $("#ladderout").innerHTML = h;
}
function renderMap(){
  const eras = STACKS.filter(s=>s.kind==="era");
  const thr  = STACKS.filter(s=>s.kind==="thread");
  const li = s=>`<li><a class="x" href="#${s.id}/0">${esc(s.title)}</a><span class="small">${s.cards.length}</span></li>`;
  return `<p><strong>The timeline</strong> \u2014 ${eras.reduce((a,s)=>a+s.cards.length,0)} cards:</p>
    <ul class="map">${eras.map(li).join("")}</ul>
    <p><strong>The threads</strong> \u2014 ${thr.reduce((a,s)=>a+s.cards.length,0)} cards:</p>
    <ul class="map">${thr.map(li).join("")}</ul>`;
}

function render(push=true){
  const st = STACKS[cur.s], cd = st.cards[cur.c];
  if(push) hist.push(location.hash);
  location.hash = `${st.id}/${cur.c}`;
  $("#stacklbl").textContent = st.title + (st.sub? " \u2014 "+st.sub : "");
  let h = `<div class="fade">`;
  h += `<div class="eyebrow"><span>${st.kind==="era"?"Timeline":"Stack"}</span>` +
       (cd.ch? `<span class="ch">${esc(cd.ch)}</span>`:"") + `</div>`;
  if(cd.d) h += `<span class="date">${esc(cd.d)}</span><br>`;
  h += `<h1 class="cardtitle">${md(esc(cd.t))}</h1>`;
  if(cd.special==="ladder") h += renderLadder();
  else if(cd.special==="map") h += renderMap();
  else h += `<div class="body">${linkify(md(cd.b.includes("<")? cd.b : esc(cd.b)))}</div>`;
  h += `</div>`;
  $("#content").innerHTML = h;
  if(cd.special==="ladder"){ computeLadder(); $("#secs").addEventListener("input",computeLadder); }
  $("#progfill").style.width = ((cur.c+1)/st.cards.length*100)+"%";
  $("#prevb").disabled = (cur.s===0 && cur.c===0);
  const lastStack = cur.s===STACKS.length-1, lastCard = cur.c===st.cards.length-1;
  $("#nextb").disabled = lastStack && lastCard;
  $("#nextstackb").style.display = lastStack? "none":"";
  $("#counter").textContent = `Card ${cur.c+1} of ${st.cards.length}`;
  window.scrollTo({top:0});
}
function go(s,c,push=true){ cur={s:Math.max(0,Math.min(s,STACKS.length-1)),c:0};
  cur.c = Math.max(0,Math.min(c,STACKS[cur.s].cards.length-1)); render(push); }
function step(dir){
  let {s,c}=cur; c+=dir;
  if(c<0){ if(s>0){s--; c=STACKS[s].cards.length-1;} else c=0; }
  else if(c>=STACKS[s].cards.length){ if(s<STACKS.length-1){s++;c=0;} else c=STACKS[s].cards.length-1; }
  go(s,c);
}
function fromHash(){
  const m = location.hash.replace(/^#/,"").split("/");
  if(byId[m[0]]!==undefined){ go(byId[m[0]], +(m[1]||0), false); return true; }
  return false;
}

function buildGo(){
  const g=$("#golist");
  let h = `<a href="#home/0">Home</a><div class="sep"></div><div class="grp">TIMELINE</div>`;
  for(const s of STACKS) if(s.kind==="era") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  h += `<div class="sep"></div><div class="grp">THREADS</div>`;
  for(const s of STACKS) if(s.kind==="thread") h+=`<a href="#${s.id}/0">${esc(s.title)}</a>`;
  g.innerHTML=h;
}
function wander(){
  const pool=[]; STACKS.forEach((s,i)=>s.cards.forEach((_,j)=>{ if(!(i===cur.s&&j===cur.c)) pool.push([i,j]); }));
  const [s,c]=pool[Math.floor(Math.random()*pool.length)]; go(s,c);
}
function doFind(q){
  q=q.trim().toLowerCase(); if(!q) return;
  const found={id:"found",kind:"thread",title:`Found: \u201c${q}\u201d`,sub:"",cards:[]};
  STACKS.forEach(s=>{ if(s.id==="found") return;
    s.cards.forEach((cd,j)=>{
      if((cd.t+" "+(cd.d||"")+" "+cd.b).toLowerCase().includes(q))
        found.cards.push({...cd, ch:s.title});
    });});
  if(!found.cards.length){ found.cards.push({t:"Nothing found", b:`No card mentions \u201c${esc(q)}\u201d. Try a shorter word \u2014 or add the card yourself (see Home).`}); }
  const i = byId["found"];
  if(i!==undefined) STACKS[i]=found; else { byId["found"]=STACKS.length; STACKS.push(found); }
  go(byId["found"],0);
}

document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="home") go(0,0);
  if(act==="wander") wander();
  if(act==="back"){ const h=hist.pop(); if(h&&h!==location.hash){ location.hash=h; fromHash(); hist.pop(); } }
  if(act==="find"){ $("#finddlg").showModal(); $("#findq").select(); }
  const menu=$("#gomenu"); if(menu.open && !e.target.closest("#gomenu")) menu.open=false;
  if(e.target.closest("#golist a")) menu.open=false;
});
$("#prevb").onclick=()=>step(-1);
$("#nextb").onclick=()=>step(1);
$("#nextstackb").onclick=()=>go(cur.s+1,0);
$("#findgo").onclick=()=>{ $("#finddlg").close(); doFind($("#findq").value); };
$("#findcancel").onclick=()=>$("#finddlg").close();
$("#findq").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#finddlg").close(); doFind($("#findq").value);} });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||$("#finddlg").open) return;
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
  if(e.key.toLowerCase()==="h") go(0,0);
  if(e.key.toLowerCase()==="w") wander();
  if(e.key.toLowerCase()==="f"){ e.preventDefault(); $("#finddlg").showModal(); $("#findq").select(); }
});
let tx=null;
document.addEventListener("touchstart",e=>{ tx=e.changedTouches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>60 && !$("#finddlg").open) step(dx<0?1:-1);
},{passive:true});
window.addEventListener("hashchange",()=>{ fromHash(); });

buildGo();
if(!fromHash()) render(false);
</script>
</body>
</html>
